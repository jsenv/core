<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>list revisit (animated)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #app,
      .shell {
        display: flex;
        height: 100dvh;
        flex-direction: column;
      }
      .bar {
        padding: 8px;
        flex: none;
        background: #eee;
      }
      .area {
        position: relative;
        min-height: 0;
        flex: 1;
      }
      .page {
        position: absolute;
        inset: 0;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./animated.jsx"></script>
  </body>
</html>
