<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide grid — experiment</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        font-size: 1.3rem;
        border-bottom: 2px solid #ddd;
      }
      .part {
        color: white;
        background: #1a237e;
      }
      .part--right {
        background: #00695c;
      }
      .part--down {
        background: #4527a0;
      }
      .filler {
        padding: 8px 12px;
        background: #eef3fb;
        border-bottom: 1px solid #cfe0f5;
      }
      .in-document {
        display: flex;
        width: 320px;
        height: 260px;
        flex-direction: column;
        border: 1px solid #90caf9;
        border-radius: 8px;
      }
      /* The map of the same slides, drawn: what the grid is supposed to feel
         like, next to the thing itself */
      .map {
        display: grid;
        grid-auto-rows: 54px;
        grid-template-columns: repeat(2, 90px);
        gap: 6px;
        font-size: 0.8rem;
      }
      .map > div {
        display: grid;
        place-items: center;
        color: #444;
        background: #eceff1;
        border: 1px dashed #b0bec5;
        border-radius: 6px;
      }
      .map > .is-current {
        color: white;
        background: #1a237e;
        border-style: solid;
        border-color: #1a237e;
      }
      .demo-row {
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { Box, Text } from "@jsenv/navi";
      import { SlideGrid } from "@jsenv/navi/src/layout/lab/slide_grid.jsx";

      const Filler = ({ count }) =>
        Array.from({ length: count }, (_, i) => (
          <div key={i} class="filler">
            {i + 1}
          </div>
        ));

      const PLACES = [
        { id: "pick", x: 0, y: 0 },
        { id: "create", x: 0, y: 1 },
        { id: "edit", x: 1, y: 0 },
      ];

      const App = () => {
        const [current, setCurrent] = useState("pick");
        return (
          <div>
            <h1>Slide grid</h1>
            <p>
              The pick-or-create flow, placed rather than ordered: “create” is
              below the list, “edit” is beside it. Travel with the chevrons or
              the arrow keys — a direction with nothing there is simply not
              offered.
            </p>

            <section class="demo-section">
              <h2>Three slides on a grid</h2>
              <div class="demo-row">
                <div class="in-document">
                  <SlideGrid
                    duration="400ms"
                    expandY
                    current={current}
                    onCurrentChange={setCurrent}
                  >
                    <SlideGrid.Item id="pick" x={0} y={0} overflow="auto">
                      <Box
                        header
                        padding="m"
                        flex="x"
                        alignY="center"
                        spacing="xs"
                        className="part"
                      >
                        <Text expandX>pick</Text>
                        <SlideGrid.Move direction="right" padding="xs" />
                        <SlideGrid.Move direction="down" padding="xs" />
                      </Box>
                      <Box body padding="m">
                        <Filler count={8} />
                      </Box>
                    </SlideGrid.Item>

                    <SlideGrid.Item id="create" x={0} y={1} overflow="auto">
                      <Box
                        header
                        padding="m"
                        flex="x"
                        alignY="center"
                        className="part part--down"
                      >
                        <Text expandX>create (below)</Text>
                        <SlideGrid.Move direction="up" padding="xs" />
                      </Box>
                      <Box body padding="m">
                        <Filler count={3} />
                      </Box>
                    </SlideGrid.Item>

                    <SlideGrid.Item id="edit" x={1} y={0} overflow="auto">
                      <Box
                        header
                        padding="m"
                        flex="x"
                        alignY="center"
                        className="part part--right"
                      >
                        <Text expandX>edit (on the right)</Text>
                        <SlideGrid.Move direction="left" padding="xs" />
                      </Box>
                      <Box body padding="m">
                        <Filler count={4} />
                      </Box>
                    </SlideGrid.Item>
                  </SlideGrid>
                </div>

                <div class="map">
                  {[
                    { id: "pick", label: "pick" },
                    { id: "edit", label: "edit" },
                    { id: "create", label: "create" },
                    { id: null, label: "" },
                  ].map(({ id, label }, index) => (
                    <div
                      key={index}
                      class={id === current ? "is-current" : undefined}
                      style={id === null ? { visibility: "hidden" } : undefined}
                    >
                      {label}
                    </div>
                  ))}
                </div>
              </div>
            </section>
          </div>
        );
      };

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
