                <Box flex="x" spacing="l" alignY="start">
                  <NotificationPanels />
                  <NotificationPanels sizing="frozen" />
                </Box>
              </div>
            </Box>
            <p class="demo-note">
              A container given a size of its own scrolls instead:{" "}
              <Link href="#scroll">Scroll</Link>
            </p>
          </section>

          <section class="demo-section" id="vertical">
            <Heading id="vertical">Vertical</Heading>
            <p>
              The same two slides with <code>layout="column"</code>: they arrive
              from below instead of from the side. The travel is the only
              difference — the box is still sized on its largest slide, in both
              directions.

          <section class="demo-section" id="drag">

            <Box flex="y" spacing="l" alignX="start">
              <div class="demo-way">
                <h3>Nothing but the gesture</h3>
                <DragPhotos prefix="drag_row" />
              </div>
              <div class="demo-way">
                <h3>
                  <code>travelByDrag={"{false}"}</code>

              </div>
              <div class="demo-way">
                <h3>
                  <code>layout="column"</code>
                </h3>
                <DragPhotos prefix="drag_column" layout="column" />
              </div>
              <div class="demo-way">
                <h3>On a map</h3>

            </Box>
          </section>

          <section class="demo-section" id="nested">
            <Heading id="nested">A container inside a container</Heading>
            <p>
              Both travel up and down, with a drag or with the wheel (

            <NestedSlides />

          <section class="demo-section" id="scroll">

            <ThreeWays
              id="tall"
              Content={TallSlides}
              documentClassName="in-document-capped"
            />
            <p>…and the same going up and down:</p>
            <ThreeWays
              id="tall_vertical"
              Content={TallSlidesVertical}
              documentClassName="in-document-capped"
            />
            <h3 id="wider">Content wider than the box</h3>
            <ThreeWays id="wide" Content={WideSlides} />
            <p>…and the same with the travel going up and down:</p>

            <h3 id="scroll-restoration">Scroll restoration</h3>

          <section class="demo-section" id="list-in-a-slide">
            <Heading id="list-in-a-slide">A list inside a slide</Heading>
            <p>
              ↑/↓ mean two things here: walk the list, or travel the map. The

          <section class="demo-section" id="scroll-in-a-slide">
            <Heading id="scroll-in-a-slide">A scroller inside a slide</Heading>
            <p>
              The list and the slides want the same gesture. The one under the
              pointer answers first: the list scrolls until it has nowhere left
              to go that way, and only then does the wheel (or the finger)
              travel to the slide below. Aim outside the list and it travels
              straight away.
            </p>
            <ThreeWays

            />

          <section class="demo-section" id="selection">
            <Heading id="selection">Dragging is not selecting</Heading>
            <p>
              A drag across the words travels the slides and leaves no blue

          <section class="demo-section" id="map">
            <Heading id="map">A map instead of a line</Heading>
            <p>
              <code>layout={JSON.stringify(MAP)}</code> — one string per row,

              nothing there is simply not offered — try ← → ↑ ↓.
            </p>
            <ThreeWays id="map" Content={MapSlides} />
          </section>

          <section class="demo-section" id="loop">
            <Heading id="loop">Looping</Heading>
            <p>
              <code>loop</code>: the travel plays, the window comes back to the
              middle, and <code>onLoop</code> moves the content one step — three
              slides for a row with no end. Press ← →.
            </p>
            <LoopSlides />
          </section>

          <ExpandDialogSection />

          <section class="demo-section" id="locking">
            <Heading id="locking">Locking the way out</Heading>
            <p>
              A step one must not skip: <code>preventNavNext</code> (and{" "}
              <code>preventNavPrevious</code>, or <code>preventNav</code> for
              both) on a <code>Slide</code> holds the user there. It is read
              where the travel is decided, so it holds against every way of
              asking — the chevron, the keyboard, a <code>--navi-right</code>{" "}
              command, an event dispatched by hand.
            </p>
            <div class="demo-ways">
              <div class="demo-way">
                <h3>Without a lock</h3>
                <p class="demo-note">
                  Press → (or the chevron): you are on the second slide, box
                  ticked or not.
                </p>
                <div class="in-document">
                  <FreeSlides />
                </div>
              </div>
              <div class="demo-way">
                <h3>preventNavNext</h3>
                <p class="demo-note">
                  The chevron is read-only and → does nothing until the box is
                  ticked.
                </p>
                <div class="in-document">
                  <LockedSlides />
                </div>
              </div>
              <div class="demo-way">
                <h3>The action moves on</h3>
                <p class="demo-note">
                  No chevron at all: signing dispatches{" "}
                  <code>navi_slide_move</code>.
                </p>
                <div class="in-document">
                  <ActionThenNextSlides />
                </div>
              </div>
            </div>
          </section>

          <section class="demo-section" id="two-slides">
            <Heading id="two-slides">Two slides</Heading>
            <p>
              The plain case: a slide arrives from the right, the one it
              replaces leaves to the left. The second slide is taller than the
              first, and the box is as tall as it from the start.
            </p>
            <ThreeWays id="basic" Content={TwoSlides} />
          </section>

          <section class="demo-section" id="three-slides">
            <Heading id="three-slides">Three slides</Heading>
            <p>
              Nothing changes past two: the middle slide simply carries both
              buttons, each still saying one word. The list walks the DOM to
              find where “one further” is, so a slide added between two others
              needs nothing said about it anywhere.
            </p>
            <ThreeWays id="three" Content={ThreeSlides} />
          </section>

          <section class="demo-section" id="practical">
            <Heading id="practical">Practical examples</Heading>
            <h3>A carousel, with bullets</h3>
            <CarouselWithBullets />
            <h3>A carousel, with a bar</h3>
            <CarouselWithBar />
            <h3>The same bar, in words</h3>
            <CarouselWithBar text />
            <h3>Looping</h3>
            <p>→ on the last photo shows the first.</p>
            <CarouselLooping />
          </section>

          <section class="demo-section" id="the-map">
            <Heading id="the-map">Seeing the map</Heading>
            <p>
              The map, with the frame widened to show what it usually hides.
            </p>
            <MapReveal />
          </section>
        </div>
      );

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
