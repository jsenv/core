<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide container demo</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        font-size: 1.3rem;
        border-bottom: 2px solid #ddd;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #444;
        font-size: 0.95rem;
      }
      .toc {
        margin: 8px 0 0;
        padding-left: 20px;
        line-height: 1.9;
      }
      .toc ul {
        margin: 0;
        padding-left: 20px;
        list-style: circle;
      }
      .toc ul a {
        color: #555;
        font-size: 0.9rem;
      }
      .demo-see-also {
        margin: 16px 0 0;
        padding-top: 12px;
        border-top: 1px solid #eee;
      }
      .demo-settings {
        display: flex;
        margin: 0 0 16px;
        padding: 10px 14px;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        font-size: 0.9rem;
        background: #f4f7fc;
        border-radius: 8px;
      }
      .demo-section {
        scroll-margin-top: 16px;
      }
      /* Focus shown by what the element becomes, not by a ring around it */
      .focus-pad {
        display: grid;
        padding: 14px 10px;
        place-items: center;
        color: #4a5568;
        font-size: 0.9rem;
        background: #eef3fb;
        border: 2px dashed #b9cdea;
        border-radius: 8px;
      }
      .focus-pad:focus {
        color: black;
        background: yellow;
        border-style: solid;
        border-color: yellow;
      }
      .demo-note {
        max-width: 300px;
        margin: 0;
        color: #666;
        font-size: 0.85rem;
      }
      .demo-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .demo-option {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.85rem;
      }
      .demo-ways {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
      }
      .demo-way {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .demo-way > h3 {
        margin: 0;
        color: #666;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .part {
        color: white;
        background: #1a237e;
      }
      .part-create {
        background: #4527a0;
      }
      .part-edit {
        background: #00695c;
      }
      .filler {
        padding: 8px 12px;
        background: #eef3fb;
        border-bottom: 1px solid #cfe0f5;
      }
      .wide {
        width: 900px;
        padding: 8px 12px;
        background: #fdf1e0;
        border-bottom: 1px solid #f0d7ae;
      }
      /* In the document there is no popup to take a size from, so the list
         is given one here — same as any box would be. */
      .in-document {
        display: flex;
        width: 300px;
        flex-direction: column;
        border: 1px solid #90caf9;
        border-radius: 8px;
      }
      /* Very tall content: without a height the box would be as tall as its
         tallest slide, which is exactly what we do NOT want to see in a page
         that also has other sections. */
      .in-document-capped {
        height: 260px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { createContext } from "preact";
      import { useContext, useEffect, useRef, useState } from "preact/hooks";
      import {
        Box,
        Button,
        Dialog,
        Input,
        Link,
        Popover,
        Slide,
        SlideContainer,
        Text,
      } from "@jsenv/navi";

      // Section heading with a hover anchor link, same shape as the wheel
      // demo's: <Link anchor> owns the id, the "#" is the visible affordance.
      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const useStoredBoolean = (key, defaultValue) => {
        const [value, setValue] = useState(() => {
          const stored = localStorage.getItem(key);
          return stored === null ? defaultValue : stored === "true";
        });
        useEffect(() => {
          localStorage.setItem(key, String(value));
        }, [key, value]);
        return [value, setValue];
      };
      const useStoredString = (key, defaultValue) => {
        const [value, setValue] = useState(
          () => localStorage.getItem(key) ?? defaultValue,
        );
        useEffect(() => {
          localStorage.setItem(key, value);
        }, [key, value]);
        return [value, setValue];
      };

      // One setting for every list on the page, kept across reloads: comparing
      // sections is only fair when they all travel at the same speed.
      const SPEEDS = [
        { label: "fast (150ms)", value: "150ms" },
        { label: "normal (300ms — default)", value: "300ms" },
        { label: "slow (1s)", value: "1s" },
      ];
      const SettingsContext = createContext(null);
      const useSlideDuration = () => {
        const settings = useContext(SettingsContext);
        // No animation is a travel that takes no time — the same code path, so
        // nothing else has to know about the setting.
        return settings.animated ? settings.speed : "0s";
      };
      const SlideSettings = () => {
        const { animated, setAnimated, speed, setSpeed } =
          useContext(SettingsContext);
        return (
          <div class="demo-settings">
            <label class="demo-option">
              <input
                type="checkbox"
                checked={animated}
                onChange={(e) => setAnimated(e.target.checked)}
              />
              Animate the travel
            </label>
            <label class="demo-option">
              Speed{" "}
              <select
                value={speed}
                disabled={!animated}
                onChange={(e) => setSpeed(e.target.value)}
              >
                {SPEEDS.map(({ label, value }) => (
                  <option key={value} value={value}>
                    {label}
                  </option>
                ))}
              </select>
            </label>
          </div>
        );
      };

      const Filler = ({ count, className = "filler" }) =>
        Array.from({ length: count }, (_, i) => (
          <div key={i} class={className}>
            {i + 1}
          </div>
        ));

      // One slide: a header that stays and a body that scrolls, plus the button
      // that leaves it. SlideContainer.Next/.Previous say where to go — which slide
      // that is, and which way the chevron points, is the list's business.
      const DemoSlide = ({ id, title, direction, children }) => (
        <SlideContainer.Item id={id} overflow="auto">
          <Box header padding="m" flex="x" alignY="center" className="part">
            {/* Title first, then the ways out of it, side by side: a slide in
                the middle needs both, and neither button needs to know it is
                in the middle — each says one word */}
            <Text expandX>{title}</Text>
            {direction !== "next" && (
              <SlideContainer.Previous size="xl" padding="xs" marginY="-xs" />
            )}
            {direction !== "previous" && (
              <SlideContainer.Next size="xl" padding="xs" marginY="-xs" />
            )}
          </Box>
          <Box body padding="m">
            {children}
          </Box>
        </SlideContainer.Item>
      );

      // Every section shows the same thing three times: in the document, in a
      // dialog, in a popover. Taking a component rather than the slides
      // themselves, because each of the three needs its own copy of them.
      // eslint-disable-next-line no-unused-vars -- Content IS used, as <Content />
      const ThreeWays = ({ id, Content, documentClassName = "" }) => (
        <div class="demo-ways">
          <div class="demo-way">
            <h3>In the document</h3>
            <div class={`in-document ${documentClassName}`}>
              <Content />
            </div>
          </div>
          <div class="demo-way">
            <h3>In a dialog</h3>
            <Button command="--navi-open" commandFor={`${id}_dialog`}>
              Open the dialog
            </Button>
            {/* flex="y" on the popup, so a list asking for the leftover
                room (expandY) can be given it: without a column to grow in,
                a tall list simply overflows the popup and the popup itself
                becomes what scrolls — header included */}
            <Dialog id={`${id}_dialog`} minWidth="300px" flex="y">
              <Content />
            </Dialog>
          </div>
          <div class="demo-way">
            <h3>In a popover</h3>
            <Button command="--navi-toggle" commandFor={`${id}_popover`}>
              Open the popover
            </Button>
            <Popover id={`${id}_popover`} minWidth="300px" flex="y">
              <Content />
            </Popover>
          </div>
        </div>
      );

      const TwoSlides = () => (
        <SlideContainer duration={useSlideDuration()}>
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} />
          </DemoSlide>
          {/* Taller than the first on purpose: the box is as tall as this one,
              and the first simply leaves room under itself */}
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={8} />
          </DemoSlide>
        </SlideContainer>
      );

      const TallSlides = () => (
        <SlideContainer duration={useSlideDuration()}>
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={40} />
          </DemoSlide>
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={60} />
          </DemoSlide>
        </SlideContainer>
      );

      const TwoSlidesVertical = () => (
        <SlideContainer duration={useSlideDuration()} layout="column">
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} />
          </DemoSlide>
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={8} />
          </DemoSlide>
        </SlideContainer>
      );

      const WideSlidesVertical = () => (
        <SlideContainer duration={useSlideDuration()} layout="column">
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} className="wide" />
          </DemoSlide>
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={5} className="wide" />
          </DemoSlide>
        </SlideContainer>
      );

      // Focus, shown rather than described: each slide holds something to do,
      // so one can watch where the keyboard lands, what it does NOT land on,
      // and where it is put back.
      // A zone that says what to do and shows, by filling up, that it holds
      // the keyboard: where the focus is and where it comes back is then read
      // off the slides themselves.
      const FocusPad = ({ children, ...rest }) => (
        <div class="focus-pad" tabIndex={0} {...rest}>
          {children}
        </div>
      );

      const FocusSlides = () => (
        <SlideContainer duration={useSlideDuration()}>
          <Slide id="who" overflow="auto">
            <Box header padding="m" flex="x" alignY="center" className="part">
              <Text expandX>who</Text>
              <SlideContainer.Next size="xl" padding="xs" marginY="-xs" />
            </Box>
            <Box body padding="m" flex="y" spacing="m">
              <FocusPad>press → </FocusPad>
              <Input name="note" placeholder="→ moves the caret in here" />
            </Box>
          </Slide>
          <Slide id="where" overflow="auto">
            <Box header padding="m" flex="x" alignY="center" className="part">
              <Text expandX>where</Text>
              <SlideContainer.Previous size="xl" padding="xs" marginY="-xs" />
              <SlideContainer.Next size="xl" padding="xs" marginY="-xs" />
            </Box>
            <Box body padding="m" flex="y" spacing="m">
              <FocusPad>press → or ←</FocusPad>
              <FocusPad navi-autofocus>navi-autofocus</FocusPad>
            </Box>
          </Slide>
          <Slide id="done" overflow="auto">
            <Box header padding="m" flex="x" alignY="center" className="part">
              <Text expandX>done</Text>
              <SlideContainer.Previous size="xl" padding="xs" marginY="-xs" />
            </Box>
            <Box body padding="m">
              <Text>(nothing focusable here)</Text>
            </Box>
          </Slide>
        </SlideContainer>
      );

      const ThreeSlides = () => (
        <SlideContainer duration={useSlideDuration()}>
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} />
          </DemoSlide>
          <DemoSlide id="middle" title="middle" direction="both">
            <Filler count={5} />
          </DemoSlide>
          <DemoSlide id="last" title="last" direction="previous">
            <Filler count={3} />
          </DemoSlide>
        </SlideContainer>
      );

      // Two slides one can always walk out of: press → on the first and you are
      // on the second, whether or not you did anything there.
      const FreeSlides = () => {
        const [agreed, setAgreed] = useState(false);
        return (
          <SlideContainer duration={useSlideDuration()}>
            <Slide id="terms" overflow="auto">
              <Box header padding="m" flex="x" alignY="center" className="part">
                <Text expandX>terms</Text>
                <SlideContainer.Next size="xl" padding="xs" marginY="-xs" />
              </Box>
              <Box body padding="m">
                <label class="demo-option">
                  <input
                    type="checkbox"
                    checked={agreed}
                    onChange={(e) => setAgreed(e.target.checked)}
                  />
                  I agree
                </label>
              </Box>
            </Slide>
            <Slide id="signed" overflow="auto">
              <Box header padding="m" flex="x" alignY="center" className="part">
                <Text expandX>signed</Text>
                <SlideContainer.Previous size="xl" padding="xs" marginY="-xs" />
              </Box>
              <Box body padding="m">
                <Text>
                  {agreed ? "…and you agreed." : "…without agreeing."}
                </Text>
              </Box>
            </Slide>
          </SlideContainer>
        );
      };

      // The same two, with the first one holding on to the user until the box
      // is ticked: preventNavNext is read wherever a travel is asked for, so
      // the chevron goes read-only and → does nothing.
      const LockedSlides = () => {
        const [agreed, setAgreed] = useState(false);
        return (
          <SlideContainer duration={useSlideDuration()}>
            <Slide id="terms" preventNavNext={!agreed} overflow="auto">
              <Box header padding="m" flex="x" alignY="center" className="part">
                <Text expandX>terms</Text>
                <SlideContainer.Next size="xl" padding="xs" marginY="-xs" />
              </Box>
              <Box body padding="m">
                <label class="demo-option">
                  <input
                    type="checkbox"
                    checked={agreed}
                    onChange={(e) => setAgreed(e.target.checked)}
                  />
                  I agree
                </label>
              </Box>
            </Slide>
            <Slide id="signed" overflow="auto">
              <Box header padding="m" flex="x" alignY="center" className="part">
                <Text expandX>signed</Text>
                <SlideContainer.Previous size="xl" padding="xs" marginY="-xs" />
              </Box>
              <Box body padding="m">
                <Text>…and you agreed.</Text>
              </Box>
            </Slide>
          </SlideContainer>
        );
      };

      // Same lock, no chevron at all: the action itself moves the list on, by
      // dispatching the event a --navi-right command would have dispatched.
      // In an effect, not in the change handler: the lock lifts with the
      // render, and a travel asked for before that would be refused by it.
      const ActionThenNextSlides = () => {
        // How MANY times it was signed, not whether it was: coming back and
        // signing again has to move on again, and a boolean that is already
        // true is a state that never changes twice.
        const [signCount, setSignCount] = useState(0);
        const listRef = useRef();
        useEffect(() => {
          if (signCount === 0) {
            return;
          }
          listRef.current.dispatchEvent(
            new CustomEvent("navi_slide_move", {
              detail: { dx: 1, dy: 0 },
              bubbles: true,
            }),
          );
        }, [signCount]);
        return (
          <SlideContainer duration={useSlideDuration()} ref={listRef}>
            <Slide id="sign" preventNav={signCount === 0} overflow="auto">
              <Box header padding="m" flex="x" alignY="center" className="part">
                <Text expandX>sign</Text>
                {/* No way out here, but its room is kept: inert + hidden, so
                    the header is the same height as the next slide's and the
                    top of the box does not jump as one travels */}
                <SlideContainer.Next
                  size="xl"
                  padding="xs"
                  marginY="-xs"
                  style={{ visibility: "hidden" }}
                  inert
                />
              </Box>
              <Box body padding="m">
                <Button onClick={() => setSignCount((count) => count + 1)}>
                  Sign
                </Button>
              </Box>
            </Slide>
            <Slide id="done" overflow="auto">
              <Box header padding="m" flex="x" alignY="center" className="part">
                <Text expandX>done</Text>
                <SlideContainer.Previous size="xl" padding="xs" marginY="-xs" />
              </Box>
              <Box body padding="m">
                <Text>Signed — and the list moved on by itself.</Text>
              </Box>
            </Slide>
          </SlideContainer>
        );
      };

      // A map instead of a line: "create" is a step further into the decision
      // so it sits below, "edit" is about one entry of the list so it sits
      // beside it. Same component, same travel — only where the slides are
      // changes.
      const MAP = ["pick   edit", "create"];
      const MapSlides = () => (
        <SlideContainer layout={MAP} duration={useSlideDuration()}>
          <Slide id="pick" overflow="auto">
            <Box
              header
              padding="m"
              flex="x"
              alignY="center"
              spacing="xs"
              className="part"
            >
              <Text expandX>pick</Text>
              <SlideContainer.Move
                direction="right"
                size="xl"
                padding="xs"
                marginY="-xs"
              />
              <SlideContainer.Move
                direction="down"
                size="xl"
                padding="xs"
                marginY="-xs"
              />
            </Box>
            <Box body padding="m">
              <Filler count={6} />
            </Box>
          </Slide>
          <Slide id="create" overflow="auto">
            <Box
              header
              padding="m"
              flex="x"
              alignY="center"
              className="part part-create"
            >
              <Text expandX>create (below)</Text>
              <SlideContainer.Move
                direction="up"
                size="xl"
                padding="xs"
                marginY="-xs"
              />
            </Box>
            <Box body padding="m">
              <Filler count={3} />
            </Box>
          </Slide>
          <Slide id="edit" overflow="auto">
            <Box
              header
              padding="m"
              flex="x"
              alignY="center"
              className="part part-edit"
            >
              <Text expandX>edit (on the right)</Text>
              <SlideContainer.Move
                direction="left"
                size="xl"
                padding="xs"
                marginY="-xs"
              />
            </Box>
            <Box body padding="m">
              <Filler count={4} />
            </Box>
          </Slide>
        </SlideContainer>
      );

      // The dialog case of its own: the dialog is the only popup that can be
      // asked to take the whole document, so it is the only one where the list
      // is given room rather than taking it from its slides.
      const ExpandDialogSection = () => {
        const [flush, setFlush] = useState(false);
        const [vertical, setVertical] = useState(false);
        return (
          <section class="demo-section" id="dialog">
            <Heading id="dialog">
              Specific to dialog: filling the document
            </Heading>
            <p>
              A dialog with <code>expand</code> takes the whole screen, so the
              list has room given to it rather than taken from its slides:{" "}
              <code>expandY</code> makes it fill the dialog, and each slide then
              fills the list whatever it contains.
            </p>
            <div class="demo-row">
              <Button command="--navi-open" commandFor="expand_dialog">
                Open the dialog
              </Button>
              {/* marginWithContainer 0: the dialog then reaches the edges of
                  the document, which is the shape a full-screen flow wants —
                  and the one where a travelling slide has nothing to peek
                  through beside it */}
              <label class="demo-option">
                <input
                  type="checkbox"
                  checked={flush}
                  onChange={(e) => setFlush(e.target.checked)}
                />
                marginWithContainer=0
              </label>
              <label class="demo-option">
                <input
                  type="checkbox"
                  checked={vertical}
                  onChange={(e) => setVertical(e.target.checked)}
                />
                vertical
              </label>
            </div>
            <Dialog
              id="expand_dialog"
              expand
              marginWithContainer={flush ? 0 : undefined}
            >
              <SlideContainer
                duration={useSlideDuration()}
                expandY
                layout={vertical ? "column" : "row"}
              >
                <DemoSlide id="first" title="first" direction="next">
                  <Filler count={3} />
                </DemoSlide>
                <DemoSlide id="second" title="second" direction="previous">
                  <Filler count={8} />
                </DemoSlide>
              </SlideContainer>
            </Dialog>
          </section>
        );
      };

      const App = () => {
        const [animated, setAnimated] = useStoredBoolean(
          "slide_container_demo_animated",
          true,
        );
        const [speed, setSpeed] = useStoredString(
          "slide_container_demo_speed",
          "300ms",
        );
        const settings = { animated, setAnimated, speed, setSpeed };
        return (
          <SettingsContext.Provider value={settings}>
            <AppContent />
          </SettingsContext.Provider>
        );
      };

      const AppContent = () => (
        <div>
          <h1>Slide container</h1>

          <div class="demo-section">
            <p>
              Slides that replace one another inside one box. The box takes the
              size of its largest slide, so nothing grows or shrinks as one
              moves through them; a slide travels by exactly one box. Where the
              slides are is said by <code>layout</code>: <code>"row"</code> (the
              default), <code>"column"</code>, or a map of named areas.
            </p>
            <SlideSettings />
            <strong>On this page</strong>
            <ol className="toc">
              <li>
                <Link href="#two-slides">Two slides</Link>
                <ul>
                  <li>
                    <Link href="#taller">Content taller than the box</Link>
                  </li>
                  <li>
                    <Link href="#wider">Content wider than the box</Link>
                  </li>
                </ul>
              </li>
              <li>
                <Link href="#vertical">Vertical</Link>
              </li>
              <li>
                <Link href="#three-slides">Three slides</Link>
              </li>
              <li>
                <Link href="#map">A map instead of a line</Link>
              </li>
              <li>
                <Link href="#focus">Focus</Link>
              </li>
              <li>
                <Link href="#locking">Locking the way out</Link>
              </li>
              <li>
                <Link href="#dialog">Specific to dialog</Link>
              </li>
            </ol>
            <p class="demo-see-also">
              <strong>See also:</strong>{" "}
              <Link href="../../control/demos/popup/1_dialog_demo.html#slides">
                Dialog demo — Slides
              </Link>{" "}
              ·{" "}
              <Link href="../../control/demos/popup/2_popover_demo.html#slides">
                Popover demo — Slides
              </Link>{" "}
              ·{" "}
              <Link href="./slide_container_perf.html">Slide container — perf</Link>
            </p>
          </div>

          <section class="demo-section" id="two-slides">
            <Heading id="two-slides">Two slides</Heading>
            <p>
              The plain case: a slide arrives from the right, the one it
              replaces leaves to the left. The second slide is taller than the
              first, and the box is as tall as it from the start.
            </p>
            <ThreeWays id="basic" Content={TwoSlides} />
          </section>

          <section class="demo-section" id="taller">
            <Heading id="taller">Content taller than the box</Heading>
            <p>
              Nothing special happens: a slide is a box, so it scrolls its own
              body (<code>overflow="auto"</code> plus a <code>body</code>, see
              box.jsx). What decides the height is what holds the container — a
              height here, the screen for a dialog, the space left under the
              anchor for a popover — never the slides themselves.
            </p>
            <ThreeWays
              id="tall"
              Content={TallSlides}
              documentClassName="in-document-capped"
            />
          </section>

          <section class="demo-section" id="vertical">
            <Heading id="vertical">Vertical</Heading>
            <p>
              The same two slides with <code>layout="column"</code>: they arrive
              from below instead of from the side. The travel is the only
              difference — the box is still sized on its largest slide, in both
              directions.
            </p>
            <ThreeWays id="vertical" Content={TwoSlidesVertical} />
          </section>

          <section class="demo-section" id="map">
            <Heading id="map">A map instead of a line</Heading>
            <p>
              <code>layout={JSON.stringify(MAP)}</code> — one string per row,
              spelled like <code>grid-template-areas</code>: “.” is a hole, a
              name repeated spans. Each slide says which area it is, so moving a
              screen is an edit to the map and nothing else. A direction with
              nothing there is simply not offered — try ← → ↑ ↓.
            </p>
            <ThreeWays id="map" Content={MapSlides} />
          </section>

          <section class="demo-section" id="wider">
            <Heading id="wider">Content wider than the box (vertical)</Heading>
            <p>
              Sideways now belongs to the content, not to the travel: the slides
              go up and down while what they hold scrolls left and right. Their
              own body is what scrolls, and the box hides its overflow so the
              slide waiting below never shows through.
            </p>
            <ThreeWays id="wide" Content={WideSlidesVertical} />
          </section>

          <ExpandDialogSection />

          <section class="demo-section" id="focus">
            <Heading id="focus">Focus</Heading>
            <p>
              Travel with the chevrons, ← and →, Home and End. The zone holding
              the keyboard is filled in.
            </p>
            <ThreeWays id="focus" Content={FocusSlides} />
          </section>

          <section class="demo-section" id="locking">
            <Heading id="locking">Locking the way out</Heading>
            <p>
              A step one must not skip: <code>preventNavNext</code> (and{" "}
              <code>preventNavPrevious</code>, or <code>preventNav</code> for
              both) on a <code>Slide</code> holds the user there. It is read
              where the travel is decided, so it holds against every way of
              asking — the chevron, the keyboard, a <code>--navi-right</code>{" "}
              command, an event dispatched by hand.
            </p>
            <div class="demo-ways">
              <div class="demo-way">
                <h3>Without a lock</h3>
                <p class="demo-note">
                  Press → (or the chevron): you are on the second slide, box
                  ticked or not.
                </p>
                <div class="in-document">
                  <FreeSlides />
                </div>
              </div>
              <div class="demo-way">
                <h3>preventNavNext</h3>
                <p class="demo-note">
                  The chevron is read-only and → does nothing until the box is
                  ticked.
                </p>
                <div class="in-document">
                  <LockedSlides />
                </div>
              </div>
              <div class="demo-way">
                <h3>The action moves on</h3>
                <p class="demo-note">
                  No chevron at all: signing dispatches <code>navi_slide_move</code>.
                </p>
                <div class="in-document">
                  <ActionThenNextSlides />
                </div>
              </div>
            </div>
          </section>

          <section class="demo-section" id="three-slides">
            <Heading id="three-slides">Three slides</Heading>
            <p>
              Nothing changes past two: the middle slide simply carries both
              buttons, each still saying one word. The list walks the DOM to
              find where “one further” is, so a slide added between two others
              needs nothing said about it anywhere.
            </p>
            <ThreeWays id="three" Content={ThreeSlides} />
          </section>
        </div>
      );

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
