<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup demo</title>
    <style>
      .demo-header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .demo-header h1 {
        margin: 0;
      }
      .demo-nav {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .demo-nav > * {
        display: flex;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        color: #1a237e;
        font-size: 1.1rem;
        text-decoration: none;
        background: #eaf2fd;
        border-radius: 6px;
      }
      .demo-nav > a:hover {
        background: #d3e5fb;
      }
      .demo-nav > .demo-nav-none {
        color: #b6bdc9;
        background: #f1f3f6;
      }
      body {
        margin: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .demo-row {
        display: flex;
        margin-top: 8px;
        flex-wrap: wrap;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { useId, useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Input,
        Label,
        NaviDebug,
        Popup,
      } from "@jsenv/navi";
      import {
        CallLog,
        useCallLog,
      } from "../../control/demos/utils/call_log.jsx";

      const TriggeredPopup = ({ label, ...rest }) => {
        const popupId = useId();
        return (
          <>
            <Button command="--navi-toggle" commandFor={popupId}>
              {label}
            </Button>
            <Popup id={popupId} {...rest}>
              <p style={{ marginTop: 0 }}>{label}</p>
              <Button command="--navi-close">Close</Button>
            </Popup>
          </>
        );
      };

      // Popup renders EITHER a Dialog or a Popover, never both — so whichever
      // one the mode resolves to is the control group, and action/uiAction
      // travel through untouched. Switching mode mid-life recreates the
      // controller; `value` below is what re-seeds it.
      const ActionsPopup = ({ label, ...rest }) => {
        const popupId = useId();
        const [entries, push, clear] = useCallLog();
        const [committed, setCommitted] = useState({ note: "" });
        return (
          <div>
            <div class="demo-row">
              <Button command="--navi-toggle" commandFor={popupId}>
                {label}
              </Button>
              <span>
                committed: <code>{JSON.stringify(committed)}</code>
              </span>
            </div>
            <Popup
              id={popupId}
              value={committed}
              uiAction={(value) => {
                push("uiAction", value);
              }}
              action={(value) => {
                push("action", value);
                setCommitted(value);
              }}
              {...rest}
            >
              <Box flex="y" spacing="m" padding="m">
                <Field vertical>
                  <Label>Note</Label>
                  <Input name="note" placeholder="type something…" />
                </Field>
                <Button command="--navi-close">Close (commits)</Button>
              </Box>
            </Popup>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // debugAll on purpose: this demo is where the two modes meet, and the
      // interaction/focus logs are the fastest way to see which one answered.
      const App = () => (
        <NaviDebug debugAll>
          <DemoHeader
            title="Popup demo"
            previous={{ href: "./3_interop_demo.html", label: "Popup interop" }}
            next={{ href: "./5_side_panel_demo.html", label: "SidePanel" }}
          />
          <div class="demo-row">
            <TriggeredPopup label="auto (wide screen -> popover)" />
            <TriggeredPopup label="mode=dialog forced" mode="dialog" />
            <TriggeredPopup label="mode=popover forced" mode="popover" />
            <TriggeredPopup label="dialog with expand" mode="dialog" expand />
          </div>

          <h2>uiAction / action</h2>
          <p>
            Same contract as Dialog and Popover, whichever the mode resolves to:{" "}
            <code>uiAction</code> while typing, <code>action</code> on close
            (and only if something changed), nothing on cancel —{" "}
            <kbd>Escape</kbd>.
          </p>
          <ActionsPopup label="auto" />
          <ActionsPopup label="mode=dialog forced" mode="dialog" />
          <ActionsPopup label="mode=popover forced" mode="popover" />
        </NaviDebug>
      );

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
