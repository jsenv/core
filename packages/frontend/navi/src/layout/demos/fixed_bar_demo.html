<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixedBar Demo</title>
    <style>
      body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 20px 0;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }
      .screens {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      .screen {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .screen > iframe {
        width: 390px;
        height: 640px;
        background: white;
        border: 1px solid #cbd2dc;
        border-radius: 12px;
      }
      .screen > a {
        color: #1a237e;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { Link } from "@jsenv/navi";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ id, children }) => (
        <h2 id={id}>
          <Link anchor revealOnInteraction href={`#${id}`}>
            #
          </Link>
          {children}
        </h2>
      );

      // A bar is fixed to the WINDOW, so two of them on one page would fight
      // over the same edges. Each layout is its own document, shown here at
      // phone size — and openable on its own, which is the only way to see it
      // against a real window.
      const Screen = ({ src, caption }) => (
        <div className="screen">
          <iframe src={src} title={caption} />
          <a href={src} target="_blank" rel="noreferrer">
            {caption} ↗
          </a>
        </div>
      );

      const App = () => (
        <div>
          <DemoHeader title="FixedBar" />
          <div className="demo-section">
            <h2>Table of contents</h2>
            <DocumentToc />
          </div>

          <div className="demo-section">
            <Heading id="area">area</Heading>
            <div className="screens">
              <Screen src="./fixed_bar/top.html" caption='area="top"' />
              <Screen
                src="./fixed_bar/bottom_nav.html"
                caption='area="bottom", a nav in it'
              />
              <Screen
                src="./fixed_bar/sides.html"
                caption='area="left" + area="right"'
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="space">The space a bar takes back</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/top_and_bottom.html"
                caption="two bars, and one that comes and goes"
              />
            </div>
          </div>
        </div>
      );

      render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
