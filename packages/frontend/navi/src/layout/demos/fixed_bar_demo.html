<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixedBar Demo</title>
    <style>
      body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 20px 0;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }
      .screens {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      /* Each screen is a real phone-sized window, scaled down: the page inside
         keeps a phone's viewport — its layout, its scrolling — while taking a
         third of the room here, so the cases sit side by side instead of being
         scrolled past one at a time. */
      .screen {
        --screen-width: 390px;
        --screen-height: 680px;
        --screen-scale: 0.55;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .screen > .viewport {
        width: calc(var(--screen-width) * var(--screen-scale));
        height: calc(var(--screen-height) * var(--screen-scale));
        border: 1px solid #cbd2dc;
        border-radius: 10px;
        overflow: hidden;
      }
      .screen iframe {
        display: block;
        width: var(--screen-width);
        height: var(--screen-height);
        background: white;
        border: none;
        transform: scale(var(--screen-scale));
        transform-origin: top left;
      }
      .screen > a {
        color: #1a237e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { Link } from "@jsenv/navi";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ id, children }) => (
        <h2 id={id}>
          <Link anchor revealOnInteraction href={`#${id}`}>
            #
          </Link>
          {children}
        </h2>
      );

      // A bar is fixed to the WINDOW, so two of them on one page would fight
      // over the same edges. Each layout is its own document, shown here at
      // phone size — and openable on its own, which is the only way to see it
      // against a real window.
      const Screen = ({ src, caption, height = 260, scale = 0.8 }) => (
        <div
          className="screen"
          style={{ "--screen-height": `${height}px`, "--screen-scale": scale }}
        >
          <div className="viewport">
            <iframe src={src} title={caption} />
          </div>
          <a href={src} target="_blank" rel="noreferrer">
            {caption} ↗
          </a>
        </div>
      );

      const App = () => (
        <div>
          <DemoHeader title="FixedBar" />
          <div className="demo-section">
            <h2>Table of contents</h2>
            <DocumentToc />
          </div>

          <div className="demo-section">
            <Heading id="nominal">Cas nominal</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/nominal.html"
                caption="a top bar and a bottom nav"
                height={420}
                scale={0.75}
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="scrollbar">The document scrollbar</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/scrollbar.html"
                caption="press the button: the page starts scrolling and the bar loses the scrollbar's width"
                height={420}
                scale={0.75}
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="area">area</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/background.html"
                caption='area="top", background="#1e293b"'
              />
              <Screen src="./fixed_bar/bottom.html" caption='area="bottom"' />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="border">border and size</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/border.html"
                caption="press the buttons: border on/off, height"
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="scrollbar-gutter">
              scrollbar-gutter: stable both-edges
            </Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/scrollbar.html?gutter"
                caption="press the button: the room is kept on both edges, so nothing moves"
                height={420}
                scale={0.75}
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="anchors">Scrolling to something</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/top_and_bottom.html"
                caption="the jumps live in the bars — every target lands in front of them"
                height={420}
                scale={0.75}
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="keyboard">A field taking focus</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/keyboard.html"
                caption="on a phone, focus the last fields: the numbers say where the bottom bar ends up"
                height={420}
                scale={0.75}
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="route-travel">A RouteTravel under the bars</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/route_travel.html"
                caption="scroll, then change tab: the pages travel between the bars, each from where it was"
                height={420}
                scale={0.75}
              />
            </div>
          </div>

          <div className="demo-section">
            <Heading id="binder">A bottom nav drawn by a Binder</Heading>
            <div className="screens">
              <Screen
                src="./fixed_bar/binder_nav.html"
                caption="Binder as the app shell, tabs at the bottom"
                height={420}
                scale={0.75}
              />
            </div>
          </div>
        </div>
      );

      render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
