<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FixedBar — area="left" and area="right"</title>
    <link rel="stylesheet" href="./_shell.css" />
  </head>
  <body>
    <div id="app" data-navi-fixed-bar-space></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { Box, FixedBar } from "@jsenv/navi";

      const App = () => (
        <>
          <FixedBar area="left" size="56px">
            <Box flex="y" alignX="center" spacing="s" paddingY="s" expandY>
              <span>A</span>
              <span>B</span>
              <span>C</span>
            </Box>
          </FixedBar>
          <div className="page">
            {Array.from({ length: 20 }, (_, index) => (
              <div key={index} className="row">
                Row {index + 1}
              </div>
            ))}
            <div className="last">
              Last row — the side bars reserve their width too.
            </div>
          </div>
          <FixedBar area="right" size="56px" borderColor="#2563eb">
            <Box flex="y" alignX="center" spacing="s" paddingY="s" expandY>
              <span>1</span>
              <span>2</span>
            </Box>
          </FixedBar>
        </>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
