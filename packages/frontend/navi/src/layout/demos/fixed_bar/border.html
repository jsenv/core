<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FixedBar — border and size</title>
    <link rel="stylesheet" href="./_shell.css" />
  </head>
  <body>
    <div id="app" data-navi-fixed-bar-space></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { Box, Button, FixedBar } from "@jsenv/navi";
      import { rows } from "./_page.jsx";

      const App = () => {
        const [border, setBorder] = useState(true);
        const [height, setHeight] = useState(56);
        return (
          <>
            <FixedBar area="top" border={border} height={height}>
              <Box flex alignX="center" expandX>
                border={String(border)} · height={height}
              </Box>
            </FixedBar>
            <div className="page">
              <Box flex spacing="s" marginBottom="s">
                <Button onClick={() => setBorder(!border)}>
                  {border ? "border={false}" : "border={true}"}
                </Button>
                <Button onClick={() => setHeight(height === 56 ? 88 : 56)}>
                  height {height === 56 ? "88" : "56"}
                </Button>
              </Box>
              {rows()}
            </div>
          </>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
