<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FixedBar — area="top"</title>
    <link rel="stylesheet" href="./_shell.css" />
  </head>
  <body>
    <div id="app" data-navi-fixed-bar-space></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { FixedBar, Title } from "@jsenv/navi";

      const App = () => (
        <>
          <FixedBar area="top">
            <Title as="h1" margin="0" size="20">
              Mes parties
            </Title>
          </FixedBar>
          <div className="page">
            {Array.from({ length: 20 }, (_, index) => (
              <div key={index} className="row">
                Row {index + 1}
              </div>
            ))}
            <div className="last">Last row — nothing hides under the bar.</div>
          </div>
        </>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
