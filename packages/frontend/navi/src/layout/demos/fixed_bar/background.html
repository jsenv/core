    <title>FixedBar — a top bar with a background</title>
    <link rel="stylesheet" href="./_shell.css" />

  <body>
    <div id="app" data-navi-safe-area></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { FixedBar, Title } from "@jsenv/navi";
      import { rows } from "./_page.jsx";

      const App = () => (
        <>
          <FixedBar area="top" background="#1e293b">

          </FixedBar>
          <div className="page">{rows()}</div>

      render(<App />, document.getElementById("app"));
