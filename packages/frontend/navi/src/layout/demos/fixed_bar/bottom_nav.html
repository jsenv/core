<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FixedBar — area="bottom", a nav in it</title>
    <link rel="stylesheet" href="./_shell.css" />
    <style>
      .nav_item {
        display: flex;
        min-width: 0;
        flex: 1 1 0;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        color: #6b7280;
        font-size: 12px;
        text-decoration: none;
      }
      .nav_item[data-href-current] {
        color: #2563eb;
      }
      .nav_item svg {
        width: 24px;
        height: 24px;
      }
      .cta {
        display: flex;
        width: 32px;
        height: 32px;
        margin-top: -4px;
        align-items: center;
        justify-content: center;
        color: white;
        background: #2563eb;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="app" data-navi-fixed-bar-space></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { FixedBar, Link, route, setupRoutes } from "@jsenv/navi";

      const HOME = route("/");
      const GAMES = route("/games");
      const CREATE = route("/create");
      const PROFILE = route("/profile");
      setupRoutes([HOME, GAMES, CREATE, PROFILE]);

      const NavItem = ({ route, label, children }) => (
        <Link
          route={route}
          baseClassName="nav_item"
          underline={false}
          hrefFallback={false}
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            {children}
          </svg>
          {label}
        </Link>
      );

      const App = () => (
        <>
          <div className="page">
            {Array.from({ length: 20 }, (_, index) => (
              <div key={index} className="row">
                Row {index + 1}
              </div>
            ))}
            <div className="last">Last row — nothing hides under the bar.</div>
          </div>
          <FixedBar as="nav" area="bottom" size="64px">
            <NavItem route={HOME} label="Accueil">
              <path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z" />
            </NavItem>
            <NavItem route={GAMES} label="Parties">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 15-5-5 1.41-1.41L10.5 14.17l6.59-6.59L18.5 9l-8 8z" />
            </NavItem>
            <Link
              route={CREATE}
              baseClassName="nav_item"
              underline={false}
              hrefFallback={false}
            >
              <span className="cta">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
              </span>
              Créer
            </Link>
            <NavItem route={PROFILE} label="Profil">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </NavItem>
          </FixedBar>
        </>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
