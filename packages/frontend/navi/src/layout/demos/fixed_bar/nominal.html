<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FixedBar — the nominal app: a top bar and a bottom nav</title>
    <link rel="stylesheet" href="./_shell.css" />
    <style>
      .cta {
        display: flex;
        width: 30px;
        height: 30px;
        margin-top: -4px;
        align-items: center;
        justify-content: center;
        color: white;
        background: #2563eb;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="app" data-navi-fixed-bar-space></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import {
        Box,
        FixedBar,
        Icon,
        Link,
        Text,
        Title,
        route,
        setupRoutes,
      } from "@jsenv/navi";
      import { rows } from "./_page.jsx";

      const HOME = route("/");
      const GAMES = route("/games");
      const CREATE = route("/create");
      const JOIN = route("/join");
      const PROFILE = route("/profile");
      setupRoutes([HOME, GAMES, CREATE, JOIN, PROFILE]);

      const TITLES = new Map([
        [HOME, "Accueil"],
        [GAMES, "Mes parties"],
        [CREATE, "Créer"],
        [JOIN, "Rejoindre"],
        [PROFILE, "Profil"],
      ]);

      const NAV_ITEM_STYLE = {
        "color": "#6b7280",
        ":-navi-href-current": { color: "#2563eb" },
      };
      const NavItem = ({ route, label, children }) => (
        <Link
          route={route}
          underline={false}
          hrefFallback={false}
          flex="y"
          alignX="center"
          alignY="center"
          spacing="xxs"
          expandX
          style={NAV_ITEM_STYLE}
        >
          {children}
          <Text size="xs">{label}</Text>
        </Link>
      );
      const NavIcon = ({ path }) => (
        <Icon size="l">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d={path} />
          </svg>
        </Icon>
      );

      const App = () => {
        let title = "Accueil";
        for (const [aRoute, aTitle] of TITLES) {
          if (aRoute.matchingSignal.value) {
            title = aTitle;
          }
        }
        return (
          <>
            <FixedBar area="top" height={48}>
              <Box flex alignX="center" alignY="center" expandX>
                <Title as="h1" margin="0" size="16">
                  {title}
                </Title>
              </Box>
            </FixedBar>
            <div className="page">{rows(20)}</div>
            <FixedBar as="nav" area="bottom" height={54}>
              <NavItem route={HOME} label="Accueil">
                <NavIcon path="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z" />
              </NavItem>
              <NavItem route={GAMES} label="Parties">
                <NavIcon path="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 15-5-5 1.41-1.41L10.5 14.17l6.59-6.59L18.5 9l-8 8z" />
              </NavItem>
              <NavItem route={CREATE} label="Créer">
                <span className="cta">
                  <NavIcon path="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </span>
              </NavItem>
              <NavItem route={JOIN} label="Rejoindre">
                <NavIcon path="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
              </NavItem>
              <NavItem route={PROFILE} label="Profil">
                <NavIcon path="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
              </NavItem>
            </FixedBar>
          </>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
