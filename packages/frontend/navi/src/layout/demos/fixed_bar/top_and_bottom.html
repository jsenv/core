<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FixedBar — top and bottom, one page</title>
    <link rel="stylesheet" href="./_shell.css" />
  </head>
  <body>
    <div id="app" data-navi-fixed-bar-space></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { Box, Button, FixedBar, Title } from "@jsenv/navi";

      const App = () => {
        const [withTopBar, setWithTopBar] = useState(true);
        return (
          <>
            {withTopBar && (
              <FixedBar area="top">
                <Title as="h1" margin="0" size="20">
                  Mes parties
                </Title>
              </FixedBar>
            )}
            <div className="page">
              <Box flex spacing="s" marginBottom="m">
                <Button onClick={() => setWithTopBar(!withTopBar)}>
                  {withTopBar ? "Remove the top bar" : "Add the top bar"}
                </Button>
              </Box>
              <div id="first" className="first">
                First row — anchor target
              </div>
              {Array.from({ length: 10 }, (_, index) => (
                <div key={index} className="row">
                  Row {index + 1}
                </div>
              ))}
              <div id="middle" className="marker">
                Middle — anchor target
              </div>
              {Array.from({ length: 10 }, (_, index) => (
                <div key={index} className="row">
                  Row {index + 11}
                </div>
              ))}
              <div id="last" className="last">
                Last row — anchor target
              </div>
              <nav className="anchors">
                <a href="#first">↑ first</a>
                <a href="#middle">middle</a>
                <a href="#last">↓ last</a>
              </nav>
            </div>
            <FixedBar area="bottom" size="64px">
              <Box flex alignX="center" expandX>
                Bottom
              </Box>
            </FixedBar>
          </>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
