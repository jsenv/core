<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>A bottom nav made of a Binder</title>
    <link rel="stylesheet" href="./_shell.css" />
    <style>
      /* No app shell of our own here: the binder IS the shell. */
      #app {
        max-width: none;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { Binder, Icon, Text } from "@jsenv/navi";

      // A bottom nav drawn by a Binder rather than by a FixedBar: the tab row
      // and the page are one shape, so the open tab opens INTO the content
      // through the same concave junction the binder draws everywhere else —
      // something a fixed bar sitting over the page cannot do, its outline
      // having no page to merge with.
      //
      // Nothing here is fixed. The binder is the size of the window and its
      // page scrolls inside it (scrollablePage), which is what keeps the tab
      // row in place. The cost: the document no longer scrolls, so anything
      // reading window scroll — and the browser's own address-bar hiding —
      // sees a page that never moves.
      const Rows = ({ from }) => (
        <>
          {Array.from({ length: 12 }, (_, index) => (
            <div key={index} className="row">
              Row {from + index}
            </div>
          ))}
        </>
      );

      const Page = ({ name }) => (
        <>
          <div id={`${name}-first`} className="first">
            First row of {name} — anchor target
          </div>
          <Rows from={1} />
          <div id={`${name}-middle`} className="marker">
            Middle of {name} — anchor target
          </div>
          <Rows from={13} />
          <div id={`${name}-last`} className="last">
            Last row of {name} — anchor target
          </div>
          <nav className="anchors">
            <a href={`#${name}-first`}>↑ first</a>
            <a href={`#${name}-middle`}>middle</a>
            <a href={`#${name}-last`}>↓ last</a>
          </nav>
        </>
      );

      const NavIcon = ({ path }) => (
        <Icon size="l">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d={path} />
          </svg>
        </Icon>
      );
      const NavLabel = ({ path, children }) => (
        <span
          style={{
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: "2px",
          }}
        >
          <NavIcon path={path} />
          <Text size="xs">{children}</Text>
        </span>
      );

      const App = () => (
        <Binder
          tabsPosition="bottom"
          scrollablePage
          defaultValue="home"
          borderRadius={12}
          pagePadding="0"
          style={{
            "position": "fixed",
            "inset": "0",
            "width": "auto",
            // The home indicator: the tab row keeps clear of it while the
            // binder's own background runs to the edge of the screen.
            "--binder-padding-y":
              "calc(var(--navi-xs) + env(safe-area-inset-bottom))",
          }}
        >
          <Binder.Item
            value="home"
            label={
              <NavLabel path="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z">
                Accueil
              </NavLabel>
            }
          >
            <div className="page">
              <Page name="home" />
            </div>
          </Binder.Item>
          <Binder.Item
            value="games"
            label={
              <NavLabel path="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 15-5-5 1.41-1.41L10.5 14.17l6.59-6.59L18.5 9l-8 8z">
                Parties
              </NavLabel>
            }
          >
            <div className="page">
              <Page name="games" />
            </div>
          </Binder.Item>
          <Binder.Item
            value="profile"
            label={
              <NavLabel path="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                Profil
              </NavLabel>
            }
          >
            <div className="page">
              <Page name="profile" />
            </div>
          </Binder.Item>
        </Binder>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
