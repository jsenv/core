<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide list demo</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f5f5;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        font-size: 1.3rem;
        border-bottom: 2px solid #ddd;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #444;
        font-size: 0.95rem;
      }
      .demo-links {
        display: flex;
        margin-bottom: 16px;
        padding: 10px 14px;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
        background: #eaf2fd;
        border-radius: 8px;
      }
      .demo-links a {
        color: #1a237e;
      }
      .demo-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .demo-option {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.85rem;
      }
      .demo-ways {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
      }
      .demo-way {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .demo-way > h3 {
        margin: 0;
        color: #666;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .part {
        color: white;
        background: #1a237e;
      }
      .filler {
        padding: 8px 12px;
        background: #eef3fb;
        border-bottom: 1px solid #cfe0f5;
      }
      .wide {
        width: 900px;
        padding: 8px 12px;
        background: #fdf1e0;
        border-bottom: 1px solid #f0d7ae;
      }
      /* In the document there is no popup to take a size from, so the list
         is given one here — same as any box would be. */
      .in-document {
        display: flex;
        width: 300px;
        flex-direction: column;
        border: 1px solid #90caf9;
        border-radius: 8px;
      }
      /* Very tall content: without a height the box would be as tall as its
         tallest slide, which is exactly what we do NOT want to see in a page
         that also has other sections. */
      .in-document-capped {
        height: 260px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Button,
        Dialog,
        Popover,
        SlideList,
        Text,
      } from "@jsenv/navi";

      const Filler = ({ count, className = "filler" }) =>
        Array.from({ length: count }, (_, i) => (
          <div key={i} class={className}>
            {i + 1}
          </div>
        ));

      // One slide: a header that stays and a body that scrolls, plus the button
      // that leaves it. SlideList.Next/.Previous say where to go — which slide
      // that is, and which way the chevron points, is the list's business.
      const DemoSlide = ({ id, title, direction, children }) => (
        <SlideList.Item id={id} overflow="auto">
          <Box header padding="m" flex="x" alignY="center" className="part">
            {/* A slide in the middle needs both, and neither button needs to
                know it is in the middle: each says one word */}
            {direction !== "next" && (
              <SlideList.Previous size="xl" padding="xs" />
            )}
            <Text expandX>{title}</Text>
            {direction !== "previous" && (
              <SlideList.Next size="xl" padding="xs" />
            )}
          </Box>
          <Box body padding="m">
            {children}
          </Box>
        </SlideList.Item>
      );

      // Every section shows the same thing three times: in the document, in a
      // dialog, in a popover. Taking a component rather than the slides
      // themselves, because each of the three needs its own copy of them.
      // eslint-disable-next-line no-unused-vars -- Content IS used, as <Content />
      const ThreeWays = ({ id, Content, documentClassName = "" }) => (
        <div class="demo-ways">
          <div class="demo-way">
            <h3>In the document</h3>
            <div class={`in-document ${documentClassName}`}>
              <Content />
            </div>
          </div>
          <div class="demo-way">
            <h3>In a dialog</h3>
            <Button command="--navi-open" commandFor={`${id}_dialog`}>
              Open the dialog
            </Button>
            {/* flex="y" on the popup, so a list asking for the leftover
                room (expandY) can be given it: without a column to grow in,
                a tall list simply overflows the popup and the popup itself
                becomes what scrolls — header included */}
            <Dialog id={`${id}_dialog`} minWidth="300px" flex="y">
              <Content />
            </Dialog>
          </div>
          <div class="demo-way">
            <h3>In a popover</h3>
            <Button command="--navi-toggle" commandFor={`${id}_popover`}>
              Open the popover
            </Button>
            <Popover id={`${id}_popover`} minWidth="300px" flex="y">
              <Content />
            </Popover>
          </div>
        </div>
      );

      const TwoSlides = () => (
        <SlideList duration="400ms">
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} />
          </DemoSlide>
          {/* Taller than the first on purpose: the box is as tall as this one,
              and the first simply leaves room under itself */}
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={8} />
          </DemoSlide>
        </SlideList>
      );

      const TallSlides = () => (
        <SlideList duration="400ms">
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={40} />
          </DemoSlide>
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={60} />
          </DemoSlide>
        </SlideList>
      );

      const TwoSlidesVertical = () => (
        <SlideList duration="400ms" vertical>
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} />
          </DemoSlide>
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={8} />
          </DemoSlide>
        </SlideList>
      );

      const WideSlidesVertical = () => (
        <SlideList duration="400ms" vertical>
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} className="wide" />
          </DemoSlide>
          <DemoSlide id="second" title="second" direction="previous">
            <Filler count={5} className="wide" />
          </DemoSlide>
        </SlideList>
      );

      const ThreeSlides = () => (
        <SlideList duration="400ms">
          <DemoSlide id="first" title="first" direction="next">
            <Filler count={3} />
          </DemoSlide>
          <DemoSlide id="middle" title="middle" direction="both">
            <Filler count={5} />
          </DemoSlide>
          <DemoSlide id="last" title="last" direction="previous">
            <Filler count={3} />
          </DemoSlide>
        </SlideList>
      );

      // The dialog case of its own: the dialog is the only popup that can be
      // asked to take the whole document, so it is the only one where the list
      // is given room rather than taking it from its slides.
      const ExpandDialogSection = () => {
        const [flush, setFlush] = useState(false);
        const [vertical, setVertical] = useState(false);
        return (
          <section class="demo-section">
            <h2>Specific to dialog: filling the document</h2>
            <p>
              A dialog with <code>expand</code> takes the whole screen, so the
              list has room given to it rather than taken from its slides:{" "}
              <code>expandY</code> makes it fill the dialog, and each slide then
              fills the list whatever it contains.
            </p>
            <div class="demo-row">
              <Button command="--navi-open" commandFor="expand_dialog">
                Open the dialog
              </Button>
              {/* marginWithContainer 0: the dialog then reaches the edges of
                  the document, which is the shape a full-screen flow wants —
                  and the one where a travelling slide has nothing to peek
                  through beside it */}
              <label class="demo-option">
                <input
                  type="checkbox"
                  checked={flush}
                  onChange={(e) => setFlush(e.target.checked)}
                />
                marginWithContainer=0
              </label>
              <label class="demo-option">
                <input
                  type="checkbox"
                  checked={vertical}
                  onChange={(e) => setVertical(e.target.checked)}
                />
                vertical
              </label>
            </div>
            <Dialog
              id="expand_dialog"
              expand
              marginWithContainer={flush ? 0 : undefined}
            >
              <SlideList duration="400ms" expandY vertical={vertical}>
                <DemoSlide id="first" title="first" direction="next">
                  <Filler count={3} />
                </DemoSlide>
                <DemoSlide id="second" title="second" direction="previous">
                  <Filler count={8} />
                </DemoSlide>
              </SlideList>
            </Dialog>
          </section>
        );
      };

      const App = () => (
        <div>
          <h1>Slide list</h1>
          <nav class="demo-links">
            <strong>See also:</strong>
            <a href="../../control/demos/popup/1_dialog_demo.html#slides">
              Dialog demo — Slides
            </a>
            <a href="../../control/demos/popup/2_popover_demo.html#slides">
              Popover demo — Slides
            </a>
            <a href="./slide_list_perf.html">Slide list — perf</a>
          </nav>
          <p>
            Slides that replace one another inside one box. The box takes the
            size of its largest slide, so nothing grows or shrinks as one moves
            through them; a slide travels by exactly one box, sideways by
            default.
          </p>

          <section class="demo-section">
            <h2>Two slides</h2>
            <p>
              The plain case: a slide arrives from the right, the one it
              replaces leaves to the left. The second slide is taller than the
              first, and the box is as tall as it from the start.
            </p>
            <ThreeWays id="basic" Content={TwoSlides} />
          </section>

          <section class="demo-section">
            <h2>Content taller than the box</h2>
            <p>
              Nothing special happens: a slide is a box, so it scrolls its own
              body (<code>overflow="auto"</code> plus a <code>body</code>, see
              box.jsx). What decides the height is what holds the list — a
              height here, the screen for a dialog, the space left under the
              anchor for a popover — never the slides themselves.
            </p>
            <ThreeWays
              id="tall"
              Content={TallSlides}
              documentClassName="in-document-capped"
            />
          </section>

          <section class="demo-section">
            <h2>Vertical</h2>
            <p>
              The same two slides with <code>vertical</code>: they arrive from
              below instead of from the side. The travel is the only difference
              — the box is still sized on its largest slide, in both directions.
            </p>
            <ThreeWays id="vertical" Content={TwoSlidesVertical} />
          </section>

          <section class="demo-section">
            <h2>Content wider than the box (vertical)</h2>
            <p>
              Sideways now belongs to the content, not to the travel: the slides
              go up and down while what they hold scrolls left and right. Their
              own body is what scrolls, and the box hides its overflow so the
              slide waiting below never shows through.
            </p>
            <ThreeWays id="wide" Content={WideSlidesVertical} />
          </section>

          <ExpandDialogSection />

          <section class="demo-section">
            <h2>Three slides</h2>
            <p>
              Nothing changes past two: the middle slide simply carries both
              buttons, each still saying one word. The list walks the DOM to
              find where “one further” is, so a slide added between two others
              needs nothing said about it anywhere.
            </p>
            <ThreeWays id="three" Content={ThreeSlides} />
          </section>
        </div>
      );

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
