<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Day and time demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 720px;
        margin: 0 auto;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      /* The panel of the screenshot: a sheet of its own, whatever holds it. */
      .datetime-panel {
        width: 340px;
        padding: 16px 8px 8px;
        background: white;
        border: 1px solid #dadce0;
        border-radius: 12px;
      }
      .datetime-panel-row {
        padding: 12px 8px;
        border-top: 1px solid #e8eaed;
      }
      .chosen {
        color: #202124;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import {
        Box,
        Button,
        DayStepper,
        Field,
        Form,
        Label,
        NaviDebug,
        Wheel,
        WheelGroup,
      } from "@jsenv/navi";
      import { DemoHeader } from "@jsenv/navi/src/internal/demo_header.jsx";
      import { FakeBackend } from "@jsenv/navi/src/internal/fake_backend.jsx";

      const MINUTE_STEP = 5;
      const HOURS = Array.from({ length: 24 }, (unused, hour) => hour);
      const MINUTES = Array.from(
        { length: 60 / MINUTE_STEP },
        (unused, index) => index * MINUTE_STEP,
      );

      const nowRoundedToStep = () => {
        const now = new Date();
        now.setMinutes(
          Math.ceil(now.getMinutes() / MINUTE_STEP) * MINUTE_STEP,
          0,
          0,
        );
        return {
          day: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`,
          hours: now.getHours(),
          minutes: now.getMinutes(),
        };
      };

      const NOW = nowRoundedToStep();

      const twoDigits = (value) => String(value).padStart(2, "0");

      const DayAndTimeForm = ({ value, action }) => (
        <Form action={action} flex="y" className="datetime-panel">
          <Box flex="y" alignX="center" spacing="l" paddingBottom="m">
            <Field as="label" flex="y" expandX>
              Jour
              <DayStepper
                name="day"
                value={value.day}
                expandX
                borderWidth="0"
              />
            </Field>
            <Field as="label" flex="y" alignX="center">
              Heure
              <WheelGroup frameBorder>
                <Wheel
                  name="hours"
                  type="integer"
                  size="xxl"
                  value={value.hours}
                >
                  {HOURS.map((hour) => (
                    <Wheel.Item key={hour} value={hour} paddingX="s">
                      {twoDigits(hour)}
                    </Wheel.Item>
                  ))}
                </Wheel>
                <WheelGroup.Separator size="xxl">
                  <Wheel.Colon />
                </WheelGroup.Separator>
                <Wheel
                  name="minutes"
                  type="integer"
                  size="xxl"
                  value={value.minutes}
                >
                  {MINUTES.map((minute) => (
                    <Wheel.Item key={minute} value={minute} paddingX="s">
                      {twoDigits(minute)}
                    </Wheel.Item>
                  ))}
                </Wheel>
              </WheelGroup>
            </Field>
          </Box>
          <Box flex spacing="s" alignX="end" className="datetime-panel-row">
            <Button command="--navi-reset">Annuler</Button>
            <Button type="submit" cta>
              Définir
            </Button>
          </Box>
        </Form>
      );

      const PanelDemo = () => (
        <div class="demo-section">
          <h2 id="panel">Panneau</h2>
          <FakeBackend
            value={{ day: NOW.day, hours: NOW.hours, minutes: NOW.minutes }}
          >
            {({ value, action }) => (
              <DayAndTimeForm value={value} action={action} />
            )}
          </FakeBackend>
        </div>
      );

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader title="Day and time demo" />
          <PanelDemo />
        </Box>
      );

      render(
        <NaviDebug debugAll>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
