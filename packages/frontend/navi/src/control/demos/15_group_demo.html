<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Border Radius Demo</title>
  </head>
  <body>
    <h1>Group Border Radius Demo</h1>
    <div id="root"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Group,
        Box,
        Button,
        Input,
        List,
        Picker,
        Select,
        Separator,
        Label,
        Text,
      } from "@jsenv/navi";

      const BasicBoxesDemo = () => {
        return (
          <Box background="white" padding="l" borderRadius="m">
            <h2>Part 1: Basic Boxes</h2>
            <Box spacing="l">
              <Box>
                <h3>Single Box</h3>
                <Group>
                  <Box
                    padding="m"
                    background="#e3f2fd"
                    border="2px solid #2196f3"
                    borderRadius="m"
                  >
                    Single Box
                  </Box>
                </Group>
              </Box>

              <Box>
                <h3>Multiple Boxes - Horizontal</h3>
                <Group column borderWidth="2">
                  <Box
                    padding="m"
                    background="#fff3e0"
                    border="2px solid #ff9800"
                    borderRadius="m"
                  >
                    Left Box
                  </Box>
                  <Box
                    padding="m"
                    background="#fff3e0"
                    border="2px solid #ff9800"
                    borderRadius="m"
                  >
                    Middle Box
                  </Box>
                  <Box
                    padding="m"
                    background="#fff3e0"
                    border="2px solid #ff9800"
                    borderRadius="m"
                  >
                    Right Box
                  </Box>
                </Group>
              </Box>

              <Box>
                <h3>Multiple Boxes - Vertical</h3>
                <Group row borderWidth="2">
                  <Box
                    padding="m"
                    background="#e8f5e8"
                    border="2px solid #4caf50"
                    borderRadius="m"
                  >
                    First Box
                  </Box>
                  <Box
                    padding="m"
                    background="#e8f5e8"
                    border="2px solid #4caf50"
                    borderRadius="m"
                  >
                    Second Box
                  </Box>
                  <Box
                    padding="m"
                    background="#e8f5e8"
                    border="2px solid #4caf50"
                    borderRadius="m"
                  >
                    Third Box
                  </Box>
                </Group>
              </Box>

              <Box>
                <h3>Different Sizes & Styles</h3>
                <Group vertical>
                  <Box
                    padding="s"
                    background="#fce4ec"
                    border="1px solid #e91e63"
                    borderRadius="s"
                  >
                    Small Box
                  </Box>
                  <Box
                    padding="l"
                    background="#f3e5f5"
                    border="3px solid #9c27b0"
                    borderRadius="l"
                  >
                    Large Box with Different Border
                  </Box>
                  <Box
                    padding="m"
                    background="#e0f2f1"
                    border="2px dashed #009688"
                    borderRadius="m"
                  >
                    Dashed Border Box
                  </Box>
                </Group>
              </Box>

              <ManyChildrenDemo />

              <Box>
                <h3>Group with Large Borders - 3 Children</h3>
                <Group
                  vertical
                  borderWidth="8"
                  style={{ border: "3px dashed #999" }}
                >
                  <Box
                    padding="l"
                    background="#ffebee"
                    border="8px solid #f44336"
                    borderRadius="l"
                  >
                    Child 1 - Large Border
                  </Box>
                  <Box
                    padding="l"
                    background="#fff3e0"
                    border="8px solid #ff9800"
                    borderRadius="l"
                  >
                    Child 2 - Large Border
                  </Box>
                  <Box
                    padding="l"
                    background="#e8f5e8"
                    border="8px solid #4caf50"
                    borderRadius="l"
                  >
                    Child 3 - Large Border
                  </Box>
                </Group>
                <p
                  style={{ fontSize: "14px", color: "#666", marginTop: "10px" }}
                >
                  Notice how the group adjusts its content area when children
                  are positioned. The dashed border shows the group's actual
                  bounds.
                </p>
              </Box>
            </Box>
          </Box>
        );
      };

      const ManyChildrenDemo = () => {
        return (
          <Box>
            <h3>Scaling - 5 Elements (with container border)</h3>
            <Group
              vertical
              borderWidth="2"
              style={{ border: "3px dashed #666" }}
            >
              <Box
                padding="m"
                background="#f1f8e9"
                border="2px solid #8bc34a"
                borderRadius="m"
              >
                First Element
              </Box>
              <Box
                padding="m"
                background="#f1f8e9"
                border="2px solid #8bc34a"
                borderRadius="m"
              >
                Second Element
              </Box>
              <Box
                padding="m"
                background="#f1f8e9"
                border="2px solid #8bc34a"
                borderRadius="m"
              >
                Third Element
              </Box>
              <Box
                padding="m"
                background="#f1f8e9"
                border="2px solid #8bc34a"
                borderRadius="m"
              >
                Fourth Element
              </Box>
              <Box
                padding="m"
                background="#f1f8e9"
                border="2px solid #8bc34a"
                borderRadius="m"
              >
                Fifth Element
              </Box>
            </Group>
          </Box>
        );
      };

      const InputElementsDemo = () => {
        return (
          <Box background="white" padding="l" borderRadius="m">
            <h2>Part 2: Input and Button Components</h2>
            <Box spacing="l">
              <Box>
                <h3>Single Components</h3>
                <Box row spacing="m">
                  <Group>
                    <Button>Single Button</Button>
                  </Group>
                  <Group>
                    <Input placeholder="Single Input" />
                  </Group>
                </Box>
              </Box>

              <Box>
                <h3>Multiple Buttons</h3>
                <Group>
                  <Button>First Button</Button>
                  <Button>Second Button</Button>
                  <Button>Third Button</Button>
                </Group>
              </Box>

              <Box>
                <h3>Multiple Inputs</h3>
                <Group>
                  <Input placeholder="First Input" />
                  <Input placeholder="Second Input" />
                  <Input placeholder="Third Input" />
                </Group>
              </Box>

              <Box>
                <h3>Horizontal Button Group</h3>
                <Group style={{ flexDirection: "row" }}>
                  <Button>Left</Button>
                  <Button>Center</Button>
                  <Button>Right</Button>
                </Group>
              </Box>

              <Box>
                <h3>Mixed Components</h3>
                <Group column>
                  <Button>Action Button</Button>
                  <Input placeholder="Enter value" />
                  <Button>Submit</Button>
                </Group>
              </Box>
            </Box>
          </Box>
        );
      };

      const SIDE_OPTIONS = ["Gauche", "Droite", "Les deux"];
      const LEVEL_OPTIONS = [
        "Niveau 1",
        "Niveau 2",
        "Niveau 3",
        "Niveau 4",
        "Niveau 5",
      ];
      const CITY_OPTIONS = ["Bordeaux", "Lyon", "Paris"];

      const SettingRow = ({ name, label, options, value, setValue }) => {
        return (
          <Picker
            name={name}
            value={value}
            ui={
              <Box row spacing="xs">
                <Text bold>{label}</Text>
                <Text>{value === undefined ? "—" : value}</Text>
              </Box>
            }
            maxLines={2}
            expandX
            paddingX="m"
            paddingY="m"
            borderRadius="m"
            uiAction={setValue}
            action={setValue}
          >
            <List selectable>
              {options.map((option, i) => (
                <List.Item
                  selectable
                  key={option}
                  id={`${name}_${option}`}
                  index={i}
                  value={option}
                  selected={value === option}
                  padding="s"
                  spacing="s"
                >
                  {option}
                </List.Item>
              ))}
            </List>
          </Picker>
        );
      };

      const SettingRowsDemo = () => {
        const [side, setSide] = useState(undefined);
        const [level, setLevel] = useState("Niveau 4");
        const [city, setCity] = useState(undefined);

        return (
          <Box>
            <h3>Setting Rows</h3>
            <Box width="420">
              <Group row>
                <SettingRow
                  name="setting_side"
                  label="Côté préféré"
                  options={SIDE_OPTIONS}
                  value={side}
                  setValue={setSide}
                />
                <SettingRow
                  name="setting_level"
                  label="Niveau"
                  options={LEVEL_OPTIONS}
                  value={level}
                  setValue={setLevel}
                />
                <SettingRow
                  name="setting_city"
                  label="Ville où je joue le plus souvent"
                  options={CITY_OPTIONS}
                  value={city}
                  setValue={setCity}
                />
              </Group>
            </Box>
          </Box>
        );
      };

      const PickerElementsDemo = () => {
        return (
          <Box background="white" padding="l" borderRadius="m">
            <h2>Part 3: Pickers</h2>
            <Box spacing="l">
              <SettingRowsDemo />

              <Box>
                <h3>Single Picker</h3>
                <Group>
                  <Picker name="picker_alone" type="date" />
                </Group>
              </Box>

              <Box>
                <h3>Multiple Pickers</h3>
                <Group>
                  <Picker
                    name="picker_date_first"
                    type="date"
                    defaultValue="2026-01-15"
                  />
                  <Picker name="picker_time_middle" type="time" />
                  <Picker
                    name="picker_color_last"
                    type="color"
                    defaultValue="#4f81e0"
                  />
                </Group>
              </Box>

              <Box>
                <h3>Multiple Pickers - Vertical</h3>
                <Group row>
                  <Picker
                    name="picker_date_top"
                    type="date"
                    defaultValue="2026-01-15"
                  />
                  <Picker name="picker_time_center" type="time" />
                  <Picker
                    name="picker_color_bottom"
                    type="color"
                    defaultValue="#4f81e0"
                  />
                </Group>
              </Box>

              <Box>
                <h3>Picker with Button, Input and Select</h3>
                <Group>
                  <Button>Today</Button>
                  <Picker
                    name="picker_mixed"
                    type="date"
                    defaultValue="2026-01-15"
                  />
                  <Input placeholder="Note" />
                  <Select name="select_mixed">
                    <option value="day">Day</option>
                    <option value="week">Week</option>
                  </Select>
                </Group>
              </Box>

              <Box>
                <h3>Custom Border Radius</h3>
                <Group>
                  <Picker
                    name="picker_radius_first"
                    type="date"
                    borderRadius="12px"
                    defaultValue="2026-01-15"
                  />
                  <Picker
                    name="picker_radius_last"
                    type="time"
                    borderRadius="12px"
                  />
                </Group>
              </Box>

              <Box>
                <h3>States</h3>
                <Group>
                  <Picker
                    name="picker_state_default"
                    type="date"
                    defaultValue="2026-01-15"
                  />
                  <Picker
                    name="picker_state_readonly"
                    type="date"
                    defaultValue="2026-01-15"
                    readOnly
                  />
                  <Picker
                    name="picker_state_disabled"
                    type="date"
                    defaultValue="2026-01-15"
                    disabled
                  />
                </Group>
              </Box>
            </Box>
          </Box>
        );
      };

      const BorderlessDemo = () => {
        return (
          <Box background="white" padding="l" borderRadius="m">
            <h2>Part 4: Borderless Groups</h2>
            <Box spacing="l">
              <h3>Checkbox Items - No Borders</h3>
              <Box background="orange" padding="l" width="200">
                <Group borderWidth={0} row>
                  <Label background="#F5F6F7" padding="m" borderRadius="s">
                    <Input type="checkbox" />
                    First Option
                  </Label>
                  <Separator color="#E9ECF0" margin="0" />
                  <Label background="#F5F6F7" padding="m" borderRadius="s">
                    <Input type="checkbox" />
                    Second Option
                  </Label>
                </Group>
              </Box>
            </Box>
          </Box>
        );
      };

      const InteractiveDemo = () => {
        const [blocks, setBlocks] = useState([
          { id: 1, color: "#e3f2fd", borderColor: "#2196f3", text: "Block 1" },
          { id: 2, color: "#fff3e0", borderColor: "#ff9800", text: "Block 2" },
          { id: 3, color: "#e8f5e8", borderColor: "#4caf50", text: "Block 3" },
        ]);

        let nextId = 4;
        const colors = [
          { bg: "#ffebee", border: "#f44336" },
          { bg: "#f3e5f5", border: "#9c27b0" },
          { bg: "#e0f2f1", border: "#009688" },
          { bg: "#fce4ec", border: "#e91e63" },
          { bg: "#f1f8e9", border: "#8bc34a" },
        ];

        const addBlock = () => {
          const colorIndex = blocks.length % colors.length;
          const newBlock = {
            id: nextId++,
            color: colors[colorIndex].bg,
            borderColor: colors[colorIndex].border,
            text: `Block ${nextId - 1}`,
          };
          setBlocks([...blocks, newBlock]);
        };

        const removeLastBlock = () => {
          if (blocks.length > 0) {
            setBlocks(blocks.slice(0, -1));
          }
        };

        const removeBlock = (id) => {
          setBlocks(blocks.filter((block) => block.id !== id));
        };

        return (
          <Box background="white" padding="l" borderRadius="m">
            <h2>Part 5: Interactive Group Demo</h2>
            <Box spacing="l">
              <Box column spacing="m">
                <Button onClick={addBlock}>Add Block</Button>
                <Button
                  onClick={removeLastBlock}
                  disabled={blocks.length === 0}
                >
                  Remove Last Block
                </Button>
              </Box>

              <Box>
                <h3>Dynamic Group ({blocks.length} blocks)</h3>
                <Group
                  vertical
                  borderWidth="2"
                  style={{
                    border: "3px dashed #333",
                    minHeight: "50px",
                  }}
                >
                  {blocks.map((block) => (
                    <Box
                      key={block.id}
                      padding="m"
                      background={block.color}
                      border={`2px solid ${block.borderColor}`}
                      borderRadius="m"
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        alignItems: "center",
                      }}
                    >
                      <span>{block.text}</span>
                      <Button
                        onClick={() => removeBlock(block.id)}
                        style={{
                          padding: "4px 8px",
                          fontSize: "12px",
                          background: "rgba(255,255,255,0.8)",
                        }}
                      >
                        ×
                      </Button>
                    </Box>
                  ))}
                  {blocks.length === 0 && (
                    <Box
                      padding="xl"
                      style={{
                        textAlign: "center",
                        color: "#999",
                        fontStyle: "italic",
                      }}
                    >
                      No blocks - add some to see the group in action!
                    </Box>
                  )}
                </Group>
                <p
                  style={{ fontSize: "14px", color: "#666", marginTop: "10px" }}
                >
                  The dashed border shows the group container. Notice how it
                  adjusts its size as blocks are added/removed.
                </p>
              </Box>
            </Box>
          </Box>
        );
      };

      const OverlapDemo = () => {
        return (
          <Box background="white" padding="l" borderRadius="m">
            <h2>Part 6: Overlap Order</h2>
            <Box spacing="l">
              <Box>
                <h3>Focus ring held on the middle member</h3>
                <Group>
                  <Button>Left</Button>
                  <Button pseudoState={{ ":focus-visible": true }}>
                    Center
                  </Button>
                  <Button>Right</Button>
                </Group>
              </Box>

              <Box>
                <h3>Same, members pinned to zIndex 0</h3>
                <Group>
                  <Button style={{ zIndex: 0 }}>Left</Button>
                  <Button
                    style={{ zIndex: 0 }}
                    pseudoState={{ ":focus-visible": true }}
                  >
                    Center
                  </Button>
                  <Button style={{ zIndex: 0 }}>Right</Button>
                </Group>
              </Box>

              <Box>
                <h3>Hover held on the middle member</h3>
                <Group>
                  <Button variant="border">Left</Button>
                  <Button variant="border" pseudoState={{ ":hover": true }}>
                    Center
                  </Button>
                  <Button variant="border">Right</Button>
                </Group>
              </Box>

              <Box>
                <h3>Same, members pinned to zIndex 0</h3>
                <Group>
                  <Button variant="border" style={{ zIndex: 0 }}>
                    Left
                  </Button>
                  <Button
                    variant="border"
                    style={{ zIndex: 0 }}
                    pseudoState={{ ":hover": true }}
                  >
                    Center
                  </Button>
                  <Button variant="border" style={{ zIndex: 0 }}>
                    Right
                  </Button>
                </Group>
              </Box>

              <Box>
                <h3>Tab through</h3>
                <Group>
                  <Input placeholder="First" />
                  <Input placeholder="Second" />
                  <Input placeholder="Third" />
                </Group>
              </Box>
            </Box>
          </Box>
        );
      };

      const App = () => {
        return (
          <Box spacing="xl">
            <BasicBoxesDemo />
            <InputElementsDemo />
            <PickerElementsDemo />
            <BorderlessDemo />
            <InteractiveDemo />
            <OverlapDemo />
          </Box>
        );
      };

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
