<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Duration Preset + Custom Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .form-result {
        min-height: 32px;
        margin-top: 16px;
        padding: 10px 12px;
        color: #333;
        font-size: 12px;
        font-family: monospace;
        background: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Duration Preset + Custom Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import { stateSignal, route, setupRoutes } from "@jsenv/navi";
      import {
        Box,
        Field,
        Label,
        List,
        Picker,
        Form,
        Text,
        Button,
        Time,
        Icon,
        NaviDebug,
        InputDuration,
        durationToISOString,
        durationToMinutes,
        Unit,
        Wheel,
        WheelGroup,
        coarsePointerSignal,
      } from "@jsenv/navi";

      // Each demo below is one block: its constants, its signals and its
      // components sit together between two banners, so a block can be copied
      // out (or deleted) whole. The only thing they share is `demoSignal`, which
      // declares a state signal and registers it in the page's route — the route
      // itself is assembled at the bottom from whatever the blocks declared.
      const DEMO_SEARCH_PARAMS = {};
      const demoSignal = (id, defaultValue, options) => {
        const signal = stateSignal(defaultValue, { id, ...options });
        DEMO_SEARCH_PARAMS[id] = signal;
        return signal;
      };

      // ── Wheel, one signal per wheel ───────────────────────────────────────

      // Hours 0..5, minutes by 5. Both lists are fixed on purpose: making the
      // minutes depend on the selected hour makes the minute wheel move on its
      // own while the hour one is being scrolled.
      const WHEEL_HOURS = [0, 1, 2, 3, 4, 5];
      const WHEEL_MINUTES = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
      const WHEEL_PRESETS = ["1h", "1h30", "2h"];
      // What the wheels open on when nothing has been chosen yet: a proposal,
      // so one scrolls FROM a duration rather than from nothing. The proposal
      // lives in the signals themselves, as their default — being their default
      // it stays out of the url until something else is chosen, and a value
      // restored from the url still wins over it.
      const WHEEL_PROPOSED_HOURS = 2;
      const WHEEL_PROPOSED_MINUTES = 30;

      const wheelPerSignalDurationSignal = demoSignal(
        "wheel_per_signal",
        "1h30",
        {
          oneOf: [...WHEEL_PRESETS, "custom"],
        },
      );
      const wheelHoursSignal = demoSignal("wheel_hours", WHEEL_PROPOSED_HOURS);
      const wheelMinutesSignal = demoSignal(
        "wheel_minutes",
        WHEEL_PROPOSED_MINUTES,
      );

      const WheelPerSignalDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = wheelPerSignalDurationSignal.value;
        const hours = wheelHoursSignal.value;
        const minutes = wheelMinutesSignal.value;

        return (
          <div class="demo-section">
            <h2>Duration selector — custom via Wheel (one signal per wheel)</h2>
            <p class="desc">
              Deux roues, deux signaux : chaque roue tient le sien à jour, rien
              à recombiner. Le Picker porte un nom, donc ce qu'il contient
              remonte dans le form sous ce nom.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              // Read from what this form controls, never from the signals: the
              // preset list under "duration", the picker under "durationCustom"
              // — here the { hours, minutes } its wheels make.
              action={({ duration, durationCustom }) => {
                const minutes =
                  duration === "custom"
                    ? (Number(durationCustom?.hours) || 0) * 60 +
                      (Number(durationCustom?.minutes) || 0)
                    : durationToMinutes(duration);
                formResultSignal.value = { minutes };
              }}
            >
              <Field ownLabel vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="wheel_per_signal"
                  name="duration"
                  required
                  flexWrap
                  signal={wheelPerSignalDurationSignal}
                  border="none"
                >
                  {WHEEL_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`wheel_per_signal_${durationPreset}`}
                      value={durationPreset}
                      selected={durationPreset === duration}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={WHEEL_PRESETS.length}
                    id="wheel_per_signal_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    spacing="xxs"
                    flex
                    noWrap
                    command="--navi-open"
                    commandFor="wheel_per_signal_picker"
                  >
                    {/* "Perso" until this is the duration in use: a number for
                        an option nobody picked reads as the current answer */}
                    {duration === "custom" ? (
                      <Time type="duration" format="compact">
                        {durationToISOString(
                          hours === 0 ? { minutes } : { hours, minutes },
                        )}
                      </Time>
                    ) : (
                      <Text>Perso</Text>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    {/* named like any control: a picker always holds one value,
                        and here that value is the pair the wheels make —
                        { hours, minutes } */}
                    <Picker
                      id="wheel_per_signal_picker"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      type="form"
                      dockedOnTouch
                      borderRadius="s"
                    >
                      <Form flex="y" alignX="center" padding="l" spacing="l">
                        <Text bold size="l">
                          Durée de la partie
                        </Text>
                        <WheelGroup required frameBorder>
                          <Wheel
                            name="hours"
                            type="integer"
                            size="xxl"
                            signal={wheelHoursSignal}
                          >
                            {WHEEL_HOURS.map((hour) => (
                              <Wheel.Item key={hour} value={hour} paddingX="s">
                                {hour}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit unit="hour" format="short" color="#6b7280" />
                          </WheelGroup.Separator>
                          <Wheel
                            name="minutes"
                            type="integer"
                            size="xxl"
                            signal={wheelMinutesSignal}
                          >
                            {WHEEL_MINUTES.map((minute) => (
                              <Wheel.Item
                                key={minute}
                                value={minute}
                                paddingX="s"
                              >
                                {String(minute).padStart(2, "0")}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit
                              unit="minute"
                              format="short"
                              color="#6b7280"
                            />
                          </WheelGroup.Separator>
                        </WheelGroup>
                        {/* Docked (a finger), the sheet is dismissed by tapping
                            outside it, so buttons would only take room from the
                            wheels. Centered (a mouse), they stay. */}
                        {!coarsePointerSignal.value && (
                          <Box flex spacing="s" expandX alignX="end">
                            <Button
                              command="--navi-cancel"
                              variant="discrete"
                            />
                            <Button type="submit" />
                          </Box>
                        )}
                      </Form>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── Wheel, one signal for both ────────────────────────────────────────
      // KNOWN BROKEN, kept on purpose to work on: the WheelGroup aggregates its
      // two wheels into ONE number and writes it to its signal correctly
      // (wheel_total in the url), but the picker around it hands the form `{}`
      // instead of that number — a picker whose popup holds a group with a
      // primitive value has no facade for it (type="duration" has one, a bare
      // number does not). What we want to end up with is
      // { durationCustom: <what aggregateChildStates returned> }.

      const WHEEL_ONE_SIGNAL_HOURS = [0, 1, 2, 3, 4, 5];
      const WHEEL_ONE_SIGNAL_MINUTES = [
        0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55,
      ];
      const WHEEL_ONE_SIGNAL_PRESETS = ["1h", "1h30", "2h"];
      const WHEEL_ONE_SIGNAL_PROPOSED_TOTAL = 2 * 60 + 30;

      const wheelOneSignalDurationSignal = demoSignal(
        "wheel_one_signal",
        "1h30",
        { oneOf: [...WHEEL_ONE_SIGNAL_PRESETS, "custom"] },
      );
      // One signal for both wheels: total minutes.
      const wheelTotalSignal = demoSignal(
        "wheel_total",
        WHEEL_ONE_SIGNAL_PROPOSED_TOTAL,
      );

      const WheelOneSignalDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = wheelOneSignalDurationSignal.value;
        const totalMinutes = wheelTotalSignal.value;
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        return (
          <div class="demo-section">
            <h2>Duration selector — custom via Wheel (one signal for both)</h2>
            <p class="desc">
              Un seul signal pour les deux roues :{" "}
              <code>aggregateChildStates</code> dit comment elles font un nombre
              de minutes, <code>distributeChildUIState</code> fait l'inverse.
              <strong>
                {" "}
                Cassé pour l'instant : le form reçoit durationCustom = {"{}"} au
                lieu du nombre.
              </strong>
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              action={({ duration: chosen, durationCustom }) => {
                const minutes =
                  chosen === "custom"
                    ? Number(durationCustom) || 0
                    : durationToMinutes(chosen);
                formResultSignal.value = { minutes, durationCustom };
              }}
            >
              <Field ownLabel vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="wheel_one_signal"
                  name="duration"
                  required
                  flexWrap
                  signal={wheelOneSignalDurationSignal}
                  border="none"
                >
                  {WHEEL_ONE_SIGNAL_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`wheel_one_signal_${durationPreset}`}
                      value={durationPreset}
                      selected={durationPreset === duration}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={WHEEL_ONE_SIGNAL_PRESETS.length}
                    id="wheel_one_signal_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    spacing="xxs"
                    flex
                    noWrap
                    command="--navi-open"
                    commandFor="wheel_one_signal_picker"
                  >
                    {duration === "custom" ? (
                      <Time type="duration" format="compact">
                        {durationToISOString(
                          hours === 0 ? { minutes } : { hours, minutes },
                        )}
                      </Time>
                    ) : (
                      <Text>Perso</Text>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    <Picker
                      id="wheel_one_signal_picker"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      dockedOnTouch
                      borderRadius="s"
                    >
                      <Form flex="y" alignX="center" padding="l" spacing="l">
                        <Text bold size="l">
                          Durée de la partie
                        </Text>
                        <WheelGroup
                          required
                          frameBorder
                          signal={wheelTotalSignal}
                          aggregateChildStates={(children) => {
                            let h = 0;
                            let m = 0;
                            for (const child of children) {
                              if (child.name === "hours") {
                                h = Number(child.uiState) || 0;
                              }
                              if (child.name === "minutes") {
                                m = Number(child.uiState) || 0;
                              }
                            }
                            return h * 60 + m;
                          }}
                          distributeChildUIState={(total, child) => {
                            const value = Number(total) || 0;
                            if (child.name === "hours") {
                              return Math.floor(value / 60);
                            }
                            if (child.name === "minutes") {
                              return value % 60;
                            }
                            return undefined;
                          }}
                        >
                          <Wheel name="hours" type="integer" size="xxl">
                            {WHEEL_ONE_SIGNAL_HOURS.map((hour) => (
                              <Wheel.Item key={hour} value={hour} paddingX="s">
                                {hour}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit unit="hour" format="short" color="#6b7280" />
                          </WheelGroup.Separator>
                          <Wheel name="minutes" type="integer" size="xxl">
                            {WHEEL_ONE_SIGNAL_MINUTES.map((minute) => (
                              <Wheel.Item
                                key={minute}
                                value={minute}
                                paddingX="s"
                              >
                                {String(minute).padStart(2, "0")}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit
                              unit="minute"
                              format="short"
                              color="#6b7280"
                            />
                          </WheelGroup.Separator>
                        </WheelGroup>
                        {!coarsePointerSignal.value && (
                          <Box flex spacing="s" expandX alignX="end">
                            <Button
                              command="--navi-cancel"
                              variant="discrete"
                            />
                            <Button type="submit" />
                          </Box>
                        )}
                      </Form>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── Presets + custom via Picker, nothing proposed ─────────────────────

      const PICKER_PRESETS = ["1h", "1h30", "2h"];
      // "1h30", not 90: the presets are duration strings, so a numeric default
      // is not one of the values this signal can hold (see oneOf).
      const pickerDurationSignal = demoSignal("duration2", "1h30", {
        oneOf: [...PICKER_PRESETS, "custom"],
      });
      // The custom duration, as InputDuration speaks it (ISO 8601) — no
      // conversion on either side. Nothing until one is entered.
      const pickerCustomDurationSignal = demoSignal(
        "custom_duration",
        undefined,
        {
          type: "duration",
        },
      );

      const PickerCustomNoProposalDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = pickerDurationSignal.value;
        const customDuration = pickerCustomDurationSignal.value;

        return (
          <div class="demo-section">
            <h2>Duration selector — custom via Picker (rien de proposé)</h2>
            <p class="desc">
              L'option "Perso" contient un Picker : cliquer dessus sélectionne
              l'option et ouvre la popup en un seul clic. Le picker s'ouvre sur
              un champ vide.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              // durationCustom is what the picker holds — an ISO 8601 duration,
              // since what it contains is one InputDuration.
              action={({ duration, durationCustom }) => {
                const minutes =
                  duration === "custom"
                    ? durationToMinutes(durationCustom)
                    : durationToMinutes(duration);
                formResultSignal.value = { minutes };
              }}
            >
              <Field vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="duration2"
                  name="duration"
                  required
                  signal={pickerDurationSignal}
                  flexWrap
                  border="none"
                >
                  {PICKER_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`duration2_${durationPreset}`}
                      value={durationPreset}
                      selected={duration === durationPreset}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={PICKER_PRESETS.length}
                    id="duration2_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    minWidth="64"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    noWrap
                    flex
                    spacing="xs"
                    command="--navi-open"
                    commandFor="custom_duration_picker2"
                  >
                    {customDuration === undefined || customDuration === null ? (
                      <Text>Perso</Text>
                    ) : (
                      <Time type="duration" format="compact">
                        {customDuration}
                      </Time>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    <Picker
                      id="custom_duration_picker2"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      borderRadius="s"
                      // one value, not a form: what it holds is a single
                      // InputDuration, so the picker IS that duration
                      type="duration"
                    >
                      <Box flex="y" alignX="center" padding="m" spacing="l">
                        <Text bold>Veuillez saisir une durée</Text>
                        <InputDuration
                          signal={pickerCustomDurationSignal}
                          min="15min"
                          max="4h30"
                          step="5min"
                          required
                        />
                        <Box flex spacing="s" expandX alignX="end">
                          <Button command="--navi-cancel" variant="discrete" />
                          <Button command="--navi-define" variant="discrete" />
                        </Box>
                      </Box>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── Presets + custom via Picker, 2h15 proposed ────────────────────────

      const PROPOSAL_PRESETS = ["1h", "1h30", "2h"];
      // 2h15 is proposed, not chosen: the signal holds nothing until the picker
      // is confirmed, so the option reads "Perso" and the url stays clean. The
      // proposal is a `defaultValue` on the input instead (see below) — which is
      // also where a reset goes back to.
      const PROPOSED_CUSTOM_DURATION = "PT2H15M";
      const proposalDurationSignal = demoSignal("duration3", "1h30", {
        oneOf: [...PROPOSAL_PRESETS, "custom"],
      });
      const proposalCustomDurationSignal = demoSignal(
        "custom_duration3",
        undefined,
        { type: "duration" },
      );

      const PickerCustomProposedDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = proposalDurationSignal.value;
        const customDuration = proposalCustomDurationSignal.value;

        return (
          <div class="demo-section">
            <h2>Duration selector — custom via Picker (2h15 proposé)</h2>
            <p class="desc">
              Même chose, mais le champ du picker s'ouvre sur 2h15 : une
              proposition à partir de laquelle régler, pas une réponse. Tant
              qu'on n'a pas confirmé, l'option affiche "Perso" et l'url ne
              contient rien.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              action={({ duration, durationCustom }) => {
                const minutes =
                  duration === "custom"
                    ? durationToMinutes(durationCustom)
                    : durationToMinutes(duration);
                formResultSignal.value = { minutes };
              }}
            >
              <Field ownLabel vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="duration3"
                  name="duration"
                  required
                  signal={proposalDurationSignal}
                  border="none"
                  flexWrap
                >
                  {PROPOSAL_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`duration3_${durationPreset}`}
                      value={durationPreset}
                      selected={duration === durationPreset}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={PROPOSAL_PRESETS.length}
                    id="duration3_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    minWidth="64"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    noWrap
                    flex
                    spacing="xs"
                    command="--navi-open"
                    commandFor="custom_duration_picker3"
                  >
                    {customDuration === undefined || customDuration === null ? (
                      <Text>Perso</Text>
                    ) : (
                      <Time type="duration" format="compact">
                        {customDuration}
                      </Time>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    <Picker
                      id="custom_duration_picker3"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      borderRadius="s"
                      type="duration"
                    >
                      <Box flex="y" alignX="center" padding="m" spacing="m">
                        <Text bold>Veuillez saisir une durée</Text>
                        {/* signal + defaultValue: the signal is where the answer
                            goes and comes from, defaultValue only what to open
                            on while there is no answer yet. */}
                        <InputDuration
                          signal={proposalCustomDurationSignal}
                          defaultValue={PROPOSED_CUSTOM_DURATION}
                          min="0min"
                          max="4h"
                          step="5min"
                        />
                        <Box flex spacing="s" expandX alignX="end">
                          <Button command="--navi-cancel" variant="discrete" />
                          <Button command="--navi-define" variant="discrete" />
                        </Box>
                      </Box>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── The page itself ───────────────────────────────────────────────────

      setupRoutes([route("", { searchParams: DEMO_SEARCH_PARAMS })]);

      const ResetAll = () => (
        <Box flex="x" alignX="end">
          <Button
            variant="discrete"
            onClick={() => {
              // undefined, not their defaults: a signal back at its default is a
              // signal with nothing to say, which is what empties the url.
              for (const signal of Object.values(DEMO_SEARCH_PARAMS)) {
                signal.value = undefined;
              }
            }}
          >
            Reset all
          </Button>
        </Box>
      );

      const App = () => (
        <Box flex="y" spacing="l">
          <ResetAll />
          <WheelPerSignalDemo />
          <WheelOneSignalDemo />
          <PickerCustomNoProposalDemo />
          <PickerCustomProposedDemo />
        </Box>
      );

      render(
        <NaviDebug debugAll>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
