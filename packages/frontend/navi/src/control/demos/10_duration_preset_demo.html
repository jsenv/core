<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Duration Preset + Custom Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .form-result {
        min-height: 32px;
        margin-top: 16px;
        padding: 10px 12px;
        color: #333;
        font-size: 12px;
        font-family: monospace;
        background: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Duration Preset + Custom Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import { stateSignal, route, setupRoutes } from "@jsenv/navi";
      import {
        Box,
        Field,
        Label,
        List,
        Picker,
        Form,
        Text,
        Button,
        Time,
        Icon,
        NaviDebug,
        InputDuration,
        durationToISOString,
        durationToMinutes,
        Unit,
        Wheel,
        WheelGroup,
      } from "@jsenv/navi";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      // Each demo below is one block: its constants, its signals and its
      // components sit together between two banners, so a block can be copied
      // out (or deleted) whole. The only thing they share is `demoSignal`, which
      // declares a state signal and registers it in the page's route — the route
      // itself is assembled at the bottom from whatever the blocks declared.
      const DEMO_SEARCH_PARAMS = {};
      const demoSignal = (id, defaultValue, options) => {
        const signal = stateSignal(defaultValue, { id, ...options });
        DEMO_SEARCH_PARAMS[id] = signal;
        return signal;
      };

      // ── 1. custom via picker + wheel, one signal per wheel ────────────────

      // Hours 0..5, minutes by 5. Both lists are fixed on purpose: making the
      // minutes depend on the selected hour makes the minute wheel move on its
      // own while the hour one is being scrolled.
      const WHEEL_HOURS = [0, 1, 2, 3, 4, 5];
      const WHEEL_MINUTES = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
      const WHEEL_PRESETS = ["1h", "1h30", "2h"];
      // What the wheels open on when nothing has been chosen yet: a proposal, so
      // one scrolls FROM a duration rather than from nothing. It is a
      // `defaultValue` on each wheel, NOT the signals' default — a proposal is
      // not an answer, so the signals hold nothing until the picker is
      // confirmed. That is what lets the option read "Perso" at first, and what
      // puts the chosen duration in the url afterwards even when it happens to
      // be the proposed one.
      const WHEEL_PROPOSED_HOURS = 2;
      const WHEEL_PROPOSED_MINUTES = 30;

      const wheelPerSignalDurationSignal = demoSignal(
        "wheel_per_signal",
        "1h30",
        {
          oneOf: [...WHEEL_PRESETS, "custom"],
        },
      );
      // type: "number" is not decoration: the wheel keeps its values typed end
      // to end (its items ARE the numbers below), so a value coming back from
      // the url as the string "5" matches no item — the wheel would fall back to
      // its first one while the signal still reads 5 everywhere else.
      const wheelHoursSignal = demoSignal("wheel_hours", undefined, {
        type: "number",
      });
      const wheelMinutesSignal = demoSignal("wheel_minutes", undefined, {
        type: "number",
      });

      const WheelPerSignalDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = wheelPerSignalDurationSignal.value;
        const hours = wheelHoursSignal.value;
        const minutes = wheelMinutesSignal.value;
        // A custom duration exists as soon as one has been confirmed — the
        // signals hold nothing before that. Shown whatever option is selected:
        // it is what "Perso" means from then on, the same way the presets keep
        // showing their own duration when they are not the chosen one.
        const hasCustom = hours !== undefined || minutes !== undefined;

        return (
          <div class="demo-section">
            <h2 id="wheel_per_signal_demo">
              1. Duration option — custom via picker + wheel (un signal par
              roue)
            </h2>
            <p class="desc">
              Deux roues, deux signaux : chaque roue tient le sien à jour, rien
              à recombiner. Le Picker porte un nom, donc ce qu'il contient
              remonte dans le form sous ce nom.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              // Read from what this form controls, never from the signals: the
              // preset list under "duration", the picker under "durationCustom"
              // — here the { hours, minutes } its wheels make.
              action={({ duration, durationCustom }) => {
                const minutes =
                  duration === "custom"
                    ? (Number(durationCustom?.hours) || 0) * 60 +
                      (Number(durationCustom?.minutes) || 0)
                    : durationToMinutes(duration);
                formResultSignal.value = { minutes };
              }}
            >
              <Field ownLabel vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="wheel_per_signal"
                  name="duration"
                  required
                  flexWrap
                  signal={wheelPerSignalDurationSignal}
                  border="none"
                >
                  {WHEEL_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`wheel_per_signal_${durationPreset}`}
                      value={durationPreset}
                      selected={durationPreset === duration}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={WHEEL_PRESETS.length}
                    id="wheel_per_signal_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    spacing="xxs"
                    flex
                    noWrap
                    command="--navi-open"
                    commandFor="wheel_per_signal_picker"
                  >
                    {/* "Perso" only while there is nothing to show: once a
                        custom duration has been confirmed, that is what this
                        option is worth */}
                    {hasCustom ? (
                      <Time type="duration" format="compact">
                        {durationToISOString(
                          hours ? { hours, minutes } : { minutes },
                        )}
                      </Time>
                    ) : (
                      <Text>Perso</Text>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    {/* named like any control: a picker always holds one value,
                        and here that value is the pair the wheels make —
                        { hours, minutes } */}
                    <Picker
                      id="wheel_per_signal_picker"
                      name="durationCustom"
                      variant="headless"
                      type="form"
                      dockedOnTouch
                      borderRadius="s"
                    >
                      <Form flex="y" alignX="center" padding="l" spacing="l">
                        <Text bold size="l">
                          Durée de la partie
                        </Text>
                        <WheelGroup frameBorder border="none" required>
                          <Wheel
                            name="hours"
                            type="integer"
                            size="xxl"
                            signal={wheelHoursSignal}
                            defaultValue={WHEEL_PROPOSED_HOURS}
                          >
                            {WHEEL_HOURS.map((hour) => (
                              <Wheel.Item key={hour} value={hour} paddingX="m">
                                {hour}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit
                              unit="hour"
                              format="short"
                              color="#6b7280"
                              // The unit is written smaller than the digits, so
                              // centering it in the row leaves it reading high
                              // next to them: a hair down puts it on their line.
                              marginTop="0.2em"
                            />
                          </WheelGroup.Separator>
                          <Wheel
                            name="minutes"
                            type="integer"
                            size="xxl"
                            signal={wheelMinutesSignal}
                            defaultValue={WHEEL_PROPOSED_MINUTES}
                          >
                            {WHEEL_MINUTES.map((minute) => (
                              <Wheel.Item
                                key={minute}
                                value={minute}
                                paddingX="m"
                              >
                                {String(minute).padStart(2, "0")}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit
                              unit="minute"
                              format="short"
                              color="#6b7280"
                              marginTop="0.2em"
                            />
                          </WheelGroup.Separator>
                        </WheelGroup>
                      </Form>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── 2. custom via picker + wheel, one signal for both ─────────────────
      // The variant above holds a PAIR of values (one signal per wheel, the
      // form reads { hours, minutes }); this one holds ONE — the number of
      // minutes its two wheels add up to — so what the form reads under
      // durationCustom is that number itself.
      //
      // Which is why there is no Form inside the picker here: a form aggregates
      // its children into one key per name, and a single nameless value has no
      // key to land under. The picker takes what the group inside it is worth,
      // directly.

      const WHEEL_ONE_SIGNAL_HOURS = [0, 1, 2, 3, 4, 5];
      const WHEEL_ONE_SIGNAL_MINUTES = [
        0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55,
      ];
      const WHEEL_ONE_SIGNAL_PRESETS = ["1h", "1h30", "2h"];
      // Same as the demo above: proposed, not chosen — so it lives on the group
      // as a defaultValue and the signal stays empty until the picker is
      // confirmed.
      const WHEEL_ONE_SIGNAL_PROPOSED_TOTAL = 2 * 60 + 30;

      const wheelOneSignalDurationSignal = demoSignal(
        "wheel_one_signal",
        "1h30",
        { oneOf: [...WHEEL_ONE_SIGNAL_PRESETS, "custom"] },
      );
      // One signal for both wheels: total minutes.
      const wheelTotalSignal = demoSignal("wheel_total", undefined, {
        type: "number",
      });

      const WheelOneSignalDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = wheelOneSignalDurationSignal.value;
        const totalMinutes = wheelTotalSignal.value;
        const hasCustom = totalMinutes !== undefined;
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        return (
          <div class="demo-section">
            <h2 id="wheel_one_signal_demo">
              2. Duration option — custom via picker + wheel (un signal pour les
              deux)
            </h2>
            <p class="desc">
              Un seul signal pour les deux roues :{" "}
              <code>aggregateChildStates</code> dit comment elles font un nombre
              de minutes, <code>distributeChildUIState</code> fait l'inverse. Le
              picker est un <code>type="number"</code> : ce qu'il contient vaut
              un nombre, et c'est ce nombre que le form reçoit sous{" "}
              <code>durationCustom</code>.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              action={({ duration: chosen, durationCustom }) => {
                const minutes =
                  chosen === "custom"
                    ? Number(durationCustom) || 0
                    : durationToMinutes(chosen);
                formResultSignal.value = { minutes, durationCustom };
              }}
            >
              <Field ownLabel vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="wheel_one_signal"
                  name="duration"
                  required
                  flexWrap
                  signal={wheelOneSignalDurationSignal}
                  border="none"
                >
                  {WHEEL_ONE_SIGNAL_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`wheel_one_signal_${durationPreset}`}
                      value={durationPreset}
                      selected={durationPreset === duration}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={WHEEL_ONE_SIGNAL_PRESETS.length}
                    id="wheel_one_signal_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    spacing="xxs"
                    flex
                    noWrap
                    command="--navi-open"
                    commandFor="wheel_one_signal_picker"
                  >
                    {hasCustom ? (
                      <Time type="duration" format="compact">
                        {durationToISOString(
                          hours ? { hours, minutes } : { minutes },
                        )}
                      </Time>
                    ) : (
                      <Text>Perso</Text>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    {/* type="number": what this picker holds is a number of
                        minutes — the one value its wheels add up to. No Form
                        inside it either (unlike the demo above, whose picker
                        holds a PAIR of fields): a form aggregates its children
                        into one key per name, and there is nothing to name
                        here. The picker takes what the group inside it is
                        worth, directly. */}
                    <Picker
                      id="wheel_one_signal_picker"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      type="number"
                      dockedOnTouch
                      borderRadius="s"
                    >
                      <Box flex="y" alignX="center" padding="l" spacing="l">
                        <Text bold size="l">
                          Durée de la partie
                        </Text>
                        <WheelGroup
                          frameBorder
                          signal={wheelTotalSignal}
                          defaultValue={WHEEL_ONE_SIGNAL_PROPOSED_TOTAL}
                          aggregateChildStates={(children) => {
                            let h = 0;
                            let m = 0;
                            for (const child of children) {
                              if (child.name === "hours") {
                                h = Number(child.uiState) || 0;
                              }
                              if (child.name === "minutes") {
                                m = Number(child.uiState) || 0;
                              }
                            }
                            return h * 60 + m;
                          }}
                          distributeChildUIState={(total, child) => {
                            const value = Number(total) || 0;
                            if (child.name === "hours") {
                              return Math.floor(value / 60);
                            }
                            if (child.name === "minutes") {
                              return value % 60;
                            }
                            return undefined;
                          }}
                        >
                          <Wheel name="hours" type="integer" size="xxl">
                            {WHEEL_ONE_SIGNAL_HOURS.map((hour) => (
                              <Wheel.Item key={hour} value={hour} paddingX="s">
                                {hour}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit
                              unit="hour"
                              format="short"
                              color="#6b7280"
                              // The unit is written smaller than the digits, so
                              // centering it in the row leaves it reading high
                              // next to them: a hair down puts it on their line.
                              marginTop="0.2em"
                            />
                          </WheelGroup.Separator>
                          <Wheel name="minutes" type="integer" size="xxl">
                            {WHEEL_ONE_SIGNAL_MINUTES.map((minute) => (
                              <Wheel.Item
                                key={minute}
                                value={minute}
                                paddingX="s"
                              >
                                {String(minute).padStart(2, "0")}
                              </Wheel.Item>
                            ))}
                          </Wheel>
                          <WheelGroup.Separator size="xxl">
                            <Unit
                              unit="minute"
                              format="short"
                              color="#6b7280"
                              marginTop="0.2em"
                            />
                          </WheelGroup.Separator>
                        </WheelGroup>
                      </Box>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── 3. custom via picker + input duration, nothing proposed ───────────

      const PICKER_PRESETS = ["1h", "1h30", "2h"];
      // "1h30", not 90: the presets are duration strings, so a numeric default
      // is not one of the values this signal can hold (see oneOf).
      const pickerDurationSignal = demoSignal("duration2", "1h30", {
        oneOf: [...PICKER_PRESETS, "custom"],
      });
      // The custom duration, as InputDuration speaks it (ISO 8601) — no
      // conversion on either side. Nothing until one is entered.
      const pickerCustomDurationSignal = demoSignal(
        "custom_duration",
        undefined,
        {
          type: "duration",
        },
      );

      const PickerCustomNoProposalDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = pickerDurationSignal.value;
        const customDuration = pickerCustomDurationSignal.value;

        return (
          <div class="demo-section">
            <h2 id="input_duration_demo">
              3. Duration option — custom via picker + input duration (rien de
              proposé)
            </h2>
            <p class="desc">
              L'option "Perso" contient un Picker : cliquer dessus sélectionne
              l'option et ouvre la popup en un seul clic. Le picker s'ouvre sur
              un champ vide.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              // durationCustom is what the picker holds — an ISO 8601 duration,
              // since what it contains is one InputDuration.
              action={({ duration, durationCustom }) => {
                const minutes =
                  duration === "custom"
                    ? durationToMinutes(durationCustom)
                    : durationToMinutes(duration);
                formResultSignal.value = { minutes };
              }}
            >
              <Field vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="duration2"
                  name="duration"
                  required
                  signal={pickerDurationSignal}
                  flexWrap
                  border="none"
                >
                  {PICKER_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`duration2_${durationPreset}`}
                      value={durationPreset}
                      selected={duration === durationPreset}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={PICKER_PRESETS.length}
                    id="duration2_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    minWidth="64"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    noWrap
                    flex
                    spacing="xs"
                    command="--navi-open"
                    commandFor="custom_duration_picker2"
                  >
                    {customDuration === undefined || customDuration === null ? (
                      <Text>Perso</Text>
                    ) : (
                      <Time type="duration" format="compact">
                        {customDuration}
                      </Time>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    <Picker
                      id="custom_duration_picker2"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      borderRadius="s"
                      // one value, not a form: what it holds is a single
                      // InputDuration, so the picker IS that duration
                      type="duration"
                    >
                      <Box flex="y" alignX="center" padding="m" spacing="l">
                        <Text bold>Veuillez saisir une durée</Text>
                        {/* required only while "Perso" is the chosen option:
                            a duration nobody is going to use is not missing,
                            and submitting a preset would otherwise be refused
                            for an empty field the user never opened. */}
                        <InputDuration
                          signal={pickerCustomDurationSignal}
                          min="15min"
                          max="4h30"
                          step="5min"
                          required={duration === "custom"}
                        />
                      </Box>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── 4. custom via picker + input duration, 2h15 proposed ──────────────

      const PROPOSAL_PRESETS = ["1h", "1h30", "2h"];
      // 2h15 is proposed, not chosen: the signal holds nothing until the picker
      // is confirmed, so the option reads "Perso" and the url stays clean. The
      // proposal is a `defaultValue` on the input instead (see below) — which is
      // also where a reset goes back to.
      const PROPOSED_CUSTOM_DURATION = "PT2H15M";
      const proposalDurationSignal = demoSignal("duration3", "1h30", {
        oneOf: [...PROPOSAL_PRESETS, "custom"],
      });
      const proposalCustomDurationSignal = demoSignal(
        "custom_duration3",
        undefined,
        { type: "duration" },
      );

      const PickerCustomProposedDemo = () => {
        const formResultSignal = useSignal(null);
        const duration = proposalDurationSignal.value;
        const customDuration = proposalCustomDurationSignal.value;

        return (
          <div class="demo-section">
            <h2 id="input_duration_proposed_demo">
              4. Duration option — custom via picker + input duration (2h15
              proposé)
            </h2>
            <p class="desc">
              Même chose, mais le champ du picker s'ouvre sur 2h15 : une
              proposition à partir de laquelle régler, pas une réponse. Tant
              qu'on n'a pas confirmé, l'option affiche "Perso" et l'url ne
              contient rien.
            </p>
            <Form
              flex="y"
              spacing="m"
              alignX="start"
              action={({ duration, durationCustom }) => {
                const minutes =
                  duration === "custom"
                    ? durationToMinutes(durationCustom)
                    : durationToMinutes(duration);
                formResultSignal.value = { minutes };
              }}
            >
              <Field ownLabel vertical>
                <Label bold>Durée</Label>
                <List
                  selectable
                  horizontal
                  spacing="s"
                  id="duration3"
                  name="duration"
                  required
                  signal={proposalDurationSignal}
                  border="none"
                  flexWrap
                >
                  {PROPOSAL_PRESETS.map((durationPreset, i) => (
                    <List.Item
                      selectable
                      key={durationPreset}
                      index={i}
                      id={`duration3_${durationPreset}`}
                      value={durationPreset}
                      selected={duration === durationPreset}
                      borderRadius="s"
                      borderWidth="1"
                      minWidth="64"
                      paddingX="m"
                      paddingY="s"
                      alignX="center"
                    >
                      <Time type="duration" format="compact">
                        {durationPreset}
                      </Time>
                    </List.Item>
                  ))}
                  <List.Item
                    selectable
                    index={PROPOSAL_PRESETS.length}
                    id="duration3_custom"
                    value="custom"
                    selected={duration === "custom"}
                    borderRadius="s"
                    borderWidth="1"
                    minWidth="64"
                    paddingX="m"
                    paddingY="s"
                    alignX="center"
                    noWrap
                    flex
                    spacing="xs"
                    command="--navi-open"
                    commandFor="custom_duration_picker3"
                  >
                    {customDuration === undefined || customDuration === null ? (
                      <Text>Perso</Text>
                    ) : (
                      <Time type="duration" format="compact">
                        {customDuration}
                      </Time>
                    )}
                    <Icon marginRight="-1ch">
                      <Picker.UI.PencilSvg />
                    </Icon>
                    <Picker
                      id="custom_duration_picker3"
                      name="durationCustom"
                      variant="headless"
                      mode="dialog"
                      borderRadius="s"
                      type="duration"
                    >
                      <Box flex="y" alignX="center" padding="m" spacing="m">
                        <Text bold>Veuillez saisir une durée</Text>
                        {/* signal + defaultValue: the signal is where the answer
                            goes and comes back from, defaultValue only what to
                            open on while there is no answer yet — so the option
                            reads "Perso" until a duration is actually chosen. */}
                        <InputDuration
                          signal={proposalCustomDurationSignal}
                          defaultValue={PROPOSED_CUSTOM_DURATION}
                          min="0min"
                          max="4h"
                          step="5min"
                        />
                      </Box>
                    </Picker>
                  </List.Item>
                </List>
              </Field>
              <Button type="submit">Submit</Button>
            </Form>
            {formResultSignal.value !== null ? (
              <div class="form-result">
                Form submitted:{" "}
                {JSON.stringify(formResultSignal.value, null, 2)}
              </div>
            ) : (
              <div class="form-result" style="color:#aaa">
                Submit the form to see values…
              </div>
            )}
          </div>
        );
      };

      // ── The page itself ───────────────────────────────────────────────────

      setupRoutes([route("", { searchParams: DEMO_SEARCH_PARAMS })]);

      const ResetAll = () => (
        <Box flex="x" alignX="end">
          <Button
            variant="discrete"
            onClick={() => {
              // undefined, not their defaults: a signal back at its default is a
              // signal with nothing to say, which is what empties the url.
              for (const signal of Object.values(DEMO_SEARCH_PARAMS)) {
                signal.value = undefined;
              }
            }}
          >
            Reset all
          </Button>
        </Box>
      );

      const TableOfContents = () => (
        <div class="demo-section">
          {/* Its own heading needs no opting out: DocumentToc lists what comes
              after it, and this sits above. */}
          <h2>Sommaire</h2>
          <DocumentToc />
        </div>
      );

      const App = () => (
        <Box flex="y" spacing="l">
          <ResetAll />
          <TableOfContents />
          <WheelPerSignalDemo />
          <WheelOneSignalDemo />
          <PickerCustomNoProposalDemo />
          <PickerCustomProposedDemo />
        </Box>
      );

      render(
        <NaviDebug debugAll>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
