<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Input variant text demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      /* A line the eye can hold on to while the control above it changes. */
      .ruler {
        width: 100%;
        height: 2px;
        background: repeating-linear-gradient(
          to right,
          #d33 0 8px,
          transparent 8px 16px
        );
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Form,
        Input,
        Label,
        Link,
        Text,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      // Every example is the same control seen twice: the button flips it and
      // nothing else changes, which is what makes a shift visible.
      const Swap = ({ caption, children }) => {
        const [asText, setAsText] = useState(true);

        return (
          <Box flex="y" spacing="xs" alignX="start">
            <Box flex alignY="center" spacing="s">
              <Button onClick={() => setAsText(!asText)}>
                {asText ? "texte" : "champ"}
              </Button>
              {caption && (
                <Text size="s" color="#666">
                  {caption}
                </Text>
              )}
            </Box>
            {children(asText ? "text" : undefined)}
          </Box>
        );
      };

      const NAME = "Damien Maillard";
      const LONG_NAME =
        "Jean-Baptiste Grenouille de la Fontaine-sur-Mer et de Montsoreau";

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Input variant text"
            previous={{ href: "./35_input_tel_demo.html", label: "Input tel" }}
          />
          <div class="demo-section">
            <h2 style="margin: 0 0 4px">Sommaire</h2>
            <DocumentToc />
          </div>
          <BasicsDemo />
          <StatesDemo />
          <ShiftDemo />
          <MetricsDemo />
          <PrefixDemo />
          <FormDemo />
        </Box>
      );

      // ── Cas nominal ───────────────────────────────────────────────────────

      const BasicsDemo = () => (
        <div class="demo-section">
          <Heading id="nominal">Cas nominal</Heading>
          <Swap>
            {(variant) => (
              <Field flex="y">
                <Label>Nom</Label>
                <Input
                  variant={variant}
                  defaultValue={NAME}
                  paddingX="s"
                  paddingY="s"
                />
              </Field>
            )}
          </Swap>
        </div>
      );

      // ── États ─────────────────────────────────────────────────────────────

      const StatesDemo = () => (
        <div class="demo-section">
          <Heading id="states">États</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Swap caption="valeur">
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue={NAME}
                  width="240px"
                  paddingX="s"
                  paddingY="s"
                />
              )}
            </Swap>
            <Swap caption="valeur vide">
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue=""
                  width="240px"
                  paddingX="s"
                  paddingY="s"
                />
              )}
            </Swap>
            <Swap caption="valeur plus longue que la boîte">
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue={LONG_NAME}
                  width="240px"
                  paddingX="s"
                  paddingY="s"
                />
              )}
            </Swap>
          </Box>
        </div>
      );

      // ── Alternance ────────────────────────────────────────────────────────

      const ShiftDemo = () => (
        <div class="demo-section">
          <Heading id="shift">Alternance texte / champ</Heading>
          <Box flex="y" spacing="m" alignX="start" width="320px">
            <Swap>
              {(variant) => (
                <Field flex="y" expandX>
                  <Label>Nom</Label>
                  <Input
                    variant={variant}
                    defaultValue={NAME}
                    paddingX="s"
                    paddingY="s"
                    expandX
                  />
                </Field>
              )}
            </Swap>
            <div class="ruler"></div>
            <Text size="s" color="#666">
              Téléphone, adresse, et tout ce qui suit
            </Text>
          </Box>
        </div>
      );

      // ── Mesures ───────────────────────────────────────────────────────────

      const Stacked = ({ caption, children }) => (
        <Box flex="y" spacing="xs" alignX="start">
          <Text size="s" color="#666">
            {caption}
          </Text>
          <Box flex="y" backgroundColor="#eef">
            {children("text")}
            {children(undefined)}
          </Box>
        </Box>
      );

      const MetricsDemo = () => (
        <div class="demo-section">
          <Heading id="metrics">Mêmes mesures</Heading>
          <p class="desc">
            Le texte est posé sur le champ, sans espace entre les deux.
          </p>
          <Box flex="y" spacing="l" alignX="start">
            <Stacked caption='paddingX="s" paddingY="s"'>
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue={NAME}
                  width="240px"
                  paddingX="s"
                  paddingY="s"
                />
              )}
            </Stacked>
            <Stacked caption='padding="l"'>
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue={NAME}
                  width="240px"
                  padding="l"
                />
              )}
            </Stacked>
            <Stacked caption='borderWidth="3" fontSize="20px"'>
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue={NAME}
                  width="240px"
                  borderWidth="3"
                  fontSize="20px"
                />
              )}
            </Stacked>
            <Stacked caption="valeur plus longue que la boîte">
              {(variant) => (
                <Input
                  variant={variant}
                  defaultValue={LONG_NAME}
                  width="240px"
                  paddingX="s"
                  paddingY="s"
                />
              )}
            </Stacked>
            <Stacked caption="maxLength={6}">
              {(variant) => (
                <Input variant={variant} defaultValue="123456" maxLength={6} />
              )}
            </Stacked>
          </Box>
        </div>
      );

      // ── Préfixe ───────────────────────────────────────────────────────────

      const PrefixDemo = () => (
        <div class="demo-section">
          <Heading id="prefix">Téléphone, avec son préfixe</Heading>
          <Swap>
            {(variant) => (
              <Box flex alignY="center" spacing="xs">
                <Text>+33</Text>
                <Input
                  type="tel"
                  variant={variant}
                  defaultValue="6 12 34 56 78"
                  width="160px"
                  paddingX="s"
                  paddingY="s"
                />
              </Box>
            )}
          </Swap>
        </div>
      );

      // ── Formulaire ────────────────────────────────────────────────────────

      const FormDemo = () => {
        const [sent, setSent] = useState(null);

        return (
          <div class="demo-section">
            <Heading id="form">Dans un formulaire</Heading>
            <Swap>
              {(variant) => (
                <Form
                  name="text_variant"
                  action={(values) => {
                    setSent(Object.entries(values));
                  }}
                >
                  <Box flex="y" spacing="m" alignX="start">
                    <Field flex="y">
                      <Label>Nom</Label>
                      <Input
                        variant={variant}
                        name="name"
                        defaultValue={NAME}
                        paddingX="s"
                        paddingY="s"
                      />
                    </Field>
                    <Field flex="y">
                      <Label>Ville</Label>
                      <Input
                        name="city"
                        defaultValue="Rennes"
                        paddingX="s"
                        paddingY="s"
                      />
                    </Field>
                    <Button type="submit">Envoyer</Button>
                    <Text size="s" color="#666">
                      {sent === null
                        ? " "
                        : sent
                            .map(([key, value]) => `${key}=${value}`)
                            .join(", ")}
                    </Text>
                  </Box>
                </Form>
              )}
            </Swap>
          </div>
        );
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
