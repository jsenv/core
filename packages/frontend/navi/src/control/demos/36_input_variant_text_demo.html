<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Input variant text demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      h3 {
        margin: 16px 0 4px;
        font-size: 0.95rem;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      /* A line the eye can watch while the control above it changes. */
      .ruler {
        height: 2px;
        background: repeating-linear-gradient(
          to right,
          #d33 0 8px,
          transparent 8px 16px
        );
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Form,
        Input,
        Label,
        Link,
        Text,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const Variant = ({ caption, children }) => (
        <Box flex="y" spacing="xs" alignX="start">
          <Text size="s" color="#666">
            {caption}
          </Text>
          {children}
        </Box>
      );

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Input variant text"
            previous={{ href: "./35_input_tel_demo.html", label: "Input tel" }}
          />
          <div class="demo-section">
            <h2 style="margin: 0 0 4px">Sommaire</h2>
            <DocumentToc />
          </div>
          <BasicsDemo />
          <StatesDemo />
          <SwapDemo />
          <MetricsDemo />
          <PrefixDemo />
          <FormDemo />
        </Box>
      );

      // ── Cas nominal ───────────────────────────────────────────────────────

      const BasicsDemo = () => (
        <div class="demo-section">
          <Heading id="nominal">Cas nominal</Heading>
          <Box flex="y" spacing="m" alignX="start">
            <Field flex="y">
              <Label>Nom</Label>
              <Input
                variant="text"
                value="Damien Maillard"
                paddingX="s"
                paddingY="s"
              />
            </Field>
            <Field flex="y">
              <Label>Nom</Label>
              <Input value="Damien Maillard" paddingX="s" paddingY="s" />
            </Field>
          </Box>
        </div>
      );

      // ── États ─────────────────────────────────────────────────────────────

      const LONG_NAME =
        "Jean-Baptiste Grenouille de la Fontaine-sur-Mer et de Montsoreau";

      const StatesDemo = () => (
        <div class="demo-section">
          <Heading id="states">États</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption="valeur">
              <Input
                variant="text"
                value="Damien"
                width="240px"
                paddingX="s"
                paddingY="s"
              />
            </Variant>
            <Variant caption="valeur vide">
              <Input
                variant="text"
                value=""
                width="240px"
                paddingX="s"
                paddingY="s"
              />
            </Variant>
            <Variant caption="valeur plus longue que la boîte">
              <Input
                variant="text"
                value={LONG_NAME}
                width="240px"
                paddingX="s"
                paddingY="s"
              />
            </Variant>
            <Variant caption="la même, éditable">
              <Input
                value={LONG_NAME}
                width="240px"
                paddingX="s"
                paddingY="s"
              />
            </Variant>
          </Box>
        </div>
      );

      // ── Alternance ────────────────────────────────────────────────────────

      const ORGANIZERS = [
        { id: "1", label: "avec un nom connu", name: "Damien" },
        { id: "2", label: "sans nom connu", name: "" },
      ];

      const SwapDemo = () => {
        const [organizer, setOrganizer] = useState(ORGANIZERS[0]);
        const known = organizer.name !== "";

        return (
          <div class="demo-section">
            <Heading id="swap">Alternance texte / champ</Heading>
            <Box flex="y" spacing="m" alignX="start" width="320px">
              <Box flex spacing="s">
                {ORGANIZERS.map((candidate) => (
                  <Button
                    key={candidate.id}
                    onClick={() => setOrganizer(candidate)}
                  >
                    {candidate.label}
                  </Button>
                ))}
              </Box>
              <Field flex="y" expandX>
                <Label>Nom</Label>
                {known ? (
                  <Input
                    variant="text"
                    value={organizer.name}
                    paddingX="s"
                    paddingY="s"
                    expandX
                  />
                ) : (
                  <Input
                    name="organizer_name"
                    placeholder="Nom de l'organisateur"
                    paddingX="s"
                    paddingY="s"
                    expandX
                  />
                )}
              </Field>
              <div class="ruler" style="width: 100%"></div>
              <Text size="s" color="#666">
                Téléphone, adresse, et tout ce qui suit
              </Text>
            </Box>
          </div>
        );
      };

      // ── Mesures ───────────────────────────────────────────────────────────

      const MetricsDemo = () => (
        <div class="demo-section">
          <Heading id="metrics">Mêmes mesures</Heading>
          <p class="desc">
            Les deux boîtes sont posées l'une sur l'autre, sans espace entre
            elles.
          </p>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption='paddingX="s" paddingY="s"'>
              <Box flex="y" backgroundColor="#eef">
                <Input
                  variant="text"
                  value="texte"
                  width="200px"
                  paddingX="s"
                  paddingY="s"
                />
                <Input value="champ" width="200px" paddingX="s" paddingY="s" />
              </Box>
            </Variant>
            <Variant caption='padding="l"'>
              <Box flex="y" backgroundColor="#eef">
                <Input variant="text" value="texte" width="200px" padding="l" />
                <Input value="champ" width="200px" padding="l" />
              </Box>
            </Variant>
            <Variant caption='borderWidth="3" fontSize="20px"'>
              <Box flex="y" backgroundColor="#eef">
                <Input
                  variant="text"
                  value="texte"
                  width="200px"
                  borderWidth="3"
                  fontSize="20px"
                />
                <Input
                  value="champ"
                  width="200px"
                  borderWidth="3"
                  fontSize="20px"
                />
              </Box>
            </Variant>
            <Variant caption="maxLength={6}">
              <Box flex="y" backgroundColor="#eef">
                <Input variant="text" value="123456" maxLength={6} />
                <Input value="123456" maxLength={6} />
              </Box>
            </Variant>
          </Box>
        </div>
      );

      // ── Préfixe ───────────────────────────────────────────────────────────

      const PrefixDemo = () => (
        <div class="demo-section">
          <Heading id="prefix">Téléphone, avec son préfixe</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption="texte">
              <Box flex alignY="center" spacing="xs">
                <Text>+33</Text>
                <Input
                  variant="text"
                  value="6 12 34 56 78"
                  width="160px"
                  paddingX="s"
                  paddingY="s"
                />
              </Box>
            </Variant>
            <Variant caption="champ">
              <Box flex alignY="center" spacing="xs">
                <Text>+33</Text>
                <Input
                  type="tel"
                  value="6 12 34 56 78"
                  width="160px"
                  paddingX="s"
                  paddingY="s"
                />
              </Box>
            </Variant>
          </Box>
        </div>
      );

      // ── Formulaire ────────────────────────────────────────────────────────

      const FormDemo = () => {
        const [sent, setSent] = useState(null);

        return (
          <div class="demo-section">
            <Heading id="form">Dans un formulaire</Heading>
            <Form
              name="text_variant"
              action={(values) => {
                setSent(Object.entries(values));
              }}
            >
              <Box flex="y" spacing="m" alignX="start">
                <Field flex="y">
                  <Label>Nom</Label>
                  <Input
                    variant="text"
                    name="name"
                    value="Damien"
                    paddingX="s"
                    paddingY="s"
                  />
                </Field>
                <Field flex="y">
                  <Label>Ville</Label>
                  <Input
                    name="city"
                    defaultValue="Rennes"
                    paddingX="s"
                    paddingY="s"
                  />
                </Field>
                <Button type="submit">Envoyer</Button>
                <Text size="s" color="#666">
                  {sent === null
                    ? " "
                    : sent.map(([key, value]) => `${key}=${value}`).join(", ")}
                </Text>
              </Box>
            </Form>
          </div>
        );
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
