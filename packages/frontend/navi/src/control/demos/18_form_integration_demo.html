<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form integration demo</title>
    <style>
      body {
        margin: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      .demo-section h2 {
        position: relative;
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
        scroll-margin-top: 12px;
      }
      .demo-section h3 {
        position: relative;
        margin: 24px 0 8px;
        color: #1a1a1a;
        font-size: 1.05rem;
        scroll-margin-top: 12px;
      }
      .toc {
        margin: 0;
        padding-left: 20px;
        line-height: 1.9;
      }
      .demo-row {
        display: flex;
        margin-top: 8px;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      /* The panel that settles a pending action. Deliberately outside every
         form below, so it stays operable while the form it settles is busy. */
      .demo-settle {
        display: flex;
        margin: 10px 0;
        padding: 8px 12px;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        background: #f4f7fb;
        border: 1px solid #d6e2f2;
        border-radius: 6px;
      }
      .demo-settle-state {
        color: #666;
        font-family: monospace;
      }
      .demo-inside-note {
        margin: 8px 0 0;
        padding: 8px 12px;
        color: #7a5b00;
        font-size: 13px;
        background: #fff8e1;
        border: 1px solid #f0dca0;
        border-radius: 6px;
      }
      .demo_form_box {
        max-width: 340px;
        padding: 16px 18px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .demo-popup-box {
        width: 320px;
        background: white;
        border-radius: 10px;
      }
      .demo-slide-box {
        width: 340px;
        height: 260px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .demo-slide-header {
        color: white;
        background: #1a237e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useRef, useState } from "preact/hooks";
      import {
        Box,
        Button,
        Dialog,
        Field,
        Form,
        Input,
        Label,
        Link,
        NaviDebug,
        Popover,
        SlideContainer,
        Text,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";

      // An action that never settles on its own: it hands its resolve/reject to
      // the panel below, so "how long does submitting take" and "does it work"
      // are answered by the demo, one submission at a time. Everything a form
      // does while its action runs (loading outline on the submit button, its
      // own fields going read-only, the popup around it refusing to close) is
      // then observable for as long as needed instead of flashing past.
      const useSettlableAction = () => {
        const [pending, setPending] = useState(null);
        return {
          pending: Boolean(pending),
          action: () =>
            new Promise((resolve, reject) => {
              setPending({ resolve, reject });
            }),
          succeed: () => {
            pending.resolve();
            setPending(null);
          },
          fail: () => {
            pending.reject(new Error("Server refused this value"));
            setPending(null);
          },
        };
      };

      const SettlePanel = ({ pending, succeed, fail, children }) => (
        <div class="demo-settle">
          <span class="demo-settle-state">
            action: {pending ? "pending" : "idle"}
          </span>
          <Button disabled={!pending} onClick={succeed}>
            Succeed
          </Button>
          <Button disabled={!pending} onClick={fail}>
            Fail
          </Button>
          {children}
        </div>
      );

      const NameEmailFields = () => (
        <>
          <Field vertical>
            <Label requiredIndicator>Name</Label>
            <Input name="name" required />
          </Field>
          <Field vertical>
            <Label>Email</Label>
            <Input name="email" type="email" />
          </Field>
        </>
      );

      // ── In the document ───────────────────────────────────────────────────

      const InDocumentSection = () => {
        const [entries, push, clear] = useCallLog();
        const settle = useSettlableAction();
        return (
          <section class="demo-section">
            <Heading id="document">In the document</Heading>
            <SettlePanel {...settle} />
            <Form
              className="demo_form_box"
              flex="y"
              spacing="m"
              action={async (value) => {
                push("action start", value);
                await settle.action();
                push("action end", value);
              }}
            >
              <NameEmailFields />
              <Button type="submit">Submit</Button>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </section>
        );
      };

      // ── In one slide ──────────────────────────────────────────────────────

      const InSlideSection = () => {
        const [entries, push, clear] = useCallLog();
        const settle = useSettlableAction();
        return (
          <section class="demo-section">
            <Heading id="slide">In a slide</Heading>
            <SettlePanel {...settle} />
            <SlideContainer
              layout="row"
              duration="400ms"
              className="demo-slide-box"
            >
              <SlideContainer.Item id="slide_form" overflow="auto">
                <Box
                  header
                  padding="s"
                  flex="x"
                  alignY="center"
                  className="demo-slide-header"
                >
                  <Text expandX>form</Text>
                  <SlideContainer.Next size="l" padding="xs" />
                </Box>
                <Form
                  body
                  flex="y"
                  spacing="m"
                  padding="m"
                  action={async (value) => {
                    push("action start", value);
                    await settle.action();
                    push("action end", value);
                  }}
                >
                  <NameEmailFields />
                  <Button type="submit">Submit</Button>
                </Form>
              </SlideContainer.Item>
              <SlideContainer.Item id="slide_done" overflow="auto">
                <Box
                  header
                  padding="s"
                  flex="x"
                  alignY="center"
                  className="demo-slide-header"
                >
                  <SlideContainer.Previous size="l" padding="xs" />
                  <Text expandX>done</Text>
                </Box>
                <Box body padding="m">
                  A submission that went through moves on by itself — nothing
                  here says <code>--navi-next</code>.
                </Box>
              </SlideContainer.Item>
            </SlideContainer>
            <CallLog entries={entries} onClear={clear} />
          </section>
        );
      };

      // ── One form per slide ────────────────────────────────────────────────

      const QUESTIONS = [
        { id: "who", label: "Your name", name: "name" },
        { id: "where", label: "Your city", name: "city" },
        { id: "what", label: "Your favourite colour", name: "colour" },
      ];

      // Each step commits on its own — the slide it sits in is what it answers
      // to, so submitting walks to the next one with nothing said about it.
      // `required` is what keeps that walk honest: a step nobody answered holds
      // the user, so the summary at the end can only be reached by going
      // through them, and answering a step again puts it back out of reach.
      const MultiStepFlow = ({ idPrefix, perform, push }) => {
        const [answers, setAnswers] = useState({});
        const [summary, setSummary] = useState(null);
        // Read inside an async action, where the state captured at render time
        // is one step out of date by the time the step before it settles.
        const answersRef = useRef({});

        const submitStep = async (index, value) => {
          push(`step ${index + 1}`, value);
          await perform(value);
          const merged = { ...answersRef.current, ...value };
          answersRef.current = merged;
          setAnswers(merged);
          // Only the last step produces the thing the summary talks about —
          // any earlier one invalidates it, exactly as it un-answers the steps
          // after it.
          setSummary(
            index === QUESTIONS.length - 1
              ? { reference: `REF-${merged.name}-${merged.city}`, ...merged }
              : null,
          );
        };

        return (
          <SlideContainer
            layout="row"
            duration="400ms"
            className="demo-slide-box"
          >
            {QUESTIONS.map((question, index) => (
              <SlideContainer.Item
                key={question.id}
                id={`${idPrefix}_${question.id}`}
                required
                overflow="auto"
              >
                <Box
                  header
                  padding="s"
                  flex="x"
                  alignY="center"
                  className="demo-slide-header"
                >
                  {index > 0 && (
                    <SlideContainer.Previous size="l" padding="xs" />
                  )}
                  <Text expandX>
                    {index + 1} / {QUESTIONS.length}
                  </Text>
                </Box>
                <Form
                  body
                  flex="y"
                  spacing="m"
                  padding="m"
                  action={(value) => submitStep(index, value)}
                >
                  <Field vertical>
                    <Label requiredIndicator>{question.label}</Label>
                    <Input name={question.name} required />
                  </Field>
                  <Button type="submit">
                    {index === QUESTIONS.length - 1 ? "Finish" : "Next"}
                  </Button>
                </Form>
              </SlideContainer.Item>
            ))}
            <SlideContainer.Item id={`${idPrefix}_done`} overflow="auto">
              <Box
                header
                padding="s"
                flex="x"
                alignY="center"
                className="demo-slide-header"
              >
                <SlideContainer.Previous size="l" padding="xs" />
                <Text expandX>done</Text>
              </Box>
              <Box body padding="m" flex="y" spacing="s">
                <strong>All set.</strong>
                {summary ? (
                  <>
                    <span>
                      Reference <code>{summary.reference}</code>
                    </span>
                    <span>
                      {summary.name}, {summary.city}, {summary.colour}
                    </span>
                  </>
                ) : (
                  <span>Nothing sent yet.</span>
                )}
                <span style={{ fontSize: "12px", color: "#666" }}>
                  answers: <code>{JSON.stringify(answers)}</code>
                </span>
              </Box>
            </SlideContainer.Item>
          </SlideContainer>
        );
      };

      const MultiStepSection = () => {
        const [syncEntries, pushSync, clearSync] = useCallLog();
        const [asyncEntries, pushAsync, clearAsync] = useCallLog();
        const settle = useSettlableAction();
        return (
          <section class="demo-section">
            <Heading id="multi-step">One form per slide</Heading>

            <Heading level={3} id="multi-step-sync">
              Steps that commit right away
            </Heading>
            <MultiStepFlow
              idPrefix="sync"
              push={pushSync}
              perform={() => undefined}
            />
            <CallLog entries={syncEntries} onClear={clearSync} />

            <Heading level={3} id="multi-step-async">
              Steps that take time
            </Heading>
            <SettlePanel {...settle} />
            <MultiStepFlow
              idPrefix="async"
              push={pushAsync}
              perform={() => settle.action()}
            />
            <CallLog entries={asyncEntries} onClear={clearAsync} />
          </section>
        );
      };

      // ── In a dialog ───────────────────────────────────────────────────────

      const InDialogSection = () => {
        const [entries, push, clear] = useCallLog();
        const settle = useSettlableAction();
        return (
          <section class="demo-section">
            <Heading id="dialog">In a dialog</Heading>
            <SettlePanel {...settle} />
            <div class="demo-row">
              <Button command="--navi-open" commandFor="form_in_dialog">
                Open
              </Button>
            </div>
            <Dialog id="form_in_dialog" className="demo-popup-box">
              <Form
                flex="y"
                spacing="m"
                padding="m"
                action={async (value) => {
                  push("action start", value);
                  await settle.action();
                  push("action end", value);
                }}
              >
                <NameEmailFields />
                <Box flex="x" spacing="s">
                  <Button command="--navi-cancel">Cancel</Button>
                  <Button type="submit">Submit</Button>
                </Box>
              </Form>
              {/* Inside the dialog, outside the form: read-only stops at the
                  form's own edge, so these stay usable while it submits —
                  unlike Cancel and Submit, which are in the form. */}
              <Box padding="m" flex="x" spacing="s">
                <Button disabled={!settle.pending} onClick={settle.succeed}>
                  Succeed (in dialog)
                </Button>
                <Button disabled={!settle.pending} onClick={settle.fail}>
                  Fail (in dialog)
                </Button>
              </Box>
            </Dialog>
            <p class="demo-inside-note">
              A dialog holding a form that is submitting has to stay put:
              Escape, a backdrop click and Cancel should all answer that it is
              busy. Today they close it, form in flight and all — the form's
              action is its own business and nothing tells the dialog about it.
            </p>
            <CallLog entries={entries} onClear={clear} />
          </section>
        );
      };

      // ── In a popover ──────────────────────────────────────────────────────

      const InPopoverSection = () => {
        const [entries, push, clear] = useCallLog();
        const settle = useSettlableAction();
        return (
          <section class="demo-section">
            <Heading id="popover">In a popover</Heading>
            <SettlePanel {...settle} />
            <div class="demo-row">
              <Button command="--navi-toggle" commandFor="form_in_popover">
                Open
              </Button>
            </div>
            <Popover id="form_in_popover" className="demo-popup-box">
              <Form
                flex="y"
                spacing="m"
                padding="m"
                action={async (value) => {
                  push("action start", value);
                  await settle.action();
                  push("action end", value);
                }}
              >
                <NameEmailFields />
                <Button type="submit">Submit</Button>
              </Form>
            </Popover>
            <CallLog entries={entries} onClear={clear} />
          </section>
        );
      };

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const TableOfContents = () => (
        <div className="demo-section">
          <Heading id="form">Form integration</Heading>
          <p>
            Where a form lives is what decides what a successful submission does
            next, and what a submission in flight holds still. The form itself
            is the same one every time — see{" "}
            <Link href="./16_form_demo.html">16_form_demo.html</Link> for what a
            form does with fields and constraints.
          </p>
          <ol className="toc">
            <li>
              <Link href="#document">In the document</Link>
            </li>
            <li>
              <Link href="#slide">In a slide</Link>
            </li>
            <li>
              <Link href="#multi-step">One form per slide</Link>
              <ul>
                <li>
                  <Link href="#multi-step-sync">
                    Steps that commit right away
                  </Link>
                </li>
                <li>
                  <Link href="#multi-step-async">Steps that take time</Link>
                </li>
              </ul>
            </li>
            <li>
              <Link href="#dialog">In a dialog</Link>
            </li>
            <li>
              <Link href="#popover">In a popover</Link>
            </li>
          </ol>
        </div>
      );

      const App = () => (
        <NaviDebug debugAll>
          <h1>Form integration demo</h1>
          <TableOfContents />
          <InDocumentSection />
          <InSlideSection />
          <MultiStepSection />
          <InDialogSection />
          <InPopoverSection />
        </NaviDebug>
      );

      render(<App />, document.querySelector("#root"));
    </script>
  </body>
</html>
