<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Demo</title>
    <style>
      body {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }

      h1 {
        margin-bottom: 32px;
        color: #333;
        font-size: 1.8rem;
        text-align: center;
      }

      .demo-section {
        margin-bottom: 32px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .demo-section h2 {
        position: relative;
        margin: 0 0 8px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.1rem;
        border-bottom: 2px solid #eee;
        scroll-margin-top: 12px;
      }

      .demo-section h3 {
        position: relative;
        margin: 20px 0 8px;
        color: #444;
        font-weight: 600;
        font-size: 0.95rem;
        scroll-margin-top: 12px;
      }

      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .toc-list {
        margin: 0;
        padding-left: 20px;
        line-height: 2;
      }
      .toc-list a {
        color: #1a56cc;
        text-decoration: none;
      }
      .toc-list a:hover {
        text-decoration: underline;
      }
      .toc-list ol {
        margin: 0;
        padding-left: 20px;
        line-height: 2;
        list-style: lower-alpha;
      }

      .demo-subsection {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
      .demo-subsection:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
      }

      .value-display {
        min-height: 24px;
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-family: monospace;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }

      .value-display:empty::before {
        color: #999;
        font-style: italic;
        content: "(none selected)";
      }

      /* A row appearing grows into place, a row leaving shrinks away; the rows
         that stay slide on their own (the browser animates each named row). The
         rules are written against view-transition-class, so one pair of
         keyframes covers every row without naming them one by one. */
      @keyframes task-row-in {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
      }
      @keyframes task-row-out {
        to {
          opacity: 0;
          transform: scale(0.9);
        }
      }
      ::view-transition-new(.task-row):only-child {
        animation: task-row-in 220ms ease-out;
      }
      ::view-transition-old(.task-row):only-child {
        animation: task-row-out 180ms ease-in;
      }
    </style>
  </head>
  <body>
    <h1>List Demo</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useRef, useState } from "preact/hooks";
      import {
        List,
        ListItem,
        ListItemGroup,
        Input,
        Text,
        useSearchText,
        Box,
        Button,
        Form,
        LoadingIndicator,
        NaviDebug,
        Icon,
        Link,
        moveArrayItemByIndex,
        startDragToReorder,
      } from "@jsenv/navi";
      import { FakeBackend } from "@jsenv/navi/src/internal/fake_backend.jsx";

      // 200 auto-generated items
      const LARGE_LIST = Array.from({ length: 200 }, (_, i) => {
        const names = [
          "Alpha",
          "Beta",
          "Gamma",
          "Delta",
          "Epsilon",
          "Zeta",
          "Eta",
          "Theta",
          "Iota",
          "Kappa",
          "Lambda",
          "Mu",
          "Nu",
          "Xi",
          "Omicron",
          "Pi",
          "Rho",
          "Sigma",
          "Tau",
          "Upsilon",
        ];
        return `${names[i % names.length]}-${String(Math.floor(i / names.length) + 1).padStart(2, "0")}`;
      });

      const SUGGESTION_BG = "light-dark(#f0f4ff, #1a2040)";

      const App = () => {
        return (
          <NaviDebug debugAction debugInteraction>
            <TableOfContents />
            <Chapter id="presentation" title="Presentation">
              <DisplayOnlyDemo />
              <HorizontalDemo />
            </Chapter>
            <Chapter id="sizing" title="Sizing">
              <WidthDemo />
              <WidthExpandXDemo />
              <HeightDemo />
            </Chapter>
            <LoadingDemo />
            <Chapter id="search" title="Search">
              <SearchStatesDemo />
              <SearchableExternalInputDemo />
              <SearchableDemo />
              <GroupedSearchDemo />
              <SplitMatchDemo />
            </Chapter>
            <Chapter id="grouping" title="Grouping">
              <ListItemGroupDemo />
            </Chapter>
            <Chapter id="editing" title="Editing the list">
              <ReorderDemo />
              <AddItemDemo />
              <RemoveItemDemo />
            </Chapter>
          </NaviDebug>
        );
      };

      // Section (h2) / subsection (h3) heading with a hover anchor link. `<Link
      // anchor>` owns the id (derived from its href); the "#" child renders as
      // the visible affordance (shown on hover via revealOnInteraction).
      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      // A chapter groups related demos under one h2. Each demo inside renders as
      // a <div className="demo-subsection"> with its own h3.
      const Chapter = ({ id, title, children }) => (
        <div className="demo-section">
          <Heading level={2} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const TableOfContents = () => {
        return (
          <div class="demo-section">
            <h2>Table of contents</h2>
            <ol className="toc-list">
              <li>
                <Link href="#presentation">Presentation</Link>
                <ol>
                  <li>
                    <Link href="#display-only">Display only</Link>
                  </li>
                  <li>
                    <Link href="#horizontal">Horizontal</Link>
                  </li>
                </ol>
              </li>
              <li>
                <Link href="#sizing">Sizing</Link>
                <ol>
                  <li>
                    <Link href="#width">Width</Link>
                  </li>
                  <li>
                    <Link href="#width-expand-x">Width — with expandX</Link>
                  </li>
                  <li>
                    <Link href="#height">
                      Height within a container (expandY)
                    </Link>
                  </li>
                </ol>
              </li>
              <li>
                <Link href="#loading">Loading &amp; error</Link>
                <ol>
                  <li>
                    <Link href="#loading-states">States</Link>
                  </li>
                  <li>
                    <Link href="#loading-default">Default skeleton</Link>
                  </li>
                  <li>
                    <Link href="#loading-padding">Custom padding</Link>
                  </li>
                  <li>
                    <Link href="#loading-layout">Title + subtitle layout</Link>
                  </li>
                  <li>
                    <Link href="#loading-separator">With separators</Link>
                  </li>
                </ol>
              </li>
              <li>
                <Link href="#search">Search</Link>
                <ol>
                  <li>
                    <Link href="#search-fallback">
                      Fallbacks — few / none / searchFallback
                    </Link>
                  </li>
                  <li>
                    <Link href="#search-external">Input outside the list</Link>
                  </li>
                  <li>
                    <Link href="#search-inline">Input inside the list</Link>
                  </li>
                  <li>
                    <Link href="#search-grouped">
                      Many items, grouped by letter
                    </Link>
                  </li>
                  <li>
                    <Link href="#search-split">
                      Split matches / non-matches
                    </Link>
                  </li>
                </ol>
              </li>
              <li>
                <Link href="#grouping">Grouping</Link>
                <ol>
                  <li>
                    <Link href="#grouped">Grouped suggestions</Link>
                  </li>
                </ol>
              </li>
              <li>
                <Link href="#editing">Editing the list</Link>
                <ol>
                  <li>
                    <Link href="#edit-reorder">Reorder</Link>
                  </li>
                  <li>
                    <Link href="#edit-add">Add an item</Link>
                  </li>
                  <li>
                    <Link href="#edit-remove">Remove an item</Link>
                  </li>
                </ol>
              </li>
            </ol>
          </div>
        );
      };

      // ── 1. Display-only list ───────────────────────────────────────────────────

      const FRUITS = [
        "Apple",
        "Banana",
        "Cherry",
        "Date",
        "Elderberry",
        "Fig",
        "Grape",
        "Honeydew",
        "Kiwi",
        "Lemon",
        "Mango",
        "Nectarine",
        "Orange",
        "Papaya",
        "Quince",
      ];

      const DisplayOnlyDemo = () => {
        return (
          <div className="demo-subsection">
            <Heading level={3} id="display-only">
              Display only
            </Heading>
            <p>
              By default a <code>List</code> is purely presentational — no hover
              state, no selection, no keyboard navigation. Items render as
              read-only content.
            </p>
            <List>
              {FRUITS.slice(0, 5).map((fruit, i) => (
                <ListItem key={fruit} index={i} id={fruit} value={fruit}>
                  {fruit}
                </ListItem>
              ))}
            </List>
          </div>
        );
      };

      // ── 1b. Horizontal list ───────────────────────────────────────────────────

      const SIZES = ["XS", "S", "M", "L", "XL"];

      const HorizontalDemo = () => (
        <div className="demo-subsection">
          <Heading level={3} id="horizontal">
            Horizontal
          </Heading>
          <p>
            Avec <code>horizontal</code> les items s'affichent en ligne.{" "}
            <code>spacing</code> s'applique entre eux. Les items supportent{" "}
            <code>borderWidth</code> et <code>borderColor</code>.
          </p>
          <Box flex="y" spacing="m" alignX="start">
            <div>
              <p
                style={{
                  margin: "0 0 8px",
                  fontWeight: 600,
                  fontSize: "0.85rem",
                }}
              >
                Simple — avec spacing
              </p>
              <List horizontal spacing="s">
                {FRUITS.slice(0, 5).map((fruit, i) => (
                  <ListItem
                    key={fruit}
                    index={i}
                    id={fruit}
                    value={fruit}
                    paddingX="m"
                    paddingY="s"
                    backgroundColor="light-dark(#e8f4ff, #1a2840)"
                  >
                    {fruit}
                  </ListItem>
                ))}
              </List>
            </div>
            <div>
              <p
                style={{
                  margin: "0 0 8px",
                  fontWeight: 600,
                  fontSize: "0.85rem",
                }}
              >
                Tailles avec border
              </p>
              <List horizontal spacing="xs" borderWidth="0">
                {SIZES.map((size, i) => (
                  <ListItem
                    key={size}
                    index={i}
                    id={size}
                    value={size}
                    paddingX="m"
                    paddingY="s"
                    borderWidth="2"
                    borderColor="light-dark(#6366f1, #818cf8)"
                    backgroundColor="transparent"
                  >
                    {size}
                  </ListItem>
                ))}
              </List>
            </div>
          </Box>
        </div>
      );

      // ── 2. Width behaviour ─────────────────────────────────────────────────────

      const SHORT = "Short item";
      const LONGER = "A longer item";
      const LONG_SENTENCE =
        "This is a much longer sentence that goes on and on well past where any reasonable line would end, forcing the list to become quite wide indeed.";
      const URL =
        "https://example.com/some/very/deep/nested/path/to/a/specific/resource?with=many&query=params&and=more&values=here&to=ensure&multiline=true";

      const PinSvg = () => (
        <svg
          width="10"
          height="13"
          viewBox="0 0 10 13"
          fill="currentColor"
          style={{ flexShrink: 0, marginRight: "2px" }}
        >
          <path d="M5 0C2.24 0 0 2.24 0 5c0 3.75 5 8 5 8s5-4.25 5-8c0-2.76-2.24-5-5-5zm0 6.5C4.17 6.5 3.5 5.83 3.5 5S4.17 3.5 5 3.5 6.5 4.17 6.5 5 5.83 6.5 5 6.5z" />
        </svg>
      );

      const PlaceItem = ({ maxLines }) => (
        <Box flex="y" expandX spacing="xs" minWidth="0">
          <Text bold noWrap={Boolean(maxLines)} maxLines={maxLines}>
            Boulangerie Artisanale et Pâtisserie du Vieux Marché de Lyon
          </Text>
          <Text
            size="xs"
            color="secondary"
            noWrap={Boolean(maxLines)}
            maxLines={maxLines}
          >
            <Icon>
              <PinSvg />
            </Icon>
            47 avenue du Général de Gaulle, Résidence Les Pins, Bâtiment C,
            42000 Saint-Étienne
          </Text>
        </Box>
      );

      const BG_SHORT = "light-dark(#dbeafe, #1e3a5f)";
      const BG_CONTENT = "light-dark(#dcfce7, #14532d)";

      const WidthDemo = () => {
        return (
          <div className="demo-subsection">
            <Heading level={3} id="width">
              Width
            </Heading>
            <p>
              By default the list is as wide as its widest item but will never
              exceed its parent width (<code>max-width: 100%</code>). Each case
              shows a short reference item paired with a longer one. The
              overflow cases rely on the parent width being constrained by the
              demo section.
            </p>
            <Box flex="y" spacing="l" style={{ alignItems: "flex-start" }}>
              <Box flex="y" spacing="xs" style={{ alignItems: "flex-start" }}>
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Medium sentence
                </strong>
                <List>
                  <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                    {SHORT}
                  </ListItem>
                  <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                    {LONGER}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Long sentence
                </strong>
                <List>
                  <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                    {SHORT}
                  </ListItem>
                  <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                    {LONG_SENTENCE}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  URL
                </strong>
                <List>
                  <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                    {SHORT}
                  </ListItem>
                  <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                    {URL}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Long sentence + maxLines={1}
                </strong>
                <List>
                  <ListItem
                    index={0}
                    style={{ backgroundColor: BG_SHORT }}
                    maxLines={1}
                  >
                    {SHORT}
                  </ListItem>
                  <ListItem
                    index={1}
                    style={{ backgroundColor: BG_CONTENT }}
                    maxLines={1}
                  >
                    {LONG_SENTENCE}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start" maxWidth="100%">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Long sentence + noWrap + maxLines={1}
                </strong>
                <List>
                  <ListItem
                    index={0}
                    style={{ backgroundColor: BG_SHORT }}
                    noWrap
                    maxLines={1}
                  >
                    {SHORT}
                  </ListItem>
                  <ListItem
                    index={1}
                    style={{ backgroundColor: BG_CONTENT }}
                    noWrap
                    maxLines={1}
                  >
                    {LONG_SENTENCE}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start" maxWidth="100%">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  URL + maxLines={1}
                </strong>
                <List expandX>
                  <ListItem
                    index={0}
                    style={{ backgroundColor: BG_SHORT }}
                    maxLines={1}
                  >
                    {SHORT}
                  </ListItem>
                  <ListItem
                    index={1}
                    style={{ backgroundColor: BG_CONTENT }}
                    maxLines={1}
                  >
                    {URL}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start" maxWidth="100%">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  URL + noWrap + maxLines={1}
                </strong>
                <List expandX>
                  <ListItem
                    index={0}
                    style={{ backgroundColor: BG_SHORT }}
                    noWrap
                    maxLines={1}
                  >
                    {SHORT}
                  </ListItem>
                  <ListItem
                    index={1}
                    style={{ backgroundColor: BG_CONTENT }}
                    noWrap
                    maxLines={1}
                  >
                    {URL}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Complex item (label + address overflow)
                </strong>
                <div
                  style={{
                    border: "2px dotted #f59e0b",
                    padding: "4px",
                    maxWidth: "250px",
                  }}
                >
                  <List>
                    <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                      {SHORT}
                    </ListItem>
                    <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                      <PlaceItem />
                    </ListItem>
                  </List>
                </div>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Complex item + maxLines={1}
                </strong>
                <div
                  style={{
                    border: "2px dotted #f59e0b",
                    padding: "4px",
                    maxWidth: "250px",
                  }}
                >
                  <List expandX>
                    <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                      {SHORT}
                    </ListItem>
                    <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                      <PlaceItem maxLines={1} />
                    </ListItem>
                  </List>
                </div>
              </Box>

              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Complex item right column
                </strong>
                <div
                  style={{
                    border: "2px dotted #f59e0b",
                    padding: "4px",
                    maxWidth: "250px",
                  }}
                >
                  <List expandX>
                    <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                      {SHORT}
                    </ListItem>
                    <ListItem
                      flex
                      spacing="xs"
                      index={1}
                      style={{ backgroundColor: BG_CONTENT }}
                    >
                      <Box shrink={false}>Coucou</Box>
                      <PlaceItem />
                    </ListItem>
                  </List>
                </div>
              </Box>

              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Complex item right column + maxLines={1}
                </strong>
                <div
                  style={{
                    border: "2px dotted #f59e0b",
                    padding: "4px",
                    maxWidth: "250px",
                  }}
                >
                  <List expandX>
                    <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                      {SHORT}
                    </ListItem>
                    <ListItem
                      flex
                      spacing="xs"
                      index={1}
                      style={{ backgroundColor: BG_CONTENT }}
                    >
                      <Box shrink={false}>Coucou</Box>
                      <PlaceItem maxLines={1} />
                    </ListItem>
                  </List>
                </div>
              </Box>

              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Flex wrapper
                </strong>
                <div
                  style={{
                    border: "2px dotted #f59e0b",
                    padding: "4px",
                    maxWidth: "250px",
                  }}
                >
                  <List expandX>
                    <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                      {SHORT}
                    </ListItem>
                    <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                      <Box flex spacing="xs">
                        <Box shrink={false}>Coucou</Box>
                        <PlaceItem />
                      </Box>
                    </ListItem>
                  </List>
                </div>
              </Box>

              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Flex wrapper + maxLines={1}
                </strong>
                <div
                  style={{
                    border: "2px dotted #f59e0b",
                    padding: "4px",
                    maxWidth: "250px",
                  }}
                >
                  <List expandX>
                    <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                      {SHORT}
                    </ListItem>
                    <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                      <Box flex spacing="xs">
                        <Box shrink={false}>Coucou</Box>
                        <PlaceItem maxLines={1} />
                      </Box>
                    </ListItem>
                  </List>
                </div>
              </Box>
            </Box>
          </div>
        );
      };

      // ── 2b. Width behaviour — with expandX ────────────────────────────────────

      const WidthExpandXDemo = () => {
        return (
          <div className="demo-subsection">
            <Heading level={3} id="width-expand-x">
              Width — with expandX
            </Heading>
            <p>
              With <code>expandX</code> the list fills its parent width. The
              overflow cases rely on the same parent constraint — the list
              expands to fill it, giving ellipsis something to truncate against.
            </p>
            <Box flex="y" spacing="l" alignX="start">
              <Box flex="y" spacing="xs" alignX="start" expandX>
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Medium sentence
                </strong>
                <List expandX>
                  <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                    {SHORT}
                  </ListItem>
                  <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                    {LONGER}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Long sentence
                </strong>
                <List expandX>
                  <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                    {SHORT}
                  </ListItem>
                  <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                    {LONG_SENTENCE}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  URL
                </strong>
                <List expandX>
                  <ListItem index={0} style={{ backgroundColor: BG_SHORT }}>
                    {SHORT}
                  </ListItem>
                  <ListItem index={1} style={{ backgroundColor: BG_CONTENT }}>
                    {URL}
                  </ListItem>
                </List>
              </Box>
              <Box flex="y" spacing="xs" alignX="start">
                <strong style={{ fontSize: "0.8rem", color: "#888" }}>
                  Long sentence + maxLines={1}
                </strong>
                <List expandX>
                  <ListItem
                    index={0}
                    style={{ backgroundColor: BG_SHORT }}
                    maxLines={1}
                  >
                    {SHORT}
                  </ListItem>
                  <ListItem
                    index={1}
                    style={{ backgroundColor: BG_CONTENT }}
                    maxLines={1}
                  >
                    {LONG_SENTENCE}
                  </ListItem>

      const useSimulatedLoad = (delay = 1400) => {
        const [phase, setPhase] = useState("idle"); // idle | loading | loaded
        const timerRef = useRef(null);
        const load = () => {
          setPhase("loading");
          clearTimeout(timerRef.current);
          timerRef.current = setTimeout(() => setPhase("loaded"), delay);
        };
        return { phase, loading: phase !== "loaded", load };

            borderRadius: "6px",
            cursor: phase === "loading" ? "default" : "pointer",

              States
            </Heading>
            <div style={{ display: "flex", gap: "14px", marginBottom: "12px" }}>
              {LOADING_STATES.map((s) => (
                <label key={s} style={{ display: "inline-flex", gap: "4px" }}>
                  <input
                    type="radio"
                    name="loading-state"
                    checked={state === s}
                    onChange={() => setState(s)}
                  />
                  {s}
                </label>
              ))}
            </div>
            <List
              loading={
                state === "skeleton" || state === "loader" || state === "custom"
              }
              loadingFallback={
                state === "custom" ? CUSTOM_LOADING_FALLBACK : state
              }
              error={
                state === "error"
                  ? "Failed to load fruits. Please try again."
                  : undefined
              }
              expandX
              maxHeight="240"
            >
              {renderFruitItems(SOME_FRUITS)}
            </List>

            <Heading level={3} id="loading-default">
              Default skeleton
            </Heading>
            <p>
              No <code>loadingSkeletonTemplate</code> — each row is a full-width{" "}
              <code>&lt;Text loading&gt;</code> bar.
            </p>
            <DefaultSkeletonExample />

            <Heading level={3} id="loading-padding">
              Custom padding
            </Heading>
            <p>
              Pass a <code>loadingSkeletonTemplate</code> so the placeholder
              matches the real rows' padding, and a{" "}
              <code>loadingSkeletonCount</code> equal to the expected item count
              so the list keeps the same height across the swap.
            </p>
            <CustomPaddingExample />

            <Heading level={3} id="loading-layout">
              Matching a title + subtitle layout
            </Heading>
            <p>
              When items have their own arrangement, the{" "}
              <code>loadingSkeletonTemplate</code> reproduces it with one{" "}
              <code>&lt;Text loading&gt;</code> per line, each sized to mimic
              the real content — a short title bar over a wide address bar;{" "}
              <code>loadingSkeletonCount</code> matches the known length. Press{" "}
              <em>Load</em> to see how closely the placeholder tracks the loaded
              rows.
            </p>
            <TitleSubtitleExample />

            <Heading level={3} id="loading-separator">
              With separators
            </Heading>
            <SeparatorExample />
          </div>
        );
      };

      // ── Search states — few / none, with & without searchFallback ──────────────

      const SearchCaseDemo = ({ title, initialQuery, ...listProps }) => {
        const [searchText, setSearchText] = useState(initialQuery);
        const [fruits, getItemMatchInfo] = useSearchText(searchText, FRUITS);
        return (
          <div style={{ minWidth: "200px" }}>
            <h3>{title}</h3>
            <Box flex="y" spacing="s">
              <Input
                value={searchText}
                placeholder="Search fruits…"
                expandX
                paddingY="6"
                size="m"
                action={(value) => setSearchText(value)}
              />
              <List
                searchText={searchText}
                expandX
                maxHeight="180"
                {...listProps}
              >
                {renderFruitItems(fruits, getItemMatchInfo)}
              </List>
            </Box>
          </div>
        );
      };

      const SearchStatesDemo = () => (
        <div className="demo-subsection">
          <Heading level={3} id="search-fallback">
            Fallbacks — few / none / searchFallback
          </Heading>
          <p>
            Each case has its own search field, pre-filled so the applicable
            state shows immediately (type to change it). The lists differ only
            in <code>searchFallback</code>; with{" "}
            <code>searchFallback={"{false}"}</code> the list hides entirely on
            no results instead of showing an empty bordered box.
          </p>
          <Box flex="y" spacing="l" alignX="start">
            <SearchCaseDemo title="Few results" initialQuery="ap" />
            <SearchCaseDemo
              title="No results — default fallback"
              initialQuery="zzz"
            />
            <SearchCaseDemo
              title="No results — custom fallback"
              initialQuery="zzz"
              searchFallback={<Box padding="s">Nothing here 🤷</Box>}
            />
            <SearchCaseDemo
              title="No results — searchFallback={false} (hides)"
              initialQuery="zzz"
              searchFallback={false}
            />
          </Box>
        </div>
      );

      // ── Editing the list — reorder / add / remove ─────────────────────────────

      const TASKS = [
        { id: "t1", label: "Book the court" },
        { id: "t2", label: "Bring the balls" },
        { id: "t3", label: "Warm up" },
        { id: "t4", label: "Play" },
      ];
      let taskCounter = TASKS.length;
      const nextTaskId = () => `t${++taskCounter}`;

      // Every row carries a view-transition name of its own, so the browser can
      // animate THIS row rather than cross-fade the whole list, plus a shared
      // class the CSS animations below are written against (see the <style>).
      const TaskRow = ({ task, children, ...rest }) => (
        <ListItem
          key={task.id}
          id={task.id}
          value={task.id}
          data-id={task.id}
          flex="x"
          alignY="center"
          spacing="s"
          paddingX="m"
          paddingY="s"
          style={{
            viewTransitionName: `task-${task.id}`,
            viewTransitionClass: "task-row",
          }}
          {...rest}
        >
          {children}
        </ListItem>
      );

      const ReorderDemo = () => {
        const [tasks, setTasks] = useState(TASKS);

        const startDrag = (event) => {
          startDragToReorder(event, {
            itemSelector: "[data-id]",
            getItemId: (el) => el.dataset.id,
            onReorder: async (fromId, toId, syncClone) => {
              const viewTransition = document.startViewTransition(() => {
                syncClone();
                setTasks((previous) => {
                  const fromIndex = previous.findIndex((t) => t.id === fromId);
                  const toIndex =
                    toId === null
                      ? previous.length
                      : previous.findIndex((t) => t.id === toId);
                  return moveArrayItemByIndex(
                    previous,
                    fromIndex,
                    fromIndex < toIndex ? toIndex - 1 : toIndex,
                  );
                });
              });
              await viewTransition.finished;
            },
          });
        };

        return (
          <div className="demo-subsection">
            <Heading level={3} id="edit-reorder">
              Reorder
            </Heading>
            <p>Drag a row by its handle.</p>
            <Box width="320px" style={{ "--drop-hint-margin-y": "4px" }}>
              <List separator>
                {tasks.map((task, i) => (
                  <TaskRow
                    key={task.id}
                    task={task}
                    index={i}
                    onPointerDown={startDrag}
                  >
                    <Text style={{ cursor: "grab" }} data-drag-handle>
                      ⠿
                    </Text>
                    <Text expandX>{task.label}</Text>
                  </TaskRow>
                ))}
              </List>
            </Box>
          </div>
        );
      };

      // Creating: the item is known before the server answers, so it is drawn
      // right away rather than as a skeleton — but read-only and loading until
      // the answer comes, because until then it is not a row anyone can act on.
      const AddItemDemo = () => (
        <div className="demo-subsection">
          <Heading level={3} id="edit-add">
            Add an item
          </Heading>
          <p>
            Answer or fail the call to see where the new row ends up. Press{" "}
            <em>échouer</em> and it goes away again.
          </p>
          <FakeBackend value={TASKS}>
            {({ value, action }) => <AddableList saved={value} save={action} />}
          </FakeBackend>
        </div>
      );

      const AddableList = ({ saved, save }) => {
        const [tasks, setTasks] = useState(saved);
        // The row being created: present in the list, not yet confirmed.
        const [pendingTask, setPendingTask] = useState(null);

        const add = async (values) => {
          const task = { id: nextTaskId(), label: values.label };
          document.startViewTransition(() => setPendingTask(task));
          try {
            await save([...tasks, task]);
          } catch {
            document.startViewTransition(() => setPendingTask(null));
            return;
          }
          setTasks((previous) => [...previous, task]);
          setPendingTask(null);
        };

        const shownTasks = pendingTask ? [...tasks, pendingTask] : tasks;
        return (
          <Box flex="y" spacing="m" width="320px">
            <List separator>
              {shownTasks.map((task, i) => {
                const pending = pendingTask && pendingTask.id === task.id;
                return (
                  <TaskRow
                    key={task.id}
                    task={task}
                    index={i}
                    loading={pending}
                    readOnly={pending}
                  >
                    <Text expandX>{task.label}</Text>
                  </TaskRow>
                );
              })}
            </List>
            {/* The form goes busy on its own while the action runs: the field
                turns read-only and the button takes its loading state. */}
            <Form action={add} flex="x" spacing="s" alignY="end">
              <Input
                name="label"
                required
                placeholder="Something to do…"
                expandX
              />
              <Button command="--navi-send">Add</Button>
            </Form>
          </Box>
        );
      };

      const RemoveItemDemo = () => (
        <div className="demo-subsection">
          <Heading level={3} id="edit-remove">
            Remove an item
          </Heading>
          <p>
            The row stays, loading and read-only, until the server has taken it.
          </p>
          <FakeBackend value={TASKS}>
            {({ value, action }) => <RemovableList saved={value} save={action} />}
          </FakeBackend>
        </div>
      );

      const RemovableList = ({ saved, save }) => {
        const [tasks, setTasks] = useState(saved);
        const [pendingId, setPendingId] = useState(null);

        const remove = async (task) => {
          setPendingId(task.id);
          try {
            await save(tasks.filter((candidate) => candidate.id !== task.id));
          } catch {
            setPendingId(null);
            return;
          }
          // Once the server has taken it, and not before: the row leaves in a
          // view transition, and the ones below it slide up.
          document.startViewTransition(() => {
            setTasks((previous) =>
              previous.filter((candidate) => candidate.id !== task.id),
            );
            setPendingId(null);
          });
        };

        return (
          <Box width="320px">
            <List separator>
              {tasks.map((task, i) => {
                const pending = pendingId === task.id;
                return (
                  <TaskRow
                    key={task.id}
                    task={task}
                    index={i}
                    loading={pending}
                    readOnly={pending}
                  >
                    <Text expandX>{task.label}</Text>
                    <Button
                      variant="discrete"
                      padding="xs"
                      loading={pending}
                      readOnly={pending}
                      aria-label={`Remove ${task.label}`}
                      action={() => remove(task)}
                    >
                      ✕
                    </Button>
                  </TaskRow>
                );
              })}
            </List>
          </Box>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
