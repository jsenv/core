<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popover demo</title>
    <style>
      body {
        margin: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      /* Same shape as the dialog and wheel demos: each section is a card,
         headings own their anchor link, and the table of contents is a plain
         nested list of <Link href="#…">. */
      .demo-overflow-filler {
        padding: 6px 10px;
        text-align: center;
        background: #eef3fb;
        border-bottom: 1px solid #cfe0f5;
      }
      .demo-overflow-part {
        color: white;
        background: #1a237e;
      }
      .demo-section h2 {
        position: relative;
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
        scroll-margin-top: 12px;
      }
      .demo-section h3 {
        position: relative;
        margin: 28px 0 10px;
        color: #1a1a1a;
        font-weight: 700;
        font-size: 1.08rem;
        scroll-margin-top: 12px;
      }
      .toc {
        margin: 0;
        padding-left: 20px;
        line-height: 1.9;
      }
      .toc ul {
        margin: 0;
        padding-left: 20px;
        list-style: circle;
      }
      .demo-section {
        margin-bottom: 32px;
        scroll-margin-top: 16px;
      }
      .demo-subsection {
        margin-top: 20px;
        margin-left: 8px;
      }
      .demo-row {
        display: flex;
        margin-top: 8px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .demo-lazy-mount {
        /* Fixed footprint, kept identical whether showing the placeholder
           or the actually-rendered content — swapping between them (on
           "Render") must not shift the rest of the page's own layout. */
        display: flex;
        width: 220px;
        height: 90px;
        align-items: center;
        justify-content: center;
      }
      .demo-lazy-placeholder {
        display: flex;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 8px 12px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 8px;
        color: #777;
        font-size: 12px;
        background: #f0f0f0;
        border: 1px dashed #bbb;
        border-radius: 8px;
      }
      .demo_popover_box {
        /* Fixed size — content (a label of varying length + a Close button)
           must not influence it, so every popover in a grid demo is
           directly comparable regardless of which positionArea it shows. */
        width: 130px;
        height: 70px;
        padding: 6px 8px;
        font-size: 11px;
        background: white;
        border: 1px solid #d0d0d0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        overflow: auto;
      }
      .demo-container {
        position: relative;
        display: flex;
        width: 100%;
        max-width: 100%;
        height: 240px;
        margin-bottom: 8px;
        align-items: center;
        justify-content: center;
        border: 1px dotted #999;
        border-radius: 8px;
        overflow: auto;
      }
      .demo-important-note {
        margin: 8px 0;
        padding: 8px 12px;
        color: #7a5b00;
        font-size: 13px;
        background: #fff8e1;
        border: 1px solid #f0dca0;
        border-radius: 6px;
      }
      .demo-animate-controls {
        display: flex;
        margin-top: 8px;
        gap: 12px;
      }
      .demo-animate-toggle {
        display: block;
        font-size: 13px;
      }
      .demo-container-label {
        color: #999;
        font-size: 12px;
      }
      .demo-side-by-side {
        display: flex;
        margin-top: 8px;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
      }
      .demo-area-grid {
        display: grid;
        width: fit-content;
        margin-top: 8px;
        padding: 8px;
        grid-template-columns: repeat(5, 100px);
        grid-template-rows: repeat(5, 48px);
        gap: 2px;
        border: 1px solid #999;
      }
      .demo-area-cell {
        display: flex;
        border: 1px solid #ccc;
      }
      .demo-area-button {
        display: flex;
        width: 100%;
        height: 100%;
        padding: 2px;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        text-align: center;
        line-height: 1.2;
        white-space: normal;
      }
      .demo-area-button[data-duplicate] {
        opacity: 0.35;
      }
      .demo-static-anchor-wrapper {
        position: relative;
        display: flex;
        width: fit-content;
        /* auto left/right centers it above the grid below; also gives
           "left"/"right" popovers (130px wide) room to render without
           being clipped by the viewport edge. */
        margin: 16px auto 44px;
        align-items: center;
        justify-content: center;
      }
      .demo-static-anchor {
        padding: 10px 16px;
        color: #666;
        font-size: 12px;
        background: #f6f6f6;
        border: 1px dashed #999;
        border-radius: 6px;
      }
      .demo-static-anchor-small {
        display: inline-block;
        padding: 4px 8px;
        color: #666;
        font-size: 10px;
        background: #f6f6f6;
        border: 1px dashed #999;
        border-radius: 4px;
      }
      /* Almost as wide as the viewport (see isAnchorTooBig's own doc,
         visible_rect.js) — leaves under 50px on the left/right axis, so
         "left"/"right" get rejected, while "top"/"bottom" stay unaffected
         (the anchor's own height is unrelated to that axis). */
      .demo-toobig-anchor-wide {
        box-sizing: border-box;
        width: calc(100vw - 30px);
        margin: 16px auto;
        padding: 10px 16px;
        color: #666;
        font-size: 12px;
        text-align: center;
        background: #f6f6f6;
        border: 1px dashed #999;
        border-radius: 6px;
      }
      /* Almost as tall as its own .demo-container (see below) — same idea
         as .demo-toobig-anchor-wide, but on the height/container axis
         instead of the viewport width. */
      .demo-toobig-anchor-tall {
        box-sizing: border-box;
        width: 80px;
        height: calc(240px - 5px);
        padding: 10px 8px;
        color: #666;
        font-size: 12px;
        text-align: center;
        background: #f6f6f6;
        border: 1px dashed #999;
        border-radius: 6px;
      }
      .demo-zone-label {
        position: absolute;
        color: #bbb;
        font-size: 10px;
        white-space: nowrap;
      }
      .demo-zone-label-top {
        bottom: 100%;
        margin-bottom: 4px;
      }
      .demo-zone-label-bottom {
        top: 100%;
        margin-top: 4px;
      }
      .demo-zone-label-left {
        right: 100%;
        margin-right: 8px;
      }
      .demo-zone-label-right {
        left: 100%;
        margin-left: 8px;
      }
      .demo-legend {
        display: flex;
        margin: 8px 0 4px;
        align-items: center;
        gap: 10px;
        color: #555;
        font-size: 13px;
      }
      .demo-legend-example {
        display: flex;
        width: 90px;
        height: 32px;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .demo-legend-example[data-duplicate] {
        opacity: 0.35;
      }
      .demo_popover_flex_box {
        /* No fixed size, unlike .demo_popover_box above — sizes to its
           content, so this section can show how Popover copes with small
           vs. large content instead of hiding it behind a fixed box. */
        max-width: 320px;
        padding: 10px 14px;
        background: white;
        border: 1px solid #d0d0d0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }
      .demo-content-wide-block {
        width: 460px;
        max-width: none;
        height: 22px;
        margin: 4px 0;
        background: #eef3fb;
        border: 1px solid #cfe0f5;
      }
      .demo-content-tall-block {
        /* flex-shrink: 0 (+ matching min-height) so a flex/column ancestor
           can't shrink these back down — the whole point is to force the
           popup taller, not to be squeezed to fit. Tall enough on its own
           (8 of them) to overflow most viewports and exercise the same
           overflow handling as the dedicated "exceeds viewport" example. */
        height: 120px;
        min-height: 120px;
        margin: 4px 0;
        flex-shrink: 0;
        background: #eef3fb;
        border: 1px solid #cfe0f5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useId, useState, useEffect } from "preact/hooks";
      import {
        Button,
        Popover,
        NaviDebug,
        Box,
        Field,
        Icon,
        Input,
        Label,
        Link,
        Slides,
        Text,
      } from "@jsenv/navi";
      import { ChevronUpSvg } from "@jsenv/navi/src/graphic/icons/chevron_stroke_svg.jsx";
      import { PlusSvg } from "@jsenv/navi/src/graphic/icons/plus_svg.jsx";
      import { CallLog, useCallLog } from "../utils/call_log.jsx";

      // The full positionArea grammar (see popup_shared.js's own
      // parsePositionArea) laid out as a 5×5 grid: rows go from fully above
      // the anchor to fully below it, columns from fully left to fully
      // right — the same spatial arrangement the anchor itself sits in at
      // the grid's center. The middle 3×3 (rows/columns 2–4) is the
      // `inset(...)` family (overlapping the anchor); the outer ring is the
      // bare/no-overlap family.
      const POSITION_AREA_GRID = [
        ["top-left", "top-start", "top", "top-end", "top-right"],
        [
          "left-start",
          "inset(top-left)",
          "inset(top)",
          "inset(top-right)",
          "right-start",
        ],
        ["left", "inset(left)", "center", "inset(right)", "right"],
        [
          "left-end",
          "inset(bottom-left)",
          "inset(bottom)",
          "inset(bottom-right)",
          "right-end",
        ],
        ["bottom-left", "bottom-start", "bottom", "bottom-end", "bottom-right"],
      ];

      // Pinned to a point/corner (layer="top" or "local" — no real anchor
      // box), overlap and no-overlap collapse to the same placement, so
      // every `-start`/`-end`/`inset(...)` token lands exactly where its
      // corner/bare counterpart does (e.g. "top-start" lands where
      // "top-left" does, "inset(top)" lands where "top" does).
      const isDuplicatePointArea = (token) =>
        token.startsWith("inset(") ||
        token.endsWith("-start") ||
        token.endsWith("-end");

      // Backs each grid demo's own "Slow" checkbox — independent per
      // section, so slowing down one doesn't affect the others while you're
      // testing.
      const useStoredBoolean = (key, defaultValue) => {
        const [value, setValue] = useState(() => {
          const stored = localStorage.getItem(key);
          return stored === null ? defaultValue : stored === "true";
        });
        useEffect(() => {
          localStorage.setItem(key, String(value));
        }, [key, value]);
        return [value, setValue];
      };

      // Backs each grid demo's own "Animation" select.
      const useStoredString = (key, defaultValue) => {
        const [value, setValue] = useState(
          () => localStorage.getItem(key) ?? defaultValue,
        );
        useEffect(() => {
          localStorage.setItem(key, value);
        }, [key, value]);
        return [value, setValue];
      };

      // "none" maps to no `animation` prop at all (Popover's own default —
      // no motion, no fade); every other option passes straight through as
      // the literal `animation` value.
      const ANIMATION_CHOICES = [
        "none",
        "auto",
        "sliding",
        "scaling",
        "expanding",
        "fading",
      ];

      // Backs a section's own "Animation" select and "Slow" checkbox, and
      // computes the animationDuration to pass down — storageKey scopes both
      // to that one section, independent of every other section's own
      // controls. Returns plain values/setters (not a component) so the
      // controls stay one stable component across renders — a component
      // returned fresh on every call gets a new identity each render, and
      // Preact remounts it whenever anything in the parent re-renders,
      // discarding whatever the user was in the middle of clicking.
      const useAnimateControls = (storageKey) => {
        const [animationChoice, setAnimationChoice] = useStoredString(
          `${storageKey}_animation`,
          "none",
        );
        const [slow, setSlow] = useStoredBoolean(`${storageKey}_slow`, true);
        const animation =
          animationChoice === "none" ? undefined : animationChoice;
        const animationDuration = animation && slow ? "0.6s" : undefined;
        return {
          animation,
          animationDuration,
          controlsProps: { animationChoice, setAnimationChoice, slow, setSlow },
        };
      };

      const AnimateControls = ({
        animationChoice,
        setAnimationChoice,
        slow,
        setSlow,
      }) => (
        <div class="demo-animate-controls">
          <label class="demo-animate-toggle">
            Animation:{" "}
            <select
              value={animationChoice}
              onChange={(e) => setAnimationChoice(e.target.value)}
            >
              {ANIMATION_CHOICES.map((choice) => (
                <option key={choice} value={choice}>
                  {choice}
                </option>
              ))}
            </select>
          </label>
          <label class="demo-animate-toggle">
            <input
              type="checkbox"
              checked={slow}
              onChange={(e) => setSlow(e.target.checked)}
            />
            Slow
          </label>
        </div>
      );

      const App = () => (
        <div>
          <h1>Popover demo</h1>

          <p>
            Most sections below have an "Animate" checkbox — the same buttons,
            with <code>animation</code> turned on — the best animation for that
            context gets picked automatically, always with a fade bundled in (no
            independent opt-out). A "Slow" checkbox next to it slows that
            section's animations down so you can actually see them play out.
          </p>

          <TableOfContents />

          <AnchorSection />
          <ContentSizeSection />
          <AnchorAreaSection />
          <AnchorSpacingSection />
          <MarginWithContainerSection />
          <PointerInteractionOutsideSection />
          <CustomizationSection />
          <OpenAtStartSection />
          <AnchorTooBigSection />
          <NestedPopoverSection />
          <OverflowSection />
          <RequiredSection />
          <SlidesSection />
          <ActionsSection />
        </div>
      );

      // ── Overflow ──────────────────────────────────────────────────────────

      const OverflowFiller = ({ count = 12 }) =>
        Array.from({ length: count }, (_, i) => (
          <div key={i} class="demo-overflow-filler">
            {i + 1}
          </div>
        ));

      // The same three shapes as the box demo (8_scrollable_demo.html) and the
      // dialog one: what scrolls, and what stays.
      const OverflowSection = () => (
        <section class="demo-section">
          <Heading id="overflow">Overflow</Heading>
          <div class="demo-row">
            <Button command="--navi-toggle" commandFor="pop_overflow_bare">
              nothing
            </Button>
            <Popover id="pop_overflow_bare" maxHeight="220px">
              <OverflowFiller />
            </Popover>

            <Button command="--navi-toggle" commandFor="pop_overflow_parts">
              header + footer
            </Button>
            <Popover id="pop_overflow_parts" maxHeight="220px">
              <Box header padding="s" className="demo-overflow-part">
                header
              </Box>
              <OverflowFiller />
              <Box footer padding="s" className="demo-overflow-part">
                footer
              </Box>
            </Popover>

            <Button command="--navi-toggle" commandFor="pop_overflow_body">
              … + body
            </Button>
            <Popover id="pop_overflow_body" maxHeight="220px">
              <Box header padding="s" className="demo-overflow-part">
                header
              </Box>
              <Box body padding="m">
                <OverflowFiller />
              </Box>
              <Box footer padding="s" className="demo-overflow-part">
                footer
              </Box>
            </Popover>
          </div>
        </section>
      );

      // ── Required / sub popover ────────────────────────────────────────────

      // Same two cases as the dialog demo: a close that cannot commit does not
      // happen, and two surfaces that move as one.
      const RequiredSection = () => {
        const [committed, setCommitted] = useState({ name: "" });
        return (
          <section class="demo-section">
            <Heading id="required">Required field</Heading>
            <div class="demo-row">
              <Button command="--navi-toggle" commandFor="pop_required">
                Open
              </Button>
              <span>
                committed: <code>{JSON.stringify(committed)}</code>
              </span>
            </div>
            <Popover
              id="pop_required"
              value={committed}
              pointerInteractionOutsideEffect="cancel"
              action={(value) => {
                setCommitted(value);
              }}
            >
              <Box body padding="m" flex="y" spacing="m">
                <Field vertical>
                  <Label requiredIndicator>Name</Label>
                  <Input name="name" required />
                </Field>
                <Button command="--navi-close">Submit</Button>
              </Box>
            </Popover>
          </section>
        );
      };

      // ── Slides ───────────────────────────────────────────────────────

      // The slides INSIDE the popover: two popovers could never share a box
      // (each is promoted to the top layer), but two contents can — and the
      // popover keeps sizing itself to whichever page is showing.
      const SlidesSection = () => {
        return (
          <section class="demo-section">
            <Heading id="slides">Slides</Heading>
            <div class="demo-row">
              <Button command="--navi-toggle" commandFor="pop_pages">
                Open
              </Button>
            </div>
            <Popover id="pop_pages" minWidth="260px">
              {/* No page state here: the buttons say "next"/"previous" and
                  the slides keeps its own place */}
              <Slides duration="500ms">
                {/* The page scrolls its BODY, not itself: header stays, the
                    content under it moves — see box.jsx's header/body/footer */}
                <Slides.Item id="first" overflow="auto">
                  <Box header padding="m" className="demo-overflow-part">
                    <Text expandX>first</Text>
                    <Slides.Next size="xl" padding="xs" />
                  </Box>
                  <Box body padding="m">
                    <OverflowFiller count={3} />
                  </Box>
                </Slides.Item>
                <Slides.Item id="second" overflow="auto">
                  <Box header padding="m" className="demo-overflow-part">
                    <Text expandX>second</Text>
                    <Slides.Previous size="xl" padding="xs" />
                  </Box>
                  <Box body padding="m">
                    <OverflowFiller count={6} />
                  </Box>
                </Slides.Item>
              </Slides>
            </Popover>
          </section>
        );
      };

      // ── uiAction / action ─────────────────────────────────────────────────

      const ActionsSection = () => {
        const [entries, push, clear] = useCallLog();
        const [committed, setCommitted] = useState({ note: "" });
        const [confirmed, setConfirmed] = useState({ note: "" });

        return (
          <section class="demo-section">
            <Heading id="actions">uiAction / action</Heading>
            <p>
              A popover aggregates the named controls it contains, so it is
              handed <code>{"{ note }"}</code>, not a bare string.{" "}
              <code>uiAction</code> fires while typing — it is the live state.{" "}
              <code>action</code> fires when the popover <em>closes</em>, and
              only if something actually changed. Cancelling commits nothing and
              puts back what the popover opened on.
            </p>

            <Heading level={3} id="actions-default">
              Default
            </Heading>
            <p>
              A popover ignores outside clicks by default (
              <code>pointerInteractionOutsideEffect="none"</code>, unlike
              Dialog), so the two ways out are <kbd>Escape</kbd>, which cancels,
              and a button that closes it, which commits.
            </p>
            <div class="demo-row">
              <Button command="--navi-toggle" commandFor="pop_actions">
                Open
              </Button>
              <span>
                committed: <code>{JSON.stringify(committed)}</code>
              </span>
            </div>
            <Popover
              id="pop_actions"
              value={committed}
              uiAction={(value) => {
                push("uiAction", value);
              }}
              action={(value) => {
                push("action", value);
                setCommitted(value);
              }}
            >
              <Box flex="y" spacing="m" padding="m">
                <Field vertical>
                  <Label>Note</Label>
                  <Input name="note" placeholder="type something…" />
                </Field>
                <Button command="--navi-close">Close (commits)</Button>
              </Box>
            </Popover>
            <CallLog entries={entries} onClear={clear} />

            <Heading level={3} id="actions-close-outside">
              pointerInteractionOutsideEffect="close"
            </Heading>
            <p>
              Clicking outside now closes the popover, and closing commits — the
              way Dialog behaves out of the box.
            </p>
            <div class="demo-row">
              <Button command="--navi-toggle" commandFor="pop_actions_close">
                Open
              </Button>
              <span>
                committed: <code>{JSON.stringify(confirmed)}</code>
              </span>
            </div>
            <Popover
              id="pop_actions_close"
              value={confirmed}
              pointerInteractionOutsideEffect="close"
              action={(value) => {
                setConfirmed(value);
              }}
            >
              <Box flex="y" spacing="m" padding="m">
                <Field vertical>
                  <Label>Note</Label>
                  <Input name="note" placeholder="type something…" />
                </Field>
              </Box>
            </Popover>
          </section>
        );
      };

      // Section (h2) / subsection (h3) heading with a hover anchor link. `<Link
      // anchor>` owns the id (derived from its href); the "#" child renders as
      // the visible affordance (shown on hover via revealOnInteraction).
      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const TableOfContents = () => (
        <div className="demo-section">
          <Heading id="popover">Popover</Heading>
          <p>
            A surface opened next to an anchor. Like Dialog it is a control
            group — it aggregates the named controls it contains, it is a form
            boundary, and closing commits while cancelling reverts, see{" "}
            <Link href="#actions">uiAction / action</Link>.
          </p>
          <ol className="toc">
            <li>
              <Link href="#anchor">Controlled by button</Link>
            </li>
            <li>
              <Link href="#content-size">Content dimensions</Link>
              <ul>
                <li>
                  <Link href="#content-size-expanding">
                    Expanding/collapsing content while open
                  </Link>
                </li>
              </ul>
            </li>
            <li>
              <Link href="#anchor-area">Position</Link>
              <ul>
                <li>
                  <Link href="#anchor-area-with-anchor">With anchor</Link>
                </li>
                <li>
                  <Link href="#anchor-area-without-anchor">Without anchor</Link>
                </li>
                <li>
                  <Link href="#anchor-area-local-layer">local layer</Link>
                </li>
              </ul>
            </li>
            <li>
              <Link href="#anchor-spacing">marginWithAnchor</Link>
            </li>
            <li>
              <Link href="#layer-spacing">marginWithContainer</Link>
            </li>
            <li>
              <Link href="#pointer-interaction-outside">
                pointerInteractionOutsideEffect
              </Link>
            </li>
            <li>
              <Link href="#customization">Customization</Link>
            </li>
            <li>
              <Link href="#open-from-start">Open from the start</Link>
            </li>
            <li>
              <Link href="#anchor-too-big">
                Anchor too big (isAnchorTooBig)
              </Link>
            </li>
            <li>
              <Link href="#nested-popovers">Nested popovers</Link>
            </li>
            <li>
              <Link href="#overflow">Overflow</Link>
            </li>
            <li>
              <Link href="#required">Required field</Link>
            </li>
            <li>
              <Link href="#slides">Slides</Link>
            </li>
            <li>
              <Link href="#actions">uiAction / action</Link>
              <ul>
                <li>

                positionAreaWhenAnchorIsInvalid="bottom"
                layer="local"
                commandProxyFor={anchorId}
              />
              <AnchorTooBigPopover
                label="left → still fine"
                positionArea="left"
                layer="local"
                commandProxyFor={anchorId}
              />
              <AnchorTooBigPopover
                label="right → still fine"
                positionArea="right"
                layer="local"
                commandProxyFor={anchorId}
              />
            </Box>
          </div>
        );
      };

      const AnchorTooBigSection = () => (
        <section id="anchor-too-big" class="demo-section">
          <h2>9. Anchor too big (isAnchorTooBig)</h2>
          <p>
            A real anchor is only usable on the axis <code>positionArea</code>
            actually places the popover *outside* of it (a bare "left"/
            "right"/"top"/"bottom", never "center"/"inset(...)") — an anchor
            consuming almost all the room on that axis (viewport, or a custom{" "}
            <code>container</code>) leaves nothing to work with there, so the
            popover docks via <code>positionAreaWhenAnchorIsInvalid</code>
            instead (default <code>"center"</code>, itself configurable).
          </p>
          <div class="demo-subsection">
            <h3>9.1 Anchor too wide for the viewport</h3>
            <AnchorTooWideDemo />
          </div>
          <div class="demo-subsection">
            <h3>9.2 Anchor too tall for its container</h3>
            <AnchorTooTallInContainerDemo />
          </div>
        </section>
      );

      // Both popovers anchor via a plain id string, resolved via
      // document.getElementById once each one opens — the parent to a small
      // anchor rendered right here in the section, the child to an equally
      // small one rendered by the parent's own (already open) content. A
      // string is what makes this work with defaultOpen at all: there's no
      // triggering event/ref yet at that point to read a real anchor element
      // from, only an id known up front. Rendered open immediately (no
      // Render button/click needed) so the anchoring is visible right away.
      const NestedPopoverDemo = () => {
        const sectionAnchorId = useId();
        const parentId = useId();
        const anchorTargetId = useId();
        const childId = useId();
        return (
          <>
            <Button
              command="--navi-toggle"
              commandFor={parentId}
              id={sectionAnchorId}
              class="demo-static-anchor-small"
            >
              anchor
            </Button>
            <Popover
              id={parentId}
              // defaultOpen
              anchor={sectionAnchorId}
              pointerInteractionOutsideEffect="close"
              positionArea="bottom"
              borderRadius="8px"
              padding="m"
            >
              <p style={{ marginTop: 0, fontWeight: "bold" }}>Parent popover</p>
              <p>
                Clicking outside this one closes it
                (pointerInteractionOutsideEffect="close").
              </p>
              <Button
                command="--navi-toggle"
                commandFor={childId}
                id={anchorTargetId}
                class="demo-static-anchor-small"
              >
                anchor
              </Button>
              <Popover
                id={childId}
                defaultOpen
                anchor={anchorTargetId}
                positionArea="right"
                borderRadius="8px"
                padding="m"
              >
                <p style={{ marginTop: 0 }}>Child popover</p>
                <p>anchor="{anchorTargetId}", no click-outside-to-close.</p>
                <Button command="--navi-close">Close</Button>
              </Popover>
              <Button command="--navi-close">Close parent</Button>
            </Popover>
          </>
        );
      };

      const NestedPopoverSection = () => (
        <section id="nested-popovers" class="demo-section">
          <h2>10. Nested popovers</h2>
          <p>
            Both popovers below open immediately, each anchored to a small
            element via a plain id string — normally impossible with{" "}
            <code>defaultOpen</code> (there's no triggering event/ref yet to
            read a real anchor element from at that point). The string is
            resolved via <code>document.getElementById</code> once the popover
            actually opens, by which time the anchor already exists — even the
            child's own anchor, rendered by the parent's content.
          </p>
          <div class="demo-row">
            <NestedPopoverDemo />
          </div>
        </section>
      );

      render(
        <NaviDebug debugAll>
          <App />
        </NaviDebug>,
        document.querySelector("#root"),
      );
    </script>
  </body>
</html>
