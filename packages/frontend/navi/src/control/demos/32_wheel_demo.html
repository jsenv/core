<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheel Demo</title>
    <style>
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 2rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        position: relative;
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
        scroll-margin-top: 12px;
      }
      /* Subsections read as headings (not tiny labels): larger, darker, spaced.
         A rule and generous top margin so a new subsection cannot be mistaken
         for another example inside the previous one. */
      .demo-section h3 {
        position: relative;
        margin: 44px 0 12px;
        padding-top: 14px;
        color: #1a1a1a;
        font-weight: 700;
        font-size: 1.08rem;
        border-top: 1px solid #e6e6e6;
        scroll-margin-top: 12px;
      }
      /* A heading captioning one example inside a row of examples is not a
         subsection: no rule, no extra space. */
      .demo-section .states h3 {
        margin: 0;
        padding-top: 0;
        border-top: none;
      }
      /* Variations WITHIN a subsection: no rule, smaller, so the nesting is
         visible at a glance. */
      .demo-section h4 {
        margin: 24px 0 10px;
        color: #444;
        font-weight: 600;
        font-size: 0.92rem;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .states {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
      }
      .states > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .value-display {
        min-height: 24px;
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-family: monospace;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      kbd {
        padding: 1px 5px;
        font-size: 0.8em;
        font-family: monospace;
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      .col-label {
        color: #888;
        font-size: 0.8rem;
      }
      /* Debug: reveal each glyph's text bounding box so vertical alignment
         between the wheel numbers and the separators is obvious. Toggled by the
         "Show text boxes" checkbox (adds .show-text-boxes on the section). The
         span is inline, so its background hugs the text line box, not the row. */
      .show-text-boxes .navi_wheel_item .dbg-text {
        background: rgba(232, 89, 12, 0.35); /* numbers */
      }
      .show-text-boxes .navi_wheel_group_separator .dbg-text {
        background: rgba(34, 139, 230, 0.4); /* separators */
      }
      .box-toggle {
        display: inline-flex;
        margin-bottom: 16px;
        align-items: center;
        gap: 6px;
        color: #555;
        font-size: 0.85rem;
      }
      .disclaimer {
        margin: 0 0 4px;
        padding: 12px 14px;
        color: #7a4a00;
        font-size: 0.85rem;
        line-height: 1.5;
        background: #fff4e0;
        border: 1px solid #f0c46a;
        border-left: 4px solid #e8940c;
        border-radius: 4px;
      }
      .toc {
        line-height: 1.9;
      }
      .toc ul {
        margin: 0;
        padding-left: 20px;
        list-style: circle;
      }
      .toc ul a {
        color: #555;
        font-size: 0.9rem;
      }
      /* A plain HTML/CSS scroll-snap list, sized + faded like the Wheel, to
         compare the browser's native snapping/momentum against our
         transform-based one. Same progressive fade mask, so only the scroll
         behaviour differs visually. */
      .native-wheel {
        width: 3.5ch;
        height: 96px; /* 3 rows × 32px, matching the Wheel defaults */
        color: #111;
        font-weight: 600;
        font-size: 13.33px;
        text-align: center;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.4) 34%,
          #000 45%,
          #000 55%,
          rgba(0, 0, 0, 0.4) 66%,
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.4) 34%,
          #000 45%,
          #000 55%,
          rgba(0, 0, 0, 0.4) 66%,
          transparent 100%
        );
        overflow-y: auto;
        scroll-behavior: smooth;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
      }
      .native-wheel::-webkit-scrollbar {
        display: none;
      }
      .native-wheel-item {
        display: flex;
        height: 32px;
        align-items: center;
        justify-content: center;
        font-variant-numeric: tabular-nums;
        scroll-snap-align: center;
      }
      .native-wheel-pad {
        height: 32px; /* (3 − 1) / 2 rows, so first/last can reach the center */
      }
      .scroll-buttons {
        display: flex;
        margin-top: 20px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .scroll-buttons button {
        padding: 6px 12px;
        font-size: 0.85rem;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
      }
      .scroll-buttons button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <h1>Wheel Demo</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { Fragment, render } from "preact";
      import { signal } from "@preact/signals";
      import { useEffect, useRef, useState } from "preact/hooks";
      import {
        NaviDebug,
        Time,
        Wheel,
        WheelGroup,
        Picker,
        usePopupMode,
        Form,
        Button,
        Box,
        Link,
        Unit,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";

      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const pad2 = (n) => String(n).padStart(2, "0");

      // Section (h2) / subsection (h3) heading with a hover anchor link. `<Link
      // anchor>` owns the id (derived from its href); the "#" child renders as
      // the visible affordance (shown on hover via revealOnInteraction).
      const Heading = ({ level = 3, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };
      // Local YYYY-MM-DD (NOT toISOString, which is UTC and can shift the day).
      const toLocalISODate = (date) =>
        `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;

      // ── Table of contents ──────────────────────────────────────────────────

      const TableOfContents = () => {
        return (
          <div className="demo-section">
            <Heading level={2} id="wheel">
              Wheel
            </Heading>
            <p>
              A scroll picker: pick a value by scrolling, dragging, clicking a
              neighbour, or with <kbd>↑</kbd> <kbd>↓</kbd> (<kbd>←</kbd>{" "}
              <kbd>→</kbd> when horizontal). The centered value is the
              selection.
            </p>
            <div className="disclaimer">
              ⚠️{" "}
              <strong>Don't place a Wheel on a normally-scrolling page.</strong>{" "}
              It captures wheel/drag scrolling with no visible scrollbar, so a
              user can scroll it by accident and be unable to tell why the page
              stopped scrolling — confusing at best, and they may change the
              value without realising. Use it inside a <strong>Dialog</strong>{" "}
              (or another deliberately-opened surface) where trapping the scroll
              is expected.
            </div>
            <ol className="toc" style={{ margin: 0, paddingLeft: "20px" }}>
              <li>
                <Link href="#nominal">Cas nominal</Link>
              </li>
              <li>
                <Link href="#states">States</Link>
                <ul>
                  <li>
                    <Link href="#states-between">Between two rows</Link>
                  </li>
                </ul>
              </li>
              <li>
                <Link href="#scroll">Scroll behavior</Link>
                <ul>
                  <li>
                    <Link href="#scroll-small">Small list (4 values)</Link>
                  </li>
                  <li>
                    <Link href="#scroll-long">Long list (100 values)</Link>
                  </li>
                </ul>
              </li>
              <li>
                <Link href="#separator">Separator alignment</Link>
              </li>
              <li>
                <Link href="#actions">uiAction / action / form</Link>
              </li>
              <li>
                <Link href="#practical">Practical examples</Link>
                <ul>
                  <li>
                    <Link href="#practical-day">Day picker</Link>
                  </li>
                  <li>
                    <Link href="#practical-size">Size picker</Link>
                  </li>
                  <li>
                    <Link href="#practical-duration">Duration wheels</Link>
                  </li>
                  <li>
                    <Link href="#practical-duration-picker">
                      Duration picker
                    </Link>
                  </li>
                  <li>
                    <Link href="#practical-time">Time wheels</Link>
                  </li>
                  <li>
                    <Link href="#practical-time-picker">Time picker</Link>
                  </li>
                </ul>
              </li>
              <li>
                <Link href="#customization">Customization</Link>
                <ul>
                  <li>
                    <Link href="#cust-visiblecount">visibleCount</Link>
                  </li>
                  <li>
                    <Link href="#cust-horizontal">horizontal</Link>
                  </li>
                  <li>
                    <Link href="#cust-padding">Item padding</Link>
                  </li>
                  <li>
                    <Link href="#cust-glass">glass</Link>
                  </li>
                  <li>
                    <Link href="#cust-zoom">zoom</Link>
                  </li>
                  <li>
                    <Link href="#cust-frame">frameBorder</Link>
                  </li>
                  <li>
                    <Link href="#cust-colors">Colors</Link>
                  </li>
                </ul>
              </li>
            </ol>
          </div>
        );
      };

      // ── Cas nominal ────────────────────────────────────────────────────────

      const MINUTES = range(60);
      const NominalDemo = () => {
        const [time, setTime] = useState({ hours: 9, minutes: 30 });
        return (
          <div className="demo-section">
            <Heading level={2} id="nominal">
              Cas nominal
            </Heading>
            <Box flex alignX="center" expandX>
              <WheelGroup borderWidth="0" value={time} action={setTime}>
                <Wheel name="hours" type="integer" size="xxl">
                  {range(24).map((h) => (
                    <Wheel.Item key={h} value={h} paddingX="s">
                      {pad2(h)}
                    </Wheel.Item>
                  ))}
                </Wheel>
                <WheelGroup.Separator size="xxl">
                  <Wheel.Colon />
                </WheelGroup.Separator>
                <Wheel name="minutes" type="integer" size="xxl">
                  {MINUTES.map((m) => (
                    <Wheel.Item key={m} value={m} paddingX="s">
                      {pad2(m)}
                    </Wheel.Item>
                  ))}
                </Wheel>
              </WheelGroup>
            </Box>
          </div>
        );
      };

      // ── States ─────────────────────────────────────────────────────────────

      const HOURS = range(24);
      const StateWheel = (props) => (
        <Wheel type="integer" defaultValue={9} {...props}>
          {HOURS.map((h) => (
            <Wheel.Item key={h} value={h}>
              {pad2(h)}
            </Wheel.Item>
          ))}
        </Wheel>
      );

      // A wheel parked `offset` rows away from a row center (0.5 = exactly
      // between two rows) and left there. Dispatched a frame after mount, once
      // the wheel has centered its initial value.
      const ParkedWheel = ({ offset, ...rest }) => {
        const wheelRef = useRef(null);
        useEffect(() => {
          const rafId = requestAnimationFrame(() => {
            wheelRef.current.dispatchEvent(
              new CustomEvent("navi_scroll", {
                detail: { items: offset, settle: false },
              }),
            );
          });
          return () => cancelAnimationFrame(rafId);
        }, [offset]);
        return <StateWheel ref={wheelRef} {...rest} />;
      };

      // The same wheel parked at four positions across one row.
      const SCROLL_OFFSETS = [0, 0.25, 0.5, 0.75];
      const ScrolledRow = (props) => (
        <div className="states">
          {SCROLL_OFFSETS.map((offset) => (
            <div key={offset}>
              <ParkedWheel offset={offset} {...props} />
              <span className="col-label">+{offset} row</span>
            </div>
          ))}
        </div>
      );

      const StatesDemo = () => {
        return (
          <div className="demo-section">
            <Heading level={2} id="states">
              States
            </Heading>
            <p>The same wheel in its different states.</p>
            <div className="states">
              <div>
                <Heading id="states-default">default</Heading>
                <StateWheel />
              </div>
              <div>
                <Heading id="states-focus">focus-visible</Heading>
                <StateWheel basePseudoState={{ ":focus-visible": true }} />
              </div>
              <div>
                <Heading id="states-loading">loading</Heading>
                <StateWheel loading />
              </div>
              <div>
                <Heading id="states-readonly">readonly</Heading>
                <StateWheel readOnly />
              </div>
              <div>
                <Heading id="states-disabled">disabled</Heading>
                <StateWheel disabled />
              </div>
            </div>

            <Heading id="states-between">Between two rows</Heading>
            <p>Held mid-scroll.</p>
            <ScrolledRow />
          </div>
        );
      };

      // ── Scroll behavior (snapping, momentum, loop) ─────────────────────────

      // Side-by-side harness: our transform-based Wheel vs a plain HTML/CSS
      // scroll-snap list, driven by the same buttons, so the snapping/momentum
      // feel can be compared against the browser's own scroller.
      const ITEM_PX = 32; // matches the Wheel + native row height
      const ScrollPair = ({ values, repeatNative, glideSpeed }) => {
        const startIndex = Math.floor(values.length / 2);
        const [v, setV] = useState(values[startIndex]);
        const wheelRef = useRef(null);
        const nativeRef = useRef(null);
        // The Wheel loops; the native list can't. For a short list, repeat the
        // values so the native side has a comparable scroll extent to fling.
        const copies = repeatNative ? 3 : 1;
        const nativeValues = range(values.length * copies).map(
          (i) => values[i % values.length],
        );
        const nativeStart = (repeatNative ? values.length : 0) + startIndex;
        useEffect(() => {
          if (nativeRef.current) {
            nativeRef.current.scrollTop = nativeStart * ITEM_PX;
          }
        }, []);
        // Drive both the same way: a custom navi_scroll event for the Wheel (no
        // real scroll), scrollBy for the native list.
        const drive = (detail) => {
          wheelRef.current?.dispatchEvent(
            new CustomEvent("navi_scroll", { detail }),
          );
          const top = (detail.delta || 0) + (detail.items || 0) * ITEM_PX;
          nativeRef.current?.scrollBy({ top, behavior: detail.behavior });
        };
        return (
          <div>
            <div className="row" style={{ gap: 48, alignItems: "flex-start" }}>
              <div>
                <Wheel
                  ref={wheelRef}
                  type="integer"
                  value={v}
                  action={setV}
                  glideSpeed={glideSpeed}
                >
                  {values.map((value) => (
                    <Wheel.Item key={value} value={value}>
                      {pad2(value)}
                    </Wheel.Item>
                  ))}
                </Wheel>
                <div className="value-display">value: {pad2(v)}</div>
                <span className="col-label">Wheel (ours, looping)</span>
              </div>
              <div>
                <div className="native-wheel" ref={nativeRef}>
                  <div className="native-wheel-pad" />
                  {nativeValues.map((value, i) => (
                    <div className="native-wheel-item" key={i}>
                      {pad2(value)}
                    </div>
                  ))}
                  <div className="native-wheel-pad" />
                </div>
                <span className="col-label">
                  native scroll-snap{repeatNative ? " (×3)" : ""}
                </span>
              </div>
            </div>
            <div className="scroll-buttons">
              <button onClick={() => drive({ items: -1, behavior: "smooth" })}>
                ▲ item
              </button>
              <button onClick={() => drive({ items: 1, behavior: "smooth" })}>
                ▼ item
              </button>
              <button onClick={() => drive({ delta: -12, behavior: "smooth" })}>
                ▲ 12px
              </button>
              <button onClick={() => drive({ delta: 12, behavior: "smooth" })}>
                ▼ 12px
              </button>
            </div>
          </div>
        );
      };

      // Glide speed presets (px/ms) for the Wheel. "slow" makes a single row take
      // ~0.8s so it's easy to see the transition — and to feel how rapid arrow /
      // click input behaves when it outpaces one transition.
      const GLIDE_SPEEDS = { slow: 0.04, normal: 0.16, fast: 0.5 };
      const ScrollBehaviorDemo = () => {
        const [speedName, setSpeedName] = useState("normal");
        const glideSpeed = GLIDE_SPEEDS[speedName];
        return (
          <NaviDebug>
            <div className="demo-section">
              <Heading level={2} id="scroll">
                Scroll behavior — snapping, momentum, loop
              </Heading>
              <p>
                Scroll, drag or fling either column, or use the buttons (which
                drive <em>both</em>). Left is our transform-based Wheel
                (looping); right is a plain HTML/CSS <code>scroll-snap</code>{" "}
                list — compare how each animates the snap. The <kbd>px</kbd>{" "}
                buttons nudge by less than a row to show the snap-back.
              </p>
              <div
                className="scroll-buttons"
                style={{ marginTop: 0, marginBottom: 8 }}
              >
                <span
                  style={{
                    alignSelf: "center",
                    color: "#555",
                    fontSize: "0.85rem",
                  }}
                >
                  Wheel glide speed:
                </span>
                {["slow", "normal", "fast"].map((name) => (
                  <button
                    key={name}
                    onClick={() => setSpeedName(name)}
                    style={
                      speedName === name
                        ? {
                            background: "#4a90d9",
                            color: "#fff",
                            borderColor: "#4a90d9",
                          }
                        : undefined
                    }
                  >
                    {name}
                  </button>
                ))}
              </div>
              <p style={{ marginTop: 0 }}>
                Try <strong>slow</strong>, then tap <kbd>▼ item</kbd> (or hold{" "}
                <kbd>↓</kbd> on a focused wheel) faster than the glide finishes:
                the glide speeds up to stay tied to your input rate instead of
                stretching into one long, detached slide.
              </p>

              <Heading id="scroll-small">Small list (4 values)</Heading>
              <p>Few values — easiest to eyeball the wrap and each snap.</p>
              <ScrollPair
                values={[0, 15, 30, 45]}
                repeatNative
                glideSpeed={glideSpeed}
              />

              <Heading id="scroll-long">Long list (100 values)</Heading>
              <p>
                Many values — stress-tests momentum and the loop runway against
                a tall native scroller.
              </p>
              <ScrollPair values={range(100)} glideSpeed={glideSpeed} />
            </div>
          </NaviDebug>
        );
      };

      // ── Practical examples ─────────────────────────────────────────────────

      // Duration and time are two different things, and the wheels say so
      // without a word: a duration is counted in units, so its columns are
      // separated by "h" / "min"; a time is a point on a clock, so its columns
      // are separated by ":" and the selected value is zoomed. Follow this
      // pairing everywhere and one look tells the two apart.
      const DURATION_HOURS = [1, 2, 3, 4, 5];
      const DURATION_MINUTES = [0, 15, 30, 45];
      const durationHoursSignal = signal(DURATION_HOURS[0]);
      const durationMinutesSignal = signal(DURATION_MINUTES[0]);

      const DurationWheels = ({ size, borderless }) => (
        <WheelGroup borderWidth={borderless ? "0" : undefined}>
          <Wheel
            name="hours"
            type="integer"
            signal={durationHoursSignal}
            size={size}
          >
            {DURATION_HOURS.map((h) => (
              <Wheel.Item key={h} value={h} paddingX="s">
                {h}
              </Wheel.Item>
            ))}
          </Wheel>
          <WheelGroup.Separator size={size}>
            <Unit unit="hour" format="short" color="#6b7280" />
          </WheelGroup.Separator>
          <Wheel
            name="minutes"
            type="integer"
            signal={durationMinutesSignal}
            size={size}
          >
            {DURATION_MINUTES.map((m) => (
              <Wheel.Item key={m} value={m} paddingX="s">
                {pad2(m)}
              </Wheel.Item>
            ))}
          </Wheel>
          {/* The unit on the right too: without it the minutes column is only
              identifiable by deduction ("3 h 15" vs "3 h 15 min"). */}
          <WheelGroup.Separator size={size}>
            <Unit unit="minute" format="short" color="#6b7280" />
          </WheelGroup.Separator>
        </WheelGroup>
      );

      const TIME_HOURS = range(24);
      const TIME_MINUTES = range(60);
      const timeHoursSignal = signal(9);
      const timeMinutesSignal = signal(30);

      const TimeWheels = ({ size, borderless }) => (
        <WheelGroup zoom borderWidth={borderless ? "0" : undefined}>
          <Wheel
            name="hours"
            type="integer"
            signal={timeHoursSignal}
            size={size}
          >
            {TIME_HOURS.map((h) => (
              <Wheel.Item key={h} value={h} paddingX="s">
                {pad2(h)}
              </Wheel.Item>
            ))}
          </Wheel>
          <WheelGroup.Separator size={size}>
            <Wheel.Colon />
          </WheelGroup.Separator>
          <Wheel
            name="minutes"
            type="integer"
            signal={timeMinutesSignal}
            size={size}
          >
            {TIME_MINUTES.map((m) => (
              <Wheel.Item key={m} value={m} paddingX="s">
                {pad2(m)}
              </Wheel.Item>
            ))}
          </Wheel>
        </WheelGroup>
      );

      // What the closed picker shows: the value it holds, rendered as a time
      // rather than as the raw object the wheels aggregate.
      const DurationWheelUI = () => (
        <Time type="time">
          {`${pad2(durationHoursSignal.value)}:${pad2(durationMinutesSignal.value)}`}
        </Time>
      );
      const TimeWheelUI = () => (
        <Time type="time">
          {`${pad2(timeHoursSignal.value)}:${pad2(timeMinutesSignal.value)}`}
        </Time>
      );

      // Popover and dialog are two different UIs (usePopupMode() is only
      // available to a Picker's children). Popover: compact, spin live and click
      // outside to commit. Dialog: a deliberate modal surface — bigger wheels,
      // more padding, and explicit Annuler / Définir actions.
      const PickerContent = ({ wheels }) => {
        // capitalized: JSX reads a lowercase name as an html tag
        const Wheels = wheels;
        const mode = usePopupMode();

        if (mode === "dialog") {
          return (
            <Box flex="y" spacing="l" padding="xl" alignX="center">
              <Wheels size="xxl" borderless />
              <Box flex="x" spacing="s" alignX="end" expandX>
                <Button command="--navi-cancel" variant="discrete">
                  Annuler
                </Button>
                <Button command="--navi-define" variant="discrete">
                  Définir
                </Button>
              </Box>
            </Box>
          );
        }

        return (
          <Box padding="s">
            <Wheels borderless />
          </Box>
        );
      };

                    ))}
                  </Wheel>
                  <span className="col-label">frameBorder</span>
                </div>
                <div>
                  <Wheel
                    type="integer"
                    value={gf}
                    action={setGf}
                    glass
                    frameBorder
                  >
                    {range(24).map((h) => (
                      <Wheel.Item key={h} value={h}>
                        {pad2(h)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <span className="col-label">glass + frameBorder</span>
                </div>
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <Heading id="cust-group-glass">
                on a WheelGroup (one prop for all wheels)
              </Heading>
              <p>
                Set <code>glass</code> (or <code>frameBorder</code>) once on a{" "}
                <code>WheelGroup</code> and every wheel inside inherits it.
              </p>
              <div className="states">
                <div>
                  <WheelGroup glass spacing="0.5ch">
                    <Wheel
                      name="hours"
                      type="integer"
                      value={gh}
                      action={setGh}
                    >
                      {range(24).map((h) => (
                        <Wheel.Item key={h} value={h}>
                          {pad2(h)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                    <WheelGroup.Separator>
                      <Wheel.Colon />
                    </WheelGroup.Separator>
                    <Wheel
                      name="minutes"
                      type="integer"
                      value={gm}
                      action={setGm}
                    >
                      {[0, 15, 30, 45].map((m) => (
                        <Wheel.Item key={m} value={m}>
                          {pad2(m)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                  </WheelGroup>
                  <span className="col-label">glass on WheelGroup</span>
                </div>
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <Heading id="cust-colors">Colors</Heading>
              <p>
                <code>--wheel-color</code> is the wheel's colour; the neighbours
                are a washed-out version of it, or{" "}
                <code>--wheel-neighbor-color</code> of their own.
              </p>
              <div className="states">
                <div>
                  <ColorWheel />
                  <span className="col-label">default</span>
                </div>
                <div>
                  <ColorWheel style={{ "--wheel-color": "#d6336c" }} />
                  <span className="col-label">--wheel-color: #d6336c</span>
                </div>
                <div>
                  <ColorWheel
                    style={{
                      "--wheel-color": "#1971c2",
                      "--wheel-neighbor-color": "#ffa94d",
                    }}
                  />
                  <span className="col-label">+ --wheel-neighbor-color</span>
                </div>
              </div>
              <h4>On a dark surface</h4>
              <div
                className="states"
                style={{
                  padding: 20,
                  background: "#15181c",
                  borderRadius: 8,
                  colorScheme: "dark",
                }}
              >
                <div>
                  <ColorWheel
                    style={{
                      "--wheel-color": "#f1f3f5",
                      "--navi-control-border-color": "#495057",
                    }}
                  />
                  <span className="col-label" style={{ color: "#adb5bd" }}>
                    light on dark
                  </span>
                </div>
                <div>
                  <ColorWheel
                    zoom
                    style={{
                      "--wheel-color": "#63e6be",
                      "--navi-control-border-color": "#2f6355",
                    }}
                  />
                  <span className="col-label" style={{ color: "#adb5bd" }}>
                    accent, zoom
                  </span>
                </div>
                <div>
                  <ColorWheel
                    glass
                    zoom
                    style={{
                      "--wheel-color": "#63e6be",
                      "--wheel-neighbor-color": "#37796a",
                      "--navi-control-border-color": "#2f6355",
                    }}
                  />
                  <span className="col-label" style={{ color: "#adb5bd" }}>
                    accent, glass + zoom
                  </span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const ColorWheel = (props) => (
        <Wheel type="integer" defaultValue={9} {...props}>
          {range(24).map((h) => (
            <Wheel.Item key={h} value={h} paddingX="s">
              {pad2(h)}
            </Wheel.Item>
          ))}
        </Wheel>
      );

      const App = () => (
        <NaviDebug>
          <TableOfContents />
          <NominalDemo />
          <StatesDemo />
          <ScrollBehaviorDemo />
          <SeparatorAlignmentDemo />
          <ActionsDemo />
          <PracticalExamplesDemo />
          <CustomizationDemo />
        </NaviDebug>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
