<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheel Demo</title>
    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 2rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .value-display {
        min-height: 24px;
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-family: monospace;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      kbd {
        padding: 1px 5px;
        font-size: 0.8em;
        font-family: monospace;
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Wheel Demo</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { NaviDebug, Text, Time, Wheel, WheelGroup } from "@jsenv/navi";

      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const pad2 = (n) => String(n).padStart(2, "0");

      // ── Table of contents ──────────────────────────────────────────────────

      const TableOfContents = () => {
        return (
          <div className="demo-section">
            <h2>Wheel — a selectable list as a scroll picker</h2>
            <p>
              A <code>Wheel</code> is the exact same selectable list as{" "}
              <code>List</code> (same <code>value</code>/<code>action</code>,
              keyboard, form wiring) rendered as an iOS-style spinner: the
              selected value sits in the middle, neighbours fade above/below.
            </p>
            <ul style={{ margin: 0, paddingLeft: "20px", lineHeight: "2" }}>
              <li>
                <strong>Change the value</strong> by scrolling / dragging,
                clicking a neighbour, or with <kbd>↑</kbd> <kbd>↓</kbd>.
                Whatever lands in the center is selected.
              </li>
              <li>
                <code>loop</code> makes it endless — past the last value the
                first reappears (inert clone rows fill the edges).
              </li>
              <li>
                Several columns + separators go in a <code>WheelGroup</code>;
                each wheel eats half of an adjacent separator so scrolling over
                the <code>:</code> scrolls the wheel, not the page.
              </li>
            </ul>
            <ol
              style={{
                margin: "12px 0 0",
                paddingLeft: "20px",
                lineHeight: "2",
              }}
            >
              <li>
                <a href="#hours">Single column, looping</a>
              </li>
              <li>
                <a href="#time">Time HH:MM:SS (WheelGroup, looping)</a>
              </li>
              <li>
                <a href="#hm">Hours + quarter minutes (looping)</a>
              </li>
              <li>
                <a href="#sizes">Sizes — loop disabled</a>
              </li>
              <li>
                <a href="#day">Day picker — today … +5 days (no loop)</a>
              </li>
            </ol>
          </div>
        );
      };

      // ── Single column, looping ─────────────────────────────────────────────

      const HoursDemo = () => {
        const [hour, setHour] = useState(4);
        return (
          <div id="hours" className="demo-section">
            <h2>Single column (hours), looping</h2>
            <p>Past 23 comes 00 again, and scrolling up past 00 shows 23.</p>
            <div className="row">
              <Wheel value={hour} action={setHour} loop>
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {pad2(hour)}</div>
            </div>
          </div>
        );
      };

      // ── Time HH:MM:SS ──────────────────────────────────────────────────────

      const TimeDemo = () => {
        const [h, setH] = useState(0);
        const [m, setM] = useState(4);
        const [s, setS] = useState(0);
        return (
          <div id="time" className="demo-section">
            <h2>WheelGroup — time HH:MM:SS (looping)</h2>
            <p>
              Scroll/drag over a <code>:</code> and it scrolls the neighbouring
              wheel (the separator is eaten by half on each side), not the page.
            </p>
            <WheelGroup style={{ fontVariantNumeric: "tabular-nums" }}>
              <Wheel value={h} action={setH} loop>
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>
                <Text lineHeight="var(--wheel-item-height)">:</Text>
              </WheelGroup.Separator>
              <Wheel value={m} action={setM} loop>
                {range(60).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>
                <Text lineHeight="var(--wheel-item-height)">:</Text>
              </WheelGroup.Separator>
              <Wheel value={s} action={setS} loop>
                {range(60).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </WheelGroup>
            <div className="value-display">
              {pad2(h)}:{pad2(m)}:{pad2(s)}
            </div>
          </div>
        );
      };

      // ── Hours + quarter minutes ────────────────────────────────────────────

      const HourMinuteDemo = () => {
        const [h, setH] = useState(9);
        const [m, setM] = useState(30);
        const MINUTES = [0, 15, 30, 45];
        return (
          <div id="hm" className="demo-section">
            <h2>WheelGroup — hours + quarter minutes (looping)</h2>
            <p>
              A short column loops too: past 45 comes 00. Try <kbd>↓</kbd> on 45
              — it continues onto the looped 00.
            </p>
            <WheelGroup
              separatorWidth="1.5ch"
              style={{ fontVariantNumeric: "tabular-nums" }}
            >
              <Wheel value={h} action={setH} loop>
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>
                <Text lineHeight="var(--wheel-item-height)">:</Text>
              </WheelGroup.Separator>
              <Wheel value={m} action={setM} loop>
                {MINUTES.map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </WheelGroup>
            <div className="value-display">
              {pad2(h)}:{pad2(m)}
            </div>
          </div>
        );
      };

      // ── Sizes — loop disabled ──────────────────────────────────────────────

      const SizesDemo = () => {
        const [size, setSize] = useState("M");
        const SIZES = ["XXS", "XS", "S", "M", "L", "XL", "XXL"];
        return (
          <div id="sizes" className="demo-section">
            <h2>Sizes — loop disabled, visibleCount=5</h2>
            <p>
              Without <code>loop</code> the list has real ends: scrolling stops
              at XXS / XXL.
            </p>
            <div className="row">
              <Wheel
                value={size}
                visibleCount={5}
                action={(v) => {
                  setSize(v);
                }}
              >
                {SIZES.map((s) => (
                  <Wheel.Item key={s} value={s}>
                    {s}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {size}</div>
            </div>
          </div>
        );
      };

      // ── Day picker (today … +5 days), no loop ──────────────────────────────

      const DayDemo = () => {
        // Offsets 0..5 from today. Keep the actual dates around so <Time> can
        // render each one with its day label ("Today", "Tomorrow", weekday…).
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const days = range(6).map((offset) => {
          const date = new Date(today);
          date.setDate(today.getDate() + offset);
          return date.toISOString().slice(0, 10);
        });
        const [day, setDay] = useState(days[0]);
        return (
          <div id="day" className="demo-section">
            <h2>Day picker — today … +5 days (no loop)</h2>
            <p>
              Each row is a <code>&lt;Time type="date" dayLabel&gt;</code>, so
              you get “Today”, “Tomorrow”, then weekday + date. A bounded range,
              so <code>loop</code> stays off.
            </p>
            <div className="row">
              <Wheel
                value={day}
                action={(v) => {
                  setDay(v);
                }}
                itemHeight={40}
                style={{ minWidth: "12ch" }}
              >
                {days.map((iso) => (
                  <Wheel.Item key={iso} value={iso}>
                    <Time type="date" dayLabel>
                      {iso}
                    </Time>
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {day}</div>
            </div>
          </div>
        );
      };

      const App = () => (
        <NaviDebug>
          <TableOfContents />
          <HoursDemo />
          <TimeDemo />
          <HourMinuteDemo />
          <SizesDemo />
          <DayDemo />
        </NaviDebug>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
