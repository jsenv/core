<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheel Demo</title>
    <style>
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 2rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }
      .demo-section h3 {
        margin: 0 0 8px;
        color: #666;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .states {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
      }
      .states > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .value-display {
        min-height: 24px;
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-family: monospace;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      kbd {
        padding: 1px 5px;
        font-size: 0.8em;
        font-family: monospace;
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      .col-label {
        color: #888;
        font-size: 0.8rem;
      }
      /* A plain HTML/CSS scroll-snap list, sized + faded like the Wheel, to
         compare the browser's native snapping/momentum against our
         transform-based one. Same progressive fade mask, so only the scroll
         behaviour differs visually. */
      .native-wheel {
        width: 3.5ch;
        height: 96px; /* 3 rows × 32px, matching the Wheel defaults */
        color: #111;
        font-weight: 600;
        font-size: 13.33px;
        text-align: center;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.4) 34%,
          #000 45%,
          #000 55%,
          rgba(0, 0, 0, 0.4) 66%,
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.4) 34%,
          #000 45%,
          #000 55%,
          rgba(0, 0, 0, 0.4) 66%,
          transparent 100%
        );
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
      }
      .native-wheel::-webkit-scrollbar {
        display: none;
      }
      .native-wheel-item {
        display: flex;
        height: 32px;
        align-items: center;
        justify-content: center;
        font-variant-numeric: tabular-nums;
        scroll-snap-align: center;
      }
      .native-wheel-pad {
        height: 32px; /* (3 − 1) / 2 rows, so first/last can reach the center */
      }
      .scroll-buttons {
        display: flex;
        margin-top: 20px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .scroll-buttons button {
        padding: 6px 12px;
        font-size: 0.85rem;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
      }
      .scroll-buttons button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <h1>Wheel Demo</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useEffect, useRef, useState } from "preact/hooks";
      import {
        NaviDebug,
        Time,
        Wheel,
        WheelGroup,
        Form,
        Button,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";

      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const pad2 = (n) => String(n).padStart(2, "0");
      // Local YYYY-MM-DD (NOT toISOString, which is UTC and can shift the day).
      const toLocalISODate = (date) =>
        `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;

      // ── Table of contents ──────────────────────────────────────────────────

      const TableOfContents = () => {
        return (
          <div className="demo-section">
            <h2>Wheel</h2>
            <p>
              A scroll picker: pick a value by scrolling, dragging, clicking a
              neighbour, or with <kbd>↑</kbd> <kbd>↓</kbd> (<kbd>←</kbd>{" "}
              <kbd>→</kbd> when horizontal). The centered value is the
              selection.
            </p>
            <ol style={{ margin: 0, paddingLeft: "20px", lineHeight: "2" }}>
              <li>
                <a href="#states">States</a>
              </li>
              <li>
                <a href="#scroll">Scroll behavior</a> — snapping, momentum, loop
              </li>
              <li>
                <a href="#separator">Separator alignment</a>
              </li>
              <li>
                <a href="#actions">uiAction / action / form</a>
              </li>
              <li>
                <a href="#practical">Practical examples</a> — size picker, day
                picker
              </li>
              <li>
                <a href="#customization">Customization</a> — visibleCount,
                horizontal, spacing, glass, frameBorder
              </li>
            </ol>
          </div>
        );
      };

      // ── States ─────────────────────────────────────────────────────────────

      const HOURS = range(24);
      const StateWheel = (props) => (
        <Wheel type="integer" defaultValue={9} {...props}>
          {HOURS.map((h) => (
            <Wheel.Item key={h} value={h}>
              {pad2(h)}
            </Wheel.Item>
          ))}
        </Wheel>
      );

      const StatesDemo = () => {
        return (
          <div id="states" className="demo-section">
            <h2>States</h2>
            <p>The same wheel in its different states.</p>
            <div className="states">
              <div>
                <h3>focus-visible</h3>
                <StateWheel basePseudoState={{ ":focus-visible": true }} />
              </div>
              <div>
                <h3>loading</h3>
                <StateWheel loading />
              </div>
              <div>
                <h3>readonly</h3>
                <StateWheel readOnly />
              </div>
              <div>
                <h3>disabled</h3>
                <StateWheel disabled />
              </div>
            </div>
          </div>
        );
      };

      // ── Scroll behavior (snapping, momentum, loop) ─────────────────────────

      // Side-by-side harness: our transform-based Wheel vs a plain HTML/CSS
      // scroll-snap list, driven by the same buttons, so the snapping/momentum
      // feel can be compared against the browser's own scroller.
      const ScrollBehaviorDemo = () => {
        const [h, setH] = useState(9);
        const wheelRef = useRef(null);
        const nativeRef = useRef(null);
        const ITEM = 32; // px, matches the Wheel + native row height
        // The Wheel loops, so its scroll extent is infinite; the native list
        // can't loop, so repeat the values ×3 to give a comparable scroll
        // height to fling through.
        const COPIES = 3;
        const nativeValues = range(24 * COPIES).map((i) => i % 24);

        // Start the native list centered on 09 in the middle copy, so there's
        // room to fling both ways.
        useEffect(() => {
          if (nativeRef.current) {
            nativeRef.current.scrollTop = (24 + 9) * ITEM;
          }
        }, []);

        // Drive both scrollers the same way: a custom navi_scroll event for the
        // Wheel (it has no real scroll), scrollBy for the native list.
        const drive = (detail) => {
          wheelRef.current?.dispatchEvent(
            new CustomEvent("navi_scroll", { detail }),
          );
          const top = (detail.delta || 0) + (detail.items || 0) * ITEM;
          nativeRef.current?.scrollBy({ top, behavior: detail.behavior });
        };

        return (
          <div id="scroll" className="demo-section">
            <h2>Scroll behavior — snapping, momentum, loop</h2>
            <p>
              Scroll, drag or fling either column, or use the buttons (which
              drive <em>both</em>). Left is our transform-based Wheel (looping);
              right is a plain HTML/CSS <code>scroll-snap</code> list — compare
              how each animates the snap. The <kbd>px</kbd> buttons nudge by
              less than a row to show the snap-back.
            </p>
            <div className="row" style={{ gap: 48, alignItems: "flex-start" }}>
              <div className="states">
                <div>
                  <Wheel
                    ref={wheelRef}
                    type="integer"
                    value={h}
                    action={setH}
                    loop
                  >
                    {range(24).map((v) => (
                      <Wheel.Item key={v} value={v}>
                        {pad2(v)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <div className="value-display">value: {pad2(h)}</div>
                  <span className="col-label">Wheel (ours, looping)</span>
                </div>
                <div>
                  <div className="native-wheel" ref={nativeRef}>
                    <div className="native-wheel-pad" />
                    {nativeValues.map((v, i) => (
                      <div className="native-wheel-item" key={i}>
                        {pad2(v)}
                      </div>
                    ))}
                    <div className="native-wheel-pad" />
                  </div>
                  <span className="col-label">native scroll-snap (×3)</span>
                </div>
              </div>
            </div>
            <div className="scroll-buttons">
              <button onClick={() => drive({ items: -1, behavior: "smooth" })}>
                ▲ item
              </button>
              <button onClick={() => drive({ items: 1, behavior: "smooth" })}>
                ▼ item
              </button>
              <button onClick={() => drive({ delta: -12, behavior: "smooth" })}>
                ▲ 12px
              </button>
              <button onClick={() => drive({ delta: 12, behavior: "smooth" })}>
                ▼ 12px
              </button>
            </div>
          </div>
        );
      };

      // ── Practical examples ─────────────────────────────────────────────────

      const PracticalExamplesDemo = () => {
        const [size, setSize] = useState("M");
        const SIZES = ["XXS", "XS", "S", "M", "L", "XL", "XXL"];
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const days = range(6).map((offset) => {
          const date = new Date(today);
          date.setDate(today.getDate() + offset);
          return toLocalISODate(date);
        });
        // Default to tomorrow so there's a neighbour above (today) and below.
        const [day, setDay] = useState(days[1]);
        return (
          <div id="practical" className="demo-section">
            <h2>Practical examples</h2>

            <h3>Size picker (no loop)</h3>
            <p>Without loop the list has real ends: it stops at XXS / XXL.</p>
            <div className="row">
              <Wheel
                value={size}
                visibleCount={5}
                action={(v) => {
                  setSize(v);
                }}
              >
                {SIZES.map((s) => (
                  <Wheel.Item key={s} value={s}>
                    {s}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>

            <h3 style={{ marginTop: 24 }}>
              Day picker — today … +5 days (no loop)
            </h3>
            <p>
              Each row is a <code>&lt;Time type="date" dayLabel&gt;</code>:
              “Today”, “Tomorrow”, then weekday + date.
            </p>
            <div className="row">
              <Wheel
                type="day"
                value={day}
                action={(v) => {
                  setDay(v);
                }}
                itemHeight={40}
                style={{ minWidth: "12ch" }}
              >
                {days.map((iso) => (
                  <Wheel.Item key={iso} value={iso}>
                    <Time type="date" dayLabel>
                      {iso}
                    </Time>
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
          </div>
        );
      };

      // ── Separator alignment ────────────────────────────────────────────────

      const AlignmentSquare = () => (
        <span
          style={{
            display: "block",
            width: 14,
            height: 14,
            background: "#e8590c",
            borderRadius: 2,
          }}
        />
      );

      // Small self-contained wheels reused across the separator cases.
      const HourWheel = (props) => {
        const [v, setV] = useState(9);
        return (
          <Wheel type="integer" value={v} action={setV} loop {...props}>
            {range(24).map((h) => (
              <Wheel.Item key={h} value={h}>
                {pad2(h)}
              </Wheel.Item>
            ))}
          </Wheel>
        );
      };
      // Alignment doesn't depend on the value count, so the separator cases use
      // light 4-value columns (a real HH:MM:SS would use 60-value minute/second
      // wheels — heavier DOM, not needed to show alignment).
      const QuarterWheel = (props) => {
        const [v, setV] = useState(30);
        return (
          <Wheel type="integer" value={v} action={setV} loop {...props}>
            {[0, 15, 30, 45].map((x) => (
              <Wheel.Item key={x} value={x}>
                {pad2(x)}
              </Wheel.Item>
            ))}
          </Wheel>
        );
      };

      const SeparatorAlignmentDemo = () => {
        return (
          <div id="separator" className="demo-section">
            <h2>Separator alignment</h2>
            <p>
              A separator sits on the center row automatically. Below: the
              orange square marks where separator content lands, then the same
              ":" by default and with the <code>center</code> prop (which snaps
              a single line onto the row).
            </p>
            <div className="states">
              <div>
                <WheelGroup>
                  <HourWheel />
                  <WheelGroup.Separator>
                    <AlignmentSquare />
                  </WheelGroup.Separator>
                  <QuarterWheel />
                </WheelGroup>
                <span className="col-label">square = separator</span>
              </div>
              <div>
                <WheelGroup>
                  <HourWheel />
                  <WheelGroup.Separator>:</WheelGroup.Separator>
                  <QuarterWheel />
                </WheelGroup>
                <span className="col-label">":" default</span>
              </div>
              <div>
                <WheelGroup>
                  <HourWheel />
                  <WheelGroup.Separator center>:</WheelGroup.Separator>
                  <QuarterWheel />
                </WheelGroup>
                <span className="col-label">":" center</span>
              </div>
            </div>

            <h3 style={{ marginTop: 24 }}>1 separator, 2 columns</h3>
            <div className="row" style={{ gap: 40, alignItems: "flex-start" }}>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>:</WheelGroup.Separator>
                <QuarterWheel />
              </WheelGroup>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>ZZ</WheelGroup.Separator>
                <QuarterWheel />
              </WheelGroup>
            </div>

            <h3 style={{ marginTop: 24 }}>
              Word separators (hours + minutes), incl. trailing
            </h3>
            <WheelGroup spacing="0.75ch">
              <HourWheel />
              <WheelGroup.Separator>hours</WheelGroup.Separator>
              <QuarterWheel />
              <WheelGroup.Separator>minutes</WheelGroup.Separator>
            </WheelGroup>

            <h3 style={{ marginTop: 24 }}>3 columns, 2 separators</h3>
            <p style={{ marginBottom: 8 }}>
              A tall glyph like <code>ZZ</code> (right) makes any misalignment
              obvious that ":" (left) can hide.
            </p>
            <div className="row" style={{ gap: 40, alignItems: "flex-start" }}>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>:</WheelGroup.Separator>
                <QuarterWheel />
                <WheelGroup.Separator>:</WheelGroup.Separator>
                <QuarterWheel />
              </WheelGroup>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>ZZ</WheelGroup.Separator>
                <QuarterWheel />
                <WheelGroup.Separator>ZZ</WheelGroup.Separator>
                <QuarterWheel />
              </WheelGroup>
            </div>
          </div>
        );
      };

      // ── Actions (uiAction / action / form) ─────────────────────────────────

      const ActionsDemo = () => {
        const [hour, setHour] = useState(9);
        const [log, pushLog, clearLog] = useCallLog();
        const [submitted, setSubmitted] = useState(null);
        return (
          <div id="actions" className="demo-section">
            <h2>uiAction / action / form</h2>
            <p>
              <code>uiAction</code> fires on every settle; <code>action</code>{" "}
              runs the bound action with the current value. Inside a{" "}
              <code>Form</code> the value submits under the wheel's{" "}
              <code>name</code>.
            </p>
            <div className="row">
              <Wheel
                type="integer"
                value={hour}
                loop
                uiAction={(v) => {
                  pushLog("uiAction", v);
                }}
                action={(v) => {
                  setHour(v);
                  pushLog("action", v);
                }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div style={{ flex: 1 }}>
                <CallLog entries={log} onClear={clearLog} />
              </div>
            </div>
            <h3 style={{ marginTop: 20 }}>Inside a form</h3>
            <Form
              flex="y"
              alignX="start"
              spacing="m"
              action={({ hour: submittedHour }) => {
                setSubmitted(submittedHour);
              }}
            >
              <Wheel type="integer" name="hour" defaultValue={9} loop>
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <Button type="submit">Submit</Button>
            </Form>
            <div className="value-display">
              {submitted !== null ? `submitted: ${submitted}` : ""}
            </div>
          </div>
        );
      };

      // ── Customization ──────────────────────────────────────────────────────

      const CustomizationDemo = () => {
        const [a, setA] = useState(9);
        const [b, setB] = useState(9);
        const [c, setC] = useState(9);
        const [vc, setVc] = useState(9);
        const [hz, setHz] = useState(9);
        const [hzH, setHzH] = useState(9);
        const [hzM, setHzM] = useState(30);
        const [g, setG] = useState(9);
        const [gf, setGf] = useState(9);
        const [gh, setGh] = useState(9);
        const [gm, setGm] = useState(30);
        const HOURS24 = range(24);
        const QUARTERS = [0, 15, 30, 45];
        return (
          <div id="customization" className="demo-section">
            <h2>Customization</h2>
            <p>
              Wheel is a <code>Box</code>, so style props work directly. The
              text colour is <code>--wheel-color</code>.
            </p>
            <div style={{ marginBottom: 24 }}>
              <h3>border="1px solid grey"</h3>
              <Wheel
                type="integer"
                value={a}
                action={setA}
                loop
                border="1px solid grey"
                padding="0 6px"
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
            <div style={{ marginBottom: 24 }}>
              <h3>accent color (--wheel-color)</h3>
              <Wheel
                type="integer"
                value={b}
                action={setB}
                loop
                style={{ "--wheel-color": "#d6336c" }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
            <div style={{ marginBottom: 24 }}>
              <h3>bigger rows, 5 visible</h3>
              <Wheel
                type="integer"
                value={c}
                action={setC}
                loop
                visibleCount={5}
                itemHeight={44}
                style={{ fontSize: "1.5rem" }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
            <div style={{ marginBottom: 24 }}>
              <h3>visibleCount (rows shown around the center)</h3>
              <p>
                An odd count; the center row is the selection. More rows show
                more context above/below.
              </p>
              <div className="states">
                {[3, 5, 7].map((count) => (
                  <div key={count}>
                    <Wheel
                      type="integer"
                      value={vc}
                      action={setVc}
                      loop
                      visibleCount={count}
                    >
                      {HOURS24.map((h) => (
                        <Wheel.Item key={h} value={h}>
                          {pad2(h)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                    <span className="col-label">visibleCount={count}</span>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ marginBottom: 24 }}>
              <h3>horizontal (scrolls left/right)</h3>
              <p>
                With <code>horizontal</code> the wheel lays out left-to-right
                and arrow keys become <kbd>←</kbd> <kbd>→</kbd>. A{" "}
                <code>WheelGroup horizontal</code> stacks such wheels with
                separators between the rows.
              </p>
              <div
                className="row"
                style={{ gap: 40, alignItems: "flex-start" }}
              >
                <div>
                  <Wheel
                    type="integer"
                    horizontal
                    loop
                    value={hz}
                    action={setHz}
                    itemWidth="4ch"
                    visibleCount={5}
                  >
                    {HOURS24.map((h) => (
                      <Wheel.Item key={h} value={h}>
                        {pad2(h)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <span className="col-label">single wheel</span>
                </div>
                <div>
                  <WheelGroup horizontal spacing="6px">
                    <Wheel
                      type="integer"
                      horizontal
                      loop
                      value={hzH}
                      action={setHzH}
                      itemWidth="4ch"
                      visibleCount={5}
                    >
                      {HOURS24.map((v) => (
                        <Wheel.Item key={v} value={v}>
                          {pad2(v)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                    <WheelGroup.Separator>hours</WheelGroup.Separator>
                    <Wheel
                      type="integer"
                      horizontal
                      loop
                      value={hzM}
                      action={setHzM}
                      itemWidth="4ch"
                      visibleCount={5}
                    >
                      {QUARTERS.map((v) => (
                        <Wheel.Item key={v} value={v}>
                          {pad2(v)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                    <WheelGroup.Separator>minutes</WheelGroup.Separator>
                  </WheelGroup>
                  <span className="col-label">WheelGroup horizontal</span>
                </div>
              </div>
            </div>
            <div>
              <h3>WheelGroup spacing (gap around separators)</h3>
              <div className="states">
                <div>
                  <WheelGroup spacing="0">
                    <HourWheel />
                    <WheelGroup.Separator>:</WheelGroup.Separator>
                    <QuarterWheel />
                  </WheelGroup>
                  <span className="col-label">spacing="0"</span>
                </div>
                <div>
                  <WheelGroup spacing="2ch">
                    <HourWheel />
                    <WheelGroup.Separator>:</WheelGroup.Separator>
                    <QuarterWheel />
                  </WheelGroup>
                  <span className="col-label">spacing="2ch"</span>
                </div>
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <h3>glass (frost the neighbours)</h3>
              <p>
                Every wheel fades its neighbours out toward the edges — that
                progressive fade <em>is</em> the selection emphasis, so a
                half-scrolled row is half-faded. <code>glass</code> additionally
                frosts (blurs) the faded rows (tune with{" "}
                <code>--wheel-glass-blur</code>).
              </p>
              <div className="states">
                <div>
                  <Wheel type="integer" value={g} action={setG} loop glass>
                    {range(24).map((h) => (
                      <Wheel.Item key={h} value={h}>
                        {pad2(h)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <span className="col-label">glass</span>
                </div>
                <div>
                  <Wheel
                    type="integer"
                    value={g}
                    action={setG}
                    loop
                    glass
                    style={{ "--wheel-glass-blur": "4px" }}
                  >
                    {range(24).map((h) => (
                      <Wheel.Item key={h} value={h}>
                        {pad2(h)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <span className="col-label">stronger blur</span>
                </div>
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <h3>frameBorder (line the window edges)</h3>
              <p>
                <code>frameBorder</code> draws a faint line along the top and
                bottom of the center window. It's independent of{" "}
                <code>glass</code> — use it alone or together. Tune the colour
                with <code>--wheel-frame-color</code>.
              </p>
              <div className="states">
                <div>
                  <Wheel
                    type="integer"
                    value={gf}
                    action={setGf}
                    loop
                    frameBorder
                  >
                    {range(24).map((h) => (
                      <Wheel.Item key={h} value={h}>
                        {pad2(h)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <span className="col-label">frameBorder</span>
                </div>
                <div>
                  <Wheel
                    type="integer"
                    value={gf}
                    action={setGf}
                    loop
                    glass
                    frameBorder
                  >
                    {range(24).map((h) => (
                      <Wheel.Item key={h} value={h}>
                        {pad2(h)}
                      </Wheel.Item>
                    ))}
                  </Wheel>
                  <span className="col-label">glass + frameBorder</span>
                </div>
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <h3>on a WheelGroup (one prop for all wheels)</h3>
              <p>
                Set <code>glass</code> (or <code>frameBorder</code>) once on a{" "}
                <code>WheelGroup</code> and every wheel inside inherits it.
              </p>
              <div className="states">
                <div>
                  <WheelGroup glass spacing="0.5ch">
                    <Wheel type="integer" value={gh} action={setGh} loop>
                      {range(24).map((h) => (
                        <Wheel.Item key={h} value={h}>
                          {pad2(h)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                    <WheelGroup.Separator center>:</WheelGroup.Separator>
                    <Wheel type="integer" value={gm} action={setGm} loop>
                      {[0, 15, 30, 45].map((m) => (
                        <Wheel.Item key={m} value={m}>
                          {pad2(m)}
                        </Wheel.Item>
                      ))}
                    </Wheel>
                  </WheelGroup>
                  <span className="col-label">glass on WheelGroup</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

        <NaviDebug>
          <TableOfContents />
          <StatesDemo />
          <ScrollBehaviorDemo />
          <SeparatorAlignmentDemo />
          <ActionsDemo />
          <PracticalExamplesDemo />
          <CustomizationDemo />
        </NaviDebug>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
