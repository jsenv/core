<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheel Demo</title>
    <style>
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 2rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }
      .demo-section h3 {
        margin: 0 0 8px;
        color: #666;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .states {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
      }
      .states > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .value-display {
        min-height: 24px;
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-family: monospace;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      kbd {
        padding: 1px 5px;
        font-size: 0.8em;
        font-family: monospace;
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      .col-label {
        color: #888;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Wheel Demo</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        NaviDebug,
        Time,
        Wheel,
        WheelGroup,
        Form,
        Button,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";

      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const pad2 = (n) => String(n).padStart(2, "0");
      // Local YYYY-MM-DD (NOT toISOString, which is UTC and can shift the day).
      const toLocalISODate = (date) =>
        `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;

      // ── Table of contents ──────────────────────────────────────────────────

      const TableOfContents = () => {
        return (
          <div className="demo-section">
            <h2>Wheel</h2>
            <p>
              A scroll picker: pick a value by scrolling, dragging, clicking a
              neighbour, or with <kbd>↑</kbd> <kbd>↓</kbd> (<kbd>←</kbd>{" "}
              <kbd>→</kbd> when horizontal). The centered value is the
              selection.
            </p>
            <ol style={{ margin: 0, paddingLeft: "20px", lineHeight: "2" }}>
              <li>
                <a href="#states">States</a>
              </li>
              <li>
                <a href="#loop">Minimal loop (few values)</a>
              </li>
              <li>
                <a href="#separator">Separator alignment</a>
              </li>
              <li>
                <a href="#sizes">Sizes (no loop)</a>
              </li>
              <li>
                <a href="#day">Day picker (no loop)</a>
              </li>
              <li>
                <a href="#horizontal">Horizontal</a>
              </li>
              <li>
                <a href="#horizontal-group">Horizontal group</a>
              </li>
              <li>
                <a href="#actions">uiAction / action / form</a>
              </li>
              <li>
                <a href="#customization">Customization</a>
              </li>
            </ol>
          </div>
        );
      };

      // ── States ─────────────────────────────────────────────────────────────

      const HOURS = range(24);
      const StateWheel = (props) => (
        <Wheel type="integer" defaultValue={9} {...props}>
          {HOURS.map((h) => (
            <Wheel.Item key={h} value={h}>
              {pad2(h)}
            </Wheel.Item>
          ))}
        </Wheel>
      );

      const StatesDemo = () => {
        return (
          <div id="states" className="demo-section">
            <h2>States</h2>
            <p>The same wheel in its different states.</p>
            <div className="states">
              <div>
                <h3>focus-visible</h3>
                <StateWheel basePseudoState={{ ":focus-visible": true }} />
              </div>
              <div>
                <h3>loading</h3>
                <StateWheel loading />
              </div>
              <div>
                <h3>readonly</h3>
                <StateWheel readOnly />
              </div>
              <div>
                <h3>disabled</h3>
                <StateWheel disabled />
              </div>
            </div>
          </div>
        );
      };

      // ── Minimal loop (few values) ──────────────────────────────────────────

      const LoopDemo = () => {
        const [m, setM] = useState(30);
        // Deliberately few values so loop is easy to eyeball/test.
        const MINUTES = [15, 30, 45, 0];
        return (
          <div id="loop" className="demo-section">
            <h2>Minimal loop (quarter minutes)</h2>
            <p>
              Only four values, looping — the easiest case to test wrapping:
              scroll or <kbd>↑</kbd> <kbd>↓</kbd> past either end, and click the
              faded neighbours (which are loop clones).
            </p>
            <div className="row">
              <Wheel type="integer" value={m} action={setM} loop>
                {MINUTES.map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {pad2(m)}</div>
            </div>
          </div>
        );
      };

      // ── Sizes (no loop) ────────────────────────────────────────────────────

      const SizesDemo = () => {
        const [size, setSize] = useState("M");
        const SIZES = ["XXS", "XS", "S", "M", "L", "XL", "XXL"];
        return (
          <div id="sizes" className="demo-section">
            <h2>Sizes — loop disabled, visibleCount=5</h2>
            <p>Without loop the list has real ends: it stops at XXS / XXL.</p>
            <div className="row">
              <Wheel
                value={size}
                visibleCount={5}
                action={(v) => {
                  setSize(v);
                }}
              >
                {SIZES.map((s) => (
                  <Wheel.Item key={s} value={s}>
                    {s}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {size}</div>
            </div>
          </div>
        );
      };

      // ── Day picker (no loop) ───────────────────────────────────────────────

      const DayDemo = () => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const days = range(6).map((offset) => {
          const date = new Date(today);
          date.setDate(today.getDate() + offset);
          return toLocalISODate(date);
        });
        // Default to tomorrow so there's a neighbour above (today) and below.
        const [day, setDay] = useState(days[1]);
        return (
          <div id="day" className="demo-section">
            <h2>Day picker — today … +5 days (no loop)</h2>
            <p>
              Each row is a <code>&lt;Time type="date" dayLabel&gt;</code>:
              “Today”, “Tomorrow”, then weekday + date.
            </p>
            <div className="row">
              <Wheel
                type="day"
                value={day}
                action={(v) => {
                  setDay(v);
                }}
                itemHeight={40}
                style={{ minWidth: "12ch" }}
              >
                {days.map((iso) => (
                  <Wheel.Item key={iso} value={iso}>
                    <Time type="date" dayLabel>
                      {iso}
                    </Time>
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {day}</div>
            </div>
          </div>
        );
      };

      // ── Horizontal ─────────────────────────────────────────────────────────

      const HorizontalDemo = () => {
        const [hour, setHour] = useState(9);
        return (
          <div id="horizontal" className="demo-section">
            <h2>Horizontal, looping</h2>
            <p>
              Same wheel, laid out left-to-right with <code>horizontal</code>.
              Arrow keys become <kbd>←</kbd> <kbd>→</kbd>.
            </p>
            <div className="row">
              <Wheel
                type="integer"
                horizontal
                loop
                value={hour}
                action={setHour}
                itemWidth="4ch"
                visibleCount={5}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {pad2(hour)}</div>
            </div>
          </div>
        );
      };

      // ── Horizontal group ───────────────────────────────────────────────────

      const HorizontalGroupDemo = () => {
        const [h, setH] = useState(9);
        const [m, setM] = useState(30);
        const MINUTES = [0, 15, 30, 45];
        return (
          <div id="horizontal-group" className="demo-section">
            <h2>Horizontal group</h2>
            <p>
              A <code>WheelGroup horizontal</code> stacks horizontal wheels,
              with separators between the rows.
            </p>
            <WheelGroup horizontal spacing="6px">
              <Wheel
                type="integer"
                horizontal
                loop
                value={h}
                action={setH}
                itemWidth="4ch"
                visibleCount={5}
              >
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>hours</WheelGroup.Separator>
              <Wheel
                type="integer"
                horizontal
                loop
                value={m}
                action={setM}
                itemWidth="4ch"
                visibleCount={5}
              >
                {MINUTES.map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>minutes</WheelGroup.Separator>
            </WheelGroup>
            <div className="value-display">
              {h} hours {pad2(m)} minutes
            </div>
          </div>
        );
      };

      // ── Separator alignment ────────────────────────────────────────────────

      const AlignmentSquare = () => (
        <span
          style={{
            display: "block",
            width: 14,
            height: 14,
            background: "#e8590c",
            borderRadius: 2,
          }}
        />
      );

      // Small self-contained wheels reused across the separator cases.
      const HourWheel = (props) => {
        const [v, setV] = useState(9);
        return (
          <Wheel type="integer" value={v} action={setV} loop {...props}>
            {range(24).map((h) => (
              <Wheel.Item key={h} value={h}>
                {pad2(h)}
              </Wheel.Item>
            ))}
          </Wheel>
        );
      };
      const MinuteWheel = (props) => {
        const [v, setV] = useState(30);
        return (
          <Wheel type="integer" value={v} action={setV} loop {...props}>
            {range(60).map((x) => (
              <Wheel.Item key={x} value={x}>
                {pad2(x)}
              </Wheel.Item>
            ))}
          </Wheel>
        );
      };
      const SecondWheel = (props) => {
        const [v, setV] = useState(0);
        return (
          <Wheel type="integer" value={v} action={setV} loop {...props}>
            {range(60).map((x) => (
              <Wheel.Item key={x} value={x}>
                {pad2(x)}
              </Wheel.Item>
            ))}
          </Wheel>
        );
      };
      const QuarterWheel = (props) => {
        const [v, setV] = useState(30);
        return (
          <Wheel type="integer" value={v} action={setV} loop {...props}>
            {[0, 15, 30, 45].map((x) => (
              <Wheel.Item key={x} value={x}>
                {pad2(x)}
              </Wheel.Item>
            ))}
          </Wheel>
        );
      };

      const SeparatorAlignmentDemo = () => {
        return (
          <div id="separator" className="demo-section">
            <h2>Separator alignment</h2>
            <p>
              A separator sits on the center row automatically. Below: the
              orange square marks where separator content lands, then the same
              ":" rendered by default and with{" "}
              <code>lineHeight="var(--wheel-item-height)"</code>.
            </p>
            <div className="states">
              <div>
                <WheelGroup>
                  <HourWheel />
                  <WheelGroup.Separator>
                    <AlignmentSquare />
                  </WheelGroup.Separator>
                  <QuarterWheel />
                </WheelGroup>
                <span className="col-label">square = separator</span>
              </div>
              <div>
                <WheelGroup>
                  <HourWheel />
                  <WheelGroup.Separator>:</WheelGroup.Separator>
                  <QuarterWheel />
                </WheelGroup>
                <span className="col-label">":" default</span>
              </div>
              <div>
                <WheelGroup>
                  <HourWheel />
                  <WheelGroup.Separator lineHeight="var(--wheel-item-height)">
                    :
                  </WheelGroup.Separator>
                  <QuarterWheel />
                </WheelGroup>
                <span className="col-label">":" lineHeight</span>
              </div>
            </div>

            <h3 style={{ marginTop: 24 }}>1 separator, 2 columns</h3>
            <div className="row" style={{ gap: 40, alignItems: "flex-start" }}>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>:</WheelGroup.Separator>
                <MinuteWheel />
              </WheelGroup>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>ZZ</WheelGroup.Separator>
                <MinuteWheel />
              </WheelGroup>
            </div>

            <h3 style={{ marginTop: 24 }}>
              Word separators (hours + minutes), incl. trailing
            </h3>
            <WheelGroup spacing="0.75ch">
              <HourWheel />
              <WheelGroup.Separator>hours</WheelGroup.Separator>
              <QuarterWheel />
              <WheelGroup.Separator>minutes</WheelGroup.Separator>
            </WheelGroup>

            <h3 style={{ marginTop: 24 }}>3 columns, 2 separators</h3>
            <p style={{ marginBottom: 8 }}>
              A tall glyph like <code>ZZ</code> (right) makes any misalignment
              obvious that ":" (left) can hide.
            </p>
            <div className="row" style={{ gap: 40, alignItems: "flex-start" }}>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>:</WheelGroup.Separator>
                <MinuteWheel />
                <WheelGroup.Separator>:</WheelGroup.Separator>
                <SecondWheel />
              </WheelGroup>
              <WheelGroup>
                <HourWheel />
                <WheelGroup.Separator>ZZ</WheelGroup.Separator>
                <MinuteWheel />
                <WheelGroup.Separator>ZZ</WheelGroup.Separator>
                <SecondWheel />
              </WheelGroup>
            </div>
          </div>
        );
      };

      // ── Actions (uiAction / action / form) ─────────────────────────────────

      const ActionsDemo = () => {
        const [hour, setHour] = useState(9);
        const [log, pushLog, clearLog] = useCallLog();
        const [submitted, setSubmitted] = useState(null);
        return (
          <div id="actions" className="demo-section">
            <h2>uiAction / action / form</h2>
            <p>
              <code>uiAction</code> fires on every settle; <code>action</code>{" "}
              runs the bound action with the current value. Inside a{" "}
              <code>Form</code> the value submits under the wheel's{" "}
              <code>name</code>.
            </p>
            <div className="row">
              <Wheel
                type="integer"
                value={hour}
                loop
                uiAction={(v) => {
                  pushLog("uiAction", v);
                }}
                action={(v) => {
                  setHour(v);
                  pushLog("action", v);
                }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div style={{ flex: 1 }}>
                <CallLog entries={log} onClear={clearLog} />
              </div>
            </div>
            <h3 style={{ marginTop: 20 }}>Inside a form</h3>
            <Form
              flex="y"
              alignX="start"
              spacing="m"
              action={({ hour: submittedHour }) => {
                setSubmitted(submittedHour);
              }}
            >
              <Wheel type="integer" name="hour" defaultValue={9} loop>
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <Button type="submit">Submit</Button>
            </Form>
            <div className="value-display">
              {submitted !== null ? `submitted: ${submitted}` : ""}
            </div>
          </div>
        );
      };

      // ── Customization ──────────────────────────────────────────────────────

      const CustomizationDemo = () => {
        const [a, setA] = useState(9);
        const [b, setB] = useState(9);
        const [c, setC] = useState(9);
        return (
          <div id="customization" className="demo-section">
            <h2>Customization</h2>
            <p>
              Wheel is a <code>Box</code>, so style props work directly. Colors
              are CSS variables (<code>--wheel-color</code>,{" "}
              <code>--wheel-color-faded</code>).
            </p>
            <div style={{ marginBottom: 24 }}>
              <h3>border="1px solid grey"</h3>
              <Wheel
                type="integer"
                value={a}
                action={setA}
                loop
                border="1px solid grey"
                padding="0 6px"
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
            <div style={{ marginBottom: 24 }}>
              <h3>accent color (CSS vars)</h3>
              <Wheel
                type="integer"
                value={b}
                action={setB}
                loop
                style={{
                  "--wheel-color": "#d6336c",
                  "--wheel-color-faded": "#f3bcd0",
                }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
            <div style={{ marginBottom: 24 }}>
              <h3>bigger rows, 5 visible</h3>
              <Wheel
                type="integer"
                value={c}
                action={setC}
                loop
                visibleCount={5}
                itemHeight={44}
                style={{ fontSize: "1.5rem" }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </div>
            <div>
              <h3>WheelGroup spacing (gap around separators)</h3>
              <div className="states">
                <div>
                  <WheelGroup spacing="0">
                    <HourWheel />
                    <WheelGroup.Separator>:</WheelGroup.Separator>
                    <QuarterWheel />
                  </WheelGroup>
                  <span className="col-label">spacing="0"</span>
                </div>
                <div>
                  <WheelGroup spacing="2ch">
                    <HourWheel />
                    <WheelGroup.Separator>:</WheelGroup.Separator>
                    <QuarterWheel />
                  </WheelGroup>
                  <span className="col-label">spacing="2ch"</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const App = () => (
        <NaviDebug>
          <TableOfContents />
          <StatesDemo />
          <LoopDemo />
          <SeparatorAlignmentDemo />
          <SizesDemo />
          <DayDemo />
          <HorizontalDemo />
          <HorizontalGroupDemo />
          <ActionsDemo />
          <CustomizationDemo />
        </NaviDebug>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
