<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheel Demo</title>
    <style>
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 2rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 12px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }
      .demo-section h3 {
        margin: 0 0 8px;
        color: #666;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .states {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
      }
      .states > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .value-display {
        min-height: 24px;
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-family: monospace;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      kbd {
        padding: 1px 5px;
        font-size: 0.8em;
        font-family: monospace;
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Wheel Demo</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        NaviDebug,
        Time,
        Wheel,
        WheelGroup,
        Form,
        Button,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";

      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const pad2 = (n) => String(n).padStart(2, "0");
      // Local YYYY-MM-DD (NOT toISOString, which is UTC and can shift the day).
      const toLocalISODate = (date) =>
        `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;

      // ── Table of contents ──────────────────────────────────────────────────

      const TableOfContents = () => {
        return (
          <div className="demo-section">
            <h2>Wheel</h2>
            <p>
              A scroll picker: pick a value by scrolling, dragging, clicking a
              neighbour, or with <kbd>↑</kbd> <kbd>↓</kbd> (<kbd>←</kbd>{" "}
              <kbd>→</kbd> when horizontal). The centered value is the
              selection.
            </p>
            <ol style={{ margin: 0, paddingLeft: "20px", lineHeight: "2" }}>
              <li>
                <a href="#states">States</a>
              </li>
              <li>
                <a href="#hours">Single column, looping</a>
              </li>
              <li>
                <a href="#time">Time HH:MM:SS</a>
              </li>
              <li>
                <a href="#hm">Hours + quarter minutes</a>
              </li>
              <li>
                <a href="#words">Word separators + trailing separator</a>
              </li>
              <li>
                <a href="#sizes">Sizes (no loop)</a>
              </li>
              <li>
                <a href="#day">Day picker (no loop)</a>
              </li>
              <li>
                <a href="#horizontal">Horizontal</a>
              </li>
              <li>
                <a href="#horizontal-group">Horizontal group</a>
              </li>
              <li>
                <a href="#actions">uiAction / action / form</a>
              </li>
              <li>
                <a href="#validation">Validation</a>
              </li>
              <li>
                <a href="#customization">Customization</a>
              </li>
            </ol>
          </div>
        );
      };

      // ── States ─────────────────────────────────────────────────────────────

      const HOURS = range(24);
      const StateWheel = (props) => (
        <Wheel type="integer" defaultValue={9} {...props}>
          {HOURS.map((h) => (
            <Wheel.Item key={h} value={h}>
              {pad2(h)}
            </Wheel.Item>
          ))}
        </Wheel>
      );

      const StatesDemo = () => {
        return (
          <div id="states" className="demo-section">
            <h2>States</h2>
            <p>The same wheel in its different states.</p>
            <div className="states">
              <div>
                <h3>focus-visible</h3>
                <StateWheel basePseudoState={{ ":focus-visible": true }} />
              </div>
              <div>
                <h3>loading</h3>
                <StateWheel loading />
              </div>
              <div>
                <h3>readonly</h3>
                <StateWheel readOnly />
              </div>
              <div>
                <h3>disabled</h3>
                <StateWheel disabled />
              </div>
            </div>
          </div>
        );
      };

      // ── Single column, looping ─────────────────────────────────────────────

      const HoursDemo = () => {
        const [hour, setHour] = useState(4);
        return (
          <div id="hours" className="demo-section">
            <h2>Single column (hours), looping</h2>
            <p>Past 23 comes 00 again; scrolling up past 00 shows 23.</p>
            <div className="row">
              <Wheel type="integer" value={hour} action={setHour} loop>
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {pad2(hour)}</div>
            </div>
          </div>
        );
      };

      // ── Time HH:MM:SS ──────────────────────────────────────────────────────

      const TimeDemo = () => {
        const [h, setH] = useState(0);
        const [m, setM] = useState(4);
        const [s, setS] = useState(0);
        return (
          <div id="time" className="demo-section">
            <h2>Time HH:MM:SS</h2>
            <p>
              Scroll/drag over a <code>:</code> and it scrolls the neighbouring
              wheel, not the page.
            </p>
            <WheelGroup>
              <Wheel type="integer" value={h} action={setH} loop>
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>:</WheelGroup.Separator>
              <Wheel type="integer" value={m} action={setM} loop>
                {range(60).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>:</WheelGroup.Separator>
              <Wheel type="integer" value={s} action={setS} loop>
                {range(60).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </WheelGroup>
            <div className="value-display">
              {pad2(h)}:{pad2(m)}:{pad2(s)}
            </div>
          </div>
        );
      };

      // ── Hours + quarter minutes ────────────────────────────────────────────

      const HourMinuteDemo = () => {
        const [h, setH] = useState(9);
        const [m, setM] = useState(30);
        const MINUTES = [0, 15, 30, 45];
        return (
          <div id="hm" className="demo-section">
            <h2>Hours + quarter minutes</h2>
            <p>
              A short column loops too. Try <kbd>↓</kbd> on 45 — it continues
              onto the looped 00.
            </p>
            <WheelGroup>
              <Wheel type="integer" value={h} action={setH} loop>
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>:</WheelGroup.Separator>
              <Wheel type="integer" value={m} action={setM} loop>
                {MINUTES.map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
            </WheelGroup>
            <div className="value-display">
              {pad2(h)}:{pad2(m)}
            </div>
          </div>
        );
      };

      // ── Word separators + trailing separator ───────────────────────────────

      const WordsDemo = () => {
        const [h, setH] = useState(9);
        const [m, setM] = useState(30);
        const MINUTES = [0, 15, 30, 45];
        return (
          <div id="words" className="demo-section">
            <h2>Word separators + trailing separator</h2>
            <p>
              Separators take their natural width (here whole words), and there
              is even a trailing one. The gap around each separator is
              scrollable (it belongs to the wheel); only the word itself is a
              dead zone.
            </p>
            <WheelGroup spacing="0.75ch">
              <Wheel type="integer" value={h} action={setH} loop>
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {v}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>hours</WheelGroup.Separator>
              <Wheel type="integer" value={m} action={setM} loop>
                {MINUTES.map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>minutes</WheelGroup.Separator>
            </WheelGroup>
            <div className="value-display">
              {h} hours {pad2(m)} minutes
            </div>
          </div>
        );
      };

      // ── Sizes (no loop) ────────────────────────────────────────────────────

      const SizesDemo = () => {
        const [size, setSize] = useState("M");
        const SIZES = ["XXS", "XS", "S", "M", "L", "XL", "XXL"];
        return (
          <div id="sizes" className="demo-section">
            <h2>Sizes — loop disabled, visibleCount=5</h2>
            <p>Without loop the list has real ends: it stops at XXS / XXL.</p>
            <div className="row">
              <Wheel
                value={size}
                visibleCount={5}
                action={(v) => {
                  setSize(v);
                }}
              >
                {SIZES.map((s) => (
                  <Wheel.Item key={s} value={s}>
                    {s}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {size}</div>
            </div>
          </div>
        );
      };

      // ── Day picker (no loop) ───────────────────────────────────────────────

      const DayDemo = () => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const days = range(6).map((offset) => {
          const date = new Date(today);
          date.setDate(today.getDate() + offset);
          return toLocalISODate(date);
        });
        const [day, setDay] = useState(days[0]);
        return (
          <div id="day" className="demo-section">
            <h2>Day picker — today … +5 days (no loop)</h2>
            <p>
              Each row is a <code>&lt;Time type="date" dayLabel&gt;</code>:
              “Today”, “Tomorrow”, then weekday + date.
            </p>
            <div className="row">
              <Wheel
                type="day"
                value={day}
                action={(v) => {
                  setDay(v);
                }}
                itemHeight={40}
                style={{ minWidth: "12ch" }}
              >
                {days.map((iso) => (
                  <Wheel.Item key={iso} value={iso}>
                    <Time type="date" dayLabel>
                      {iso}
                    </Time>
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {day}</div>
            </div>
          </div>
        );
      };

      // ── Horizontal ─────────────────────────────────────────────────────────

      const HorizontalDemo = () => {
        const [hour, setHour] = useState(9);
        return (
          <div id="horizontal" className="demo-section">
            <h2>Horizontal, looping</h2>
            <p>
              Same wheel, laid out left-to-right with <code>horizontal</code>.
              Arrow keys become <kbd>←</kbd> <kbd>→</kbd>.
            </p>
            <div className="row">
              <Wheel
                type="integer"
                horizontal
                loop
                value={hour}
                action={setHour}
                itemWidth="4ch"
                visibleCount={5}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div className="value-display">value: {pad2(hour)}</div>
            </div>
          </div>
        );
      };

      // ── Horizontal group ───────────────────────────────────────────────────

      const HorizontalGroupDemo = () => {
        const [h, setH] = useState(9);
        const [m, setM] = useState(30);
        const MINUTES = [0, 15, 30, 45];
        return (
          <div id="horizontal-group" className="demo-section">
            <h2>Horizontal group</h2>
            <p>
              A <code>WheelGroup horizontal</code> stacks horizontal wheels,
              with separators between the rows.
            </p>
            <WheelGroup horizontal spacing="6px">
              <Wheel
                type="integer"
                horizontal
                loop
                value={h}
                action={setH}
                itemWidth="4ch"
                visibleCount={5}
              >
                {range(24).map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>hours</WheelGroup.Separator>
              <Wheel
                type="integer"
                horizontal
                loop
                value={m}
                action={setM}
                itemWidth="4ch"
                visibleCount={5}
              >
                {MINUTES.map((v) => (
                  <Wheel.Item key={v} value={v}>
                    {pad2(v)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <WheelGroup.Separator>minutes</WheelGroup.Separator>
            </WheelGroup>
            <div className="value-display">
              {h} hours {pad2(m)} minutes
            </div>
          </div>
        );
      };

      // ── Actions (uiAction / action / form) ─────────────────────────────────

      const ActionsDemo = () => {
        const [hour, setHour] = useState(9);
        const [log, pushLog, clearLog] = useCallLog();
        const [submitted, setSubmitted] = useState(null);
        return (
          <div id="actions" className="demo-section">
            <h2>uiAction / action / form</h2>
            <p>
              <code>uiAction</code> fires on every settle; <code>action</code>{" "}
              runs the bound action with the current value. Inside a{" "}
              <code>Form</code> the value submits under the wheel's{" "}
              <code>name</code>.
            </p>
            <div className="row">
              <Wheel
                type="integer"
                value={hour}
                loop
                uiAction={(v) => {
                  pushLog("uiAction", v);
                }}
                action={(v) => {
                  setHour(v);
                  pushLog("action", v);
                }}
              >
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <div style={{ flex: 1 }}>
                <CallLog entries={log} onClear={clearLog} />
              </div>
            </div>
            <h3 style={{ marginTop: 20 }}>Inside a form</h3>
            <Form
              flex="y"
              alignX="start"
              spacing="m"
              action={({ hour: submittedHour }) => {
                setSubmitted(submittedHour);
              }}
            >
              <Wheel type="integer" name="hour" defaultValue={9} loop>
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <Button type="submit">Submit</Button>
            </Form>
            <div className="value-display">
              {submitted !== null ? `submitted: ${submitted}` : ""}
            </div>
          </div>
        );
      };

      // ── Validation ─────────────────────────────────────────────────────────

      const ValidationDemo = () => {
        const [submitted, setSubmitted] = useState(null);
        return (
          <div id="validation" className="demo-section">
            <h2>Validation</h2>
            <p>
              <code>required</code> is the only constraint that would apply —
              but a wheel always has a value centered, so the user can never
              leave it empty or pick an out-of-range value. It therefore always
              passes.
            </p>
            <Form
              flex="y"
              alignX="start"
              spacing="m"
              action={({ hour }) => {
                setSubmitted(hour);
              }}
            >
              <Wheel type="integer" name="hour" required defaultValue={9} loop>
                {range(24).map((h) => (
                  <Wheel.Item key={h} value={h}>
                    {pad2(h)}
                  </Wheel.Item>
                ))}
              </Wheel>
              <Button type="submit">Submit (always valid)</Button>
            </Form>
            <div className="value-display">
              {submitted !== null ? `submitted: ${submitted}` : ""}
            </div>
          </div>
        );
      };

      // ── Customization ──────────────────────────────────────────────────────

      const CustomizationDemo = () => {
        const [a, setA] = useState(9);
        const [b, setB] = useState(9);
        const [c, setC] = useState(9);
        return (
          <div id="customization" className="demo-section">
            <h2>Customization</h2>
            <p>
              Wheel is a <code>Box</code>, so style props work directly. Colors
              are CSS variables (<code>--wheel-color</code>,{" "}
              <code>--wheel-color-faded</code>).
            </p>
            <div className="states">
              <div>
                <h3>border="1px solid grey"</h3>
                <Wheel
                  type="integer"
                  value={a}
                  action={setA}
                  loop
                  border="1px solid grey"
                  padding="0 6px"
                >
                  {range(24).map((h) => (
                    <Wheel.Item key={h} value={h}>
                      {pad2(h)}
                    </Wheel.Item>
                  ))}
                </Wheel>
              </div>
              <div>
                <h3>accent color</h3>
                <Wheel
                  type="integer"
                  value={b}
                  action={setB}
                  loop
                  style={{
                    "--wheel-color": "#d6336c",
                    "--wheel-color-faded": "#f3bcd0",
                  }}
                >
                  {range(24).map((h) => (
                    <Wheel.Item key={h} value={h}>
                      {pad2(h)}
                    </Wheel.Item>
                  ))}
                </Wheel>
              </div>
              <div>
                <h3>bigger rows, 5 visible</h3>
                <Wheel
                  type="integer"
                  value={c}
                  action={setC}
                  loop
                  visibleCount={5}
                  itemHeight={44}
                  style={{ fontSize: "1.5rem" }}
                >
                  {range(24).map((h) => (
                    <Wheel.Item key={h} value={h}>
                      {pad2(h)}
                    </Wheel.Item>
                  ))}
                </Wheel>
              </div>
            </div>
          </div>
        );
      };

      const App = () => (
        <NaviDebug>
          <TableOfContents />
          <StatesDemo />
          <HoursDemo />
          <TimeDemo />
          <HourMinuteDemo />
          <WordsDemo />
          <SizesDemo />
          <DayDemo />
          <HorizontalDemo />
          <HorizontalGroupDemo />
          <ActionsDemo />
          <ValidationDemo />
          <CustomizationDemo />
        </NaviDebug>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
