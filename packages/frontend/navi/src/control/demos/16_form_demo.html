<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Demo</title>
    <style>
      .test-container {
        margin: 20px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .field {
        margin-bottom: 15px;
      }
      .status {
        margin-top: 20px;
        padding: 10px;
        border-radius: 4px;
      }
      .status.success {
        color: #155724;
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
      }
      .status.error {
        color: #721c24;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
      }
      .validation-errors {
        margin-top: 10px;
      }
      .validation-errors ul {
        margin: 0;
        padding-left: 20px;
      }
      /* ✅ Styles for form params display */
      .form-params {
        margin-top: 20px;
        padding: 15px;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      .form-params h3 {
        margin-top: 0;
        color: #495057;
      }
      .form-params pre {
        margin: 0;
        padding: 10px;
        font-size: 14px;
        background-color: #e9ecef;
        border-radius: 4px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Form,
        Button,
        Input,
        Field,
        Label,
        NaviDebug,
        Slide,
        SlideContainer,
        stateSignal,
        Text,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const App = () => {
        return (
          <NaviDebug debugAction debugInteraction>
            <div>
              <DemoHeader
                title="Form demo"
                next={{
                  href: "./18_form_integration_demo.html",
                  label: "Form integration",
                }}
              />
              <TableOfContents />
              <BasicFormDemo />
              <UnchangedDemo />
              <FormWithButtonActionDemo />
              <TwoSubmitButtonsDemo />
              <MultiFieldValidationTest />
              <h2 style={{ margin: "40px 20px 0" }}>Input types in forms</h2>
              <FormTextDemo />
              <FormEmailDemo />
              <FormPasswordDemo />
              <FormNumberDemo />
              <FormDateDemo />
              <FormDatetimeDemo />
              <FormTimeDemo />
              <FormSearchDemo />
              <FormTelDemo />
              <FormRangeDemo />
              <FormCheckboxDemo />
            </div>
          </NaviDebug>
        );
      };

      const TableOfContents = () => (
        <div className="test-container">
          <h2>Table of contents</h2>
          <DocumentToc />
        </div>
      );

      const BasicFormDemo = () => {
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="basic">
            <h2>Basic form</h2>
            <Form
              name="basic"
              action={async ({ username }) => {
                await new Promise((r) => setTimeout(r, 600));
                return `Hello, ${username}!`;
              }}
              onActionError={(err) =>
                setResult({ ok: false, value: err.message })
              }
              onActionEnd={(value) => setResult({ ok: true, value })}
            >
              <div className="field">
                <Field>
                  <Label>Username</Label>
                  <Input type="text" name="username" defaultValue="dam" />
                </Field>
              </div>
              <Button type="submit">Submit</Button>
            </Form>
            {result && (
              <div className={`status ${result.ok ? "success" : "error"}`}>
                {result.value}
              </div>
            )}
          </div>
        );
      };

      // ── Submitting an unchanged form ──────────────────────────────────────

      // Four forms, one question: does the action run when submit is pressed
      // without touching anything? What separates them is only where the field's
      // starting content comes from — nothing, a value, a suggestion.
      const UnchangedCase = ({
        id,
        title,
        note,
        children,
        expectation,
        formProps,
        submitProps,
      }) => {
        const [log, setLog] = useState([]);
        return (
          <div className="test-container" id={id}>
            <h3>{title}</h3>
            <p className="desc">{note}</p>
            <Form
              name={id}
              flex="y"
              spacing="m"
              alignX="start"
              // --navi-void: a command that does nothing but say it ran. It is
              // what a dialog's own close (or a slide's move) would be here, so
              // the log shows the two halves apart — "the action ran" and "what
              // follows a send ran".
              command="--navi-void"
              action={(value) => {
                setLog((previous) => [
                  ...previous,
                  `action ← ${JSON.stringify(value)}`,
                ]);
              }}
              {...formProps}
            >
              {children}
              <Button type="submit" {...submitProps}>
                Submit
              </Button>
            </Form>
            <div className="form-params" data-toc-ignore>
              <h3>{expectation}</h3>
              <pre>{log.length ? log.join("\n") : "— nothing yet —"}</pre>
            </div>
          </div>
        );
      };

      // A signal carrying a default: navi seeds the input's defaultValue from
      // it, so the field is uncontrolled-with-a-suggestion — the same shape as
      // the defaultValue case above it, said with a signal.
      const ageSignal = stateSignal(18, { id: "age" });

      const UnchangedDemo = () => (
        <div className="test-container" id="unchanged">
          <h2>Submitting an unchanged form</h2>
          <p className="desc">
            A form only acts on an answer that is actually new. What counts as
            "new" is the point of the four cases below: a <code>value</code> is
            what the form <em>holds</em>, a <code>defaultValue</code> (from the
            prop or from a signal's default) is only a <em>suggestion</em> — and
            sending a suggestion back is a real answer.
          </p>
          <p className="desc">
            Every form carries <code>command="--navi-void"</code>, which logs
            nothing but always runs: in a dialog that command would be the
            close. So a press that logs no action still went through — which is
            why a dialog closes on it.
          </p>

          <UnchangedCase
            id="unchanged-empty"
            title="1. An empty field"
            note="No value, no defaultValue: the form holds nothing and shows nothing."
            expectation="Expected: the log below does not grow when you submit without modifying anything"
          >
            <Field vertical>
              <Label>Name</Label>
              <Input name="name" />
            </Field>
          </UnchangedCase>

          <UnchangedCase
            id="unchanged-value"
            title="2. A field with a value"
            note='value="Ada": the form holds it, so submitting it back says nothing new.'
            expectation="Expected: the log below does not grow when you submit without modifying anything"
          >
            <Field vertical>
              <Label>Name</Label>
              <Input name="name" value="Ada" readOnly={false} />
            </Field>
          </UnchangedCase>

          <UnchangedCase
            id="unchanged-default-value"
            title="3. A field with a defaultValue"
            note='defaultValue="18": a suggestion the form does not hold — "yes, 18" is an answer.'
            expectation="Expected: the log below grows on the FIRST submit even without modifying anything — then stops, since that value has now been sent"
          >
            <Field vertical>
              <Label>Age</Label>
              <Input name="age" defaultValue="18" />
            </Field>
          </UnchangedCase>

          <UnchangedCase
            id="unchanged-signal-default"
            title="4. A field bound to a signal that has a default"
            note="Same as 3, said with a signal: the signal carries the default, so the field is uncontrolled-with-a-suggestion."
            expectation="Expected: the log below grows on the FIRST submit even without modifying anything — then stops, since that value has now been sent"
          >
            <Field vertical>
              <Label>Age</Label>
              <Input name="age" signal={ageSignal} />
            </Field>
          </UnchangedCase>

          <UnchangedCase
            id="unchanged-read-only-button"
            title="5. readOnlyWhileFormUnchanged, on the submit button"
            note="Case 2 again, with a button that would rather say it is waiting than accept a press that sends nothing. Press it as is to hear why, then type."
            expectation="Expected: the button is read-only until you modify the field"
            submitProps={{ readOnlyWhileFormUnchanged: true }}
          >
            <Field vertical>
              <Label>Name</Label>
              <Input name="name" value="Ada" />
            </Field>
          </UnchangedCase>

          <UnchangedCase
            id="unchanged-can-send"
            title="6. canSendWhileUnchanged, on the form"
            note="Case 2 again, for a form where sending the same thing twice is the point — a notification, an action whose duplicates are fine."
            expectation="Expected: the log below grows on every press"
            formProps={{ canSendWhileUnchanged: true }}
          >
            <Field vertical>
              <Label>Name</Label>
              <Input name="name" value="Ada" />
            </Field>
          </UnchangedCase>
        </div>
      );

      const FormWithButtonActionDemo = () => {
        const [formResult, setFormResult] = useState(null);
        const [previewResult, setPreviewResult] = useState(null);
        return (
          <div className="test-container" id="button-action">
            <h2>Form with a button that has its own action</h2>
            <p>
              The <strong>Preview</strong> button uses the form values but calls
              its own action — it does not submit the form. Only{" "}
              <strong>Submit</strong> triggers the form action.
            </p>
            <Form
              name="with-button-action"
              action={async ({ message }) => {
                await new Promise((r) => setTimeout(r, 600));
                return `Submitted: "${message}"`;
              }}
              onActionEnd={(value) => setFormResult({ ok: true, value })}
              onActionError={(err) =>
                setFormResult({ ok: false, value: err.message })
              }
            >
              <div className="field">
                <Field>
                  <Label>Message</Label>
                  <Input type="text" name="message" defaultValue="message" />
                </Field>
              </div>
              <div style={{ display: "flex", gap: "8px", marginTop: "8px" }}>
                <Button
                  action={async ({ message }) => {
                    await new Promise((r) => setTimeout(r, 400));
                    return `Preview: "${message}"`;
                  }}
                  onActionEnd={(value) => setPreviewResult({ ok: true, value })}
                  onActionError={(err) =>
                    setPreviewResult({ ok: false, value: err.message })
                  }
                >
                  Preview
                </Button>
                <Button type="submit">Submit</Button>
              </div>
            </Form>
            {previewResult && (
              <div
                className={`status ${previewResult.ok ? "success" : "error"}`}
              >
                {previewResult.value}
              </div>
            )}
            {formResult && (
              <div className={`status ${formResult.ok ? "success" : "error"}`}>
                {formResult.value}
              </div>
            )}
          </div>
        );
      };

      // Two ways to send the same form: the action is told which button asked
      // (it carries a name and a value, like any field), and what follows the
      // send is that button's own business too — `formCommand`, next to the
      // form's `command`, the way the browser's own formaction sits next to
      // action.
      const TwoSubmitButtonsDemo = () => {
        const [log, setLog] = useState([]);
        const append = (line) => setLog((previous) => [...previous, line]);
        return (
          <div className="test-container" id="two-submits">
            <h2>Two submit buttons in one form</h2>
            <p>
              Both send the form and both put it in loading while the action
              runs — save stays on the slide, delete moves on to the next one. A
              button with an action of its own is the other way round: only it
              goes loading, and the form is left alone —{" "}
              <a href="#button-action">see above</a>, and{" "}
              <a href="./01_button_demo.html#interactivity-form-own-action">
                in the button demo
              </a>
              .
            </p>
            <div style={{ width: "320px", border: "1px solid #90caf9" }}>
              <SlideContainer>
                <Slide id="two_submits_edit" overflow="auto">
                  <Form
                    name="two-submits"
                    action={async ({ name, intent }) => {
                      await new Promise((r) => setTimeout(r, 700));
                      append(`${intent}: "${name}"`);
                      return intent;
                    }}
                  >
                    <Box padding="m" flex="y" spacing="s">
                      <Field>
                        <Label>Name</Label>
                        <Input type="text" name="name" defaultValue="Ada" />
                      </Field>
                      <Box flex spacing="s">
                        {/* Stays here: --navi-void is how one says "nothing
                            follows my send" — without it the form would do what
                            a form in a slide does, and move on. */}
                        <Button
                          type="submit"
                          name="intent"
                          value="save"
                          formCommand="--navi-void"
                        >
                          Save
                        </Button>
                        {/* Goes: this button says what follows ITS own send. */}
                        <Button
                          type="submit"
                          name="intent"
                          value="delete"
                          formCommand="--navi-go-to-slide:two_submits_gone"
                          variant="discrete"
                        >
                          Delete
                        </Button>
                      </Box>
                    </Box>
                  </Form>
                </Slide>
                <Slide id="two_submits_gone" overflow="auto">
                  <Box padding="m" flex="y" spacing="s" alignX="start">
                    <Text>Deleted.</Text>
                    <Button command="--navi-back" variant="discrete">
                      back
                    </Button>
                  </Box>
                </Slide>
              </SlideContainer>
            </div>
            <div className="status success" style={{ minHeight: "1.5em" }}>
              {log.join(" · ")}
            </div>
          </div>
        );
      };

      const MultiFieldValidationTest = () => {
        const [submitStatus, setSubmitStatus] = useState(null);
        const [validationErrors, setValidationErrors] = useState([]);
        const [formParams, setFormParams] = useState(null); // ✅ New state for form params

        const handleFormExecutePrevented = (event) => {
          console.log("❌ Form execute prevented event:", event);
          const reason = event.detail;

          if (reason === "validation_failed") {
            setSubmitStatus("error");
            setFormParams(null); // ✅ Clear params on validation failure

            // Collecter toutes les erreurs de validation
            const form = event.target;
            const errors = [];

            // Parcourir tous les éléments du formulaire
            const formElements = form.querySelectorAll(
              "input, select, textarea",
            );
            formElements.forEach((element) => {
              const validationInterface = element.__validationInterface__;
              if (validationInterface) {
                // Vérifier si l'élément a des erreurs
                if (
                  !element.checkValidity() ||
                  !validationInterface.checkValidity?.()
                ) {
                  const fieldName = element.name || element.id || element.type;
                  const validationMessage =
                    element.validationMessage || "Invalid value";
                  errors.push(`${fieldName}: ${validationMessage}`);
                }
              }
            });

            setValidationErrors(errors);
          }
        };

        return (
          <div className="test-container" id="multi-field">
            <h2>Formulaire avec validation multiple</h2>
            <p>
              Ce formulaire contient plusieurs champs avec différentes
              contraintes. Essayez de soumettre avec des valeurs invalides pour
              voir toutes les erreurs.
            </p>

            <Form
              onReset={() => {
                setSubmitStatus(null);
                setValidationErrors([]);
                setFormParams(null); // ✅ Clear params on reset
              }}
              onExecutePrevented={handleFormExecutePrevented}
              action={async (params) => {
                console.log("🎯 Form execute event with params:", params);

                // ✅ Store form params in state
                setFormParams(params);
                setSubmitStatus("executing...");
                setValidationErrors([]);
                await new Promise((resolve) => setTimeout(resolve, 2_000));
                setSubmitStatus("Form submitted successfully!");
              }}
            >
              {/* ✅ Champ requis */}
              <Field vertical>
                <Label>Nom (obligatoire) :</Label>
                <Input name="name" required placeholder="Entrez votre nom" />
              </Field>

              {/* ✅ Champ email avec validation type */}
              <Field vertical>
                <Label>Email (format email) :</Label>
                <Input
                  name="email"
                  type="email"
                  placeholder="exemple@domain.com"
                />
              </Field>

              {/* ✅ Champ avec pattern */}
              <Field vertical>
                <Label>Téléphone (format: 01-23-45-67-89) :</Label>
                <Input
                  name="phone"
                  pattern="[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}"
                  pattern-validation-message="Doit respecter le format <strong>01-23-45-67-89</strong>."
                  placeholder="01-23-45-67-89"
                />
              </Field>

              {/* ✅ Champ avec longueur minimum */}
              <Field vertical>
                <Label>Mot de passe (min 8 caractères) :</Label>
                <Input
                  name="password"
                  type="password"
                  minLength="8"
                  placeholder="Au moins 8 caractères"
                />
              </Field>

              {/* ✅ Champ avec contrainte personnalisée */}
              <Field vertical>
                <Label>Âge (18-99 ans) :</Label>
                <Input
                  name="age"
                  type="number"
                  min="18"
                  min-validation-message="L'age doit être de <strong>18</strong> ans ou plus."
                  max="99"
                  max-validation-message="L'age doit être de <strong>99</strong> ans ou moins."
                  placeholder="18"
                />
              </Field>

              {/* ✅ Bouton de soumission */}
              <div className="field">
                <Button type="submit">Valider le formulaire</Button>
                <Button type="reset">Reset Status</Button>
              </div>
            </Form>

            {/* ✅ Affichage des paramètres du formulaire */}
            {formParams && (
              <div className="form-params" data-toc-ignore>
                <div className="panel-title">
                  📋 Paramètres du formulaire soumis :
                </div>
                <pre>{JSON.stringify(formParams, null, 2)}</pre>
              </div>
            )}

            {/* ✅ Affichage du statut */}
            {submitStatus && (
              <div
                className={`status ${submitStatus === "error" ? "error" : "success"}`}
              >
                {submitStatus === "error" ? (
                  <div>
                    <strong>❌ Validation échouée</strong>
                    {validationErrors.length > 0 && (
                      <div className="validation-errors">
                        <p>Erreurs détectées :</p>
                        <ul>
                          {validationErrors.map((error, index) => (
                            <li key={index}>{error}</li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>
                ) : (
                  <strong>✅ {submitStatus}</strong>
                )}
              </div>
            )}

            {/* ✅ Instructions de test */}
            <div
              style={{
                marginTop: "30px",
                padding: "15px",
                backgroundColor: "#f8f9fa",
                borderRadius: "4px",
              }}
            >
              <h3>Instructions de test :</h3>
              <ol>
                <li>
                  <strong>Test 1</strong> : Laissez tous les champs vides et
                  cliquez "Valider" → Doit montrer toutes les erreurs
                </li>
                <li>
                  <strong>Test 2</strong> : Remplissez partiellement (ex: nom
                  seulement) → Doit montrer les erreurs restantes
                </li>
                <li>
                  <strong>Test 3</strong> : Entrez des valeurs invalides (ex:
                  email sans @, âge inf. 18) → Doit montrer les erreurs
                  spécifiques
                </li>
                <li>
                  <strong>Test 4</strong> : Remplissez tout correctement → Doit
                  permettre la soumission et afficher les paramètres
                </li>
              </ol>
            </div>
          </div>
        );
      };

      const delay = (ms) => new Promise((r) => setTimeout(r, ms));

      // Helper to display what was submitted
      const SubmitResult = ({ result }) => {
        if (!result) {
          return null;
        }
        return (
          <div className="form-params" data-toc-ignore>
            <strong>Submitted:</strong>
            <pre>{JSON.stringify(result, null, 2)}</pre>
          </div>
        );
      };

      const FormTextDemo = () => {
        const [username, setUsername] = useState("dam");
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="form-text">
            <h3>text</h3>
            <Form
              action={async ({ username: v }) => {
                await delay(600);
                setUsername(v);
                setResult({ username: v });
              }}
            >
              <Field>
                <Label>Username</Label>
                <Input
                  name="username"
                  required
                  minLength="2"
                  value={username}
                />
              </Field>
              <Button type="submit" style={{ marginTop: "8px" }}>
                Submit
              </Button>
            </Form>
            <SubmitResult result={result} />
          </div>
        );
      };

      const FormEmailDemo = () => {
        const [email, setEmail] = useState("dam@example.com");
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="form-email">
            <h3>email</h3>
            <Form
              action={async ({ email: v }) => {
                await delay(600);
                setEmail(v);
                setResult({ email: v });
              }}
            >
              <Field>
                <Label>Email</Label>
                <Input name="email" type="email" required value={email} />
              </Field>
              <Button type="submit" style={{ marginTop: "8px" }}>
                Submit
              </Button>
            </Form>
            <SubmitResult result={result} />
          </div>
        );
      };

      const FormPasswordDemo = () => {
        const [password, setPassword] = useState("secret123");
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="form-password">
            <h3>password</h3>
            <Form
              action={async ({ password: v }) => {
                await delay(600);
                setPassword(v);
                setResult({ password: "***" });
              }}
            >
              <Field>
                <Label>Password</Label>
                <Input
                  name="password"
                  type="password"
                  required
                  minLength="8"
                  value={password}
                />
              </Field>
              <Button type="submit" style={{ marginTop: "8px" }}>
                Submit
              </Button>
            </Form>
            <SubmitResult result={result} />
          </div>
        );
      };

      const FormNumberDemo = () => {
        const [age, setAge] = useState(25);
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="form-number">
            <h3>number</h3>
            <Form
              action={async ({ age: v }) => {
                await delay(600);
                setAge(Number(v));
                setResult({ age: v });
              }}
            >
              <Field>
                <Label>Age</Label>
                <Input
                  name="age"
                  type="number"
                  required
                  min="0"
                  max="120"
                  value={age}
                />
              </Field>
              <Button type="submit" style={{ marginTop: "8px" }}>
                Submit
              </Button>
            </Form>
            <SubmitResult result={result} />
          </div>
        );
      };

      const FormDateDemo = () => {
        const [date, setDate] = useState("2024-06-15");
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="form-date">
            <h3>date</h3>
            <Form
              action={async ({ birthday: v }) => {
                await delay(600);
                setDate(v);
                setResult({ birthday: v });
              }}
            >
              <Field>
                <Label>Birthday</Label>
                <Input name="birthday" type="date" required value={date} />
              </Field>
              <Button type="submit" style={{ marginTop: "8px" }}>
                Submit
              </Button>
            </Form>
            <SubmitResult result={result} />
          </div>
        );
      };

      const FormDatetimeDemo = () => {
        const [datetime, setDatetime] = useState("2024-06-15T14:30");
        const [result, setResult] = useState(null);
        return (
          <div className="test-container" id="form-datetime">
            <h3>datetime-local</h3>
            <Form
              action={async ({ meeting: v }) => {
                await delay(600);
                setDatetime(v);
                setResult({ meeting: v });
              }}
            >
              <Field>
                <Label>Meeting</Label>
                <Input
                  name="meeting"
                  type="datetime-local"
                  required
                  value={datetime}
                />
              </Field>
              <Button type="submit" style={{ marginTop: "8px" }}>
                Submit
              </Button>
            </Form>
            <SubmitResult result={result} />
          </div>
        );
      };

      const FormTimeDemo = () => {
