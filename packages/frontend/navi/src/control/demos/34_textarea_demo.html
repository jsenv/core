<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Textarea demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Form,
        Label,
        Link,
        Text,
        Textarea,
        TextareaCharCount,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const Variant = ({ caption, children }) => (
        <Box flex="y" spacing="xs" alignX="start">
          <Text size="s" color="#666">
            {caption}
          </Text>
          {children}
        </Box>
      );

      const THREE_LINES = `La première ligne
la deuxième
et la troisième`;

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Textarea"
            previous={{ href: "./33_day_spin_demo.html", label: "Day spin" }}
            next={{ href: "./35_input_tel_demo.html", label: "Input tel" }}
          />
          <div class="demo-section">
            <h2 style="margin: 0 0 4px">Sommaire</h2>
            <DocumentToc />
          </div>
          <BasicsDemo />
          <StatesDemo />
          <RowsDemo />
          <CharCountDemo />
          <ActionDemo />
          <FormDemo />
        </Box>
      );

      // ── Basics ────────────────────────────────────────────────────────────

      const BasicsDemo = () => (
        <div class="demo-section">
          <Heading id="nominal">Cas nominal</Heading>
          <p class="desc">La boîte grandit avec ce qu'on y tape.</p>
          <Textarea name="message" placeholder="Écrire quelque chose…" />
        </div>
      );

      // ── États ─────────────────────────────────────────────────────────────

      const StatesDemo = () => (
        <div class="demo-section">
          <Heading id="states">États</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption="readOnly">
              <Textarea defaultValue={THREE_LINES} readOnly />
            </Variant>
            <Variant caption="disabled">
              <Textarea defaultValue={THREE_LINES} disabled />
            </Variant>
            <Variant caption="loading">
              <Textarea defaultValue={THREE_LINES} loading />
            </Variant>
            <Variant caption="focus visible">
              <Textarea
                defaultValue={THREE_LINES}
                pseudoState={{ ":focus-visible": true }}
              />
            </Variant>
          </Box>
        </div>
      );

      // ── minRows / maxRows ─────────────────────────────────────────────────

      const RowsDemo = () => (
        <div class="demo-section">
          <Heading id="rows">minRows / maxRows</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption="par défaut (minRows=1.5) : une ligne et demie, assez pour lire « multiligne »">
              <Textarea placeholder="Écrire quelque chose…" />
            </Variant>
            <Variant caption="minRows={1}">
              <Textarea minRows={1} placeholder="Une ligne" />
            </Variant>
            <Variant caption="minRows={2}">
              <Textarea minRows={2} placeholder="Deux lignes" />
            </Variant>
            <Variant caption="minRows={4}">
              <Textarea minRows={4} placeholder="Quatre lignes" />
            </Variant>
            <Variant caption="maxRows={4} : au-delà, ça défile">
              <Textarea
                maxRows={4}
                defaultValue={`Un
deux
trois
quatre
cinq
six`}
              />
            </Variant>
            <Variant caption="resizable : la poignée verticale du navigateur">
              <Textarea resizable defaultValue={THREE_LINES} />
            </Variant>
          </Box>
        </div>
      );

      // ── TextareaCharCount ─────────────────────────────────────────────────

      const CharCountExample = ({ maxLength, maxLengthGuard, placement }) => {
        const [text, setText] = useState("Déjà un début de message.");
        const textarea = (
          <Textarea
            value={text}
            uiAction={(v) => {
              setText(v);
            }}
            maxLength={maxLength}
            maxLengthGuard={maxLengthGuard}
          />
        );
        const count = (
          <TextareaCharCount
            value={text}
            maxLength={maxLength ?? maxLengthGuard}
          />
        );
        if (placement === "beside") {
          return (
            <Box flex spacing="m" alignY="start">
              {textarea}
              <Box flex spacing="xs" alignY="center">
                <Text size="s" color="#666">
                  longueur :
                </Text>
                {count}
              </Box>
            </Box>
          );
        }
        return (
          <Box inline flex="y" alignX="end" spacing="xxs">
            {textarea}
            {count}
          </Box>
        );
      };

      const CharCountDemo = () => (
        <div class="demo-section">
          <Heading id="char-count">TextareaCharCount</Heading>
          <p class="desc">
            Le compteur est un composant à part : c'est l'appelant qui le place
            et le nourrit de la même valeur que le textarea.
          </p>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption="sous la boîte à droite, avec maxLength={100} : « 25/100 »">
              <CharCountExample maxLength={100} />
            </Variant>
            <Variant caption="avec maxLengthGuard={100} : taper au-delà est bloqué">
              <CharCountExample maxLengthGuard={100} />
            </Variant>
            <Variant caption="sans maxLength : les caractères tapés">
              <CharCountExample />
            </Variant>
            <Variant caption="posé ailleurs : à côté du champ">
              <CharCountExample maxLength={100} placement="beside" />
            </Variant>
          </Box>
        </div>
      );

      // ── uiAction / action ─────────────────────────────────────────────────

      const ActionDemo = () => {
        const [entries, push, clear] = useCallLog();
        return (
          <div class="demo-section">
            <Heading id="actions">uiAction / action</Heading>
            <Box flex="y" spacing="s" alignX="start">
              <Textarea
                placeholder="Taper, puis quitter le champ…"
                uiAction={(value, event) => {
                  push("uiAction", value, event);
                }}
                action={(value) => {
                  push("action", value);
                }}
              />
              <CallLog entries={entries} onClear={clear} />
            </Box>
          </div>
        );
      };

      // ── Dans un formulaire ────────────────────────────────────────────────

      const FormDemo = () => {
        const [result, setResult] = useState(null);
        return (
          <div class="demo-section">
            <Heading id="form">Dans un formulaire</Heading>
            <p class="desc">
              <code>required</code> et <code>maxLength=20</code> : soumettre tel
              quel (trop long), puis vidé, montre les deux refus.
            </p>
            <Form
              name="textarea_form"
              action={({ message }) => `Envoyé : ${message}`}
              onActionEnd={(value) => {
                setResult(value);
              }}
            >
              <Box flex="y" spacing="s" alignX="start">
                <Field>
                  <Label>Message</Label>
                  <Textarea
                    name="message"
                    required
                    maxLength={20}
                    defaultValue="Un message beaucoup trop long pour la limite"
                  />
                </Field>
                <Button type="submit">Envoyer</Button>
              </Box>
            </Form>
            {result && (
              <Text size="s" color="#2e7d32">
                {result}
              </Text>
            )}
          </div>
        );
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
