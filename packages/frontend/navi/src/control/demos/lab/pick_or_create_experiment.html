<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXP: choisir dans une liste, ou créer ce qui n'existe pas</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        color: #1a1a2e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #eef1f5;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.3rem;
      }
      .intro {
        margin: 0 0 20px;
        color: #555;
        font-size: 13px;
        line-height: 1.5;
      }
      /* A phone-sized column: the constraint that drives every choice here */
      .phone {
        position: relative;
        width: 380px;
        max-width: 100%;
        height: 620px;
        margin: 0 auto 24px;
        background: #fff;
        border: 1px solid #d6dae0;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .phone-scroll {
        height: 100%;
        padding: 16px;
        overflow-y: auto;
      }
      /* Stands in for the floating keyboard: the area a picker must not use */
      .keyboard {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 260px;
        color: #6b7280;
        font-size: 12px;
        text-align: center;
        line-height: 260px;
        background: repeating-linear-gradient(
          45deg,
          #e5e7eb,
          #e5e7eb 8px,
          #dde0e4 8px,
          #dde0e4 16px
        );
        border-top: 1px solid #cbd1d8;
        pointer-events: none;
      }
      .variants {
        display: flex;
        max-width: 1400px;
        margin: 0 auto;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }
      .variant {
        width: 380px;
      }
      .variant > h2 {
        margin: 0 0 2px;
        font-size: 1rem;
      }
      .variant > p {
        min-height: 3.4em;
        margin: 0 0 10px;
        color: #555;
        font-size: 12.5px;
        line-height: 1.45;
      }
      .field-title {
        margin: 0 0 6px;
        color: #444;
        font-weight: 600;
        font-size: 13px;
      }
      .created {
        margin-top: 10px;
        padding: 8px 10px;
        color: #166534;
        font-size: 12px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Choisir dans une liste, ou créer ce qui n'existe pas</h1>
    <p class="intro">
      Quatre façons de répondre au même besoin, à comparer au doigt. La zone
      hachurée en bas figure le clavier : tout ce qui compte doit rester
      au-dessus.
    </p>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import {
        Box,
        Button,
        Dialog,
        Field,
        Input,
        Label,
        List,
        Picker,
        Text,
        useSearchText,
      } from "@jsenv/navi";

      // Few entries on purpose: that is the situation at the start of the app,
      // when "create" is the common path and "pick" the rare one
      const INITIAL_CLUBS = [
        "Mouratoglou Country Club",
        "Padel Attitude Antibes",
        "Set Club Valbonne",
      ];

      const useClubs = () => {
        const clubsSignal = useSignal(INITIAL_CLUBS);
        const add = (name) => {
          if (!clubsSignal.value.includes(name)) {
            clubsSignal.value = [...clubsSignal.value, name];
          }
          return name;
        };
        return [clubsSignal.value, add];
      };

      // An exact match means "pick it", not "create a duplicate of it"
      const normalize = (value) => value.trim().toLowerCase();
      const hasExactMatch = (clubs, searchText) =>
        clubs.some((club) => normalize(club) === normalize(searchText));

      const Phone = ({ children }) => (
        <div class="phone">
          <div class="phone-scroll">{children}</div>
          <div class="keyboard">clavier</div>
        </div>
      );

      const Variant = ({ title, description, children }) => (
        <div class="variant">
          <h2>{title}</h2>
          <p>{description}</p>
          <Phone>{children}</Phone>
        </div>
      );

      const Selected = ({ value, createdSet }) => {
        if (!value) {
          return null;
        }
        return (
          <div class="created">
            {value}
            {createdSet.has(value) ? " — créé à l'instant" : " — existait déjà"}
          </div>
        );
      };

      /* ─────────────────────────────────────────────────────────────────
       * A. La création est une ligne de la liste
       * ───────────────────────────────────────────────────────────────── */
      const VariantCreateRow = () => {
        const [clubs, addClub] = useClubs();
        const selectedSignal = useSignal("");
        const searchSignal = useSignal("");
        const createdSignal = useSignal(new Set());
        const [matchingClubs, getMatchInfo] = useSearchText(
          searchSignal.value,
          clubs,
        );
        const typed = searchSignal.value.trim();
        const canCreate = typed !== "" && !hasExactMatch(clubs, typed);

        return (
          <>
            <p class="field-title">Lieu</p>
            <Field vertical>
              <Picker
                name="club_a"
                placeholder="Choisir un club…"
                value={selectedSignal.value}
                action={(value) => {
                  selectedSignal.value = value;
                }}
                expandX
              >
                <Box flex="y" spacing="s" padding="s">
                  <Input
                    navi-list="club_a_list"
                    type="search"
                    placeholder="Rechercher ou saisir un nom…"
                    value={searchSignal.value}
                    uiAction={(value) => {
                      searchSignal.value = value;
                    }}
                    autoComplete="off"
                    autoFocus="fallback"
                    expandX
                    discrete
                  />
                  <List
                    selectable
                    id="club_a_list"
                    command="--navi-send"
                    maxHeight="180"
                    searchText={searchSignal.value}
                    separator
                    searchFallback={null}
                  >
                    {matchingClubs.map((club, i) => (
                      <List.Item
                        selectable
                        key={club}
                        id={`club_a_${club}`}
                        index={i}
                        value={club}
                        selected={selectedSignal.value === club}
                        matchInfo={getMatchInfo(club)}
                        padding="s"
                      >
                        {club}
                      </List.Item>
                    ))}
                    {canCreate && (
                      <List.Item
                        selectable
                        key="__create__"
                        id="club_a_create"
                        index={matchingClubs.length}
                        value={typed}
                        padding="s"
                        onClick={() => {
                          addClub(typed);
                          createdSignal.value = new Set([
                            ...createdSignal.value,
                            typed,
                          ]);
                        }}
                      >
                        <Text>+ Créer « {typed} »</Text>
                      </List.Item>
                    )}
                  </List>
                </Box>
              </Picker>
            </Field>
            <Selected
              value={selectedSignal.value}
              createdSet={createdSignal.value}
            />
          </>
        );
      };

      /* ─────────────────────────────────────────────────────────────────
       * B. La création est une barre collée en bas du picker
       * ───────────────────────────────────────────────────────────────── */
      const VariantStickyFooter = () => {
        const [clubs, addClub] = useClubs();
        const selectedSignal = useSignal("");
        const searchSignal = useSignal("");
        const createdSignal = useSignal(new Set());
        const [matchingClubs, getMatchInfo] = useSearchText(
          searchSignal.value,
          clubs,
        );
        const typed = searchSignal.value.trim();
        const canCreate = typed !== "" && !hasExactMatch(clubs, typed);

        return (
          <>
            <p class="field-title">Lieu</p>
            <Field vertical>
              <Picker
                name="club_b"
                placeholder="Choisir un club…"
                value={selectedSignal.value}
                action={(value) => {
                  selectedSignal.value = value;
                }}
                expandX
              >
                <Box flex="y" spacing="s" padding="s">
                  <Input
                    navi-list="club_b_list"
                    type="search"
                    placeholder="Rechercher ou saisir un nom…"
                    value={searchSignal.value}
                    uiAction={(value) => {
                      searchSignal.value = value;
                    }}
                    autoComplete="off"
                    autoFocus="fallback"
                    expandX
                    discrete
                  />
                  <List
                    selectable
                    id="club_b_list"
                    command="--navi-send"
                    maxHeight="150"
                    searchText={searchSignal.value}
                    separator
                    searchFallback={
                      <Box padding="s">
                        <Text>Aucun club ne correspond.</Text>
                      </Box>
                    }
                  >
                    {matchingClubs.map((club, i) => (
                      <List.Item
                        selectable
                        key={club}
                        id={`club_b_${club}`}
                        index={i}
                        value={club}
                        selected={selectedSignal.value === club}
                        matchInfo={getMatchInfo(club)}
                        padding="s"
                      >
                        {club}
                      </List.Item>
                    ))}
                  </List>
                  {canCreate && (
                    <Button
                      command="--navi-send"
                      value={typed}
                      expandX
                      onClick={() => {
                        addClub(typed);
                        createdSignal.value = new Set([
                          ...createdSignal.value,
                          typed,
                        ]);
                      }}
                    >
                      + Créer « {typed} »
                    </Button>
                  )}
                </Box>
              </Picker>
            </Field>
            <Selected
              value={selectedSignal.value}
              createdSet={createdSignal.value}
            />
          </>
        );
      };

      /* ─────────────────────────────────────────────────────────────────
       * C. Le texte saisi est la valeur, la liste ne fait que suggérer
       * ───────────────────────────────────────────────────────────────── */
      const VariantFreeText = () => {
        const [clubs, addClub] = useClubs();
        const valueSignal = useSignal("");
        const createdSignal = useSignal(new Set());
        const [matchingClubs, getMatchInfo] = useSearchText(
          valueSignal.value,
          clubs,
        );
        const typed = valueSignal.value.trim();
        const isNew = typed !== "" && !hasExactMatch(clubs, typed);

        return (
          <>
            <p class="field-title">Lieu</p>
            <Field vertical>
              <Input
                navi-list="club_c_list"
                type="search"
                placeholder="Nom du club…"
                value={valueSignal.value}
                uiAction={(value) => {
                  valueSignal.value = value;
                }}
                autoComplete="off"
                expandX
              />
              <List
                selectable
                id="club_c_list"
                maxHeight="150"
                searchText={valueSignal.value}
                separator
                searchFallback={null}
                action={(value) => {
                  valueSignal.value = value;
                }}
              >
                {matchingClubs.map((club, i) => (
                  <List.Item
                    selectable
                    key={club}
                    id={`club_c_${club}`}
                    index={i}
                    value={club}
                    matchInfo={getMatchInfo(club)}
                    padding="s"
                  >
                    {club}
                  </List.Item>
                ))}
              </List>
            </Field>
            {isNew && (
              <Box paddingY="xs">
                <Text>
                  « {typed} » sera ajouté à la liste des clubs.{" "}
                  <Button
                    discrete
                    onClick={() => {
                      addClub(typed);
                      createdSignal.value = new Set([
                        ...createdSignal.value,
                        typed,
                      ]);
                    }}
                  >
                    Confirmer
                  </Button>
                </Text>
              </Box>
            )}
            <Selected
              value={valueSignal.value}
              createdSet={createdSignal.value}
            />
          </>
        );
      };

      /* ─────────────────────────────────────────────────────────────────
       * D. La création ouvre un mini formulaire dans la même surface
       * ───────────────────────────────────────────────────────────────── */
      const VariantTwoStep = () => {
        const [clubs, addClub] = useClubs();
        const selectedSignal = useSignal("");
        const searchSignal = useSignal("");
        const createdSignal = useSignal(new Set());
        const stepSignal = useSignal("pick"); // "pick" | "create"
        const citySignal = useSignal("");
        const [matchingClubs, getMatchInfo] = useSearchText(
          searchSignal.value,
          clubs,
        );
        const typed = searchSignal.value.trim();
        const canCreate = typed !== "" && !hasExactMatch(clubs, typed);

        return (
          <>
            <p class="field-title">Lieu</p>
            <Field vertical>
              <Picker
                name="club_d"
                placeholder="Choisir un club…"
                value={selectedSignal.value}
                action={(value) => {
                  selectedSignal.value = value;
                }}
                expandX
              >
                {stepSignal.value === "pick" ? (
                  <Box flex="y" spacing="s" padding="s">
                    <Input
                      navi-list="club_d_list"
                      type="search"
                      placeholder="Rechercher ou saisir un nom…"
                      value={searchSignal.value}
                      uiAction={(value) => {
                        searchSignal.value = value;
                      }}
                      autoComplete="off"
                      autoFocus="fallback"
                      expandX
                      discrete
                    />
                    <List
                      selectable
                      id="club_d_list"
                      command="--navi-send"
                      maxHeight="150"
                      searchText={searchSignal.value}
                      separator
                      searchFallback={null}
                    >
                      {matchingClubs.map((club, i) => (
                        <List.Item
                          selectable
                          key={club}
                          id={`club_d_${club}`}
                          index={i}
                          value={club}
                          selected={selectedSignal.value === club}
                          matchInfo={getMatchInfo(club)}
                          padding="s"
                        >
                          {club}
                        </List.Item>
                      ))}
                    </List>
                    {canCreate && (
                      <Button
                        expandX
                        onClick={() => {
                          stepSignal.value = "create";
                        }}
                      >
                        + Créer « {typed} »
                      </Button>
                    )}
                  </Box>
                ) : (
                  <Box flex="y" spacing="s" padding="s">
                    <Button
                      discrete
                      onClick={() => {
                        stepSignal.value = "pick";
                      }}
                    >
                      ‹ Retour
                    </Button>
                    <Field vertical>
                      <Label>Nom</Label>
                      <Input
                        value={searchSignal.value}
                        uiAction={(value) => {
                          searchSignal.value = value;
                        }}
                        expandX
                      />
                    </Field>
                    <Field vertical>
                      <Label>Ville</Label>
                      <Input
                        placeholder="Antibes…"
                        value={citySignal.value}
                        uiAction={(value) => {
                          citySignal.value = value;
                        }}
                        expandX
                      />
                    </Field>
                    <Button
                      command="--navi-send"
                      value={typed}
                      expandX
                      onClick={() => {
                        addClub(typed);
                        createdSignal.value = new Set([
                          ...createdSignal.value,
                          typed,
                        ]);
                        stepSignal.value = "pick";
                      }}
                    >
                      Créer et choisir
                    </Button>
                  </Box>
                )}
              </Picker>
            </Field>
            <Selected
              value={selectedSignal.value}
              createdSet={createdSignal.value}
            />
          </>
        );
      };

      /* ─────────────────────────────────────────────────────────────────
       * E. Le champ se promeut en dialog plein écran au focus
       * ───────────────────────────────────────────────────────────────── */
      const VariantPromoteToDialog = () => {
        const [clubs, addClub] = useClubs();
        const selectedSignal = useSignal("");
        const searchSignal = useSignal("");
        const createdSignal = useSignal(new Set());
        const openSignal = useSignal(false);
        const [matchingClubs, getMatchInfo] = useSearchText(
          searchSignal.value,
          clubs,
        );
        const typed = searchSignal.value.trim();
        const canCreate = typed !== "" && !hasExactMatch(clubs, typed);
        const choose = (club) => {
          selectedSignal.value = club;
          openSignal.value = false;
        };

        return (
          <>
            <p class="field-title">Lieu</p>
            <Field vertical>
              <Input
                type="search"
                placeholder="Choisir un club…"
                value={selectedSignal.value}
                readOnly
                expandX
                onFocus={() => {
                  openSignal.value = true;
                }}
                onClick={() => {
                  openSignal.value = true;
                }}
              />
            </Field>
            <Selected
              value={selectedSignal.value}
              createdSet={createdSignal.value}
            />
            <Dialog
              layer="local"
              positionArea="top"
              marginWithContainer={0}
              animation="slide-from-bottom"
              open={openSignal.value}
              onClose={() => {
                openSignal.value = false;
              }}
              minWidth="100%"
              minHeight="100%"
            >
              <Box flex="y" spacing="s" padding="s" expand>
                {/* The search input sits at the top: the keyboard covers the
                    bottom, so anything docked there would be unreachable */}
                <Box flex="x" spacing="xs" alignY="center">
                  <Button
                    discrete
                    onClick={() => {
                      openSignal.value = false;
                    }}
                  >
                    ‹
                  </Button>
                  <Input
                    navi-list="club_e_list"
                    type="search"
                    placeholder="Rechercher ou saisir un nom…"
                    value={searchSignal.value}
                    uiAction={(value) => {
                      searchSignal.value = value;
                    }}
                    autoComplete="off"
                    autoFocus
                    expandX
                  />
                </Box>
                <List
                  selectable
                  id="club_e_list"
                  searchText={searchSignal.value}
                  separator
                  searchFallback={null}
                  expandY
                  action={choose}
                >
                  {matchingClubs.map((club, i) => (
                    <List.Item
                      selectable
                      key={club}
                      id={`club_e_${club}`}
                      index={i}
                      value={club}
                      selected={selectedSignal.value === club}
                      matchInfo={getMatchInfo(club)}
                      padding="s"
                    >
                      {club}
                    </List.Item>
                  ))}
                </List>
                {canCreate && (
                  <Button
                    expandX
                    onClick={() => {
                      addClub(typed);
                      createdSignal.value = new Set([
                        ...createdSignal.value,
                        typed,
                      ]);
                      choose(typed);
                    }}
                  >
                    + Créer « {typed} »
                  </Button>
                )}
              </Box>
            </Dialog>
          </>
        );
      };

      const App = () => (
        <div class="variants">
          <Variant
            title="A. Créer = une ligne de la liste"
            description="La ligne « + Créer … » apparaît en fin de liste dès que la saisie ne correspond à rien d'existant. Un seul geste, aucun changement de mode, le clavier ne bouge pas."
          >
            <VariantCreateRow />
          </Variant>
          <Variant
            title="B. Créer = une barre sous la liste"
            description="Même déclencheur, mais l'action sort de la liste et reste visible quel que soit le défilement. La liste garde son propre scroll."
          >
            <VariantStickyFooter />
          </Variant>
          <Variant
            title="C. Le texte saisi EST la valeur"
            description="Pas de picker : un champ libre, la liste ne fait que suggérer. Le plus rapide quand la valeur est juste un nom (le cas « saisir un joueur »)."
          >
            <VariantFreeText />
          </Variant>
          <Variant
            title="D. Créer ouvre un mini formulaire"
            description="La même surface bascule sur un formulaire pré-rempli avec le texte saisi. Nécessaire dès que créer demande plus qu'un nom (ville, adresse…)."
          >
            <VariantTwoStep />
          </Variant>
          <Variant
            title="E. Le champ se promeut en plein écran"
            description="Au focus, le champ laisse place à une dialog qui prend tout l'écran : recherche en haut, suggestions en dessous, création en bas. Toute la hauteur restante sert la liste au lieu d'être disputée au clavier."
          >
            <VariantPromoteToDialog />
          </Variant>
        </div>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
