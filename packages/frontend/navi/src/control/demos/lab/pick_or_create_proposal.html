<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROPAL: picker « choisir ou créer »</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        color: #1a1a2e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #eef1f5;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.25rem;
      }
      .intro {
        max-width: 660px;
        margin: 0 0 20px;
        color: #555;
        font-size: 13px;
        line-height: 1.5;
      }
      /* The page itself is the phone: view it with device emulation. There is
         no fake frame any more — a Picker's popup goes to the browser's top
         layer, and a layer="local" one would be confined to the trigger's own
         box, which is the height of a single line. */
      .screen {
        max-width: 380px;
        min-height: 100%;
        margin: 0 auto;
        padding: 16px;
        background: #fff;
        box-shadow: 0 0 0 1px #d6dae0;
      }
      /* Stands in for the floating keyboard. It only shows while a real text
         input has focus, which is the whole point being demonstrated: opening
         the surface must not raise it */
      .keyboard {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483647;
        height: 250px;
        color: #6b7280;
        font-size: 12px;
        text-align: center;
        line-height: 250px;
        background: repeating-linear-gradient(
          45deg,
          #e5e7eb,
          #e5e7eb 8px,
          #dde0e4 8px,
          #dde0e4 16px
        );
        border-top: 1px solid #cbd1d8;
        transform: translateY(100%);
        transition: transform 0.2s ease-out;
        pointer-events: none;
      }
      .keyboard.up {
        transform: none;
      }
      /* The positioned ancestor a layer="local" popup is confined to */
      .frame {
        position: relative;
        width: 320px;
        height: 320px;
        margin: 0 auto 32px;
        border-radius: 12px;
        overflow: hidden;
      }
      .variant-title {
        max-width: 380px;
        margin: 24px auto 8px;
        color: #444;
        font-size: 0.95rem;
      }
      /* navi's own `discrete` resolves to a transparent background, which reads
         as plain white on a white surface. Same mechanism, grey at rest. */
      .navi_dialog .navi_input[data-discrete] {
        --x-background-color: #f1f3f5;
      }
      .navi_dialog .navi_input[data-discrete][data-focus] {
        --x-background-color: #fff;
      }
      .screen-title {
        margin: 0 0 18px;
        font-weight: 600;
        font-size: 1.1rem;
      }
      .field-title {
        margin: 0 0 6px;
        color: #444;
        font-weight: 600;
        font-size: 13px;
      }
      /* The title of a row of fields: the last span sits over the last column
         (same width as the field under it), the first takes the rest */
      .field-title--row {
        display: flex;
        gap: 8px;
      }
      .field-title--row span:first-child {
        flex: 1;
      }
      .field-block {
        margin-bottom: 18px;
      }
      /* Grouped under a shared title: they belong together, so they sit
         together rather than reading as two unrelated fields */
      .field-block--grouped {
        margin-bottom: 8px;
      }
      .chips {
        display: flex;
        gap: 8px;
      }
      .chip {
        padding: 8px 14px;
        font-size: 13px;
        border: 1px solid #cbd1d8;
        border-radius: 8px;
      }
      .chip.on {
        color: #fff;
        background: #1a1a2e;
        border-color: #1a1a2e;
      }
      .required {
        color: #b42318;
      }
      .detail {
        color: #6b7280;
        font-size: 12px;
      }
      /* The family name is what separates two homonyms, so it is the part that
         carries the weight; the given name is only there to disambiguate it */
      .family-name {
        text-transform: uppercase;
      }
      .given-name {
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <h1>Picker « choisir ou créer »</h1>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import {
        Box,
        Button,
        createSearch,
        Dialog,
        Field,
        Icon,
        Input,
        ControlGroup,
        Label,
        List,
        NaviDebug,
        Picker,
        RadioGroup,
        Text,
        useSearchText,
      } from "@jsenv/navi";
      import { ChevronDownSvg } from "@jsenv/navi/src/graphic/icons/chevron_updown_svg.jsx";
      import { ChevronLeftSvg } from "@jsenv/navi/src/graphic/icons/chevron_left_svg.jsx";
      import { HeartSvg } from "@jsenv/navi/src/graphic/icons/heart_svg.jsx";
      import { PlusSvg } from "@jsenv/navi/src/graphic/icons/plus_svg.jsx";

      // Name and detail are both searchable: with homonyms allowed, the detail
      // is often the only thing telling two entries apart, so it has to be
      // reachable from the search box too
      const searchEntry = createSearch({
        name: { getter: (entry) => entry.name, priority: 2 },
        detail: { getter: (entry) => entry.detail || "", priority: 1 },
      });

      let idCounter = 0;
      const nextId = () => `e${++idCounter}`;

      // Both surfaces open over the screen, so both need the same way out, in
      // the same place. The padding is what makes it a comfortable target; the
      // chevron itself stays at text size — the cramped "‹" was a glyph pushed
      // around by the line it sat on, not an icon too small.
      const BackButton = () => (
        <Button
          command="--navi-close"
          icon
          variant="discrete"
          padding="s"
          // reaches back into the surface's own padding: the button's box is
          // mostly air, so aligning that box with the text below leaves the
          // chevron itself looking pushed inward
          marginLeft="-s"
          aria-label="Retour"
        >
          <Icon color="#4b5563">
            <ChevronLeftSvg />
          </Icon>
        </Button>
      );

      /*
       * The field is a real search input, readOnly: it looks and reads exactly
       * like the search box it opens, but the typing happens in the surface,
       * never here. Its clear button still works — that is the one edit it is
       * allowed to receive, and the only way to unset a choice.
       *
       * The surface opens on the list, keyboard down: once the app has lived a
       * while, the people someone plays with are already there and picking is a
       * single tap. Typing, and creating, stay one tap away for the rest.
       */
      const PickOrCreateField = ({
        id,
        popupLayer,
        label,
        placeholder,
        searchPlaceholder,
        surfaceTitle,
        createLabel,
        createTitle,
        // The form itself, as a component: what a place or a player asks for
        // has nothing generic about it, and a list of field descriptors would
        // hide behind an abstraction the very thing this demo is about. It
        // receives the name already typed, and renders navi controls whose
        // names are what submitForm reads.
        createForm,
        toEntry,
        entries,
        recentIds = [],
        onCreate,
        value,
        onChange,
        // undefined when the entity has no such notion (a place); a string when
        // it does, so the field knows to offer it
        sideOverride,
        onSideChange,
      }) => {
        // capitalized: JSX reads a lowercase name as an html tag, and props are
        // camelCase — so the prop is createForm and the element is <CreateForm>
        const CreateForm = createForm;
        const searchSignal = useSignal("");
        const prefillSignal = useSignal("");
        const formId = `${id}_form`;

        // Without a search, the ones used recently come first: that is the tap
        // the mature app is optimized for, and it must land above the fold
        const orderedEntries = searchSignal.value
          ? entries
          : [
              ...recentIds
                .map((recentId) => entries.find((e) => e.id === recentId))
                .filter(Boolean),
              ...entries.filter((e) => !recentIds.includes(e.id)),
            ];
        const [matchingEntries, getMatchInfo] = useSearchText(
          searchSignal.value,
          orderedEntries,
          searchEntry,
        );
        const typed = searchSignal.value.trim();

        // isNew rather than a save round-trip: the backend sees an entry with no
        // id of its own when the match is finally submitted, and registers it
        // then. Nothing to await here, nothing to undo if the user quits.
        const submitForm = (values) => {
          const entry = { id: nextId(), isNew: true, ...toEntry(values) };
          onCreate(entry);
          onChange(entry);
          searchSignal.value = "";
        };

        return (
          <div
            class={label ? "field-block" : "field-block field-block--grouped"}
          >
            {label && <p class="field-title">{label}</p>}
            <Box flex="x" spacing="s" alignY="end">
              {/* Picker, not a hand-made trigger + Dialog: it already owns the
                open/close, the value, the façade (value or placeholder, chevron
                or clear button) and the popup — mode="dialog" just pins the
                shape we want on every device instead of letting it pick. */}
              <Picker
                // explicit id: the popup's history entry is keyed by it, and a
                // generated one neither survives a reload nor stays clear of
                // another component's own
                id={id}
                name={id}
                placeholder={placeholder}
                value={value ? value.id : undefined}
                ui={value ? value.name : undefined}
                clearable
                borderRadius="s"
                mode="dialog"
                popupLayer={popupLayer}
                positionArea="top"
                dialogExpand
                padding="m"
                expandX
                action={(entryId) => {
                  onChange(
                    entryId ? entries.find((e) => e.id === entryId) : null,
                  );
                  searchSignal.value = "";
                }}
              >
                <Box flex="y" spacing="m" padding="m" expand>
                  {/* Header, search, then list — the surface says what it is
                    before saying what can be done in it. The keyboard owns the
                    bottom of the screen, so nothing goes down there. */}
                  <Box flex="x" spacing="xs" alignY="center">
                    <BackButton />
                    {/* 1rem, not the inherited size: this content lives inside
                        the picker, so it would otherwise be sized for a control
                        (13px) while the create form next to it — a plain dialog
                        — sits at the page's own size. Two screens of the same
                        flow, one size. */}
                    <Text expandX fontSize="1rem">
                      <strong>{surfaceTitle}</strong>
                    </Text>
                    {/* Always available, and never disabled: creating does not
                      require having searched first, so the entry point must not
                      depend on the search box holding something */}
                    <Button
                      command="--navi-open"
                      commandFor={formId}
                      icon
                      variant="discrete"
                      padding="s"
                      // same as the back button on the other side, so the two
                      // ends of the header balance
                      marginRight="-s"
                      onClick={() => {
                        prefillSignal.value = "";
                      }}
                    >
                      <Icon size="1.4rem" color="#6b7280">
                        <PlusSvg />
                      </Icon>
                    </Button>
                  </Box>
                  <Input
                    navi-list={`${id}_list`}
                    type="search"
                    placeholder={searchPlaceholder}
                    value={searchSignal.value}
                    uiAction={(next) => {
                      searchSignal.value = next;
                    }}
                    autoComplete="off"
                    // grey at rest, white once focused
                    discrete
                    slotSpacing="s"
                    borderRadius="m"
                    paddingX="m"
                    paddingY="m"
                    expandX
                  />

                  <List
                    selectable
                    id={`${id}_list`}
                    command="--navi-send"
                    searchText={searchSignal.value}
                    separator
                    searchFallback={null}
                    expandY
                  >
                    {matchingEntries.map((entry, i) => (
                      <List.Item
                        selectable
                        key={entry.id}
                        id={`${id}_${entry.id}`}
                        index={i}
                        value={entry.id}
                        selected={value ? value.id === entry.id : false}
                        matchInfo={getMatchInfo(entry)}
                        padding="s"
                      >
                        <Box flex="y">
                          <Text>
                            <PlayerName entry={entry} />
                          </Text>
                          {entry.detail && (
                            <Text className="detail">{entry.detail}</Text>
                          )}
                        </Box>
                      </List.Item>
                    ))}
                    {/* At the bottom of the list rather than below it: it reads
                      as "and if none of these is the one", right where the eye
                      already is. Same form as the +, name prefilled.
                      A footer, not a regular row: it is not one of the
                      candidates — it never takes the selection, never answers
                      to the arrow keys, and stays visible while the matches
                      scroll behind it. */}
                    {typed !== "" && (
                      <List.Item footer key="__create__" id={`${id}_create`}>
                        {/* A Button, not a command on the row itself: the list
                          carries --navi-send, and a row of a sending list is
                          claimed by it — the create row wants a different
                          command, so it needs its own control to carry it. */}
                        <Button
                          command="--navi-open"
                          commandFor={formId}
                          variant="discrete"
                          padding="s"
                          expandX
                          alignX="start"
                          onClick={() => {
                            prefillSignal.value = typed;
                          }}
                        >
                          « {typed} » : {createLabel}
                        </Button>
                      </List.Item>
                    )}
                  </List>
                </Box>
              </Picker>
              {/* Always on the row, not conditional on a selection: it is part of
                what the field is, and appearing later would shift the layout.
                Beside the selection rather than inside the entry — overriding
                the side for tonight must not rewrite the player's own habit, so
                picking another player starts again from that player's default. */}
              {sideOverride !== undefined && (
                <Picker
                  id={`${id}_side`}
                  name={`${id}_side`}
                  value={sideOverride || undefined}
                  ui={sideLabel(sideOverride)}
                  placeholder="—"
                  borderRadius="s"
                  mode="popover"
                  padding="m"
                  slotSpacing="xs"
                  // the width of its column, fixed: left free the field would
                  // resize with what is selected ("—" vs "Les 2") and the row
                  // would jiggle every time the side changes
                  minWidth={SIDE_COLUMN_WIDTH}
                  maxWidth={SIDE_COLUMN_WIDTH}
                  action={onSideChange}
                >
                  <List selectable command="--navi-send" separator>
                    {SIDES.map((side, i) => (
                      <List.Item
                        selectable
                        key={side.value}
                        id={`${id}_side_${side.value}`}
                        index={i}
                        value={side.value}
                        selected={sideOverride === side.value}
                        padding="s"
                      >
                        <Box flex="x" spacing="xs" alignY="center">
                          <Text expandX>{side.label}</Text>
                          {/* The player's own side, marked: it says whether
                              tonight is an override, and it is the way back to
                              the habit once you have left it */}
                          {value && value.side === side.value && (
                            <Icon size="0.9em" color="#b42318">
                              <HeartSvg />
                            </Icon>
                          )}
                        </Box>
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              )}
            </Box>

            {/* Asked once, at creation: an entry is entered a single time in
                its life, and the second field is what will tell homonyms apart
                afterwards. Cheaper here than as an after-the-fact chore nobody
                comes back to do. */}
            <Dialog
              id={formId}
              layer={popupLayer}
              positionArea="top"
              expand
              animation
              padding="m"
            >
              {/* ControlGroup aggregates its children into one object and hands
                  it to action — no per-field signal to wire, and `required`
                  does the gating the disabled button used to do by hand */}
              {/* flex + minHeight 0: the group is what stands between the
                  dialog and the form, so it is what has to accept the dialog's
                  height instead of growing past it — otherwise the scrolling
                  area below never gets a height to work with */}
              <ControlGroup
                action={submitForm}
                spacing="m"
                flex="y"
                expand
                minHeight={0}
              >
                <Box flex="x" spacing="xs" alignY="center">
                  <BackButton />
                  <Text expandX>
                    <strong>{createTitle}</strong>
                  </Text>
                </Box>
                {/* The fields scroll, not the whole surface: the title stays
                      readable and the two buttons stay under the thumb even
                      when the form is taller than what is left of the screen
                      (the keyboard takes half of it). */}
                <Box
                  flex="y"
                  spacing="m"
                  expandY
                  // a flex child refuses to shrink below its content unless
                  // told it may — without this the fields push the dialog
                  // taller instead of scrolling inside it
                  minHeight={0}
                  overflowY="auto"
                >
                  {/* keyed by the prefill: the fields are uncontrolled, so a
                        new name typed in the search must give them a fresh
                        defaultValue rather than keep the previous one */}
                  <CreateForm
                    key={prefillSignal.value}
                    prefill={prefillSignal.value}
                  />
                </Box>
                <Box flex="y" spacing="s">
                  <Button command="--navi-send" expandX paddingY="s">
                    {createTitle}
                  </Button>
                  {/* The same way out as the arrow above, where the thumb
                      already is once the form is filled: giving up on a form
                      should not mean reaching back to the top of the screen */}
                  <Button
                    command="--navi-close"
                    variant="discrete"
                    expandX
                    paddingY="s"
                  >
                    Annuler
                  </Button>
                </Box>
              </ControlGroup>
            </Dialog>
          </div>
        );
      };

      const INITIAL_CLUBS = [
        {
          id: nextId(),
          name: "Mouratoglou Country Club",
          detail: "3550 route des Dolines, Biot",
        },
        {
          id: nextId(),
          name: "Padel Attitude",
          detail: "Chemin de Saint-Claude, Antibes",
        },
        {
          id: nextId(),
          name: "Padel Attitude",
          detail: "Route de Grasse, Valbonne",
        },
      ];
      // Rendered as "Prénom NOM": with homonyms allowed the family name is what
      // separates two entries, so it is the part that carries the emphasis.
      // Falls back to the plain name for an entity that has no such split.
      const PlayerName = ({ entry }) =>
        entry.lastName ? (
          <>
            <span class="given-name">{entry.firstName}</span>{" "}
            <span class="family-name">{entry.lastName}</span>
          </>
        ) : (
          entry.name
        );

      // name is the single searchable/displayable string, firstName/lastName the
      // parts the list emphasizes — kept in sync from one place
      const player = ({ firstName, lastName, detail, side }) => ({
        id: nextId(),
        firstName,
        lastName,
        name: `${firstName} ${lastName}`,
        detail,
        side,
      });
      const INITIAL_PLAYERS = [
        {
          ...player({
            firstName: "Flore",
            lastName: "Giraudier",
            detail: "flore@mail.com",
            side: "left",
          }),
        },
        {
          ...player({
            firstName: "Karim",
            lastName: "Benali",
            detail: "karim@mail.com",
            side: "right",
          }),
        },
        {
          ...player({
            firstName: "Damien",
            lastName: "Maillard",
            detail: "damien@mail.com",
            side: "both",
          }),
        },
        {
          ...player({
            firstName: "Damien",
            lastName: "Martin",
            detail: "d.martin@mail.com",
          }),
        },
        {
          ...player({
            firstName: "Marie-Ange",
            lastName: "Da Silva",
            detail: "ma.dasilva@mail.com",
            side: "left",
          }),
        },
      ];

      // One source for both the side field and the column label above it, so
      // the label stays over the column it names
      const SIDE_COLUMN_WIDTH = "100px";

      const SIDES = [
        { value: "left", label: "Gauche" },
        { value: "right", label: "Droite" },
        { value: "both", label: "Les 2" },
      ];

      const sideLabel = (value) =>
        SIDES.find((side) => side.value === value)?.label;

      // The two forms, written out: this is the part of "create what is not
      // there" that differs per entity, so it is the part worth seeing. The
      // asterisk comes from Label's requiredIndicator, which reads the required
      // state off the control itself — nothing to keep in sync by hand.
      const TextField = ({ label, name, required, ...rest }) => (
        <Field flex="y" spacingWithControl="s">
          <Label requiredIndicator>{label}</Label>
          <Input
            name={name}
            required={required}
            borderRadius="m"
            paddingY="s"
            expandX
            {...rest}
          />
        </Field>
      );

      const PlaceForm = ({ prefill }) => (
        <>
          {/* A place needs a name or an address to be recognizable again;
              demanding both would be a lie, and demanding "one of the two" is
              not something a form says well — so only the name is required */}
          <TextField label="Nom" name="name" required defaultValue={prefill} />
          <TextField label="Adresse" name="address" placeholder="Rue, ville…" />
        </>
      );

      const PlayerForm = ({ prefill }) => (
        <>
          <TextField
            label="Prénom"
            name="firstName"
            required
            defaultValue={prefill}
          />
          <TextField label="Nom" name="lastName" required />
          <TextField label="Email" name="email" placeholder="prenom@mail.com" />
          <Field flex="y" spacingWithControl="s">
            <Label>Côté</Label>
            <RadioGroup name="side" flex="y" spacing="s">
              {SIDES.map((side) => (
                <Field key={side.value} spacing="xs">
                  <Input type="radio" value={side.value} />
                  <Label>{side.label}</Label>
                </Field>
              ))}
            </RadioGroup>
          </Field>
        </>
      );
      // A field nobody filled has no ui state at all — undefined, not "" — so
      // reading one always goes through here. navi is right to tell the two
      // apart; a form that only wants text is the one that has to say so.
      const text = (value) => (value || "").trim();

      const playerToEntry = (values) => {
        const firstName = text(values.firstName);
        const lastName = text(values.lastName);
        return {
          firstName,
          lastName,
          // name stays the searchable/displayable single string; the parts are
          // what let the list emphasize the family name
          name: `${firstName} ${lastName}`.trim(),
          detail: text(values.email),
          side: values.side || "",
        };
      };

      const Screen = ({ idPrefix, popupLayer }) => {
        const clubsSignal = useSignal(INITIAL_CLUBS);
        const playersSignal = useSignal(INITIAL_PLAYERS);
        const clubSignal = useSignal(null);
        const playerSignal = useSignal(null);
        const player2Signal = useSignal(null);
        // Kept beside the selection, not inside the entry: overriding the side
        // for tonight's match must not rewrite the player's own habit. Picking
        // another player therefore starts again from that player's default.
        const sideSignal = useSignal("");
        const side2Signal = useSignal("");
        const selectPlayer = (playerSignal, sideSignal) => (entry) => {
          playerSignal.value = entry;
          sideSignal.value = entry ? entry.side || "" : "";
        };

        const addTo = (listSignal) => (entry) => {
          listSignal.value = [...listSignal.value, entry];
        };

        return (
          <>
            <div class="screen">
              <p class="screen-title">‹ Créer une partie</p>

              <PickOrCreateField
                popupLayer={popupLayer}
                id={`${idPrefix}club`}
                label="Lieu"
                placeholder="Choisir un lieu"
                searchPlaceholder="Rechercher un lieu…"
                surfaceTitle="Choisir un lieu"
                createLabel="ajouter ce lieu"
                createTitle="Ajouter un lieu"
                createForm={PlaceForm}
                toEntry={(values) => ({
                  name: text(values.name),
                  detail: text(values.address),
                })}
                entries={clubsSignal.value}
                recentIds={[INITIAL_CLUBS[0].id]}
                onCreate={addTo(clubsSignal)}
                value={clubSignal.value}
                onChange={(entry) => {
                  clubSignal.value = entry;
                }}
              />

              {/* "Côté" is said once, at the head of the column it names: the
                  rows below are all the same shape, so repeating it on each of
                  them would be three times the words for one meaning */}
              <p class="field-title field-title--row">
                <span>Joueurs</span>
                <span style={{ width: SIDE_COLUMN_WIDTH }}>Côté</span>
              </p>
              <PickOrCreateField
                popupLayer={popupLayer}
                id={`${idPrefix}player`}
                // no placeholder on purpose: an empty row reads as empty, which
                // is exactly what it is — a player slot nobody has to fill
                searchPlaceholder="Rechercher un joueur…"
                surfaceTitle="Choisir un joueur"
                createLabel="ajouter ce joueur"
                createTitle="Ajouter un joueur"
                createForm={PlayerForm}
                toEntry={playerToEntry}
                entries={playersSignal.value}
                recentIds={[INITIAL_PLAYERS[0].id, INITIAL_PLAYERS[1].id]}
                onCreate={addTo(playersSignal)}
                value={playerSignal.value}
                onChange={selectPlayer(playerSignal, sideSignal)}
                sideOverride={sideSignal.value}
                onSideChange={(next) => {
                  sideSignal.value = next;
                }}
              />

              <PickOrCreateField
                popupLayer={popupLayer}
                id={`${idPrefix}player2`}
                searchPlaceholder="Rechercher un joueur…"
                surfaceTitle="Choisir un joueur"
                createLabel="ajouter ce joueur"
                createTitle="Ajouter un joueur"
                createForm={PlayerForm}
                toEntry={playerToEntry}
                entries={playersSignal.value}
                recentIds={[INITIAL_PLAYERS[2].id]}
                onCreate={addTo(playersSignal)}
                value={player2Signal.value}
                onChange={selectPlayer(player2Signal, side2Signal)}
                sideOverride={side2Signal.value}
                onSideChange={(next) => {
                  side2Signal.value = next;
                }}
              />
            </div>
            <div class="keyboard">clavier</div>
          </>
        );
      };

      // debugAll on purpose: this is a lab file, and the interaction logs are the
      // fastest way to see why a click did or did not reach a control
      const App = () => (
        <NaviDebug debugAll>
          <h2 class="variant-title">1. popupLayer="local" — dans le cadre</h2>
          <div class="frame">
            <Screen idPrefix="local_" popupLayer="local" />
          </div>
          <h2 class="variant-title">
            2. top layer — lié au viewport (à voir en émulation d'appareil)
          </h2>
          <Screen idPrefix="top_" />
        </NaviDebug>
      );

      render(<App />, document.querySelector("#app"));

      // The fake keyboard follows the focus, so "did opening the surface raise
      // the keyboard?" can be answered by looking at the screen
      const syncKeyboard = () => {
        const el = document.activeElement;
        const up = Boolean(
          el && el.tagName === "INPUT" && el.type !== "button" && !el.readOnly,
        );
        document.querySelector(".keyboard").classList.toggle("up", up);
      };
      document.addEventListener("focusin", syncKeyboard);
      document.addEventListener("focusout", () => setTimeout(syncKeyboard));
    </script>
  </body>
</html>
