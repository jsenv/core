<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pristineKey + type=object repro</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { memo } from "preact/compat";
      import {
        Box,
        Form,
        Input,
        Picker,
        ControlGroup,
        Button,
        DaySpin,
        Wheel,
        WheelGroup,
        stateSignal,
      } from "@jsenv/navi";

      const HOURS = [7, 8, 9, 20, 21];
      const MINUTES = [0, 15, 30, 45];
      const pad2 = (v) => String(v).padStart(2, "0");

      // The shape we-match describes: the row's `value` is computed from module
      // stateSignals READ INSIDE THE PICKER'S OWN COMPONENT, while pristineKey
      // comes from a useState set in the same synchronous block.
      const daySignal = stateSignal("2026-08-19", {
        id: "e_day",
        type: "date",
      });
      const hoursSignal = stateSignal(7, { id: "e_hours", type: "number" });
      const minutesSignal = stateSignal(0, { id: "e_minutes", type: "number" });
      const titleSignal = stateSignal("", { id: "e_title" });

      // Memo: the row does not re-render because the page re-rendered — only
      // because its signals moved. That is a render of its own, scheduled by
      // preact/signals, not the one that carried pristineKey.
      const WhenPicker = memo(() => {
        const day = daySignal.value;
        const hours = hoursSignal.value;
        const minutes = minutesSignal.value;
        return (
          <Picker
            id="when"
            name="when"
            type="object"
            value={{ day, hours, minutes }}
            mode="dialog"
            placeholder="when"
          >
            <ControlGroup flex="y" padding="l" spacing="m" alignX="center">
              <DaySpin id="date" name="day" signal={daySignal} expandX />
              <WheelGroup required frameBorder border="none">
                <Wheel name="hours" type="integer" bounded signal={hoursSignal}>
                  {HOURS.map((h) => (
                    <Wheel.Item key={h} value={h}>
                      {pad2(h)}
                    </Wheel.Item>
                  ))}
                </Wheel>
                <Wheel name="minutes" type="integer" signal={minutesSignal}>
                  {MINUTES.map((m) => (
                    <Wheel.Item key={m} value={m}>
                      {pad2(m)}
                    </Wheel.Item>
                  ))}
                </Wheel>
              </WheelGroup>
            </ControlGroup>
          </Picker>
        );
      });

      let setFilled;
      const App = () => {
        const [filled, setFilledState] = useState(false);
        setFilled = setFilledState;
        return (
          <Box flex="y" spacing="m">
            <Button id="load" onClick={() => window.__load()}>
              load
            </Button>
            <Form id="form" pristineKey={filled ? "loaded" : undefined}>
              <Input name="title" signal={titleSignal} />
              <WhenPicker />
              <Button id="submit" type="submit" readOnlyWhileFormUnchanged>
                Save
              </Button>
            </Form>
          </Box>
        );
      };

      const probe = () => {
        const controller =
          document.getElementById("form").__uiStateController__;
        return {
          ui: controller.uiState,
          sent: controller.sentUIState,
          changed: controller.changed,
        };
      };
      window.__probe = probe;
      window.__trace = [];
      const dump = (label) => {
        window.__trace.push([label, probe()]);
      };
      window.__shortcut = () => {
        hoursSignal.value = 9;
        minutesSignal.value = 30;
      };
      window.__load = () => {
        Promise.resolve().then(() => {
          titleSignal.value = "loaded title";
          daySignal.value = "2026-08-20";
          hoursSignal.value = 21;
          minutesSignal.value = 0;
          dump("1. signaux remplis, avant le drapeau");
          setFilled(true);
          queueMicrotask(() => dump("2. microtache"));
          requestAnimationFrame(() => dump("3. frame suivante"));
          setTimeout(() => dump("4. tick suivant"), 0);
        });
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
