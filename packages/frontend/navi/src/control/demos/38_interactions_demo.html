<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Interactions demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      h3 {
        margin: 16px 0 4px;
        font-size: 0.95rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .legend {
        margin: 0 0 12px;
        padding: 8px 12px;
        color: #37474f;
        font-size: 13px;
        background: #eef4fd;
        border-left: 3px solid #2f5fa8;
        border-radius: 4px;
      }

      /* Une « liste » : ce qui dépasse d'une ligne balayée est coupé par la
         liste, pas par la ligne. */
      .rows {
        border: 1px solid #dde3ec;
        border-radius: 8px;
        overflow: hidden;
      }
      /* Une ligne tirée hors de la liste allongerait ce qui défile : rien ne se
         lit sur le côté d'une liste de mails, donc rien n'y défile. */
      .mail_list {
        overflow-x: hidden;
      }
      .row {
        position: relative;
        display: flex;
        padding: 14px 16px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #1f2733;
        font-size: 14px;
        text-align: left;
        background: white;
      }
      .row_title {
        font-weight: 500;
      }
      .row_body {
        color: #6b7482;
        font-size: 13px;
      }

      /* Ce qu'on découvre derrière la ligne : exactement la bande qu'elle vient
         de quitter, donc large de ce qu'elle a parcouru. */
      .trail {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        color: white;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
      }
      .trail_start {
        right: 100%;
        width: var(--swipe-pulled);
        padding-right: 16px;
        justify-content: flex-end;
        opacity: calc(var(--swipe-progress) * 3);
      }
      .trail_end {
        left: 100%;
        width: calc(-1 * var(--swipe-pulled));
        padding-left: 16px;
        justify-content: flex-start;
        opacity: calc(var(--swipe-progress) * -3);
      }
      .trail_archive {
        background: #9aa6b6;
      }
      [data-swipe-past-threshold] .trail_archive {
        background: #1e8e5a;
      }
      .trail_delete {
        background: #d8a3a3;
      }
      [data-swipe-past-threshold] .trail_delete {
        background: #c62828;
      }
      .trail_unread {
        background: #a8b4c8;
      }
      [data-swipe-past-threshold] .trail_unread {
        background: #2f5fa8;
      }

      /* Cas nominal : la liste à gauche, ce qui est ouvert à droite. */
      .file_item {
        padding: 8px 12px;
        font-size: 14px;
      }
      .file_marker {
        width: 10px;
        color: #2f5fa8;
        font-weight: 700;
      }
      .opened_pane {
        min-width: 220px;
        min-height: 120px;
        padding: 16px;
        color: #37474f;
        font-size: 14px;
        background: #fafbfd;
        border: 1px solid #dde3ec;
        border-radius: 8px;
      }
      .opened_pane_empty {
        color: #9aa6b6;
      }

      .mail_dot {
        width: 8px;
        height: 8px;
        flex: none;
        background: #2f5fa8;
        border-radius: 50%;
      }
      .mail_dot_read {
        background: transparent;
      }
      .mail_from {
        font-weight: 600;
      }
      .mail_subject {
        color: #6b7482;
        font-size: 13px;
      }
      .mail_menu {
        display: flex;
        padding: 10px 16px;
        flex-wrap: wrap;
        gap: 8px;
        background: #f2f5fa;
        border-top: 1px solid #e3e9f2;
      }

      .thumb {
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Button,
        defineInteractionDetector,
        findEvent,
        Link,
        List,
        Text,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";
      import { FakeBackend } from "../../internal/fake_backend.jsx";
      import { DemoHeader } from "../../internal/demo_header.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const Variant = ({ caption, children }) => (
        <Box flex="y" spacing="xs" alignX="start">
          <Text size="s" color="#666">
            {caption}
          </Text>
          {children}
        </Box>
      );

      const ARCHIVE_TRAIL = { className: "trail_archive", label: "Archiver" };
      const DELETE_TRAIL = { className: "trail_delete", label: "Supprimer" };

      // Une ligne balayable : une Box, ni un lien ni un bouton — une interaction
      // n'a pas besoin d'un contrôle pour être lue.
      const Row = ({ title, body, trailStart, trailEnd, ...rest }) => (
        <Box className="row" {...rest}>
          {trailStart ? (
            <span className={`trail trail_start ${trailStart.className}`}>
              {trailStart.label}
            </span>
          ) : null}
          {trailEnd ? (
            <span className={`trail trail_end ${trailEnd.className}`}>
              {trailEnd.label}
            </span>
          ) : null}
          <span className="row_title">{title}</span>
          <span className="row_body">{body}</span>
        </Box>
      );

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Interactions"
            previous={{ href: "./37_select_demo.html", label: "Select" }}
          />
          <div class="demo-section">
            <h2 style="margin: 0 0 4px">Sommaire</h2>
            <DocumentToc />
          </div>
          <NominalDemo />
          <StatesDemo />
          <SwipeDemo />
          <LongPressDemo />
          <KeyboardDemo />
          <DraggableSurfaceDemo />
          <SettingsDemo />
          <WhichInteractionDemo />
          <RunningDemo />
          <CustomDetectorDemo />
          <MailboxDemo />
        </Box>
      );

      // ── Cas nominal ───────────────────────────────────────────────────────

      const FILES = ["notes.md", "budget.csv", "photo.png", "brouillon.txt"];

      const NominalDemo = () => {
        const [selected, setSelected] = useState(null);
        const [opened, setOpened] = useState(null);
        return (
          <div class="demo-section">
            <Heading id="nominal">Cas nominal</Heading>
            <p class="legend">
              Clic pour sélectionner, double clic pour ouvrir.
            </p>
            <Box flex="x" spacing="l" alignY="start">
              <Box className="rows" width="220px">
                <List>
                  {FILES.map((file) => (
                    <List.Item
                      key={file}
                      id={file}
                      className="file_item"
                      // En style inline plutôt qu'en classe : la liste a son
                      // propre fond, et une classe de la page perdrait contre
                      // lui.
                      style={
                        selected === file
                          ? { backgroundColor: "#dde9fb" }
                          : undefined
                      }
                      interactions={{
                        click: () => setSelected(file),
                        dblclick: () => setOpened(file),
                      }}
                    >
                      <Box flex="x" spacing="xs" alignY="center">
                        <span className="file_marker">
                          {selected === file ? "▸" : ""}
                        </span>
                        <span>{file}</span>
                      </Box>
                    </List.Item>
                  ))}
                </List>
              </Box>
              <div class="opened_pane">
                {opened ? (
                  <Box flex="y" spacing="xs">
                    <strong>{opened}</strong>
                    <Text size="s" color="#6b7482">
                      ouvert
                    </Text>
                  </Box>
                ) : (
                  <span class="opened_pane_empty">rien d'ouvert</span>
                )}
              </div>
            </Box>
          </div>
        );
      };

      // ── États ─────────────────────────────────────────────────────────────

      const StatesDemo = () => {
        const [entries, push, clear] = useCallLog();
        const log = (name) => (event) => push(name, undefined, event);
        const swipeAndHold = {
          swipe_right: log("swipe_right"),
          longpress: log("longpress"),
        };
        return (
          <div class="demo-section">
            <Heading id="states">États</Heading>
            <p class="desc">
              Sur un contrôle, une interaction passe par la même porte qu'un
              clic.
            </p>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption="normal">
                <Button interactions={swipeAndHold}>Maintenir</Button>
              </Variant>
              <Variant caption="readOnly">
                <Button readOnly interactions={swipeAndHold}>
                  Maintenir
                </Button>
              </Variant>
              <Variant caption="disabled">
                <Button disabled interactions={swipeAndHold}>
                  Maintenir
                </Button>
              </Variant>
              <Variant caption="loading">
                <Button loading interactions={swipeAndHold}>
                  Maintenir
                </Button>
              </Variant>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Balayage ──────────────────────────────────────────────────────────

      const SwipeDemo = () => {
        const [entries, push, clear] = useCallLog();
        const log = (name) => (event) => push(name, undefined, event);
        return (
          <div class="demo-section">
            <Heading id="swipe">Balayage</Heading>
            <p class="desc">
              À la souris comme au doigt : la ligne suit, et revient si on la
              lâche trop tôt.
            </p>

            <Heading level={3} id="swipe-one-way">
              Un seul côté
            </Heading>
            <Box className="rows" flex="y" spacing="0">
              <Row
                title="swipe_right"
                body="vers la droite"
                trailStart={ARCHIVE_TRAIL}
                interactions={{ swipe_right: log("swipe_right") }}
              />
              <Row
                title="swipe_left"
                body="vers la gauche"
                trailEnd={DELETE_TRAIL}
                interactions={{ swipe_left: log("swipe_left") }}
              />
            </Box>

            <Heading level={3} id="swipe-both-ways">
              Les deux
            </Heading>
            <Box className="rows">
              <Row
                title="swipe_right + swipe_left"
                body="deux gestes, deux effets"
                trailStart={ARCHIVE_TRAIL}
                trailEnd={DELETE_TRAIL}
                interactions={{
                  swipe_right: log("swipe_right"),
                  swipe_left: log("swipe_left"),
                }}
              />
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Appui long ────────────────────────────────────────────────────────

      const LongPressDemo = () => {
        const [entries, push, clear] = useCallLog();
        const log = (name) => (event) => push(name, undefined, event);
        return (
          <div class="demo-section">
            <Heading id="longpress">Appui long</Heading>
            <p class="legend">
              Maintenir enfoncé sans bouger, au doigt comme à la souris.
            </p>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption="{ longpress }">
                <Button interactions={{ longpress: log("longpress") }}>
                  Maintenir
                </Button>
              </Variant>
            </Box>

            <Heading level={3} id="longpress-contextmenu">
              Et le menu contextuel
            </Heading>
            <p class="legend">
              Clic droit sur chacun des deux. Un appui long ne prend pas le menu
              du navigateur : le clic droit vient de l'autre bouton, ce n'est
              pas la pression qu'on écoute. Pour qu'il fasse ce que fait l'appui
              long, on l'écrit à côté.
            </p>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption="{ longpress } — clic droit : menu du navigateur">
                <Button interactions={{ longpress: log("longpress") }}>
                  Clic droit ici
                </Button>
              </Variant>
              <Variant caption="{ longpress, contextmenu } — clic droit : l'interaction">
                <Button
                  interactions={{
                    longpress: log("longpress"),
                    contextmenu: log("contextmenu"),
                  }}
                >
                  Clic droit ici
                </Button>
              </Variant>
            </Box>
            <Heading level={3} id="longpress-and-swipe">
              Avec un balayage
            </Heading>
            <Box className="rows">
              <Row
                title="swipe_right + longpress"
                body="partir sur le côté, ou ne pas bouger"
                trailStart={ARCHIVE_TRAIL}
                interactions={{
                  swipe_right: log("swipe_right"),
                  longpress: log("longpress"),
                }}
              />
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Clavier ───────────────────────────────────────────────────────────

      const KeyboardDemo = () => {
        const [entries, push, clear] = useCallLog();
        const logAction = (value, { event }) => push("action", value, event);
        return (
          <div class="demo-section">
            <Heading id="keyboard">Clavier</Heading>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption='{ "keyboard:ctrl+backspace": "request_action" }'>
                <Button
                  action={logAction}
                  interactions={{ "keyboard:ctrl+backspace": "request_action" }}
                >
                  Focus puis ctrl+backspace
                </Button>
              </Variant>
              <Variant caption='{ "keyboard:shift+a": fn }'>
                <Button
                  interactions={{
                    "keyboard:shift+a": (event) =>
                      push("keyboard:shift+a", undefined, event),
                  }}
                >
                  Focus puis shift+a
                </Button>
              </Variant>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Surfaces déjà draggable ───────────────────────────────────────────

      // Un carré de couleur en data: URI, pour avoir une vraie <img> sans réseau.
      const THUMB_SRC = `data:image/svg+xml,${encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="#2f5fa8"/></svg>',
      )}`;

      const DraggableSurfaceDemo = () => {
        const [entries, push, clear] = useCallLog();
        const log = (name) => (event) => push(name, undefined, event);
        return (
          <div class="demo-section">
            <Heading id="draggable">Surfaces déjà draggable</Heading>
            <p class="desc">
              Commencer le geste sur la vignette, puis sur le lien, puis sur le
              texte.
            </p>
            <Box className="rows">
              <Row
                title={
                  <Box flex="x" spacing="s" alignY="center">
                    <img class="thumb" src={THUMB_SRC} alt="" />
                    <Link href="https://jsenv.dev">jsenv.dev</Link>
                  </Box>
                }
                body="une image et un lien dans la ligne"
                trailStart={ARCHIVE_TRAIL}
                interactions={{ swipe_right: log("swipe_right") }}
              />
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Réglages ──────────────────────────────────────────────────────────

      const SettingsDemo = () => {
        const [entries, push, clear] = useCallLog();
        const log = (name) => (event) => push(name, undefined, event);
        return (
          <div class="demo-section">
            <Heading id="settings">Réglages</Heading>

            <Heading level={3} id="swipe-threshold">
              data-swipe-threshold
            </Heading>
            <Box className="rows">
              <Row
                title="0.33"
                body="par défaut"
                trailStart={ARCHIVE_TRAIL}
                interactions={{ swipe_right: log("0.33") }}
              />
              <Row
                title="0.15"
                body="lâchée tôt, elle part"
                data-swipe-threshold="0.15"
                trailStart={ARCHIVE_TRAIL}
                interactions={{ swipe_right: log("0.15") }}
              />
              <Row
                title="0.8"
                body="il faut la traverser"
                data-swipe-threshold="0.8"
                trailStart={ARCHIVE_TRAIL}
                interactions={{ swipe_right: log("0.8") }}
              />
            </Box>

            <Heading level={3} id="longpress-delay">
              data-longpress-delay
            </Heading>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption="450 (par défaut)">
                <Button interactions={{ longpress: log("450") }}>
                  Maintenir
                </Button>
              </Variant>
              <Variant caption='data-longpress-delay="1200"'>
                <Button
                  data-longpress-delay="1200"
                  interactions={{ longpress: log("1200") }}
                >
                  Maintenir
                </Button>
              </Variant>
            </Box>

            <Heading level={3} id="longpress-slop">
              data-longpress-slop
            </Heading>
            <p class="legend">
              Combien de pixels le doigt peut dériver pendant l'attente avant
              que l'appui soit abandonné. Maintenir 1,2 s en bougeant lentement
              d'un centimètre : à 8 px rien ne se déclenche, à 60 px si.
            </p>
            <Box
              flex="x"
              spacing="xl"
              alignY="start"
              data-longpress-delay="1200"
            >
              <Variant caption="8 px (par défaut) — la dérive annule">
                <Button interactions={{ longpress: log("slop 8") }}>
                  Maintenir en bougeant
                </Button>
              </Variant>
              <Variant caption='data-longpress-slop="60" — la dérive est tolérée'>
                <Button
                  data-longpress-slop="60"
                  interactions={{ longpress: log("slop 60") }}
                >
                  Maintenir en bougeant
                </Button>
              </Variant>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Quelle interaction a demandé ──────────────────────────────────────

      const WhichInteractionDemo = () => {
        const [entries, push, clear] = useCallLog();
        const archiveOrDelete = (value, { event }) => {
          const swipe = findEvent(event, "swipe_right");
          if (!swipe) {
            push("action", "sans balayage", event);
            return;
          }
          const { progress } = swipe.detail;
          push(
            progress > 0.8 ? "supprime" : "archive",
            `progress ${progress.toFixed(2)}`,
            event,
          );
        };
        return (
          <div class="demo-section">
            <Heading id="which-interaction">
              Quelle interaction a demandé
            </Heading>
            <p class="desc">
              <code>findEvent(event, "swipe_right").detail</code> : l'axe, le
              signe, la distance, la taille, la progression.
            </p>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption='{ swipe_right: "request_action", longpress: "request_action" }'>
                <Button
                  action={archiveOrDelete}
                  interactions={{
                    swipe_right: "request_action",
                    longpress: "request_action",
                  }}
                >
                  Balayer, ou maintenir
                </Button>
              </Variant>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Ce que la ligne fait pendant l'attente ────────────────────────────

      const RunningDemo = () => {
        const [archived, setArchived] = useState([]);
        return (
          <div class="demo-section">
            <Heading id="running">
              Ce que la ligne fait pendant l'attente
            </Heading>
            <p class="legend">
              Balayer une ligne vers la droite, puis répondre depuis le backend
              ci-dessous. La ligne reste sortie tant que l'appel n'a pas
              répondu, et revient qu'il réussisse ou qu'il échoue.
            </p>
            <FakeBackend value={{ archived: [] }}>
              {({ action }) => (
                <Box className="rows" flex="y">
                  {["Marc", "Léa", "Sofia"]
                    .filter((name) => !archived.includes(name))
                    .map((name) => (
                      <Row
                        key={name}
                        title={name}
                        body="balayer vers la droite"
                        trailStart={ARCHIVE_TRAIL}
                        interactions={{
                          // Une promesse : le balayage attend qu'elle se règle.
                          swipe_right: async () => {
                            await action({ archived: [name] });
                            setArchived((previous) => [...previous, name]);
                          },
                        }}
                      />
                    ))}
                </Box>
              )}
            </FakeBackend>
            {archived.length ? (
              <Box paddingY="s">
                <Button action={() => setArchived([])}>
                  Rétablir {archived.length}
                </Button>
              </Box>
            ) : null}
          </div>
        );
      };

      // ── Une interaction à soi ─────────────────────────────────────────────

      // Trois clics dans la seconde : navi n'en a pas, l'appli l'enregistre.
      // Le compte vit dans `state`, qui est le même d'un rendu à l'autre — une
      // variable de la closure repartirait de zéro au premier re-rendu, donc au
      // premier clic.
      defineInteractionDetector({
        name: "triple_click",
        claims: (type) => type === "triple_click",
        setup: ({ request, state }) => ({
          onClick: (clickEvent) => {
            state.count = (state.count || 0) + 1;
            clearTimeout(state.timeout);
            state.timeout = setTimeout(() => {
              state.count = 0;
            }, 1000);
            if (state.count < 3) {
              return;
            }
            state.count = 0;
            request("triple_click", {}, clickEvent);
          },
        }),
      });

      const CustomDetectorDemo = () => {
        const [entries, push, clear] = useCallLog();
        const [fired, setFired] = useState(0);
        return (
          <div class="demo-section">
            <Heading id="custom">Une interaction à soi</Heading>
            <p class="desc">
              <code>defineInteractionDetector</code> : la porte par laquelle
              passent aussi les balayages et les raccourcis de navi.
            </p>
            <Box flex="x" spacing="xl" alignY="start">
              <Variant caption="{ triple_click: fn }">
                <Button
                  action={(value, { event }) => push("clic", undefined, event)}
                  interactions={{
                    triple_click: (event) => {
                      setFired((previous) => previous + 1);
                      push("triple_click", undefined, event);
                    },
                  }}
                >
                  Cliquer trois fois
                </Button>
              </Variant>
              <Variant caption="déclenché">
                <Text>{fired} fois</Text>
              </Variant>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Cas concret : une boîte mail ──────────────────────────────────────

      const MAILS = [
        {
          id: "1",
          from: "Sofia Mendes",
          subject: "Relecture du devis avant jeudi",
        },
        { id: "2", from: "GitHub", subject: "3 activités sur jsenv/core" },
        { id: "3", from: "Marc Aubert", subject: "Photos de la conf" },
        {
          id: "4",
          from: "Léa Fournier",
          subject: "On décale le point de 15h ?",
        },
      ];

      const MailboxDemo = () => {
        const [archived, setArchived] = useState([]);
        const [read, setRead] = useState(["3"]);
        const [menuId, setMenuId] = useState(null);
        const [openedId, setOpenedId] = useState(null);
        const visible = MAILS.filter((mail) => !archived.includes(mail.id));
        const opened = MAILS.find((mail) => mail.id === openedId);
        const archive = (id) => {
          setArchived((previous) => [...previous, id]);
          setMenuId(null);
        };
        return (
          <div class="demo-section">
            <Heading id="mailbox">Cas concret : une boîte mail</Heading>
            <p class="legend">
              Clic pour ouvrir, balayage à droite pour archiver, balayage à
              gauche pour marquer lu ou non lu, appui long pour le menu.
            </p>
            <Box flex="x" spacing="l" alignY="start">
              <Box className="rows" expandX>
                <List className="mail_list">
                  {visible.map((mail) => (
                    <List.Item key={mail.id} id={mail.id}>
                      <Row
                        title={
                          <Box flex="x" spacing="s" alignY="center">
                            <span
                              className={`mail_dot ${read.includes(mail.id) ? "mail_dot_read" : ""}`}
                            />
                            <span className="mail_from">{mail.from}</span>
                          </Box>
                        }
                        body={
                          <span className="mail_subject">{mail.subject}</span>
                        }
                        trailStart={ARCHIVE_TRAIL}
                        trailEnd={{
                          className: "trail_unread",
                          label: read.includes(mail.id) ? "Non lu" : "Lu",
                        }}
                        interactions={{
                          click: () => setOpenedId(mail.id),
                          swipe_right: () => archive(mail.id),
                          swipe_left: () => {
                            setRead((previous) =>
                              previous.includes(mail.id)
                                ? previous.filter((id) => id !== mail.id)
                                : [...previous, mail.id],
                            );
                          },
                          longpress: () => {
                            setMenuId(menuId === mail.id ? null : mail.id);
                          },
                        }}
                      />
                      {menuId === mail.id ? (
                        <div className="mail_menu">
                          <Button action={() => archive(mail.id)}>
                            Archiver
                          </Button>
                          <Button action={() => setMenuId(null)}>
                            Épingler
                          </Button>
                          <Button action={() => setMenuId(null)}>
                            Signaler
                          </Button>
                          <Button action={() => setMenuId(null)}>Fermer</Button>
                        </div>
                      ) : null}
                    </List.Item>
                  ))}
                </List>
              </Box>
              <div class="opened_pane">
                {opened ? (
                  <Box flex="y" spacing="xs">
                    <strong>{opened.from}</strong>
                    <Text size="s" color="#6b7482">
                      {opened.subject}
                    </Text>
                  </Box>
                ) : (
                  <span class="opened_pane_empty">rien d'ouvert</span>
                )}
              </div>
            </Box>
            {archived.length ? (
              <Box paddingY="s">
                <Button action={() => setArchived([])}>
                  Rétablir {archived.length}
                </Button>
              </Box>
            ) : null}
          </div>
        );
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
