<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Picker settings sheet demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { signal } from "@preact/signals";
      import {
        Box,
        Button,
        ControlGroup,
        Field,
        Form,
        Input,
        Label,
        Link,
        Picker,
        Nav,
        Select,
        Slide,
        SlideContainer,
        Text,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "../utils/call_log.jsx";
      import { DemoHeader } from "@jsenv/navi/src/internal/demo_header.jsx";
      import { DocumentToc } from "@jsenv/navi/src/internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag id={id} {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const ZONE_INITIAL = { origin: "all" };
      const zoneSignal = signal(ZONE_INITIAL);
      const zoneInFormSignal = signal(ZONE_INITIAL);
      const DEMO_SIGNALS = [zoneSignal, zoneInFormSignal];

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Picker settings sheet"
            previous={{ href: "./8_picker_wheel_demo.html", label: "Wheel" }}
            next={{ href: "./10_picker_confirm_demo.html", label: "Confirm" }}
          />
          <TableOfContents />
          <NominalDemo />
          <InFormDemo />
        </Box>
      );

      const TableOfContents = () => (
        <div class="demo-section">
          <Box flex alignY="center" spacing="m">
            <h2 style="margin: 0; flex: 1">Sommaire</h2>
            <Button
              onClick={() => {
                for (const demoSignal of DEMO_SIGNALS) {
                  demoSignal.value = ZONE_INITIAL;
                }
              }}
            >
              Tout réinitialiser
            </Button>
          </Box>
          <DocumentToc />
        </div>
      );

      // ── Cas nominal ───────────────────────────────────────────────────────

      const NominalDemo = () => {
        const [entries, push, clear] = useCallLog();

        return (
          <div class="demo-section">
            <Heading id="nominal">Cas nominal</Heading>
            <p class="desc">
              Quatre onglets, une réponse. Le résumé sous le picker est ce que
              l'application a reçu.
            </p>
            <Box flex="y" spacing="m" alignX="start">
              <Field vertical>
                <Label>Où chercher</Label>
                <ZonePicker
                  signalHoldingCommitted={zoneSignal}
                  onUIAction={(value) => {
                    push("uiAction", value);
                  }}
                  onAction={(value) => {
                    push("action", value);
                  }}
                />
              </Field>
              <Text size="s" color="#666">
                zoneSignal : <code>{JSON.stringify(zoneSignal.value)}</code>
              </Text>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Dans un formulaire ────────────────────────────────────────────────

      const InFormDemo = () => {
        const [entries, push, clear] = useCallLog();

        return (
          <div class="demo-section">
            <Heading id="in-form">Dans un formulaire</Heading>
            <p class="desc">
              Le picker répond pour lui-même : ce qu'il commet ne part pas avec
              le formulaire autour, et laisse ce formulaire inchangé.
            </p>
            <Form
              action={(value) => {
                push("Form action", value);
              }}
            >
              <Box flex="y" spacing="m" alignX="start">
                <Field vertical>
                  <Label>Titre</Label>
                  <Input name="title" placeholder="Tournoi du samedi" />
                </Field>
                <Field vertical>
                  <Label>Où chercher</Label>
                  <ZonePicker
                    standalone
                    signalHoldingCommitted={zoneInFormSignal}
                    onAction={(value) => {
                      push("Picker action", value);
                    }}
                  />
                </Field>
                <Button command="--navi-send" />
              </Box>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── La feuille de réglages ────────────────────────────────────────────

      const ZonePicker = ({
        signalHoldingCommitted,
        onUIAction,
        onAction,
        ...rest
      }) => {
        const committed = signalHoldingCommitted.value;

        return (
          <Picker
            type="object"
            mode="dialog"
            // Le résumé lit ce qui est enregistré, pas ce qui est en train
            // d'être essayé dans la dialog.
            ui={<ZoneSummary zone={committed} />}
            value={committed}
            uiAction={onUIAction}
            action={(value) => {
              signalHoldingCommitted.value = value;
              onAction?.(value);
            }}
            minWidth="220"
            {...rest}
          >
            <ControlGroup flex="y" spacing="m" padding="m" alignX="stretch">
              <Nav slideContainer="zone_slides" currentIndicator spacing="m">
                <Link slide="all">Tous</Link>
                <Link slide="department">Département</Link>
                <Link slide="city">Ville</Link>
                <Link slide="here">Ma position</Link>
              </Nav>

              {/* Les onglets sont une navigation, pas un champ : l'onglet
                  courant entre dans la valeur par ici. */}
              <Input type="hidden" name="origin" signal={originSignal} />

              <SlideContainer
                id="zone_slides"
                signal={originSignal}
                minHeight="150"
              >
                <Slide area="all">
                  <Text size="s" color="#666">
                    Tous les lieux.
                  </Text>
                </Slide>
                <Slide area="department">
                  <Box flex="y" spacing="s" alignX="start">
                    <Field vertical>
                      <Label>Département</Label>
                      <Select name="department" defaultValue="">
                        <option value="">Choisir</option>
                        <option value="06">06 — Alpes-Maritimes</option>
                        <option value="13">13 — Bouches-du-Rhône</option>
                        <option value="83">83 — Var</option>
                      </Select>
                    </Field>
                    <Field as="label" flex alignY="center" spacing="s">
                      <Input type="checkbox" name="periphery" value="around" />
                      Départements limitrophes
                    </Field>
                  </Box>
                </Slide>
                <Slide area="city">
                  <Box flex="y" spacing="s" alignX="start">
                    <Field vertical>
                      <Label>Ville</Label>
                      <Input name="city" placeholder="Antibes" />
                    </Field>
                  </Box>
                </Slide>
                <Slide area="here">
                  <Box flex="y" spacing="s" alignX="start">
                    <Field vertical>
                      <Label>Commune détectée</Label>
                      <Input name="here" readOnly signal={hereSignal} />
                    </Field>
                    <Button
                      action={async () => {
                        await new Promise((resolve) => {
                          setTimeout(resolve, 800);
                        });
                        hereSignal.value = "Antibes (06)";
                      }}
                    >
                      Utiliser ma position
                    </Button>
                  </Box>
                </Slide>
              </SlideContainer>

              {/* Monté quel que soit l'onglet : il garde ce qu'il montre, et
                  revient dans la réponse même quand l'onglet ne s'en sert pas —
                  c'est en la lisant qu'on décide s'il compte. */}
              <Box
                hidden={
                  originSignal.value !== "city" && originSignal.value !== "here"
                }
              >
                <RadiusField />
              </Box>

              <Box flex spacing="s" alignX="end">
                <Button command="--navi-cancel" variant="discrete">
                  Annuler
                </Button>
                <Button command="--navi-close">Voir les lieux</Button>
              </Box>
            </ControlGroup>
          </Picker>
        );
      };

      const ZoneSummary = ({ zone }) => {
        const { origin, department, periphery, city, radius, here } = zone;
        if (origin === "department" && department) {
          return (
            <Text>
              {periphery
                ? `${department} et limitrophes`
                : `Département ${department}`}
            </Text>
          );
        }
        if (origin === "city" && city) {
          return <Text>{`${city} · ${radius} km`}</Text>;
        }
        if (origin === "here" && here) {
          return <Text>{`${here} · ${radius} km`}</Text>;
        }
        return <Text>Tous les lieux</Text>;
      };

      // L'onglet montré. C'est le champ "origin" de la réponse, donc rouvrir
      // la feuille — ou l'annuler — remet les slides là où la réponse les met.
      const originSignal = signal("all");
      const hereSignal = signal(undefined);

      const RadiusField = () => (
        <Field vertical>
          <Label>Rayon</Label>
          <Select name="radius" defaultValue="10">
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="30">30 km</option>
          </Select>
        </Field>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
