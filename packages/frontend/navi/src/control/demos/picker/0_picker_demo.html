<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Picker Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 32px;
        color: #333;
        font-size: 1.8rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        position: relative;
        margin: 0 0 8px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.1rem;
        border-bottom: 2px solid #eee;
        scroll-margin-top: 12px;
      }
      .demo-section h3 {
        position: relative;
        margin: 20px 0 8px;
        color: #444;
        font-weight: 600;
        font-size: 0.95rem;
        scroll-margin-top: 12px;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .demo-subsection {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
      .demo-subsection:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
      }
      .toc-list {
        margin: 0;
        padding-left: 20px;
        line-height: 2;
      }
      .toc-list a {
        color: #1a56cc;
        text-decoration: none;
      }
      .toc-list a:hover {
        text-decoration: underline;
      }
      .toc-list ol {
        margin: 0;
        padding-left: 20px;
        line-height: 2;
        list-style: lower-alpha;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Picker Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useEffect, useRef, useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Label,
        Link,
        List,
        ListItem,
        NaviDebug,
        Picker,
        Text,
        route,
        setupRoutes,
      } from "@jsenv/navi";
      import { NavInspect } from "@jsenv/navi/src/control/demos/utils/nav_inspect.jsx";

      // ── State signals (persisted in URL search params) ────────────────────

      const DEMO_ROUTE = route("", {
        searchParams: {},
      });
      setupRoutes([DEMO_ROUTE]);

      const App = () => (
        <NaviDebug debugAll>
          <Box flex="y" spacing="l">
            <TableOfContents />
            <Chapter id="dimensions" title="Dimensions — size & overflow">
              <FontSizeDemo />
              <WidthDemo />
              <OverflowDemo />
              <MaxLinesDemo />
              <PopupWidthDemo />
            </Chapter>
            <Chapter id="icon" title="Picker icon">
              <PickerIconDemo />
            </Chapter>
            <Chapter id="text-align" title="Text alignment">
              <TextAlignDemo />
            </Chapter>
            <Chapter id="value" title="Default value & placeholder">
              <DefaultValueDemo />
            </Chapter>
            <Chapter id="custom-ui" title="Custom UI via prop ui">
              <CustomUIDemo />
            </Chapter>
            <Chapter id="modes" title="Popover vs dialog mode">
              <PopoverDialogDemo />
            </Chapter>
            <Chapter id="popup-sizing" title="Popup sizing">
              <PopoverSizingDemo />
              <DialogSizingDemo />
            </Chapter>
            <Chapter id="popup-position" title="Popup position">
              <PopoverPositionDemo />
              <DialogPositionDemo />
            </Chapter>
            <Chapter id="loading" title="Loading & error">
              <ContentLoadingDemo />
              <ValueLoadingDemo />
            </Chapter>
          </Box>
        </NaviDebug>
      );

      // Section (h2) / subsection (h3) heading with a hover anchor link. `<Link
      // anchor>` owns the id (derived from its href); the "#" child renders as
      // the visible affordance (shown on hover via revealOnInteraction).
      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      // A chapter groups related demos under one h2. Each demo inside renders as
      // a <div className="demo-subsection"> with its own h3.
      const Chapter = ({ id, title, children }) => (
        <div className="demo-section">
          <Heading level={2} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const Subsection = ({ id, title, children }) => (
        <div className="demo-subsection">
          <Heading level={3} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const TableOfContents = () => (
        <div class="demo-section">
          <h2>Table of contents</h2>
          <ol class="toc-list">
            <li>
              <Link href="#dimensions">Dimensions — size &amp; overflow</Link>
              <ol>
                <li>
                  <Link href="#dim-font-size">Font size</Link>
                </li>
                <li>
                  <Link href="#dim-width">Width adapts to value</Link>
                </li>
                <li>
                  <Link href="#dim-overflow">Single-line overflow</Link>
                </li>
                <li>
                  <Link href="#dim-maxlines">Multi-line with maxLines</Link>
                </li>
                <li>
                  <Link href="#dim-popup-width">
                    Popup width follows the trigger
                  </Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#icon">Picker icon</Link>
            </li>
            <li>
              <Link href="#text-align">Text alignment</Link>
            </li>
            <li>
              <Link href="#value">Default value &amp; placeholder</Link>
            </li>
            <li>
              <Link href="#custom-ui">Custom UI via prop ui</Link>
            </li>
            <li>
              <Link href="#modes">Popover vs dialog mode</Link>
            </li>
            <li>
              <Link href="#popup-sizing">Popup sizing</Link>
              <ol>
                <li>
                  <Link href="#popup-sizing-popover">Popover</Link>
                </li>
                <li>
                  <Link href="#popup-sizing-dialog">Dialog</Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#popup-position">Popup position</Link>
              <ol>
                <li>
                  <Link href="#popup-position-popover">Popover</Link>
                </li>
                <li>
                  <Link href="#popup-position-dialog">Dialog</Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#loading">Loading &amp; error</Link>
              <ol>
                <li>
                  <Link href="#loading-content">Loading content</Link>
                </li>
                <li>
                  <Link href="#loading-value">Loading the selected label</Link>
                </li>
              </ol>
            </li>
          </ol>
        </div>
      );

      const AdjacentElement = () => (
        <div
          style={{
            flexShrink: 0,
            padding: "4px 10px",
            fontSize: "11px",
            color: "#7a5c00",
            background: "#fff8e1",
            border: "1.5px dashed #f0c040",
            borderRadius: "4px",
            whiteSpace: "nowrap",
          }}
        >
          adjacent element
        </div>
      );

      const SHORT_VALUE = "Apple";
      const MEDIUM_VALUE = "Elderberry";
      const LONG_SENTENCE =
        "A very long selected value that definitely overflows the picker trigger button";
      const LONG_WORD = "Supercalifragilisticexpialidocious";
      const VERY_LONG_TEXT =
        "This value is intentionally so long that it spans more than three lines inside the constrained picker width, so the line-clamp kicks in and an ellipsis appears at the end";

      const BasicPickerContent = () => (
        <div style={{ padding: "16px" }}>
          <p style={{ margin: "0 0 12px 0", fontSize: "14px" }}>
            Hello world! This is the picker content.
          </p>
          <p
            style={{
              margin: "0",
              fontSize: "12px",
              color: "#666",
              lineHeight: "1.5",
            }}
          >
            You can put any content here — text, buttons, forms, images,
            whatever you need.
          </p>
        </div>
      );

      const VioletSquareIcon = () => (
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="1" y="1" width="16" height="16" rx="2" fill="#7c3aed" />
        </svg>
      );

      const CalendarSvg = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z" />
        </svg>
      );

      const TallPickerUI = ({ label }) => (
        <div
          style={{
            minHeight: "64px",
            display: "flex",
            alignItems: "center",
          }}
        >
          {label}
        </div>
      );

      // ── Dimensions ────────────────────────────────────────────────────────────

      const FontSizeDemo = () => (
        <Subsection id="dim-font-size" title="Font size">
          <Box flex="x" spacing="m" alignY="end" flexWrap>
            {["xs", "m", "xl", "xxl"].map((size) => (
              <Field key={size} vertical>
                <Label>
                  <code style={{ fontWeight: "normal" }}>size={size}</code>
                </Label>
                <Picker
                  name={`dim_font_${size}`}
                  placeholder="Fruit…"
                  value=""
                  action={() => {}}
                  size={size}
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
            ))}
          </Box>
        </Subsection>
      );

      const WidthDemo = () => (
        <Subsection id="dim-width" title="Width adapts to value">
          <Box
            flex="x"
            spacing="s"
            alignY="center"
            style={{ marginBottom: "12px" }}
          >
            <AdjacentElement />
            <span style={{ fontSize: "12px", color: "#555" }}>
              ← this represents an element sitting next to the picker
            </span>
          </Box>
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Short value{" "}
                <code style={{ fontWeight: "normal" }}>(default)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_width_short"
                  value={SHORT_VALUE}
                  action={() => {}}
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Medium value{" "}
                <code style={{ fontWeight: "normal" }}>(default)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_width_medium"
                  value={MEDIUM_VALUE}
                  action={() => {}}
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
          </Box>

          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Short value{" "}
                <code style={{ fontWeight: "normal" }}>(minWidth="140")</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_minwidth_short"
                  value={SHORT_VALUE}
                  action={() => {}}
                  minWidth="140"
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Medium value{" "}
                <code style={{ fontWeight: "normal" }}>(minWidth="140")</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_minwidth_medium"
                  value={MEDIUM_VALUE}
                  action={() => {}}
                  minWidth="140"
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
          </Box>

          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Short value{" "}
                <code style={{ fontWeight: "normal" }}>(expandX)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center" expandX>
                <Picker
                  name="dim_expandx_short"
                  value={SHORT_VALUE}
                  action={() => {}}
                  expandX
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Medium value{" "}
                <code style={{ fontWeight: "normal" }}>(expandX)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center" expandX>
                <Picker
                  name="dim_expandx_medium"
                  value={MEDIUM_VALUE}
                  action={() => {}}
                  expandX
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
          </Box>
        </Subsection>
      );

      const OverflowDemo = () => (
        <Subsection id="dim-overflow" title="Single-line overflow">
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>Long sentence</Label>
              <Picker
                name="dim_sentence"
                value={LONG_SENTENCE}
                action={() => {}}
                maxWidth="200"
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>Long word</Label>
              <Picker
                name="dim_word"
                value={LONG_WORD}
                action={() => {}}
                maxWidth="200"
              >
                <BasicPickerContent />
              </Picker>
            </Field>
          </Box>
        </Subsection>
      );

      const MaxLinesDemo = () => (
        <Subsection id="dim-maxlines" title="Multi-line with maxLines">
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Long sentence{" "}
                <code style={{ fontWeight: "normal" }}>(maxLines=3)</code>
              </Label>
              <Picker
                name="dim_sentence_maxrows"
                value={LONG_SENTENCE}
                action={() => {}}
                maxWidth="200"
                maxLines={3}
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Long word{" "}
                <code style={{ fontWeight: "normal" }}>(maxLines=3)</code>
              </Label>
              <Picker
                name="dim_word_maxrows"
                value={LONG_WORD}
                action={() => {}}
                maxWidth="200"
                maxLines={3}
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Exceeds maxLines{" "}
                <code style={{ fontWeight: "normal" }}>(ellipsis)</code>
              </Label>
              <Picker
                name="dim_clamp_maxrows"
                value={VERY_LONG_TEXT}
                action={() => {}}
                maxWidth="200"
                maxLines={3}
              >
                <BasicPickerContent />
              </Picker>
            </Field>
          </Box>
        </Subsection>
      );

      const ShortPickerContent = () => (
        <div
          style={{
            padding: "10px 14px",
            fontSize: "13px",
            whiteSpace: "nowrap",
          }}
        >
          Short
        </div>
      );

      const PopupWidthDemo = () => (
        <Subsection
          id="dim-popup-width"
          title="Popup width follows the trigger"
        >
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Default{" "}
                <code style={{ fontWeight: "normal" }}>
                  (popup stretches to the trigger)
                </code>
              </Label>
              <Picker placeholder="A deliberately wide trigger…" width="320px">
                <ShortPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                <code>popupWidthFitContent</code>{" "}
                <code style={{ fontWeight: "normal" }}>
                  (content sizes the popup)
                </code>
              </Label>
              <Picker
                placeholder="A deliberately wide trigger…"
                width="320px"
                popupWidthFitContent
              >
                <ShortPickerContent />
              </Picker>
            </Field>
          </Box>
        </Subsection>
      );

      // ── Popover position ──────────────────────────────────────────────────────

      const POSITION_AREAS = [
        "bottom-start",
        "bottom",
        "bottom-end",
        "top-start",
        "top",
        "top-end",
        "right-start",
        "right",
        "left-start",
        "left",
        "inset(top-left)",
        "center",
      ];

      const PositionAreaStage = ({ children }) => (
        <div
          style={{
            display: "flex",
            justifyContent: "center",
            alignItems: "center",
            minHeight: "260px",
            marginTop: "16px",
            background:
              "repeating-linear-gradient(45deg, #fafafa, #fafafa 10px, #f2f2f2 10px, #f2f2f2 20px)",
            borderRadius: "6px",
          }}
        >
          {children}
        </div>
      );

      const PositionAreaSelect = ({ value, onChange }) => (
        <label style={{ fontSize: "12px", color: "#555" }}>
          positionArea{" "}
          <select value={value} onChange={(e) => onChange(e.target.value)}>
            {POSITION_AREAS.map((area) => (
              <option key={area} value={area}>
                {area}
              </option>
            ))}
          </select>
        </label>
      );

      const PopoverPositionDemo = () => {
        const [positionArea, setPositionArea] = useState("bottom-start");

        return (
          <Subsection id="popup-position-popover" title="Popover">
            <p>
              A bare token places the popover next to the trigger,{" "}
              <code>inset(…)</code> makes it overlap. It still flips to the
              opposite side on its own when there isn't enough room.
            </p>
            <PositionAreaSelect
              value={positionArea}
              onChange={setPositionArea}
            />
            <PositionAreaStage>
              <Picker
                placeholder="Open me…"
                mode="popover"
                positionArea={positionArea}
                popupWidthFitContent
                pointerInteractionOutsideEffect="none"
              >
                <ShortPickerContent />
              </Picker>
            </PositionAreaStage>
          </Subsection>
        );
      };

      const DialogPositionDemo = () => {
        const [positionArea, setPositionArea] = useState("center");

        return (
          <Subsection id="popup-position-dialog" title="Dialog">
            <p>
              A dialog docks against the viewport rather than the trigger, and
              defaults to <code>center</code>. It is modal, so the browser's own
              backdrop swallows every outside click — unlike the popover above,
              the select can only be changed while it is closed.
            </p>
            <PositionAreaSelect
              value={positionArea}
              onChange={setPositionArea}
            />
            <PositionAreaStage>
              <Picker
                placeholder="Open me…"
                mode="dialog"
                positionArea={positionArea}
                popupWidthFitContent
              >
                <ShortPickerContent />
              </Picker>
            </PositionAreaStage>
          </Subsection>
        );
      };

      // ── Icon / alignment / value / custom UI ─────────────────────────────────

      const PickerIconDemo = () => (
        <>
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Default icon{" "}
                <code style={{ fontWeight: "normal" }}>(dropdown)</code>
              </Label>
              <Picker name="icon_default" value="Hello world" action={() => {}}>
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Custom icon{" "}
                <code style={{ fontWeight: "normal" }}>(icon prop)</code>
              </Label>
              <Picker
                name="icon_custom"
                value="Hello world"
                action={() => {}}
                icon={<VioletSquareIcon />}
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Font size impacts icon{" "}
                <code style={{ fontWeight: "normal" }}>(size prop)</code>
              </Label>
              <Box flex="y" spacing="s">
                <Box flex="x" spacing="m" alignY="end" flexWrap>
                  {["xs", "m", "xl", "xxl"].map((size) => (
                    <Picker
                      key={`icon_size_default_${size}`}
                      id={`icon_size_default_${size}`}
                      name={`icon_size_default_${size}`}
                      value="Hello world"
                      action={() => {}}
                      size={size}
                    >
                      <BasicPickerContent />
                    </Picker>
                  ))}
                </Box>
                <Box flex="x" spacing="m" alignY="end" flexWrap>
                  {["xs", "m", "xl", "xxl"].map((size) => (
                    <Picker
                      key={`icon_size_custom_${size}`}
                      id={`icon_size_custom_${size}`}
                      name={`icon_size_custom_${size}`}
                      value="Hello world"
                      action={() => {}}
                      size={size}
                      icon={<VioletSquareIcon />}
                    >
                      <BasicPickerContent />
                    </Picker>
                  ))}
                </Box>
                <Box flex="x" spacing="m" alignY="end" flexWrap>
                  {["xs", "m", "xl", "xxl"].map((size) => (
                    <Picker
                      key={`icon_size_calendar_${size}`}
                      id={`icon_size_calendar_${size}`}
                      name={`icon_size_calendar_${size}`}
                      value="Hello world"
                      action={() => {}}
                      size={size}
                      icon={<CalendarSvg />}
                    >
                      <BasicPickerContent />
                    </Picker>
                  ))}
                </Box>
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Single-line tall UI{" "}
                <code style={{ fontWeight: "normal" }}>
                  (icon stays vertically centered)
                </code>
              </Label>
              <Picker
                name="icon_tall_ui"
                value=""
                action={() => {}}
                ui={<TallPickerUI label="Custom UI with bigger height" />}
                icon={<VioletSquareIcon />}
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Multi-line value{" "}
                <code style={{ fontWeight: "normal" }}>
                  (maxLines=3, icon stays on top)
                </code>
              </Label>
              <Picker
                name="icon_multiline"
                value={VERY_LONG_TEXT}
                action={() => {}}
                width="260px"
                maxLines={3}
                icon={<VioletSquareIcon />}
              >
                <BasicPickerContent />
              </Picker>
            </Field>
          </Box>
        </>
      );

      const TextAlignDemo = () => (
        <>
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Left aligned{" "}
                <code style={{ fontWeight: "normal" }}>(default)</code>
              </Label>
              <Picker
                name="align_left"
                placeholder="Select…"
                value={SHORT_VALUE}
                action={() => {}}
                width="200px"
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Center aligned{" "}
                <code style={{ fontWeight: "normal" }}>
                  (textAlign="center")
                </code>
              </Label>
              <Picker
                name="align_center"
                placeholder="Select…"
                value={SHORT_VALUE}
                action={() => {}}
                width="200px"
                textAlign="center"
              >
                <BasicPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                Right aligned{" "}
                <code style={{ fontWeight: "normal" }}>
                  (textAlign="right")
                </code>
              </Label>
              <Picker
                name="align_right"
                placeholder="Select…"
                value={SHORT_VALUE}
                action={() => {}}
                width="200px"
                textAlign="right"
              >
                <BasicPickerContent />
              </Picker>
            </Field>
          </Box>
        </>
      );

      const DefaultValueDemo = () => {
        const noValueSignal = { value: "" };
        const withValueSignal = { value: "Grape" };

        return (
          <>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  No value selected{" "}
                  <code style={{ fontWeight: "normal" }}>
                    (value="", placeholder="Select a fruit…")
                  </code>
                </Label>
                <Picker
                  name="no_value"
                  placeholder="Select a fruit…"
                  value={noValueSignal.value}
                  action={(v) => {
                    noValueSignal.value = v;
                  }}
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
              <Field vertical>
                <Label>
                  With value selected{" "}
                  <code style={{ fontWeight: "normal" }}>(value="Grape")</code>
                </Label>
                <Picker
                  name="with_value"
                  placeholder="Select a fruit…"
                  value={withValueSignal.value}
                  action={(v) => {
                    withValueSignal.value = v;
                  }}
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
            </Box>
          </>
        );
      };

      const CustomUIDemo = () => {
        const customValueSignal = { value: "Cherry" };
        const value = customValueSignal.value;

        return (
          <>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  Custom button with icon{" "}
                  <code style={{ fontWeight: "normal" }}>(ui prop)</code>
                </Label>
                <Picker
                  name="custom_ui"
                  value={customValueSignal.value}
                  action={(v) => {
                    customValueSignal.value = v;
                  }}
                  ui={
                    <button
                      style={{
                        padding: "8px 12px",
                        background: value ? "#007bff" : "#e9ecef",
                        color: value ? "#fff" : "#999",
                        border: "1px solid #ccc",
                        borderRadius: "4px",
                        cursor: "pointer",
                        fontFamily: "system-ui",
                        fontSize: "14px",
                        display: "flex",
                        alignItems: "center",
                        gap: "8px",
                      }}
                    >
                      🍎 {value || "Pick a fruit"}
                    </button>
                  }
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
              <Field vertical>
                <Label>
                  Custom pill-style UI{" "}
                  <code style={{ fontWeight: "normal" }}>(ui prop)</code>
                </Label>
                <Picker
                  name="custom_pill"
                  value={customValueSignal.value}
                  action={(v) => {
                    customValueSignal.value = v;
                  }}
                  ui={
                    <div
                      style={{
                        display: "inline-block",
                        padding: "4px 12px",
                        background: value ? "#f0f8ff" : "#f5f5f5",
                        border: `2px solid ${value ? "#007bff" : "#ddd"}`,
                        borderRadius: "20px",
                        cursor: "pointer",
                        fontSize: "13px",
                        fontWeight: "500",
                        color: value ? "#007bff" : "#999",
                      }}
                    >
                      {value || "No selection"}
                    </div>
                  }
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
            </Box>
          </>
        );
      };

      const PopoverDialogDemo = () => {
        const modeSignal = { popover: "Grape", dialog: "Banana" };

        return (
          <>
            <p>
              Dialog mode pushes a history entry, so the browser back button (or
              the Android back gesture) closes it instead of leaving the page.
              Popover mode replaces it, never adding an entry.
            </p>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  Popover mode{" "}
                  <code style={{ fontWeight: "normal" }}>
                    (mode="popover" — replaces state, no history entry)
                  </code>
                </Label>
                <Picker
                  id="with_popover"
                  name="mode_popover"
                  placeholder="Select…"
                  value={modeSignal.popover}
                  action={(v) => {
                    modeSignal.popover = v;
                  }}
                  mode="popover"
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
              <NavInspect />
              <Field vertical>
                <Label>
                  Dialog mode{" "}
                  <code style={{ fontWeight: "normal" }}>
                    (mode="dialog" — pushes history entry, back closes)
                  </code>
                </Label>
                <Picker
                  id="with_dialog"
                  name="mode_dialog"
                  placeholder="Select…"
                  value={modeSignal.dialog}
                  action={(v) => {
                    modeSignal.dialog = v;
                  }}
                  mode="dialog"
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
              <NavInspect />
            </Box>
          </>
        );
      };

      const TallPickerContent = () => (
        <div style={{ padding: "16px" }}>
          {Array.from({ length: 12 }, (_, i) => (
            <p
              key={i}
              style={{ margin: "0 0 10px", fontSize: "14px", color: "#444" }}
            >
              Item {i + 1} — some content to make the popup tall enough to
              scroll.
            </p>
          ))}
        </div>
      );

      const PopoverSizingDemo = () => (
        <Subsection id="popup-sizing-popover" title="Popover">
          <p>
            The cap is a ceiling, not a height: the popover shrinks below it
            when there isn't enough space above or below the trigger.
          </p>
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Default{" "}
                <code style={{ fontWeight: "normal" }}>(300px max)</code>
              </Label>
              <Picker placeholder="Open me…" mode="popover">
                <TallPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                <code>popoverMaxHeight={150}</code>
              </Label>
              <Picker
                placeholder="Open me…"
                mode="popover"
                popoverMaxHeight="150px"
              >
                <TallPickerContent />
              </Picker>
            </Field>
          </Box>
        </Subsection>
      );

      const DialogSizingDemo = () => (
        <Subsection id="popup-sizing-dialog" title="Dialog">
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>Default — sizes to content</Label>
              <Picker placeholder="Open me…" mode="dialog">
                <TallPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                <code>dialogExpandY</code> — fills available height
              </Label>
              <Picker placeholder="Open me…" mode="dialog" dialogExpandY>
                <TallPickerContent />
              </Picker>
            </Field>
          </Box>
        </Subsection>
      );

      // ── Loading & error ───────────────────────────────────────────────────────

      const ARTICLES = [
        { id: "art-101", title: "Notes on the Analytical Engine" },
        { id: "art-102", title: "On Computable Numbers" },
        { id: "art-103", title: "The Education of a Computer" },
      ];
      const findArticleById = (id) => ARTICLES.find((a) => a.id === id);
      const LOAD_DELAY = 1200;

      // A fake remote load whose outcome the reader chooses.
      const useFakeLoad = () => {
        const [phase, setPhase] = useState("loading");
        const timerRef = useRef(null);
        const settleOn = (outcome) => {
          clearTimeout(timerRef.current);
          setPhase("loading");
          timerRef.current = setTimeout(() => setPhase(outcome), LOAD_DELAY);
        };
        useEffect(() => {
          settleOn("loaded");
          return () => clearTimeout(timerRef.current);
        }, []);
        return {
          phase,
          load: () => settleOn("loaded"),
          fail: () => settleOn("error"),
        };
      };

      const LoadControls = ({ phase, load, fail }) => (
        <Box
          flex="x"
          spacing="s"
          alignY="center"
          style={{ marginBottom: "12px" }}
        >
          <Button action={load} disabled={phase === "loading"}>
            Load
          </Button>
          <Button action={fail} disabled={phase === "loading"}>
            Make it fail
          </Button>
          <code style={{ fontSize: "12px", color: "#666" }}>phase={phase}</code>
        </Box>
      );

      // `articles` is what the server gave us — empty until the load settles.
      const ArticleList = ({ articles, loading, selectedId }) => (
        <List
          selectable
          command="--navi-send"
          loading={loading}
          loadingSkeletonCount={3}
        >
          {articles.map((article, i) => (
            <ListItem
              selectable
              key={article.id}
              id={article.id}
              index={i}
              value={article.id}
              selected={selectedId === article.id}
              paddingX="m"
              paddingY="s"
            >
              {article.title}
            </ListItem>
          ))}
        </List>
      );

      const ContentLoadingDemo = () => {
        const { phase, load, fail } = useFakeLoad();

        return (
          <Subsection id="loading-content" title="Nothing selected">
            <LoadControls phase={phase} load={load} fail={fail} />
            {/* Pushed to the right so the popover, which opens under it, never
                covers the buttons above-left. */}
            <Box flex="x" alignX="end">
              <Picker
                name="loading_content"
                placeholder="Choose an article…"
                minWidth="240"
                error={
                  phase === "error"
                    ? "Could not load the list of articles."
                    : undefined
                }
                // Demo affordance only: keeps the popup open while you press the
                // buttons above ("none" = no backdrop, outside clicks pass through).
                pointerInteractionOutsideEffect="none"
              >
                <ArticleList
                  articles={phase === "loaded" ? ARTICLES : []}
                  loading={phase === "loading"}
                />
              </Picker>
            </Box>
          </Subsection>
        );
      };

      const ValueLoadingDemo = () => {
        const [articleId, setArticleId] = useState(ARTICLES[1].id);
        const { phase, load, fail } = useFakeLoad();

        // The value is an id: until its title arrives there is nothing readable
        // to put in the trigger.
        const triggerUI =
          phase === "loading" ? (
            <Text loading width="180px" />
          ) : phase === "error" ? (
            // Better than nothing: the raw id at least identifies what is
            // selected, and the error callout says why it is not a title.
            <Text color="secondary">{articleId}</Text>
          ) : (
            <>{findArticleById(articleId).title}</>
          );

        return (
          <Subsection id="loading-value" title={`"${ARTICLES[1].id}" is selected`}>
            <LoadControls phase={phase} load={load} fail={fail} />
            <Box flex="x" alignX="end">
              <Picker
                name="loading_value"
                value={articleId}
                ui={triggerUI}
                minWidth="240"
                error={
                  phase === "error"
                    ? "Could not load the selected article."
                    : undefined
                }
                pointerInteractionOutsideEffect="none"
                uiAction={(value) => {
                  setArticleId(value);
                }}
              >
                <ArticleList
                  articles={phase === "loaded" ? ARTICLES : []}
                  loading={phase === "loading"}
                  selectedId={articleId}
                />
              </Picker>
            </Box>
          </Subsection>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
