<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Picker Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 32px;
        color: #333;
        font-size: 1.8rem;
        text-align: center;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        position: relative;
        margin: 0 0 8px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.1rem;
        border-bottom: 2px solid #eee;
        scroll-margin-top: 12px;
      }
      .demo-section h3 {
        position: relative;
        margin: 20px 0 8px;
        color: #444;
        font-weight: 600;
        font-size: 0.95rem;
        scroll-margin-top: 12px;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .demo-section h4 {
        margin: 0 0 10px;
        color: #444;
        font-weight: 600;
        font-size: 0.85rem;
        scroll-margin-top: 12px;
      }
      .demo-subsection {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
      .demo-subsection-part {
        margin-top: 20px;
      }
      .demo-subsection-part:first-of-type {
        margin-top: 0;
      }
      .demo-toggle {
        display: inline-flex;
        margin-bottom: 16px;
        align-items: center;
        gap: 6px;
        color: #555;
        font-size: 0.85rem;
      }
      .demo-subsection:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
      }
      .toc-list {
        margin: 0;
        padding-left: 20px;
        line-height: 2;
      }
      .toc-list a {
        color: #1a56cc;
        text-decoration: none;
      }
      .toc-list a:hover {
        text-decoration: underline;
      }
      .toc-list ol {
        margin: 0;
        padding-left: 20px;
        line-height: 2;
        list-style: lower-alpha;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Picker Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useEffect, useRef, useState } from "preact/hooks";
      import {
        Badge,
        BadgeList,
        Box,
        Button,
        Field,
        Label,
        Link,
        List,
        ListItem,
        NaviDebug,
        Picker,
        Text,
        route,
        usePopupMode,
        setupRoutes,
      } from "@jsenv/navi";
      import { NavInspect } from "@jsenv/navi/src/control/demos/utils/nav_inspect.jsx";
      import { FakeBackend } from "@jsenv/navi/src/internal/fake_backend.jsx";

      // ── State signals (persisted in URL search params) ────────────────────

      const DEMO_ROUTE = route("", {
        searchParams: {},
      });
      setupRoutes([DEMO_ROUTE]);

      const App = () => (
        <NaviDebug debugAll>
          <Box flex="y" spacing="l">
            <TableOfContents />
            <Chapter id="dimensions" title="Dimensions — size & overflow">
              <FontSizeDemo />
              <WidthSection />
              <HeightSection />
            </Chapter>
            <Chapter id="icon" title="Picker icon">
              <PickerIconDemo />
              <RightSlotDemo />
            </Chapter>
            <Chapter id="variant" title="Variants">
              <VariantDemo />
              <VariantIconAlignDemo />
            </Chapter>
            <Chapter id="text-align" title="Text alignment">
              <TextAlignDemo />
            </Chapter>
            <Chapter id="value" title="Default value & placeholder">
              <DefaultValueDemo />
            </Chapter>
            <Chapter id="custom-ui" title="Custom UI via prop ui">
              <CustomUIDemo />
            </Chapter>
            <Chapter id="modes" title="Popover vs dialog mode">
              <PopoverDialogDemo />
              <ModeAwareContentDemo />
            </Chapter>
            <Chapter id="popup-sizing" title="Popup sizing">
              <PopoverSizingDemo />
              <DialogSizingDemo />
            </Chapter>
            <Chapter id="popup-position" title="Popup position">
              <PopoverPositionDemo />
              <DialogPositionDemo />
            </Chapter>
            <Chapter id="loading" title="Loading & error">
              <ContentLoadingDemo />
              <ValueLoadingDemo />
            </Chapter>
            <Chapter id="clearing" title="Clearing">
              <ClearableDemo />
              <ClearConfirmDemo />
              <ClearObjectRowDemo />
            </Chapter>
          </Box>
        </NaviDebug>
      );

      // Section (h2) / subsection (h3) heading with a hover anchor link. `<Link
      // anchor>` owns the id (derived from its href); the "#" child renders as
      // the visible affordance (shown on hover via revealOnInteraction).
      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      // A chapter groups related demos under one h2. Each demo inside renders as
      // a <div className="demo-subsection"> with its own h3.
      const Chapter = ({ id, title, children }) => (
        <div className="demo-section">
          <Heading level={2} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const Subsection = ({ id, title, children }) => (
        <div className="demo-subsection">
          <Heading level={3} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const SubsectionPart = ({ id, title, children }) => (
        <div className="demo-subsection-part">
          <Heading level={4} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const TableOfContents = () => (
        <div class="demo-section">
          <h2>Table of contents</h2>
          <ol class="toc-list">
            <li>
              <Link href="#dimensions">Dimensions — size &amp; overflow</Link>
              <ol>
                <li>
                  <Link href="#dim-font-size">Font size</Link>
                </li>
                <li>
                  <Link href="#dim-width">Width</Link>
                  <ol>
                    <li>
                      <Link href="#dim-width-value">Width adapts to value</Link>
                    </li>
                    <li>
                      <Link href="#dim-popup-width">
                        Popup width follows the trigger
                      </Link>
                    </li>
                  </ol>
                </li>
                <li>
                  <Link href="#dim-height">Height</Link>
                  <ol>
                    <li>
                      <Link href="#dim-single-line">
                        Single line by default
                      </Link>
                    </li>
                    <li>
                      <Link href="#dim-maxlines">More lines with maxLines</Link>
                    </li>
                    <li>
                      <Link href="#dim-multiline-overflow">
                        Overflow on multiple lines
                      </Link>
                    </li>
                  </ol>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#icon">Picker icon</Link>
              <ol>
                <li>
                  <Link href="#icon-right-slot">
                    rightSlot — something interactive in the slot
                  </Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#variant">Variants</Link>
              <ol>
                <li>
                  <Link href="#variant-gallery">The four drawings</Link>
                </li>
                <li>
                  <Link href="#variant-icon-align">
                    variant=&quot;icon&quot; — centering
                  </Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#text-align">Text alignment</Link>
            </li>
            <li>
              <Link href="#value">Default value &amp; placeholder</Link>
            </li>
            <li>
              <Link href="#custom-ui">Custom UI via prop ui</Link>
            </li>
            <li>
              <Link href="#modes">Popover vs dialog mode</Link>
              <ol>
                <li>
                  <Link href="#modes-history">Back-button close</Link>
                </li>
                <li>
                  <Link href="#modes-content">Content aware of the mode</Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#popup-sizing">Popup sizing</Link>
              <ol>
                <li>
                  <Link href="#popup-sizing-popover">Popover</Link>
                </li>
                <li>
                  <Link href="#popup-sizing-dialog">Dialog</Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#popup-position">Popup position</Link>
              <ol>
                <li>
                  <Link href="#popup-position-popover">Popover</Link>
                </li>
                <li>
                  <Link href="#popup-position-dialog">Dialog</Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#loading">Loading &amp; error</Link>
              <ol>
                <li>
                  <Link href="#loading-content">Loading content</Link>
                </li>
                <li>
                  <Link href="#loading-value">Loading the selected label</Link>
                </li>
              </ol>
            </li>
            <li>
              <Link href="#clearing">Clearing</Link>
              <ol>
                <li>
                  <Link href="#clearing-clearable">
                    clearable — navi&apos;s own cross
                  </Link>
                </li>
                <li>
                  <Link href="#clearing-action">
                    A cross that asks, then sends the clear
                  </Link>
                </li>
                <li>
                  <Link href="#clearing-custom-ui">
                    A settings row that holds an object
                  </Link>
                </li>
              </ol>
            </li>
          </ol>
        </div>
      );

      const AdjacentElement = () => (
        <div
          style={{
            flexShrink: 0,
            padding: "4px 10px",
            fontSize: "11px",
            color: "#7a5c00",
            background: "#fff8e1",
            border: "1.5px dashed #f0c040",
            borderRadius: "4px",
            whiteSpace: "nowrap",
          }}
        >
          adjacent element
        </div>
      );

      const SHORT_VALUE = "Apple";
      const MEDIUM_VALUE = "Elderberry";
      // Long enough to overflow one line at the picker width used below, short
      // enough to land inside two — that contrast is the whole point of the
      // overflow subsections.
      const LONG_SENTENCE = "A selected value that runs onto a second line";
      const LONG_WORD = "Supercalifragilisticexpialidocious";
      const VERY_LONG_TEXT =
        "This value is intentionally so long that it spans more than three lines inside the constrained picker width, so the line-clamp kicks in and an ellipsis appears at the end";

      // Overflow demos below run the same four values through the same picker
      // width, once on one line and once on two.
      const LONG_SELECTION = [
        "Apple",
        "Banana",
        "Lemon",
        "Cherry",
        "Elderberry",
      ];
      // Past two lines: a word that cannot be broken at all, a sentence several
      // times over, and a selection long enough that no row count would hold it.
      const LONGER_WORD = "Pneumonoultramicroscopicsilicovolcanoconiosis";
      const LONGER_SELECTION = [
        "Apple",
        "Banana",
        "Lemon",
        "Cherry",
        "Elderberry",
        "Blackcurrant",
        "Watermelon",
        "Pomegranate",
        "Passion fruit",
        "Clementine",
        "Gooseberry",
        "Persimmon",
      ];

      const BasicPickerContent = () => (
        <div style={{ padding: "16px" }}>
          <p style={{ margin: "0 0 12px 0", fontSize: "14px" }}>
            Hello world! This is the picker content.
          </p>
          <p
            style={{
              margin: "0",
              fontSize: "12px",
              color: "#666",
              lineHeight: "1.5",
            }}
          >
            You can put any content here — text, buttons, forms, images,
            whatever you need.
          </p>
        </div>
      );

      const VioletSquareIcon = () => (
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="1" y="1" width="16" height="16" rx="2" fill="#7c3aed" />
        </svg>
      );

      const CalendarSvg = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z" />
        </svg>
      );

      const TallPickerUI = ({ label }) => (
        <div
          style={{
            minHeight: "64px",
            display: "flex",
            alignItems: "center",
          }}
        >
          {label}
        </div>
      );

      // ── Dimensions ────────────────────────────────────────────────────────────

      const FontSizeDemo = () => (
        <Subsection id="dim-font-size" title="Font size">
          <Box flex="x" spacing="m" alignY="end" flexWrap>
            {["xs", "m", "xl", "xxl"].map((size) => (
              <Field key={size} vertical>
                <Label>
                  <code style={{ fontWeight: "normal" }}>size={size}</code>
                </Label>
                <Picker
                  name={`dim_font_${size}`}
                  placeholder="Fruit…"
                  value=""
                  action={() => {}}
                  size={size}
                >
                  <BasicPickerContent />
                </Picker>
              </Field>
            ))}
          </Box>
        </Subsection>
      );

      const WidthValueDemo = () => (
        <SubsectionPart id="dim-width-value" title="Width adapts to value">
          <Box
            flex="x"
            spacing="s"
            alignY="center"
            style={{ marginBottom: "12px" }}
          >
            <AdjacentElement />
            <span style={{ fontSize: "12px", color: "#555" }}>
              ← this represents an element sitting next to the picker
            </span>
          </Box>
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Short value{" "}
                <code style={{ fontWeight: "normal" }}>(default)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_width_short"
                  value={SHORT_VALUE}
                  action={() => {}}
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Medium value{" "}
                <code style={{ fontWeight: "normal" }}>(default)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_width_medium"
                  value={MEDIUM_VALUE}
                  action={() => {}}
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
          </Box>

          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Short value{" "}
                <code style={{ fontWeight: "normal" }}>(minWidth="140")</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_minwidth_short"
                  value={SHORT_VALUE}
                  action={() => {}}
                  minWidth="140"
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Medium value{" "}
                <code style={{ fontWeight: "normal" }}>(minWidth="140")</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center">
                <Picker
                  name="dim_minwidth_medium"
                  value={MEDIUM_VALUE}
                  action={() => {}}
                  minWidth="140"
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
          </Box>

          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Short value{" "}
                <code style={{ fontWeight: "normal" }}>(expandX)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center" expandX>
                <Picker
                  name="dim_expandx_short"
                  value={SHORT_VALUE}
                  action={() => {}}
                  expandX
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
            <Field vertical>
              <Label>
                Medium value{" "}
                <code style={{ fontWeight: "normal" }}>(expandX)</code>
              </Label>
              <Box flex="x" spacing="s" alignY="center" expandX>
                <Picker
                  name="dim_expandx_medium"
                  value={MEDIUM_VALUE}
                  action={() => {}}
                  expandX
                >
                  <BasicPickerContent />
                </Picker>
                <AdjacentElement />
              </Box>
            </Field>
          </Box>
        </SubsectionPart>
      );

      // The same four values, laid out the same way, so what changes between
      // the parts below is only how many lines the picker is given.
      const OverflowCases = ({
        idPrefix,
        maxLines,
        pickerProps,
        sentence,
        word,
        selection,
      }) => (
        <Box flex="y" spacing="m">
          <Field vertical>
            <Label>A long sentence</Label>
            <Picker
              name={`${idPrefix}_sentence`}
              value={sentence}
              action={() => {}}
              maxWidth="200"
              maxLines={maxLines}
              {...pickerProps}
            >
              <BasicPickerContent />
            </Picker>
          </Field>
          <Field vertical>
            <Label>A long word</Label>
            <Picker
              name={`${idPrefix}_word`}
              value={word}
              action={() => {}}
              maxWidth="200"
              maxLines={maxLines}
              {...pickerProps}
            >
              <BasicPickerContent />
            </Picker>
          </Field>
          <Field vertical>
            <Label>A long selection</Label>
            <Picker
              name={`${idPrefix}_selection`}
              value={selection.join(", ")}
              action={() => {}}
              maxWidth="200"
              maxLines={maxLines}
              {...pickerProps}
            >
              <BasicPickerContent />
            </Picker>
          </Field>
          <Field vertical>
            <Label>
              A long selection{" "}
              <code style={{ fontWeight: "normal" }}>
                (rendered by a BadgeList)
              </code>
            </Label>
            <Picker
              name={`${idPrefix}_badges`}
              value={selection.join(", ")}
              action={() => {}}
              maxWidth="200"
              maxLines={maxLines}
              {...pickerProps}
              ui={
                <BadgeList>
                  {selection.map((item) => (
                    <Badge key={item}>{item}</Badge>
                  ))}
                </BadgeList>
              }
            >
              <BasicPickerContent />
            </Picker>
          </Field>
        </Box>
      );

      const ShortPickerContent = () => (
        <div
          style={{
            padding: "10px 14px",
            fontSize: "13px",
            whiteSpace: "nowrap",
          }}
        >
          Short
        </div>
      );

      const PopupWidthDemo = () => (
        <SubsectionPart
          id="dim-popup-width"
          title="Popup width follows the trigger"
        >
          <Box flex="y" spacing="m">
            <Field vertical>
              <Label>
                Default{" "}
                <code style={{ fontWeight: "normal" }}>
                  (popup stretches to the trigger)
                </code>
              </Label>
              <Picker placeholder="A deliberately wide trigger…" width="320px">
                <ShortPickerContent />
              </Picker>
            </Field>
            <Field vertical>
              <Label>
                <code>popupWidthFitContent</code>{" "}
                <code style={{ fontWeight: "normal" }}>
                  (content sizes the popup)
                </code>
              </Label>
              <Picker
                placeholder="A deliberately wide trigger…"
                width="320px"
                popupWidthFitContent
              >
                <ShortPickerContent />
              </Picker>
            </Field>
          </Box>
        </SubsectionPart>
      );

      const WidthSection = () => (
        <Subsection id="dim-width" title="Width">
          <WidthValueDemo />
          <PopupWidthDemo />
        </Subsection>
      );

      const HeightSection = () => {
        // paddingY is what stands between the lines and the trigger's edges;
        // the checkbox is there to check it survives every clamping mode.
        const [padded, setPadded] = useState(false);
        const pickerProps = padded ? { paddingY: "l" } : undefined;
        return (
          <Subsection id="dim-height" title="Height">
            <label className="demo-toggle">
              <input
                type="checkbox"
                checked={padded}
                onChange={(e) => setPadded(e.currentTarget.checked)}
              />
              <code>paddingY="l"</code>
            </label>
            <SubsectionPart id="dim-single-line" title="Single line by default">
              <OverflowCases
                idPrefix="dim_single_line"
                pickerProps={pickerProps}
                sentence={LONG_SENTENCE}
                word={LONG_WORD}
                selection={LONG_SELECTION}
              />
            </SubsectionPart>
            <SubsectionPart id="dim-maxlines" title="More lines with maxLines">
              <OverflowCases
                idPrefix="dim_maxlines"
                maxLines={2}
                pickerProps={pickerProps}
                sentence={LONG_SENTENCE}
                word={LONG_WORD}
                selection={LONG_SELECTION}
              />
            </SubsectionPart>
            <SubsectionPart
              id="dim-multiline-overflow"
              title="Overflow on multiple lines"
            >
              <OverflowCases
                idPrefix="dim_multiline_overflow"
                maxLines={2}
                pickerProps={pickerProps}
                sentence={VERY_LONG_TEXT}
                word={LONGER_WORD}
                selection={LONGER_SELECTION}
              />
            </SubsectionPart>
          </Subsection>
        );
      };

      // ── Popover position ──────────────────────────────────────────────────────

      const POSITION_AREAS = [
        "bottom-start",
        "bottom",
        "bottom-end",
        "top-start",
        "top",
        "top-end",
        "right-start",
        "right",
        "left-start",
        "left",
        "inset(top-left)",
        "center",
      ];

      const PositionAreaStage = ({ children }) => (
        <div
          style={{
            display: "flex",
            justifyContent: "center",
            alignItems: "center",
            minHeight: "260px",
            marginTop: "16px",
            background:
              "repeating-linear-gradient(45deg, #fafafa, #fafafa 10px, #f2f2f2 10px, #f2f2f2 20px)",
            borderRadius: "6px",
          }}
        >
          {children}
        </div>
      );

      const PositionAreaSelect = ({ value, onChange }) => (
        <label style={{ fontSize: "12px", color: "#555" }}>
          positionArea{" "}
          <select value={value} onChange={(e) => onChange(e.target.value)}>
            {POSITION_AREAS.map((area) => (
              <option key={area} value={area}>
                {area}
              </option>
            ))}
          </select>
        </label>
      );

      const PopoverPositionDemo = () => {
        const [positionArea, setPositionArea] = useState("bottom-start");

        return (
          <Subsection id="popup-position-popover" title="Popover">
            <p>
              A bare token places the popover next to the trigger,{" "}
              <code>inset(…)</code> makes it overlap. It still flips to the
              opposite side on its own when there isn't enough room.
            </p>
            <PositionAreaSelect
              value={positionArea}
              onChange={setPositionArea}
            />
            <PositionAreaStage>
              <Picker
                id="popup_position_popover"
                placeholder="Open me…"
                mode="popover"
                positionArea={positionArea}
                popupWidthFitContent
                pointerInteractionOutsideEffect="none"
              >
                <ShortPickerContent />
              </Picker>
            </PositionAreaStage>
          </Subsection>
        );
      };

      const DialogPositionDemo = () => {
        const [positionArea, setPositionArea] = useState("center");

        return (
          <Subsection id="popup-position-dialog" title="Dialog">
            <p>
              A dialog docks against the viewport rather than the trigger, and
              defaults to <code>center</code>. It is modal, so the browser's own
              backdrop swallows every outside click — unlike the popover above,
              the select can only be changed while it is closed.

        useEffect(() => {

          load: () => settleOn("loaded"),

                <FruitList selected={value} />
              </Picker>
            </Field>
          </Subsection>
        );
      };

      const ClearConfirmDemo = () => (
        <Subsection
          id="clearing-action"
          title="A cross that asks, then sends the clear"
        >
          <p>
            <code>clearConfirm</code> is the question the cross asks — the cross
            is then a <code>&lt;Picker type="confirm"&gt;</code>, and this its{" "}
            <code>message</code>, plain text or JSX. It is asked BEFORE anything
            is emptied: while it is on the screen the field is exactly as it
            was, and answering no leaves it that way. Answering yes clears and
            sends, so the picker&apos;s own action receives the cleared value
            like any other choice — nothing else to wire.
          </p>
          <p>
            The clear is <strong>optimistic</strong>: the field empties on the
            spot and the send commits it afterwards. Press <em>échouer</em>{" "}
            below to refuse the call — the value comes back where it was, and
            the error lands on the picker rather than on the cross, which left
            with the value it had cleared.
          </p>
          <FakeBackend value={{ fruit: "Cherry" }}>
            {({ value, action }) => (
              <Field vertical>
                <Label>clearable + clearConfirm</Label>
                <Picker
                  name="clear_action"
                  minWidth="200"
                  clearable
                  clearConfirm={`Remove "${value.fruit}" from this field?`}
                  placeholder="Pick a fruit…"
                  value={value.fruit}
                  action={(fruit) => action({ fruit })}
                >
                  <FruitList selected={value.fruit} />
                </Picker>
              </Field>
            )}
          </FakeBackend>
        </Subsection>
      );

      const ClearObjectRowDemo = () => (
        <Subsection
          id="clearing-custom-ui"
          title="A settings row that holds an object"
        >
          <p>
            The picker wears its own <code>ui</code> — a label above the value —
            and holds one field of a bigger object. The cross sends what the
            picker now holds, so the action puts the cleared nickname back into
            the object and the visibility next to it is left alone.
          </p>
          <FakeBackend value={{ nickname: "Dam", visibility: "public" }}>
            {({ value, action }) => (
              <Field vertical>
                <Label>Settings row</Label>
                <Picker
                  name="clear_custom_ui"
                  mode="dialog"
                  minWidth="260"
                  clearable
                  clearConfirm="Remove your nickname?"
                  value={value.nickname}
                  ui={
                    <Box flex="y" style={{ padding: "6px 0" }}>
                      <span style={{ fontWeight: "500" }}>Nickname</span>
                      <span style={{ color: "#777", fontSize: "13px" }}>
                        {value.nickname || "Not set"}
                      </span>
                    </Box>
                  }
                  action={(nickname) => action({ ...value, nickname })}
                >
                  <List selectable command="--navi-send">
                    {["Dam", "Damien", "dmail"].map((nickname, i) => (
                      <ListItem
                        selectable
                        key={nickname}
                        id={`nickname_${nickname}`}
                        index={i}
                        value={nickname}
                        selected={value.nickname === nickname}
                        paddingX="m"
                        paddingY="s"
                      >
                        {nickname}
                      </ListItem>
                    ))}
                  </List>
                </Picker>
              </Field>
            )}
          </FakeBackend>
        </Subsection>
      );

      const RightSlotDemo = () => {
        const [pressCount, setPressCount] = useState(0);

        return (
          <Subsection
            id="icon-right-slot"
            title="rightSlot — something interactive in the slot"
          >
            <p>
              <code>rightSlotIcon</code> is wrapped in an{" "}
              <code>&lt;Icon&gt;</code>, which is <code>aria-hidden</code>: a
              button in there is reachable by tab and invisible to assistive
              tech. <code>rightSlot</code> renders what it is given as-is, so
              anything interactive goes there instead. The slot holds one thing
              at a time — a clear cross, when there is one, takes the place of
              both.
            </p>
            <Box flex="x" spacing="m" alignY="center">
              <Picker
                name="right_slot"
                minWidth="200"
                placeholder="Pick a fruit…"
                rightSlot={
                  <Button
                    icon
                    variant="discrete"
                    tabIndex="-1"
                    loadingOutline={false}
                    onMouseDown={(e) => {
                      e.preventDefault();
                    }}
                    action={() => {
                      setPressCount(pressCount + 1);
                    }}
                  >
                    ⓘ
                  </Button>
                }
              >
                <FruitList />
              </Picker>
              <div
                style={{
                  padding: "4px 10px",
                  fontSize: "12px",
                  background: "#f1f8e9",
                  border: "1px solid #c5e1a5",
                  borderRadius: "4px",
                }}
              >
                ⓘ pressed {pressCount} time(s)
              </div>
            </Box>
          </Subsection>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
