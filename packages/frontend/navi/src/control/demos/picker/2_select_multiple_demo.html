<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multiselect Picker Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 600px;
        margin: 0 auto;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-bottom: 24px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1rem;
      }
      p {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .value-display {
        margin-top: 12px;
        color: #333;
        font-size: 13px;
      }
      /* Chips */
      .chip-list {
        display: flex;
        min-height: 28px;
        margin-top: 10px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        padding: 2px 10px;
        align-items: center;
        gap: 4px;
        color: #1a56cc;
        font-weight: 500;
        font-size: 13px;
        background: #e8f0fe;
        border-radius: 999px;
      }
      .chip-remove {
        display: inline-flex;
        width: 16px;
        height: 16px;
        padding: 0;
        align-items: center;
        justify-content: center;
        color: #1a56cc;
        font-size: 14px;
        line-height: 1;
        background: none;
        border: none;
        border-radius: 50%;
        opacity: 0.7;
        cursor: pointer;
      }
      .chip-remove:hover {
        background: #c6d8ff;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Multiselect Picker Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import { useRef } from "preact/hooks";
      import {
        Box,
        Field,
        Label,
        Picker,
        Button,
        List,
        NaviDebug,
        Badge,
        BadgeList,
        Text,
      } from "@jsenv/navi";

      const FRUIT_OPTIONS = [
        "Apple",
        "Banana",
        "Cherry",
        "Date",
        "Elderberry",
        "Fig",
        "Grape",
      ];

      const SKILL_OPTIONS = [
        "HTML",
        "CSS",
        "JavaScript",
        "TypeScript",
        "React",
        "Vue",
        "Angular",
        "Node.js",
        "Python",
        "Rust",
        "Go",
        "Java",
        "C++",
        "Swift",
        "Kotlin",
        "SQL",
      ];

      const App = () => (
        <Box flex="y" spacing="l">
          <TextDisplay />
          <ChipsSimpleDisplay />
          <ChipsWithDeleteDisplay />
        </Box>
      );

      // ── 1. Text display ───────────────────────────────────────────────────

      const TextDisplay = () => {
        const selectedSignal = useSignal([
          "Apple",
          "Banana",
          "Cherry",
          "Elderberry",
        ]);
        const selectedArray = selectedSignal.value;

        const selectedSignalMr2 = useSignal([
          "Apple",
          "Banana",
          "Cherry",
          "Date",
          "Elderberry",
          "Fig",
          "Grape",
        ]);
        const selectedArrayMr2 = selectedSignalMr2.value;

        return (
          <div class="demo-section">
            <h2>1. Text display — comma-separated</h2>
            <p>
              <code>List selectable multiple command="--navi-update"</code>{" "}
              updates the picker's pending state on each click. Confirming
              commits the array to the action callback, which updates the
              displayed value.
            </p>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  Fruits <code style="font-weight:normal">(default)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_text"
                  placeholder="Select fruits, a very long placeholder to trigger multiline behavior"
                  value={selectedArray}
                  uiAction={(v) => {
                    selectedSignal.value = v;
                  }}
                  action={(v) => {
                    selectedSignal.value = v;
                  }}
                  maxWidth="150"
                >
                  <List selectable multiple command="--navi-update">
                    {FRUIT_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`${opt}_chip`}
                        index={i}
                        value={opt}
                        selected={selectedArray.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
              <Field vertical>
                <Label>
                  Fruits <code style="font-weight:normal">(maxLines=2)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_text_maxrows2"
                  placeholder="Select fruits…"
                  value={selectedArrayMr2}
                  uiAction={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  action={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  maxWidth="150"
                  maxLines={2}
                >
                  <List selectable multiple command="--navi-update">
                    {FRUIT_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`${opt}_chip_mr2`}
                        index={i}
                        value={opt}
                        selected={selectedArrayMr2.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
            </Box>
          </div>
        );
      };

      // ── 2. Chips display (no delete) ──────────────────────────────────────

      const ChipsSimpleDisplay = () => {
        const selectedSignal = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
        ]);
        const selectedArray = selectedSignal.value;

        const selectedSignalMr2 = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
        ]);
        const selectedArrayMr2 = selectedSignalMr2.value;

        const chipsFallback = (
          <Badge
            background="transparent"
            color="var(--picker-placeholder-color)"
          >
            Select skills…
          </Badge>
        );

        return (
          <div class="demo-section">
            <h2>2. Chips display</h2>
            <p>
              Selected items appear as chip pills inside the picker. Clicking
              anywhere on the picker opens the dropdown where items can be
              toggled.
            </p>
            <p style="color: #0f5132; background: #d1e7dd; border: 1px solid #badbcc; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 0 0 16px">
              <strong>maxLines works with chips.</strong> Chips are flex items
              with spacing, not plain text, so CSS <code>line-clamp</code> never
              sees the rows they wrap onto. The picker hands its{" "}
              <code>maxLines</code> to the <code>BadgeList</code> instead (and
              turns its own clamp off): the list measures where the rows fall
              and renders only the chips that fit, plus a <code>+N more</code>{" "}
              chip for the rest. Nothing to set on the <code>BadgeList</code>{" "}
              itself — <code>max</code> is still there to cap the count rather
              than the rows.
            </p>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  Skills <code style="font-weight:normal">(default)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_chips_simple"
                  value={selectedArray}
                  ui={
                    <BadgeList fallback={chipsFallback}>
                      {selectedArray.map((opt) => (
                        <Badge key={opt}>{opt}</Badge>
                      ))}
                    </BadgeList>
                  }
                  uiAction={(v) => {
                    selectedSignal.value = v;
                  }}
                  action={(v) => {
                    selectedSignal.value = v;
                  }}
                  maxWidth="150"
                >
                  <List
                    selectable
                    multiple
                    id="skills_list_simple"
                    command="--navi-update"
                    style="min-width: 180px"
                  >
                    {SKILL_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`simple_${opt}`}
                        index={i}
                        value={opt}
                        selected={selectedArray.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
              <Field vertical>
                <Label>
                  Skills <code style="font-weight:normal">(maxLines=2)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_chips_simple_mr2"
                  value={selectedArrayMr2}
                  ui={
                    <BadgeList fallback={chipsFallback}>
                      {selectedArrayMr2.map((opt) => (
                        <Badge key={opt}>{opt}</Badge>
                      ))}
                    </BadgeList>
                  }
                  uiAction={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  action={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  maxWidth="150"
                  maxLines={2}
                >
                  <List
                    selectable
                    multiple
                    id="skills_list_simple_mr2"
                    command="--navi-update"
                    style="min-width: 180px"
                  >
                    {SKILL_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`simple_mr2_${opt}`}
                        index={i}
                        value={opt}
                        selected={selectedArrayMr2.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
            </Box>
          </div>
        );
      };

      // ── 3. Chips display (with delete button on badge) ────────────────────

      const ChipsWithDeleteDefault = () => {
        const selectedSignal = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
          "Node.js",
          "Python",
        ]);
        const listRef = useRef(null);
        const selectedArray = selectedSignal.value;

        return (
          <Field vertical>
            <Label>
              Skills <code style="font-weight:normal">(default)</code>
            </Label>
            <Picker
              type="array"
              name="multiselect_chips_delete"
              value={selectedArray}
              ui={
                selectedArray.length === 0 ? (
                  <span style="color: #999">Select skills…</span>
                ) : (
                  <BadgeList>
                    {selectedArray.map((opt) => (
                      <Picker.Chip key={opt} value={opt}>
                        <Text>{opt}</Text>
                      </Picker.Chip>
                    ))}
                  </BadgeList>
                )
              }
              uiAction={(v) => {
                selectedSignal.value = v;
              }}
              action={(v) => {
                selectedSignal.value = v;
              }}
              maxWidth="200"
            >
              <List
                selectable
                ref={listRef}
                multiple
                command="--navi-update"
                style="min-width: 180px"
              >
                {SKILL_OPTIONS.map((opt, i) => (
                  <List.Item
                    selectable
                    key={opt}
                    id={opt}
                    index={i}
                    value={opt}
                    selected={selectedArray.includes(opt)}
                    padding="s"
                    spacing="s"
                  >
                    {opt}
                  </List.Item>
                ))}
              </List>
            </Picker>
          </Field>
        );
      };

      const ChipsWithDeleteMaxLines2 = () => {
        const selectedSignalMr2 = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
          "Node.js",
          "Python",
        ]);
        const selectedArrayMr2 = selectedSignalMr2.value;

        return (
          <Field vertical>
            <Label>
              Skills <code style="font-weight:normal">(maxLines=2)</code>
            </Label>
            <Picker
              type="array"
              name="multiselect_chips_delete_mr2"
              value={selectedArrayMr2}
              maxLines={2}
              ui={
                <BadgeList>
                  {selectedArrayMr2.map((opt) => (
                    <Picker.Chip key={opt} value={opt}>
                      <Text>{opt}</Text>
                    </Picker.Chip>
                  ))}
                </BadgeList>
              }
              uiAction={(v) => {
                selectedSignalMr2.value = v;
              }}
              action={(v) => {
                selectedSignalMr2.value = v;
              }}
              maxWidth="200"
            >
              <List
                selectable
                multiple
                command="--navi-update"
                style="min-width: 180px"
              >
                {SKILL_OPTIONS.map((opt, i) => (
                  <List.Item
                    selectable
                    key={opt}
                    id={`mr2_${opt}`}
                    index={i}
                    value={opt}
                    selected={selectedArrayMr2.includes(opt)}
                    padding="s"
                    spacing="s"
                  >
                    {opt}
                  </List.Item>
                ))}
              </List>
            </Picker>
          </Field>
        );
      };

      const ChipsWithDeleteReadOnly = () => {
        const selectedArray = ["HTML", "CSS", "JavaScript"];

        return (
          <Field vertical>
            <Label>
              Skills <code style="font-weight:normal">(readOnly)</code>
            </Label>
            <Picker
              type="array"
              name="multiselect_chips_delete_readonly"
              readOnly
              value={selectedArray}
              ui={
                <BadgeList>
                  {selectedArray.map((opt) => (
                    <Picker.Chip key={opt} value={opt}>
                      <Text>{opt}</Text>
                    </Picker.Chip>
                  ))}
                </BadgeList>
              }
              maxWidth="200"
            >
              <List
                selectable
                multiple
                command="--navi-update"
                style="min-width: 180px"
              >
                {SKILL_OPTIONS.map((opt, i) => (
                  <List.Item
                    selectable
                    key={opt}
                    id={`readonly_${opt}`}
                    index={i}
                    value={opt}
                    selected={selectedArray.includes(opt)}
                    padding="s"
                    spacing="s"
                  >
                    {opt}
                  </List.Item>
                ))}
              </List>
            </Picker>
          </Field>
        );
      };

      const ChipsWithDeleteDisplay = () => {
        return (
          <div class="demo-section">
            <h2>3. Chips with delete button</h2>
            <p>
              Each chip has an × button to deselect without reopening the
              dropdown. Two UX drawbacks to be aware of: the interaction target
              is very small (the tiny × icon), and clicking the chip label
              itself — outside the × button — opens the picker instead of
              removing the chip, which can surprise users who expect the whole
              chip to be the delete target.
            </p>
            <p style="color: #0f5132; background: #d1e7dd; border: 1px solid #badbcc; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 0 0 16px">
              <strong>maxLines works with chips.</strong> Same mechanism as
              section 2: the picker hands its <code>maxLines</code> down and the{" "}
              <code>BadgeList</code> caps its own rows.
            </p>
            <Box flex="y" spacing="m">
              <ChipsWithDeleteDefault />
              <ChipsWithDeleteMaxLines2 />
              <ChipsWithDeleteReadOnly />
            </Box>
          </div>
        );
      };

      render(
        <NaviDebug debugAction debugInteraction debugPopup>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
