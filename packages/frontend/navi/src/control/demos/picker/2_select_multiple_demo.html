<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multiselect Picker Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 600px;
        margin: 0 auto;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-bottom: 24px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1rem;
      }
      p {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .value-display {
        margin-top: 12px;
        color: #333;
        font-size: 13px;
      }
      /* Chips */
      .chip-list {
        display: flex;
        min-height: 28px;
        margin-top: 10px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        padding: 2px 10px;
        align-items: center;
        gap: 4px;
        color: #1a56cc;
        font-weight: 500;
        font-size: 13px;
        background: #e8f0fe;
        border-radius: 999px;
      }
      .chip-remove {
        display: inline-flex;
        width: 16px;
        height: 16px;
        padding: 0;
        align-items: center;
        justify-content: center;
        color: #1a56cc;
        font-size: 14px;
        line-height: 1;
        background: none;
        border: none;
        border-radius: 50%;
        opacity: 0.7;
        cursor: pointer;
      }
      .chip-remove:hover {
        background: #c6d8ff;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Multiselect Picker Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import { useLayoutEffect, useRef, useState } from "preact/hooks";
      import {
        Box,
        Field,
        Label,
        Picker,
        Button,
        List,
        NaviDebug,
        Badge,
        BadgeList,
        Text,
      } from "@jsenv/navi";

      const FRUIT_OPTIONS = [
        "Apple",
        "Banana",
        "Cherry",
        "Date",
        "Elderberry",
        "Fig",
        "Grape",
      ];

      const SKILL_OPTIONS = [
        "HTML",
        "CSS",
        "JavaScript",
        "TypeScript",
        "React",
        "Vue",
        "Angular",
        "Node.js",
        "Python",
        "Rust",
        "Go",
        "Java",
        "C++",
        "Swift",
        "Kotlin",
        "SQL",
      ];

      const App = () => (
        <Box flex="y" spacing="l">
          <TextDisplay />
          <ChipsSimpleDisplay />
          <ChipsWithDeleteDisplay />
          <EmptyHeightDisplay />
        </Box>
      );

      // ── 1. Text display ───────────────────────────────────────────────────

      const TextDisplay = () => {
        const selectedSignal = useSignal([
          "Apple",
          "Banana",
          "Cherry",
          "Elderberry",
        ]);
        const selectedArray = selectedSignal.value;

        const selectedSignalMr2 = useSignal([
          "Apple",
          "Banana",
          "Cherry",
          "Date",
          "Elderberry",
          "Fig",
          "Grape",
        ]);
        const selectedArrayMr2 = selectedSignalMr2.value;

        return (
          <div class="demo-section">
            <h2>1. Text display — comma-separated</h2>
            <p>
              <code>List selectable multiple command="--navi-update"</code>{" "}
              updates the picker's pending state on each click. Confirming
              commits the array to the action callback, which updates the
              displayed value.
            </p>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  Fruits <code style="font-weight:normal">(default)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_text"
                  placeholder="Select fruits, a very long placeholder to trigger multiline behavior"
                  value={selectedArray}
                  uiAction={(v) => {
                    selectedSignal.value = v;
                  }}
                  action={(v) => {
                    selectedSignal.value = v;
                  }}
                  maxWidth="150"
                >
                  <List selectable multiple command="--navi-update">
                    {FRUIT_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`${opt}_chip`}
                        index={i}
                        value={opt}
                        selected={selectedArray.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
              <Field vertical>
                <Label>
                  Fruits <code style="font-weight:normal">(maxLines=2)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_text_maxrows2"
                  placeholder="Select fruits…"
                  value={selectedArrayMr2}
                  uiAction={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  action={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  maxWidth="150"
                  maxLines={2}
                >
                  <List selectable multiple command="--navi-update">
                    {FRUIT_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`${opt}_chip_mr2`}
                        index={i}
                        value={opt}
                        selected={selectedArrayMr2.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
            </Box>
          </div>
        );
      };

      // ── 2. Chips display (no delete) ──────────────────────────────────────

      const ChipsSimpleDisplay = () => {
        const selectedSignal = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
        ]);
        const selectedArray = selectedSignal.value;

        const selectedSignalMr2 = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
        ]);
        const selectedArrayMr2 = selectedSignalMr2.value;

        const chipsFallback = "Select skills…";

        return (
          <div class="demo-section">
            <h2>2. Chips display</h2>
            <p>
              Selected items appear as chip pills inside the picker. Clicking
              anywhere on the picker opens the dropdown where items can be
              toggled.
            </p>
            <p style="color: #0f5132; background: #d1e7dd; border: 1px solid #badbcc; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 0 0 16px">
              <strong>maxLines works with chips.</strong> Chips are flex items
              with spacing, not plain text, so CSS <code>line-clamp</code> never
              sees the rows they wrap onto. The picker hands its{" "}
              <code>maxLines</code> to the <code>BadgeList</code> instead (and
              turns its own clamp off): the list measures where the rows fall
              and renders only the chips that fit, plus a <code>+N more</code>{" "}
              chip for the rest. Nothing to set on the <code>BadgeList</code>{" "}
              itself — <code>max</code> is still there to cap the count rather
              than the rows.
            </p>
            <Box flex="y" spacing="m">
              <Field vertical>
                <Label>
                  Skills <code style="font-weight:normal">(default)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_chips_simple"
                  value={selectedArray}
                  ui={
                    <BadgeList fallback={chipsFallback}>
                      {selectedArray.map((opt) => (
                        <Badge key={opt}>{opt}</Badge>
                      ))}
                    </BadgeList>
                  }
                  uiAction={(v) => {
                    selectedSignal.value = v;
                  }}
                  action={(v) => {
                    selectedSignal.value = v;
                  }}
                  maxWidth="150"
                >
                  <List
                    selectable
                    multiple
                    id="skills_list_simple"
                    command="--navi-update"
                    style="min-width: 180px"
                  >
                    {SKILL_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`simple_${opt}`}
                        index={i}
                        value={opt}
                        selected={selectedArray.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
              <Field vertical>
                <Label>
                  Skills <code style="font-weight:normal">(maxLines=2)</code>
                </Label>
                <Picker
                  type="array"
                  name="multiselect_chips_simple_mr2"
                  value={selectedArrayMr2}
                  ui={
                    <BadgeList fallback={chipsFallback}>
                      {selectedArrayMr2.map((opt) => (
                        <Badge key={opt}>{opt}</Badge>
                      ))}
                    </BadgeList>
                  }
                  uiAction={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  action={(v) => {
                    selectedSignalMr2.value = v;
                  }}
                  maxWidth="150"
                  maxLines={2}
                >
                  <List
                    selectable
                    multiple
                    id="skills_list_simple_mr2"
                    command="--navi-update"
                    style="min-width: 180px"
                  >
                    {SKILL_OPTIONS.map((opt, i) => (
                      <List.Item
                        selectable
                        key={opt}
                        id={`simple_mr2_${opt}`}
                        index={i}
                        value={opt}
                        selected={selectedArrayMr2.includes(opt)}
                        padding="s"
                        spacing="s"
                      >
                        {opt}
                      </List.Item>
                    ))}
                  </List>
                </Picker>
              </Field>
            </Box>
          </div>
        );
      };

      // ── 3. Chips display (with delete button on badge) ────────────────────

      const ChipsWithDeleteDefault = () => {
        const selectedSignal = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
          "Node.js",
          "Python",
        ]);
        const listRef = useRef(null);
        const selectedArray = selectedSignal.value;

        return (
          <Field vertical>
            <Label>
              Skills <code style="font-weight:normal">(default)</code>
            </Label>
            <Picker
              type="array"
              name="multiselect_chips_delete"
              value={selectedArray}
              ui={
                <BadgeList fallback="Select skills…">
                  {selectedArray.map((opt) => (
                    <Picker.Chip key={opt} value={opt}>
                      <Text>{opt}</Text>
                    </Picker.Chip>
                  ))}
                </BadgeList>
              }
              uiAction={(v) => {
                selectedSignal.value = v;
              }}
              action={(v) => {
                selectedSignal.value = v;
              }}
              maxWidth="200"
            >
              <List
                selectable
                ref={listRef}
                multiple
                command="--navi-update"
                style="min-width: 180px"
              >
                {SKILL_OPTIONS.map((opt, i) => (
                  <List.Item
                    selectable
                    key={opt}
                    id={opt}
                    index={i}
                    value={opt}
                    selected={selectedArray.includes(opt)}
                    padding="s"
                    spacing="s"
                  >
                    {opt}
                  </List.Item>
                ))}
              </List>
            </Picker>
          </Field>
        );
      };

      const ChipsWithDeleteMaxLines2 = () => {
        const selectedSignalMr2 = useSignal([
          "HTML",
          "CSS",
          "JavaScript",
          "TypeScript",
          "React",
          "Vue",
          "Node.js",
          "Python",
        ]);
        const selectedArrayMr2 = selectedSignalMr2.value;

        return (
          <Field vertical>
            <Label>
              Skills <code style="font-weight:normal">(maxLines=2)</code>
            </Label>
            <Picker
              type="array"
              name="multiselect_chips_delete_mr2"
              value={selectedArrayMr2}
              maxLines={2}
              ui={
                <BadgeList fallback="Select skills…">
                  {selectedArrayMr2.map((opt) => (
                    <Picker.Chip key={opt} value={opt}>
                      <Text>{opt}</Text>
                    </Picker.Chip>
                  ))}
                </BadgeList>
              }
              uiAction={(v) => {
                selectedSignalMr2.value = v;
              }}
              action={(v) => {
                selectedSignalMr2.value = v;
              }}
              maxWidth="200"
            >
              <List
                selectable
                multiple
                command="--navi-update"
                style="min-width: 180px"
              >
                {SKILL_OPTIONS.map((opt, i) => (
                  <List.Item
                    selectable
                    key={opt}
                    id={`mr2_${opt}`}
                    index={i}
                    value={opt}
                    selected={selectedArrayMr2.includes(opt)}
                    padding="s"
                    spacing="s"
                  >
                    {opt}
                  </List.Item>
                ))}
              </List>
            </Picker>
          </Field>
        );
      };

      const ChipsWithDeleteReadOnly = () => {
        const selectedArray = ["HTML", "CSS", "JavaScript"];

        return (
          <Field vertical>
            <Label>
              Skills <code style="font-weight:normal">(readOnly)</code>
            </Label>
            <Picker
              type="array"
              name="multiselect_chips_delete_readonly"
              readOnly
              value={selectedArray}
              ui={
                <BadgeList>
                  {selectedArray.map((opt) => (
                    <Picker.Chip key={opt} value={opt}>
                      <Text>{opt}</Text>
                    </Picker.Chip>
                  ))}
                </BadgeList>
              }
              maxWidth="200"
            >
              <List
                selectable
                multiple
                command="--navi-update"
                style="min-width: 180px"
              >
                {SKILL_OPTIONS.map((opt, i) => (
                  <List.Item
                    selectable
                    key={opt}
                    id={`readonly_${opt}`}
                    index={i}
                    value={opt}
                    selected={selectedArray.includes(opt)}
                    padding="s"
                    spacing="s"
                  >
                    {opt}
                  </List.Item>
                ))}
              </List>
            </Picker>
          </Field>
        );
      };

      const ChipsWithDeleteDisplay = () => {
        return (
          <div class="demo-section">
            <h2>3. Chips with delete button</h2>
            <p>
              Each chip has an × button to deselect without reopening the
              dropdown. Two UX drawbacks to be aware of: the interaction target
              is very small (the tiny × icon), and clicking the chip label
              itself — outside the × button — opens the picker instead of
              removing the chip, which can surprise users who expect the whole
              chip to be the delete target.
            </p>
            <p style="color: #0f5132; background: #d1e7dd; border: 1px solid #badbcc; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 0 0 16px">
              <strong>maxLines works with chips.</strong> Same mechanism as
              section 2: the picker hands its <code>maxLines</code> down and the{" "}
              <code>BadgeList</code> caps its own rows.
            </p>
            <Box flex="y" spacing="m">
              <ChipsWithDeleteDefault />
              <ChipsWithDeleteMaxLines2 />
              <ChipsWithDeleteReadOnly />
            </Box>
          </div>
        );
      };

      // ── 4. Empty picker: the BadgeList fallback ───────────────────────────

      const formatPx = (value) => {
        const rounded = Math.round(value * 100) / 100;
        return `${rounded}px`;
      };

      const MEASURE_COLOR = "#d6336c";
      const MEASURE_GAP = 8;
      const MEASURE_TICK = 10;

      // Wraps a single element and draws dotted rulers with its exact rendered
      // width and height, so two states can be compared pixel per pixel.
      // Same helper as the search input demo (07_input_search_demo.html), plus
      // `innerSelector`: a descendant measured along, for the part of the
      // element that actually holds the content — here the picker's value
      // slot, whose changes the picker box can hide.
      const Measured = ({ onMeasure, innerSelector, children }) => {
        const wrapperRef = useRef(null);
        const [size, setSize] = useState(null);

        useLayoutEffect(() => {
          const wrapper = wrapperRef.current;
          const element = wrapper.firstElementChild;
          if (!element) {
            return undefined;
          }
          const inner = innerSelector
            ? element.querySelector(innerSelector)
            : null;
          const observer = new ResizeObserver(() => {
            const rect = element.getBoundingClientRect();
            const nextSize = {
              width: rect.width,
              height: rect.height,
              innerHeight: inner ? inner.getBoundingClientRect().height : null,
            };
            setSize((currentSize) => {
              if (
                currentSize &&
                currentSize.width === nextSize.width &&
                currentSize.height === nextSize.height &&
                currentSize.innerHeight === nextSize.innerHeight
              ) {
                return currentSize;
              }
              return nextSize;
            });
          });
          observer.observe(element);
          if (inner) {
            observer.observe(inner);
          }
          return () => {
            observer.disconnect();
          };
        }, []);

        useLayoutEffect(() => {
          if (size && onMeasure) {
            onMeasure(size);
          }
        }, [size, onMeasure]);

        const tickStyle = {
          position: "absolute",
          background: "none",
          borderColor: MEASURE_COLOR,
          borderStyle: "dotted",
          borderWidth: 0,
        };
        const labelStyle = {
          position: "absolute",
          fontSize: "11px",
          fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
          color: MEASURE_COLOR,
          background: "#fff",
          padding: "0 3px",
          whiteSpace: "nowrap",
          lineHeight: "14px",
        };

        return (
          <div
            style={{
              position: "relative",
              // inline-flex, not inline-block: an inline-block wraps its child
              // in a line box, whose strut adds descender room under the
              // child — the wrapper ends up a few pixels taller than what it
              // holds, and the rulers drawn on it miss the picker's edges. A
              // flex container has no line box: it hugs its item exactly.
              display: "inline-flex",
              marginBottom: `${MEASURE_GAP + MEASURE_TICK + 16}px`,
              marginRight: "120px",
            }}
          >
            <div ref={wrapperRef} style={{ display: "inline-flex" }}>
              {children}
            </div>
            {size && (
              <div
                aria-hidden="true"
                style={{
                  position: "absolute",
                  inset: 0,
                  pointerEvents: "none",
                }}
              >
                {/* width ruler, below the element */}
                <div
                  style={{
                    ...tickStyle,
                    left: 0,
                    top: `${-MEASURE_TICK}px`,
                    height: `calc(100% + ${MEASURE_GAP + MEASURE_TICK * 2}px)`,
                    borderLeftWidth: "1px",
                  }}
                />
                <div
                  style={{
                    ...tickStyle,
                    left: "100%",
                    top: `${-MEASURE_TICK}px`,
                    height: `calc(100% + ${MEASURE_GAP + MEASURE_TICK * 2}px)`,
                    borderLeftWidth: "1px",
                  }}
                />
                <div
                  style={{
                    ...tickStyle,
                    left: 0,
                    width: "100%",
                    top: `calc(100% + ${MEASURE_GAP + MEASURE_TICK}px)`,
                    borderTopWidth: "1px",
                  }}
                />
                <div
                  style={{
                    ...labelStyle,
                    left: "50%",
                    top: `calc(100% + ${MEASURE_GAP + MEASURE_TICK}px)`,
                    transform: "translate(-50%, -50%)",
                  }}
                >
                  w {formatPx(size.width)}
                </div>

                {/* height ruler, on the right of the element */}
                <div
                  style={{
                    ...tickStyle,
                    top: 0,
                    left: `${-MEASURE_TICK}px`,
                    width: `calc(100% + ${MEASURE_GAP + MEASURE_TICK * 2}px)`,
                    borderTopWidth: "1px",
                  }}
                />
                <div
                  style={{
                    ...tickStyle,
                    top: "100%",
                    left: `${-MEASURE_TICK}px`,
                    width: `calc(100% + ${MEASURE_GAP + MEASURE_TICK * 2}px)`,
                    borderTopWidth: "1px",
                  }}
                />
                <div
                  style={{
                    ...tickStyle,
                    top: 0,
                    height: "100%",
                    left: `calc(100% + ${MEASURE_GAP + MEASURE_TICK}px)`,
                    borderLeftWidth: "1px",
                  }}
                />
                {/* Anchored to the right of the ruler line, not centered on
                    it: two lines of text would otherwise sit half over the
                    element. */}
                <div
                  style={{
                    ...labelStyle,
                    top: "50%",
                    left: `calc(100% + ${MEASURE_GAP + MEASURE_TICK + 6}px)`,
                    transform: "translateY(-50%)",
                  }}
                >
                  h {formatPx(size.height)}
                  {size.innerHeight !== null && (
                    <>
                      <br />
                      value {formatPx(size.innerHeight)}
                    </>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

      // Reads the two measurements and tells whether both states match — the
      // box, and the value slot inside it when one was measured.
      const MeasureDelta = ({ a, b, labelA, labelB }) => {
        if (!a || !b) {
          return null;
        }
        const round = (n) => Math.round(n * 100) / 100;
        const signed = (n) => `${n > 0 ? "+" : ""}${n}px`;
        const widthDelta = round(b.width - a.width);
        const heightDelta = round(b.height - a.height);
        const hasInner = a.innerHeight !== null && b.innerHeight !== null;
        const innerDelta = hasInner ? round(b.innerHeight - a.innerHeight) : 0;
        // The verdict is the picker's height — what moves the row on screen,
        // or not. The width is fixed by the demo, and the value slot is only
        // reported along: a change inside a box that does not move is
        // suboptimal for the eye, nothing more.
        const pixelPerfect = heightDelta === 0;
        return (
          <div
            style={{
              marginTop: "8px",
              fontSize: "12px",
              fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
              color: pixelPerfect ? "#2b8a3e" : "#c92a2a",
            }}
          >
            {labelB} − {labelA}: Δw {signed(widthDelta)} · Δh{" "}
            {signed(heightDelta)}{" "}
            {pixelPerfect ? "✓ same height" : "✗ height changed"}
            {hasInner && (
              <span style={{ color: "#868e96" }}>
                {" "}
                (value slot Δh {signed(innerDelta)})
              </span>
            )}
          </div>
        );
      };

      // One picker drawn from an array, with what it is given as chips. What
      // the list falls back on when empty is the whole point of the section.
      const ChipsPicker = ({ name, selected, fallback }) => (
        <Picker
          type="array"
          name={name}
          value={selected}
          placeholder="Select skills…"
          ui={
            <BadgeList fallback={fallback}>
              {selected.map((opt) => (
                <Badge key={opt}>{opt}</Badge>
              ))}
            </BadgeList>
          }
          action={() => {}}
          width="200"
        >
          <List selectable multiple command="--navi-update">
            {SKILL_OPTIONS.slice(0, 4).map((opt, i) => (
              <List.Item
                selectable
                key={opt}
                id={`${name}_${opt}`}
                index={i}
                value={opt}
                selected={selected.includes(opt)}
                padding="s"
                spacing="s"
              >
                {opt}
              </List.Item>
            ))}
          </List>
        </Picker>
      );

      // Empty above, with a value below, both measured — box and value slot.
      const EmptyVersusFilled = ({ id, fallback }) => {
        const [emptySize, setEmptySize] = useState(null);
        const [filledSize, setFilledSize] = useState(null);
        return (
          <>
            <Box flex="y" spacing="s" alignX="start">
              <Measured
                onMeasure={setEmptySize}
                innerSelector=".navi_picker_value"
              >
                <ChipsPicker
                  name={`${id}_empty`}
                  selected={[]}
                  fallback={fallback}
                />
              </Measured>
              <Measured
                onMeasure={setFilledSize}
                innerSelector=".navi_picker_value"
              >
                <ChipsPicker
                  name={`${id}_filled`}
                  selected={["HTML", "CSS"]}
                  fallback={fallback}
                />
              </Measured>
            </Box>
            <MeasureDelta
              a={emptySize}
              b={filledSize}
              labelA="empty"
              labelB="with value"
            />
          </>
        );
      };

      const EmptyHeightDisplay = () => (
        <div class="demo-section">
          <h2>4. Empty picker — the BadgeList fallback</h2>
          <p>
            A picker drawn from chips must look the same empty as it does with a
            value: as tall, and saying something. Empty above, with a value
            below, with dotted rulers giving the exact rendered height of the
            picker box — and, as information, of its value slot, the part
            holding the chips. The picker's own line (the right slot is 1lh)
            holds the box one line tall, so the box does not move in any of the
            three cases; what differs is what the empty picker shows.
          </p>

          <fieldset>
            <legend>No fallback — a blank picker</legend>
            <p>
              An empty <code>BadgeList</code> renders nothing, and the picker's
              own <code>placeholder</code> is not drawn either: a picker given a{" "}
              <code>ui</code> draws that and only that. Same height, but the
              picker says nothing.
            </p>
            <EmptyVersusFilled id="empty_height_none" />
          </fieldset>

          <fieldset>
            <legend>Fallback as plain text — recommended</legend>
            <p>
              <code>fallback="Select skills…"</code>: the placeholder text, at
              the picker's own size, in the placeholder color (the picker colors
              its value slot that way while it holds nothing). The box is the
              same height; the slot is off by a fraction of a pixel, which
              nothing shows.
            </p>
            <EmptyVersusFilled
              id="empty_height_text"
              fallback="Select skills…"
            />
          </fieldset>

          <fieldset>
            <legend>
              Fallback as a transparent badge — slot exact, text small
            </legend>
            <p>
              A <code>Badge</code> with no background takes the exact room a
              badge takes, so even the slot does not move — but the text is
              badge-sized, smaller than the picker's, and reads as a badge with
              nothing in it. Only worth it where the slot itself is what
              something else is sized on.
            </p>
            <EmptyVersusFilled
              id="empty_height_badge"
              fallback={
                <Badge
                  background="transparent"
                  color="var(--picker-placeholder-color)"
                >
                  Select skills…
                </Badge>
              }
            />
          </fieldset>
        </div>
      );

      render(
        <NaviDebug debugAction debugInteraction debugPopup>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
