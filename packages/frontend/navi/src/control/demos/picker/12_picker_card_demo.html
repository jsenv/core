<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Picker card demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 700px;
        margin: 0 auto;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .demo-section h2 {
        margin: 0 0 16px;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.1rem;
        border-bottom: 2px solid #eee;
        scroll-margin-top: 12px;
      }
      .demo-section h3 {
        margin: 20px 0 10px;
        color: #444;
        font-size: 0.95rem;
        scroll-margin-top: 12px;
      }
      .demo-section p {
        margin: 0 0 16px;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .demo-row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      .demo-case {
        display: flex;
        margin-bottom: 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .demo-caption {
        color: #666;
        font-size: 0.8rem;
      }
      .demo-caption code {
        font-size: 0.8rem;
      }
      .demo-animate-controls {
        display: flex;
        margin-top: 8px;
        gap: 12px;
      }
      .demo-animate-toggle {
        display: block;
        font-size: 13px;
      }
      .demo-scene {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import { useEffect, useRef, useState } from "preact/hooks";
      import {
        Box,
        Button,
        ControlGroup,
        DaySpin,
        FixedBar,
        Input,
        Link,
        Picker,
        Text,
        Textarea,
        usePickerState,
      } from "@jsenv/navi";
      import { DemoHeader } from "@jsenv/navi/src/internal/demo_header.jsx";
      import { DocumentToc } from "@jsenv/navi/src/internal/document_toc.jsx";
      import { FakeBackend } from "@jsenv/navi/src/internal/fake_backend.jsx";

      const Heading = ({ level = 2, id, children }) => {
        const Tag = `h${level}`;
        return (
          <Tag id={id}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const Section = ({ id, title, children }) => (
        <div class="demo-section">
          <Heading id={id}>{title}</Heading>
          {children}
        </div>
      );

      const Case = ({ caption, children }) => (
        <div class="demo-case">
          <span class="demo-caption">{caption}</span>
          {children}
        </div>
      );

      const GAME = {
        name: "Aurore / Malo",
        court: "Terrain 2",
        place: "Padel Club Marseille",
        score: "6-4 3-6",
        canceled: false,
      };

      // What a sheet answers, applied to the game: its fields — and the
      // gesture a named button put in the answer (`op`), which is not a
      // field but travels with them (see the edit sheet's "Annuler la
      // partie").
      const applyAnswer = (game, answer) => {
        const { op, ...fields } = answer;
        return {
          ...game,
          ...fields,
          canceled: op === "cancel" ? true : game.canceled,
        };
      };

      const useStoredBoolean = (key, defaultValue) => {
        const [value, setValue] = useState(() => {
          const stored = localStorage.getItem(key);
          return stored === null ? defaultValue : stored === "true";
        });
        useEffect(() => {
          localStorage.setItem(key, String(value));
        }, [key, value]);
        return [value, setValue];
      };

      const SlowToggle = ({ slow, setSlow }) => (
        <div class="demo-animate-controls">
          <label class="demo-animate-toggle">
            <input
              type="checkbox"
              checked={slow}
              onChange={(e) => setSlow(e.target.checked)}
            />
            Slow
          </label>
        </div>
      );

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Picker card"
            previous={{
              href: "./11_picker_callout_demo.html",
              label: "Callout",
            }}
          />
          <div class="demo-section">
            <h2>Sommaire</h2>
            <DocumentToc />
          </div>
          <NominalDemo />
          <StatesDemo />
          <OpenOnDemo />
          <DoorDemo />
          <LiftDemo />
          <BenchDemo />
        </Box>
      );

      // ── Cas nominal ───────────────────────────────────────────────────────

      const NominalDemo = () => {
        const [slow, setSlow] = useStoredBoolean(
          "picker_card_demo_nominal_slow",
          true,
        );
        return (
          <Section id="nominal" title="Cas nominal">
            <p>
              Tenue, la carte s'ouvre sur son terrain et son lieu ; son score,
              au milieu, s'ouvre au clic.
            </p>
            <FakeBackend value={GAME}>
              {({ value, action }) => (
                <GamePicker
                  game={value}
                  action={(next) => action(applyAnswer(value, next))}
                  animationDuration={slow ? "0.6s" : undefined}
                />
              )}
            </FakeBackend>
            <SlowToggle slow={slow} setSlow={setSlow} />
          </Section>
        );
      };

      // ── États ─────────────────────────────────────────────────────────────

      const StatesDemo = () => (
        <Section id="states" title="États">
          <div class="demo-row">
            <Case caption="default">
              <LocalGamePicker />
            </Case>
            <Case caption="readOnly">
              <LocalGamePicker readOnly />
            </Case>
            <Case caption="disabled">
              <LocalGamePicker disabled />
            </Case>
            <Case caption="loading">
              <LocalGamePicker loading />
            </Case>
            <Case caption="focus visible">
              <LocalGamePicker pseudoState={{ ":focus-visible": true }} />
            </Case>
          </div>
        </Section>
      );

      // ── openOn ────────────────────────────────────────────────────────────

      const OpenOnDemo = () => (
        <Section id="open-on" title="openOn">
          <div class="demo-row">
            <Case caption="default (press)">
              <LocalGamePicker openOn="press" scorePicker={false} />
            </Case>
            <Case caption='openOn="longpress"'>
              <LocalGamePicker openOn="longpress" scorePicker={false} />
            </Case>
            <Case caption='openOn={["longpress", "contextmenu"]}'>
              <LocalGamePicker
                openOn={["longpress", "contextmenu"]}
                scorePicker={false}
              />
            </Case>
          </div>
        </Section>
      );

      // ── Une porte ─────────────────────────────────────────────────────────

      // The same drawing twice — the thumbnail and the zoomed one are one
      // vnode, so the two boxes the browser morphs hold the same picture.
      const scene = (
        <svg
          class="demo-scene"
          viewBox="0 0 160 100"
          role="img"
          aria-label="Terrain vu du ciel"
        >
          <rect width="160" height="100" fill="#dbe9f6" />
          <rect x="30" y="20" width="100" height="60" fill="#3f7fbf" />
          <line
            x1="80"
            y1="20"
            x2="80"
            y2="80"
            stroke="white"
            stroke-width="2"
          />
          <circle cx="140" cy="18" r="9" fill="#ffca28" />
        </svg>
      );

      const DoorDemo = () => {
        const [slow, setSlow] = useStoredBoolean(
          "picker_card_demo_door_slow",
          true,
        );
        return (
          <Section id="door" title="picksNothing">
            <p>Rien à enregistrer : le dessin grandit, et c'est tout.</p>
            <Picker
              picksNothing
              variant="bare"
              mode="dialog"
              ui={<Box width="160">{scene}</Box>}
              aria-label="Agrandir le dessin"
              animation="lifting"
              animationDuration={slow ? "0.6s" : undefined}
              dialogExpandX
              dialogMaxWidth="min(560px, 92vw)"
              popupBackgroundColor="transparent"
              popupBoxShadow="none"
              mount="from-first-open"
            >
              <Box data-lift>{scene}</Box>
            </Picker>
            <SlowToggle slow={slow} setSlow={setSlow} />
          </Section>
        );
      };

      // ── lift ──────────────────────────────────────────────────────────────

      // The same drawing at two framings: the whole scene is 1:1, the page
      // shows its middle band, 4:3 — a sun at the top and a bench at the
      // bottom fall outside the band, so where each picture sits is visible.
      const sceneOf = (viewBox) => (
        <svg
          class="demo-scene"
          viewBox={viewBox}
          role="img"
          aria-label="Terrain vu du ciel"
        >
          <rect width="200" height="200" fill="#dbe9f6" />
          <circle cx="170" cy="22" r="11" fill="#ffca28" />
          <rect x="40" y="60" width="120" height="80" fill="#3f7fbf" />
          <line
            x1="100"
            y1="60"
            x2="100"
            y2="140"
            stroke="white"
            stroke-width="2"
          />
          <rect x="70" y="172" width="60" height="10" fill="#8d6e63" />
        </svg>
      );
      const wholeScene = sceneOf("0 0 200 200");
      const framedScene = sceneOf("0 25 200 150");

      const FramedScenePicker = ({ lift, animationDuration }) => (
        <Picker
          picksNothing
          variant="bare"
          mode="dialog"
          ui={<Box width="200">{framedScene}</Box>}
          aria-label="Voir toute la scène"
          animation="lifting"
          lift={lift}
          animationDuration={animationDuration}
          dialogExpandX
          dialogMaxWidth="min(360px, 92vw)"
          popupBackgroundColor="transparent"
          popupBoxShadow="none"
          mount="from-first-open"
        >
          <Box data-lift>{wholeScene}</Box>
        </Picker>
      );

      // The same card at two lengths: the page shows its first lines, the
      // sheet all of them, at the same width.
      const PlainCard = ({ children, ...props }) => (
        <Box
          flex="y"
          spacing="s"
          padding="m"
          color="white"
          backgroundColor="#2f6fb5"
          borderRadius="12"
          width="300"
          {...props}
        >
          <Text bold>{GAME.name}</Text>
          <Text size="s">{GAME.court}</Text>
          <Text size="s">{GAME.place}</Text>
          {children}
        </Box>
      );

      const ExtendingCardPicker = ({ lift, animationDuration }) => (
        <Picker
          picksNothing
          variant="bare"
          mode="dialog"
          borderRadius="12"
          ui={<PlainCard />}
          aria-label="Voir toute la fiche"
          animation="lifting"
          lift={lift}
          animationDuration={animationDuration}
          dialogSizeFromAnchor
          dialogExpandX
          popupBackgroundColor="transparent"
          popupBoxShadow="none"
          mount="from-first-open"
        >
          <PlainCard data-lift>
            <Text size="s">Samedi 14 mars, 10h00 – 11h30</Text>
            <Text size="s">Aurore, Malo, Inès, Théo</Text>
            <Text size="s">Balles fournies, 8 € par joueur</Text>
            <Text size="s">Vestiaires et douches sur place</Text>
          </PlainCard>
        </Picker>
      );

      // The same content, centred, in a box that is a little bigger once
      // promoted — wider, or taller — and nothing else.
      const CenteredCard = ({ width, height, ...props }) => (
        <Box
          flex="y"
          spacing="s"
          padding="m"
          alignX="center"
          alignY="center"
          color="white"
          backgroundColor="#2f6fb5"
          borderRadius="12"
          width={width}
          height={height}
          {...props}
        >
          <Text bold>{GAME.name}</Text>
          <Text size="s">{GAME.court}</Text>
          <Text size="s">{GAME.place}</Text>
        </Box>
      );

      const SameContentPicker = ({
        lift,
        animationDuration,
        pageSize,
        sheetSize,
      }) => (
        <Picker
          picksNothing
          variant="bare"
          mode="dialog"
          borderRadius="12"
          ui={<CenteredCard {...pageSize} />}
          aria-label="Mettre la fiche en avant"
          animation="lifting"
          lift={lift}
          animationDuration={animationDuration}
          popupBackgroundColor="transparent"
          popupBoxShadow="none"
          mount="from-first-open"
        >
          <CenteredCard data-lift {...sheetSize} />
        </Picker>
      );

      const IN_PAGE_SIZE = { width: 300, height: 120 };
      const WIDER_SIZE = { width: 340, height: 120 };
      const TALLER_SIZE = { width: 300, height: 160 };

      const LiftDemo = () => {
        const [slow, setSlow] = useStoredBoolean(
          "picker_card_demo_lift_slow",
          true,
        );
        const animationDuration = slow ? "1s" : undefined;
        return (
          <Section id="lift" title="lift">
            <p>
              Une carte qui s'allonge garde son en-tête ; une scène recadrée
              garde son centre.
            </p>
            <Heading level={3} id="lift-card">
              Une carte qui s'allonge
            </Heading>
            <div class="demo-row">
              <Case caption='lift="box" (défaut)'>
                <ExtendingCardPicker
                  lift="box"
                  animationDuration={animationDuration}
                />
              </Case>
              <Case caption='lift="scene"'>
                <ExtendingCardPicker
                  lift="scene"
                  animationDuration={animationDuration}
                />
              </Case>
            </div>
            <Heading level={3} id="lift-scene">
              Une scène vue par deux cadres
            </Heading>
            <div class="demo-row">
              <Case caption='lift="box" (défaut) — le cadre d’une carte, pas d’une scène'>
                <FramedScenePicker
                  lift="box"
                  animationDuration={animationDuration}
                />
              </Case>
              <Case caption='lift="scene"'>
                <FramedScenePicker
                  lift="scene"
                  animationDuration={animationDuration}
                />
              </Case>
            </div>
            <Heading level={3} id="lift-same-content">
              Le même contenu, à peine plus grand
            </Heading>
            <div class="demo-row">
              <Case caption='plus large, lift="box" (défaut)'>
                <SameContentPicker
                  lift="box"
                  animationDuration={animationDuration}
                  pageSize={IN_PAGE_SIZE}
                  sheetSize={WIDER_SIZE}
                />
              </Case>
              <Case caption='plus large, lift="scene"'>
                <SameContentPicker
                  lift="scene"
                  animationDuration={animationDuration}
                  pageSize={IN_PAGE_SIZE}
                  sheetSize={WIDER_SIZE}
                />
              </Case>
            </div>
            <div class="demo-row">
              <Case caption='plus haut, lift="box" (défaut)'>
                <SameContentPicker
                  lift="box"
                  animationDuration={animationDuration}
                  pageSize={IN_PAGE_SIZE}
                  sheetSize={TALLER_SIZE}
                />
              </Case>
              <Case caption='plus haut, lift="scene"'>
                <SameContentPicker
                  lift="scene"
                  animationDuration={animationDuration}
                  pageSize={IN_PAGE_SIZE}
                  sheetSize={TALLER_SIZE}
                />
              </Case>
            </div>
            <SlowToggle slow={slow} setSlow={setSlow} />
          </Section>
        );
      };

      // ── Au poids d'une vraie carte ────────────────────────────────────────

      // The two cases wematch lifts, at their weight: a game card that becomes
      // editable (fields, spins, seats — ~200 elements), and a weather drawing
      // enlarged. Under each, what the page measures on its own opening.

      const TODAY = new Date().toISOString().slice(0, 10);
      const RICH_GAME = {
        name: "Aurore / Malo",
        level: "Intermédiaire",
        day: TODAY,
        time: "10:00",
        place: "Padel Club Marseille",
        court: "Terrain 2",
        duration: "1h30",
        price: "8",
        players: ["Aurore", "Malo", "Inès", ""],
        notes: "Balles fournies, vestiaires sur place.",
      };
      const LEVELS = ["Débutant", "Intermédiaire", "Confirmé", "Expert"];
      const PLACES = [
        "Padel Club Marseille",
        "Le City Padel",
        "Toulon Padel Center",
      ];
      const COURTS = ["Terrain 1", "Terrain 2", "Terrain 3"];
      const DURATIONS = ["1h00", "1h30", "2h00"];
      const PLAYERS = ["Aurore", "Malo", "Inès", "Théo", "Lina"];

      const Glyph = ({ d }) => (
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d={d} />
        </svg>
      );
      const CLOCK_D =
        "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5h-2v6l5 3 1-1.7-4-2.3z";
      const PIN_D =
        "M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z";
      const CROWN_D = "M3 18h18l-2-10-5 4-2-6-2 6-5-4z";
      const EURO_D =
        "M15 18.5c-2.5 0-4.6-1.4-5.5-3.5H15v-2H9c0-.3 0-.7.1-1H15V10H9.5C10.4 7.9 12.5 6.5 15 6.5c1.2 0 2.3.3 3.2.9l1.4-1.4C18.3 5 16.7 4.5 15 4.5c-3.6 0-6.7 2.3-7.8 5.5H5v2h1.8c0 .3-.1.7-.1 1s0 .7.1 1H5v2h2.2c1.1 3.2 4.2 5.5 7.8 5.5 1.7 0 3.3-.5 4.6-1.5l-1.4-1.4c-.9.6-2 .9-3.2.9z";
      const SHIELD_D = "M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z";
      const BELL_D =
        "M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 0 0-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z";

      const PickList = ({ items }) => (
        <Box flex="y" padding="s">
          {items.map((item) => (
            <Text key={item} size="s">
              {item}
            </Text>
          ))}
        </Box>
      );

      const CardRow = ({ label, glyph, children }) => (
        <Box flex="y" spacing="xs">
          <Text size="xs" opacity="0.7">
            {label}
          </Text>
          <Box flex spacing="s" alignY="center">
            {glyph ? <Glyph d={glyph} /> : null}
            {children}
          </Box>
        </Box>
      );

      // The card at the two moments the sheet morphs between: as the page
      // shows it (`mode="page"`, texts) and as the sheet edits it
      // (`mode="edit"`, a control per line) — the same lines in the same
      // order, so the box is the same box.
      const RichCard = ({ game, mode, ...props }) => {
        const edit = mode === "edit";
        return (
          <Box
            flex="y"
            spacing="s"
            padding="m"
            color="white"
            backgroundColor="#2f6fb5"
            borderRadius="12"
            {...props}
          >
            <Box flex spacing="s" alignY="center">
              {edit ? (
                <Input
                  name="name"
                  defaultValue={game.name}
                  expandX
                  color="#1a1a1a"
                />
              ) : (
                <Text bold expandX>
                  {game.name}
                </Text>
              )}
              {edit ? (
                <Picker
                  name="level"
                  mode="popover"
                  value={game.level}
                  action={() => {}}
                >
                  <PickList items={LEVELS} />
                </Picker>
              ) : (
                <Text size="s">{game.level}</Text>
              )}
            </Box>
            <CardRow label="Quand" glyph={CLOCK_D}>
              {edit ? (
                <>
                  <DaySpin name="day" defaultValue={game.day} width="170px" />
                  <Picker
                    type="time"
                    name="time"
                    defaultValue={game.time}
                    action={() => {}}
                  />
                </>
              ) : (
                <Text size="s">
                  {game.day} à {game.time}
                </Text>
              )}
            </CardRow>
            <CardRow label="Où" glyph={PIN_D}>
              {edit ? (
                <>
                  <Picker
                    name="place"
                    mode="popover"
                    value={game.place}
                    action={() => {}}
                    expandX
                  >
                    <PickList items={PLACES} />
                  </Picker>
                  <Picker
                    name="court"
                    mode="popover"
                    value={game.court}
                    action={() => {}}
                  >
                    <PickList items={COURTS} />
                  </Picker>
                </>
              ) : (
                <Text size="s">
                  {game.place}, {game.court}
                </Text>
              )}
            </CardRow>
            <Box flex="y" spacing="xs">
              <Text size="xs" opacity="0.7">
                Joueurs
              </Text>
              {game.players.map((player, index) => (
                <Box key={index} flex spacing="s" alignY="center">
                  <Glyph d={CROWN_D} />
                  {edit ? (
                    <Picker
                      name={`seat_${index}`}
                      mode="popover"
                      placeholder="Place libre"
                      value={player}
                      action={() => {}}
                      expandX
                    >
                      <PickList items={PLAYERS} />
                    </Picker>
                  ) : (
                    <Text size="s" opacity={player ? undefined : "0.6"}>
                      {player || "Place libre"}
                    </Text>
                  )}
                </Box>
              ))}
            </Box>
            <Box flex spacing="m">
              <CardRow label="Durée">
                {edit ? (
                  <Picker
                    name="duration"
                    mode="popover"
                    value={game.duration}
                    action={() => {}}
                  >
                    <PickList items={DURATIONS} />
                  </Picker>
                ) : (
                  <Text size="s">{game.duration}</Text>
                )}
              </CardRow>
              <CardRow label="Prix" glyph={EURO_D}>
                {edit ? (
                  <Input
                    name="price"
                    type="number"
                    defaultValue={game.price}
                    width="80px"
                    color="#1a1a1a"
                  />
                ) : (
                  <Text size="s">{game.price} € par joueur</Text>
                )}
              </CardRow>
            </Box>
            <CardRow label="Notes">
              {edit ? (
                <Textarea
                  name="notes"
                  defaultValue={game.notes}
                  maxRows={3}
                  expandX
                  color="#1a1a1a"
                />
              ) : (
                <Text size="s">{game.notes}</Text>
              )}
            </CardRow>
          </Box>
        );
      };

      const SheetTile = ({ glyph, label, value }) => (
        <Box
          flex="y"
          spacing="xs"
          padding="s"
          alignX="center"
          color="white"
          backgroundColor="rgb(255 255 255 / 12%)"
          borderRadius="10"
          expandX
        >
          <Glyph d={glyph} />
          <Text size="xs" opacity="0.7">
            {label}
          </Text>
          <Text size="s" bold>
            {value}
          </Text>
        </Box>
      );

      // Case A: the game card. What the sheet holds around the lifted card is
      // wematch's: a badge row above, three tiles and the buttons below.
      // The picker's box IS the card's: the anchor a lift starts from is the
      // trigger, and a trigger wider than the card it shows would start the
      // movement from a box the card does not fill.
      const RichCardPicker = ({
        samePicture,
        sameWidth,
        rebuild,
        animationDuration,
      }) => (
        <Picker
          variant="bare"
          type="object"
          mode="dialog"
          borderRadius="12"
          ui={<RichCard game={RICH_GAME} mode="page" width="300" />}
          aria-label="Modifier la partie"
          action={() => {}}
          animation="lifting"
          animationDuration={animationDuration}
          dialogSizeFromAnchor
          dialogMaxWidth={sameWidth ? "var(--anchor-width)" : "364px"}
          dialogExpandX
          popupBackgroundColor="transparent"
          popupBoxShadow="none"
          scrollCapture
          mount={rebuild ? "while-opened" : "from-first-open"}
          loadingOutline="custom"
        >
          <ControlGroup flex="y" spacing="m" alignX="stretch">
            <Box flex spacing="s" alignY="center" color="white">
              <Glyph d={SHIELD_D} />
              <Text size="s">Partie publique</Text>
            </Box>
            <RichCard
              game={RICH_GAME}
              mode={samePicture ? "page" : "edit"}
              data-lift
            />
            <Box flex spacing="s">
              <SheetTile glyph={CLOCK_D} label="Durée" value="1h30" />
              <SheetTile glyph={CROWN_D} label="Format" value="Double" />
              <SheetTile glyph={BELL_D} label="Rappel" value="1h avant" />
            </Box>
            <SheetButtons send="Enregistrer" />
          </ControlGroup>
        </Picker>
      );

      // Case B: the weather drawing. One vnode on both sides; the thumbnail
      // is a band cut out of its middle, so the two frames do not share an
      // aspect ratio.
      const weatherScene = sceneOf("0 0 200 200");

      const WeatherScenePicker = ({ animationDuration }) => (
        <Picker
          picksNothing
          standalone
          variant="bare"
          mode="dialog"
          padding="0"
          borderRadius="m"
          ui={
            <Box width="170" height="110" style={{ overflow: "hidden" }}>
              {/* The middle band of a 170px-wide, 170px-tall scene: what a
                  thumbnail cut from the scene shows, at the scene's own
                  scale. */}
              <Box style={{ marginTop: "-30px" }}>{weatherScene}</Box>
            </Box>
          }
          aria-label="Voir la météo"
          animation="lifting"
          lift="scene"
          animationDuration={animationDuration}
          dialogExpandX
          dialogMaxWidth="min(560px, 92vw)"
          popupBackgroundColor="transparent"
          popupBoxShadow="none"
          popupBorderRadius="0"
        >
          <Box flex="y" spacing="s">
            <Box data-lift>{weatherScene}</Box>
            <Text size="s" color="white" alignX="center">
              Samedi 14 mars, 10h — Padel Club Marseille
            </Text>
          </Box>
        </Picker>
      );

      // What the page can measure about its own opening, from a
      // requestAnimationFrame loop reading nothing but the DOM: the frame the
      // dialog is open on, the frame the movement starts on, and a census of
      // what the dialog holds at that moment. Frames are not delivered while
      // the browser holds the view transition's pictures, so the two frames
      // seen are exactly the two painted.
      const censusOf = (dialog) => {
        const all = dialog.querySelectorAll("*");
        const lifted = dialog.querySelector("[data-lift]");
        let depth = 0;
        for (const el of all) {
          let d = 0;
          let node = el;
          while (node && node !== dialog) {
            d++;
            node = node.parentElement;
          }
          if (d > depth) {
            depth = d;
          }
        }
        return {
          elements: all.length,
          lifted: lifted ? lifted.querySelectorAll("*").length : 0,
          pickers: dialog.querySelectorAll('[class*="navi_picker"]').length,
          fields: dialog.querySelectorAll("input, textarea, select").length,
          texts: dialog.querySelectorAll(".navi_text").length,
          buttons: dialog.querySelectorAll(".navi_button").length,
          svgs: dialog.querySelectorAll("svg").length,
          depth,
        };
      };
      const isViewTransitionRunning = () =>
        document
          .getAnimations()
          .some((animation) =>
            String(animation.effect?.pseudoElement || "").startsWith(
              "::view-transition",
            ),
          );
      const ms = (value) => (value === null ? "—" : `${Math.round(value)} ms`);

      const LiftBench = ({ name, children }) => {
        const rootRef = useRef(null);
        const [report, setReport] = useState(null);
        const onPointerDown = () => {
          const dialog = rootRef.current.querySelector("dialog");
          if (!dialog || dialog.open) {
            return;
          }
          const start = performance.now();
          performance.mark("lift_bench_tap");
          let openedAt = null;
          // performance.now() and not the frame's own timestamp: under load
          // that timestamp can predate the work the frame is painting.
          const frame = () => {
            const now = performance.now();
            if (openedAt === null && dialog.open) {
              openedAt = now;
              performance.mark("lift_bench_opened");
            }
            if (openedAt !== null && isViewTransitionRunning()) {
              performance.mark("lift_bench_moving");
              setReport({
                opened: openedAt - start,
                moving: now - start,
                census: censusOf(dialog),
              });
              return;
            }
            if (now - start > 4000) {
              setReport(
                openedAt === null
                  ? null
                  : {
                      opened: openedAt - start,
                      moving: null,
                      census: censusOf(dialog),
                    },
              );
              return;
            }
            requestAnimationFrame(frame);
          };
          requestAnimationFrame(frame);
        };
        return (
          <Box
            ref={rootRef}
            flex="y"
            spacing="s"
            alignX="start"
            data-lift-bench={name}
            onPointerDownCapture={onPointerDown}
          >
            {children}
            <Text size="xs" color="secondary">
              {report
                ? `tap → ouverte ${ms(report.opened)} · tap → mouvement ${ms(report.moving)}`
                : "tap → ouverte — · tap → mouvement —"}
            </Text>
            <Text size="xs" color="secondary">
              {report
                ? `${report.census.elements} éléments, ${report.census.lifted} dans data-lift, ${report.census.pickers} navi_picker*, ${report.census.fields} champs, ${report.census.texts} textes, ${report.census.buttons} boutons, ${report.census.svgs} svg, profondeur ${report.census.depth}`
                : "wematch : 213 éléments, 162 dans data-lift, 73 navi_picker*, 16 champs, 36 textes, 5 boutons, 10 svg, profondeur 17"}
            </Text>
          </Box>
        );
      };

      const BenchDemo = () => {
        const [slow, setSlow] = useStoredBoolean(
          "picker_card_demo_bench_slow",
          false,
        );
        const [samePicture, setSamePicture] = useStoredBoolean(
          "picker_card_demo_bench_same_picture",
          false,
        );
        const [rebuild, setRebuild] = useStoredBoolean(
          "picker_card_demo_bench_rebuild",
          true,
        );
        const [sameWidth, setSameWidth] = useStoredBoolean(
          "picker_card_demo_bench_same_width",
          true,
        );
        const [fixedBars, setFixedBars] = useStoredBoolean(
          "picker_card_demo_bench_fixed_bars",
          false,
        );
        const animationDuration = slow ? "1s" : undefined;
        return (
          <Section id="lift-bench" title="Au poids d'une vraie carte">
            {fixedBars ? (
              <>
                <FixedBar area="top" height={48}>
                  <Box flex alignX="center" alignY="center" expandX>
                    <Text size="16">Partie de padel</Text>
                  </Box>
                </FixedBar>
                <FixedBar area="bottom" height={54}>
                  <Box flex alignX="center" alignY="center" expandX spacing="l">
                    <Text size="s">Mes parties</Text>
                    <Text size="s">Alertes</Text>
                    <Text size="s">Joueurs</Text>
                    <Text size="s">Moi</Text>
                  </Box>
                </FixedBar>
              </>
            ) : null}
            <Heading level={3} id="lift-bench-card">
              La carte qui devient éditable
            </Heading>
            <Box width="364">
              <LiftBench name="card">
                <RichCardPicker
                  key={`${samePicture}_${rebuild}_${sameWidth}`}
                  samePicture={samePicture}
                  sameWidth={sameWidth}
                  rebuild={rebuild}
                  animationDuration={animationDuration}
                />
              </LiftBench>
            </Box>
            <div class="demo-animate-controls">
              <label class="demo-animate-toggle">
                <input
                  type="checkbox"
                  checked={samePicture}
                  onChange={(e) => setSamePicture(e.target.checked)}
                />
                le même dessin des deux côtés
              </label>
              <label class="demo-animate-toggle">
                <input
                  type="checkbox"
                  checked={rebuild}
                  onChange={(e) => setRebuild(e.target.checked)}
                />
                reconstruire à chaque ouverture (mount="while-opened")
              </label>
              <label class="demo-animate-toggle">
                <input
                  type="checkbox"
                  checked={sameWidth}
                  onChange={(e) => setSameWidth(e.target.checked)}
                />
                même largeur soulevée (dialogMaxWidth="var(--anchor-width)",
                sinon 364px)
              </label>
              <label class="demo-animate-toggle">
                <input
                  type="checkbox"
                  checked={fixedBars}
                  onChange={(e) => setFixedBars(e.target.checked)}
                />
                barres fixes en haut et en bas
              </label>
            </div>
            <Heading level={3} id="lift-bench-scene">
              Le dessin météo
            </Heading>
            <LiftBench name="scene">
              <WeatherScenePicker animationDuration={animationDuration} />
            </LiftBench>
            <SlowToggle slow={slow} setSlow={setSlow} />
          </Section>
        );
      };

      // ── The card, and the two pickers it is ───────────────────────────────

      // The card, one drawing for its three states — as it sits in the page,
      // as the edit sheet (court and place become fields), as the score sheet
      // (the score does) — so the box the browser morphs is the same box each
      // way, and each sheet edits its own lines and nothing else.
      const GameCard = ({ game, mode, loading, scoreSlot, ...props }) => (
        <Box
          flex="y"
          spacing="s"
          padding="m"
          color="white"
          backgroundColor="#2f6fb5"
          borderRadius="12"
          style={loading ? { opacity: 0.6 } : undefined}
          {...props}
        >
          <Box flex spacing="s" alignY="center">
            <Text bold>{game.name}</Text>
            {game.canceled && (
              <Text size="xs" bold color="#ffd54f">
                ANNULÉE
              </Text>
            )}
          </Box>
          {mode === "edit" ? (
            <Input
              name="court"
              placeholder="Terrain"
              color="#1a1a1a"
              autoFocus
            />
          ) : (
            <Text size="s">{game.court || "—"}</Text>
          )}
          {mode === "edit" ? (
            <Input name="place" placeholder="Lieu" color="#1a1a1a" />
          ) : (
            <Text size="s">{game.place || "—"}</Text>
          )}
          <Box flex alignX="center" paddingY="s">
            {mode === "score" ? (
              <Input
                name="score"
                placeholder="6-4 3-6"
                color="#1a1a1a"
                autoFocus
              />
            ) : (
              (scoreSlot ?? (
                <Text bold size="xl">
                  {game.score || "—"}
                </Text>
              ))
            )}
          </Box>
        </Box>
      );

      // The sheet is not a sheet: the card makes the paper, and the popup only
      // carries it above the rest — the same way for both sheets.
      const LIFTED_SHEET_PROPS = {
        mode: "dialog",
        animation: "lifting",
        dialogSizeFromAnchor: true,
        dialogExpandX: true,
        popupBackgroundColor: "transparent",
        popupBoxShadow: "none",
        scrollCapture: true,
        mount: "from-first-open",
      };

      const SheetButtons = ({ send, children }) => (
        <Box flex="y" spacing="s">
          <Box flex spacing="s">
            <Button
              command="--navi-cancel"
              variant="discrete"
              color="rgb(255 255 255 / 80%)"
              expandX
              alignX="center"
            >
              Annuler
            </Button>
            <Button command="--navi-send" expandX alignX="center">
              {send}
            </Button>
          </Box>
          {children}
        </Box>
      );

      // The score as the card shows it: what the score picker HOLDS — the one
      // just typed while the write is out, the backend's again if it refuses.
      const ScoreInPage = () => {
        const { value } = usePickerState();
        return (
          <Text bold size="xl">
            {value?.score || "—"}
          </Text>
        );
      };

      // The score, in the middle of the card: a picker of its own, opened on
      // its click, whose sheet lifts the WHOLE card (`anchor`) — and which
      // answers for itself (`standalone`) rather than for the card around it.
      const ScorePicker = ({
        game,
        action,
        anchor,
        animationDuration,
        ...props
      }) => (
        <Picker
          variant="bare"
          type="object"
          standalone
          value={{ score: game.score }}
          action={action}
          ui={<ScoreInPage />}
          aria-label="Saisir le score"
          // A sheet to fill in, nothing to read: busy (and read-only) refuse
          // the press with the reason, rather than opening a sheet whose
          // fields would refuse in turn.
          openWhileReadOnly={false}
          anchor={anchor}
          // One wait for the card, one outline: the picker around the card
          // draws it, this one only wears the busy.
          loadingOutline="custom"
          animationDuration={animationDuration}
          {...LIFTED_SHEET_PROPS}
          {...props}
        >
          <ControlGroup flex="y" spacing="m" alignX="stretch">
            <GameCard game={game} mode="score" data-lift />
            <SheetButtons send="Enregistrer le score" />
          </ControlGroup>
        </Picker>
      );

      // The card as the page shows it, drawn from what the picker HOLDS
      // (usePickerState): the name typed in the sheet is on the card the
      // moment the sheet leaves, and back to the backend's if the backend
      // refuses — and the card dims while the write is out.
      const GameCardInPage = ({ game, scoreSlot }) => {
        const { value, loading } = usePickerState();
        return (
          <GameCard
            game={applyAnswer(game, value)}
            loading={loading}
            width="300"
            scoreSlot={scoreSlot}
          />
        );
      };

      // One card, two writes, one wait: while either is out the whole card is
      // busy — each picker wears the other's run through `loading`, so the
      // hold and the click on the score are both refused, with the reason.
      const useRunning = () => {
        const runningSignal = useSignal(false);
        const settle = () => {
          runningSignal.value = false;
        };
        return [
          runningSignal.value,
          {
            onActionStart: () => {
              runningSignal.value = true;
            },
            onActionEnd: settle,
            onActionError: settle,
            onActionAborted: settle,
          },
        ];
      };

      const GamePicker = ({
        game,
        action,
        animationDuration,
        scorePicker = true,
        ...props
      }) => {
        const cardRef = useRef(null);
        const [editRunning, editRunHandlers] = useRunning();
        const [scoreRunning, scoreRunHandlers] = useRunning();
        return (
          <Picker
            ref={cardRef}
            variant="bare"
            type="object"
            value={{ court: game.court, place: game.place }}
            action={action}
            openOn={["longpress", "contextmenu"]}
            // The card's own corners: the focus ring and the loading outline
            // are drawn on the picker's box, which is the card's, so its radius
            // has to be the card's too.
            borderRadius="12"
            // Clear of the card's frame: on its border the run reads as the
            // border blinking.
            loadingOutlineInset={-4}
            ui={
              <GameCardInPage
                game={game}
                scoreSlot={
                  scorePicker ? (
                    <ScorePicker
                      game={game}
                      action={action}
                      anchor={cardRef}
                      animationDuration={animationDuration}
                      loading={editRunning}
                      {...scoreRunHandlers}
                    />
                  ) : undefined
                }
              />
            }
            aria-label="Modifier le terrain et le lieu"
            animationDuration={animationDuration}
            loading={scoreRunning}
            {...editRunHandlers}
            {...LIFTED_SHEET_PROPS}
            {...props}
          >
            <ControlGroup flex="y" spacing="m" alignX="stretch">
              <GameCard game={game} mode="edit" data-lift />
              <SheetButtons send="Enregistrer">
                {/* Not a field, still an answer of this sheet: the button's
                    name and value travel with the fields, the sheet leaves,
                    and the card wears the wait like any other write. */}
                <Button
                  name="op"
                  value="cancel"
                  command="--navi-send"
                  variant="discrete"
                  color="#ffab91"
                  alignX="center"
                >
                  Annuler la partie
                </Button>
              </SheetButtons>
            </ControlGroup>
          </Picker>
        );
      };

      const LocalGamePicker = (props) => {
        const gameSignal = useSignal(GAME);
        const game = gameSignal.value;
        return (
          <GamePicker
            game={game}
            action={(next) => {
              gameSignal.value = applyAnswer(game, next);
            }}
            {...props}
          />
        );
      };

      render(<App />, document.getElementById("container"));
    </script>
  </body>
</html>
