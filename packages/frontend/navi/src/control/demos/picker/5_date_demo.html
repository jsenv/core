<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Picker Date Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      h3 {
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .states-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: start;
        gap: 16px;
      }
      .states-col-header {
        margin: 0 0 12px;
        color: #888;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .sub-heading {
        margin: 0 0 8px;
        font-size: 0.95rem;
      }
      .demo-hr {
        margin: 20px 0;
        border: none;
        border-top: 1px solid #eee;
      }
      .demo-hr-tight {
        margin: 4px 0;
        border: none;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Date Picker Demo</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { CallLog, useCallLog } from "../utils/call_log.jsx";
      import { ClipboardInspect } from "../utils/clipboard_inspect.jsx";
      import {
        Box,
        Field,
        Label,
        Link,
        Picker,
        Form,
        Button,
        NaviDebug,
        getNowHoursRoundedToStep,
        isToday,
        stateSignal,
        route,
        setupRoutes,
      } from "@jsenv/navi";
      import { DocumentToc } from "../../../internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const App = () => (
        <Box flex="y" spacing="l">
          <TableOfContents />
          <StatesDemo />
          <WithActionDemo />
          <InFormDemo />
          <ValidationDemo />
          <CustomizationDemo />
          <ClipboardDemo />
          <DateTimeComboDemo />
        </Box>
      );

      const TableOfContents = () => (
        <div class="demo-section">
          <h2>Sommaire</h2>
          <DocumentToc />
        </div>
      );

      // ── États ─────────────────────────────────────────────────────────────

      const DEFAULT_DATE = "2026-06-03";

      const StatesDemo = () => (
        <div class="demo-section">
          <Heading id="states">États</Heading>
          <div class="states-grid">
            <div>
              <div class="states-col-header">Navi Picker</div>
              <Box flex="y" spacing="s">
                <Field flex="y">
                  <Label border="1px dotted grey">Vide</Label>
                  <Picker name="date_empty" type="date" />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">Avec valeur</Label>
                  <Picker
                    name="date_with_value"
                    type="date"
                    defaultValue={DEFAULT_DATE}
                  />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">Readonly</Label>
                  <Picker
                    name="date_readonly"
                    type="date"
                    defaultValue={DEFAULT_DATE}
                    readOnly
                  />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">Disabled</Label>
                  <Picker
                    name="date_disabled"
                    type="date"
                    defaultValue={DEFAULT_DATE}
                    disabled
                  />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">
                    Overflow (width contrainte)
                  </Label>
                  <Picker
                    name="date_overflow"
                    type="date"
                    defaultValue="2026-09-11"
                    style={{ width: "120px" }}
                  />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">
                    Width 200px + textAlign center
                  </Label>
                  <Picker
                    name="date_width_align"
                    type="date"
                    defaultValue={DEFAULT_DATE}
                    width="200px"
                    textAlign="center"
                  />
                </Field>
              </Box>
            </div>
            <div>
              <div class="states-col-header">User agent</div>
              <Box flex="y" spacing="s">
                <Field flex="y">
                  <Label border="1px dotted grey">Vide</Label>
                  <input type="date" />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">Avec valeur</Label>
                  <input type="date" defaultValue={DEFAULT_DATE} />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">Readonly</Label>
                  <input type="date" defaultValue={DEFAULT_DATE} readOnly />
                </Field>
                <Field flex="y">
                  <Label border="1px dotted grey">Disabled</Label>
                  <input type="date" defaultValue={DEFAULT_DATE} disabled />
                </Field>
              </Box>
            </div>
          </div>
        </div>
      );

      // ── Interactivity — outside a form ────────────────────────────────────

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const noInitialDateSignal = stateSignal(undefined, {
        id: "no_initial_date",
        type: "date",
      });
      const withInitialDateSignal = stateSignal(DEFAULT_DATE, {
        id: "with_initial_date",
        type: "date",
      });

      const WithActionDemo = () => {
        const [entries, push, clear] = useCallLog();

        return (
          <div class="demo-section">
            <Heading id="outside-form">Interactivity — outside a form</Heading>
            <p class="desc">
              <code>action</code> est asynchrone (800 ms) : le picker passe en
              état loading pendant ce temps.
            </p>
            <Box flex="y" spacing="m">
              <Field flex="y">
                <Label>No initial date</Label>
                <Picker
                  name="date_no_initial"
                  type="date"
                  value={noInitialDateSignal.value}
                  uiAction={(v) => {
                    push("Picker uiAction", v);
                  }}
                  action={async (v) => {
                    push("Picker action", v);
                    await sleep(800);
                    noInitialDateSignal.value = v;
                  }}
                />
              </Field>
              <Field flex="y">
                <Label>With initial date</Label>
                <Picker
                  name="date_with_initial"
                  type="date"
                  value={withInitialDateSignal.value}
                  uiAction={(v) => {
                    push("Picker uiAction", v);
                  }}
                  action={async (v) => {
                    push("Picker action", v);
                    await sleep(800);
                    withInitialDateSignal.value = v;
                  }}
                />
              </Field>
            </Box>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Interactivity — inside a form ─────────────────────────────────────

      const InFormDemo = () => {
        const [entries, push, clear] = useCallLog();

        return (
          <div class="demo-section">
            <Heading id="inside-form">Interactivity — inside a form</Heading>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
              flex="y"
              spacing="m"
              alignX="start"
            >
              <Field flex="y">
                <Label>Date (avec valeur par défaut, required)</Label>
                <Picker
                  name="date_with_default"
                  type="date"
                  defaultValue={DEFAULT_DATE}
                  required
                  uiAction={(v) => {
                    push("Picker uiAction (with default)", v);
                  }}
                />
              </Field>
              <Field flex="y">
                <Label>Date (sans valeur, required)</Label>
                <Picker
                  name="date_no_default"
                  type="date"
                  required
                  uiAction={(v) => {
                    push("Picker uiAction (no default)", v);
                  }}
                />
              </Field>
              <Button type="submit">Soumettre</Button>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── Validation ───────────────────────────────────────────────────────

      const ValidationRequired = () => {
        const [entries, push, clear] = useCallLog();
        return (
          <div>
            <Heading level={3} id="validation-required" class="sub-heading">
              Required
            </Heading>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
              flex="y"
              spacing="m"
              alignX="start"
            >
              <Field flex="y">
                <Label>Date (required)</Label>
                <Picker name="val_required" type="date" required />
              </Field>
              <Button type="submit">Soumettre</Button>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      const ValidationMin = () => {
        const [entries, push, clear] = useCallLog();
        return (
          <div>
            <Heading level={3} id="validation-min" class="sub-heading">
              Min
            </Heading>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
              flex="y"
              spacing="m"
              alignX="start"
            >
              <Field flex="y">
                <Label>
                  Date (min 2026-06-01, valeur 2026-05-01, required)
                </Label>
                <Picker
                  name="val_min"
                  type="date"
                  required
                  min="2026-06-01"
                  defaultValue="2026-05-01"
                />
              </Field>
              <Button type="submit">Soumettre</Button>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      const ValidationMax = () => {
        const [entries, push, clear] = useCallLog();
        return (
          <div>
            <Heading level={3} id="validation-max" class="sub-heading">
              Max
            </Heading>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
              flex="y"
              spacing="m"
              alignX="start"
            >
              <Field flex="y">
                <Label>
                  Date (max 2026-06-30, valeur 2026-12-01, required)
                </Label>
                <Picker
                  name="val_max"
                  type="date"
                  required
                  max="2026-06-30"
                  defaultValue="2026-12-01"
                />
              </Field>
              <Button type="submit">Soumettre</Button>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      const ValidationStep = () => {
        const [entries, push, clear] = useCallLog();
        return (
          <div>
            <Heading level={3} id="validation-step" class="sub-heading">
              Step
            </Heading>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
              flex="y"
              spacing="m"
              alignX="start"
            >
              <Field flex="y">
                <Label>
                  Date (min 2026-06-01 + step 7, valeur 2026-06-03, required)
                </Label>
                <Picker
                  name="val_step"
                  type="date"
                  required
                  min="2026-06-01"
                  step="7"
                  defaultValue="2026-06-03"
                />
              </Field>
              <Button type="submit">Soumettre</Button>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      const ValidationDemo = () => (
        <div class="demo-section">
          <Heading id="validation">Validation</Heading>
          <Box flex="y" spacing="m">
            <ValidationRequired />
            <hr class="demo-hr-tight" />
            <ValidationMin />
            <hr class="demo-hr-tight" />
            <ValidationMax />
            <hr class="demo-hr-tight" />
            <ValidationStep />
          </Box>
        </div>
      );

      // ── Customization ────────────────────────────────────────────────────

      // Dates chosen to contrast short vs long day/month names:
      // "2026-06-03" → mercredi 3 juin      (medium day, short month)
      // "2026-09-11" → vendredi 11 septembre (long day, long month)
      // "2026-01-20" → mardi 20 janvier      (short day, medium month)
      const DEMO_DATES = ["2026-06-03", "2026-09-11", "2026-01-20"];

      // Fixed reference point for dayLabel demos so yesterday/today/tomorrow
      // labels are always visible regardless of the actual current date.
      const DAY_LABEL_NOW = new Date("2026-06-03T12:00:00");
      const DAY_LABEL_YESTERDAY = "2026-06-02";
      const DAY_LABEL_TODAY = "2026-06-03";
      const DAY_LABEL_TOMORROW = "2026-06-04";

      const CustomizationDemo = () => (
        <div class="demo-section">
          <Heading id="customization">Customization — Picker.UI.Date</Heading>
          <p class="desc">
            <code>ui={"{<Picker.UI.Date />}"}</code> personnalise l'affichage de
            la date sélectionnée ; ses props sont transmises au{" "}
            <code>&lt;Time type="date"&gt;</code> sous-jacent.
          </p>

          <div class="states-grid">
            <div>
              <Heading level={3} id="format-long" class="states-col-header">
                Default — format long
              </Heading>
              <Box flex="y" spacing="xs" alignX="start">
                {DEMO_DATES.map((d, i) => (
                  <Picker
                    key={i}
                    name={`date_default_${i}`}
                    type="date"
                    defaultValue={d}
                  />
                ))}
              </Box>
              <hr class="demo-hr" />
              <p class="desc" style={{ margin: "0 0 8px" }}>
                dayLabel
              </p>
              <Box flex="y" spacing="xs" alignX="start">
                <Picker
                  name="date_daylabel_yesterday"
                  type="date"
                  defaultValue={DAY_LABEL_YESTERDAY}
                  ui={<Picker.UI.Date dayLabel now={DAY_LABEL_NOW} />}
                />
                <Picker
                  name="date_daylabel_today"
                  type="date"
                  defaultValue={DAY_LABEL_TODAY}
                  ui={<Picker.UI.Date dayLabel now={DAY_LABEL_NOW} />}
                />
                <Picker
                  name="date_daylabel_tomorrow"
                  type="date"
                  defaultValue={DAY_LABEL_TOMORROW}
                  ui={<Picker.UI.Date dayLabel now={DAY_LABEL_NOW} />}
                />
              </Box>
            </div>
            <div>
              <Heading level={3} id="format-short" class="states-col-header">
                format="short"
              </Heading>
              <Box flex="y" spacing="xs" alignX="start">
                {DEMO_DATES.map((d, i) => (
                  <Picker
                    key={i}
                    name={`date_short_${i}`}
                    type="date"
                    defaultValue={d}
                    ui={<Picker.UI.Date format="short" />}
                  />
                ))}
              </Box>
              <hr class="demo-hr" />
              <p class="desc" style={{ margin: "0 0 8px" }}>
                dayLabel
              </p>
              <Box flex="y" spacing="xs" alignX="start">
                <Picker
                  name="date_short_daylabel_yesterday"
                  type="date"
                  defaultValue={DAY_LABEL_YESTERDAY}
                  ui={
                    <Picker.UI.Date
                      format="short"
                      dayLabel
                      now={DAY_LABEL_NOW}
                    />
                  }
                />
                <Picker
                  name="date_short_daylabel_today"
                  type="date"
                  defaultValue={DAY_LABEL_TODAY}
                  ui={
                    <Picker.UI.Date
                      format="short"
                      dayLabel
                      now={DAY_LABEL_NOW}
                    />
                  }
                />
                <Picker
                  name="date_short_daylabel_tomorrow"
                  type="date"
                  defaultValue={DAY_LABEL_TOMORROW}
                  ui={
                    <Picker.UI.Date
                      format="short"
                      dayLabel
                      now={DAY_LABEL_NOW}
                    />
                  }
                />
              </Box>
            </div>
          </div>

          <hr class="demo-hr" />
          <Heading level={3} id="format-numeric" class="states-col-header">
            format="numeric"
          </Heading>
          <Box flex="y" spacing="xs" alignX="start">
            {DEMO_DATES.map((d, i) => (
              <Picker
                key={i}
                name={`date_numeric_${i}`}
                type="date"
                defaultValue={d}
                ui={<Picker.UI.Date format="numeric" />}
              />
            ))}
          </Box>

          <hr class="demo-hr" />
          <Heading level={3} id="sizing" class="states-col-header">
            Sizing, padding, border-radius, text-align
          </Heading>
          <Box flex="y" spacing="s" alignX="start">
            <span style={{ color: "#888", fontSize: "12px" }}>
              size s / m / l
            </span>

            <Box flex spacing="s" alignX="start" alignY="center">
              <Picker
                name="date_size_s"
                type="date"
                defaultValue={DEMO_DATES[0]}
                size="s"
              />
              <Picker
                name="date_size_m"
                type="date"
                defaultValue={DEMO_DATES[0]}
                size="m"
              />
              <Picker
                name="date_size_l"
                type="date"
                defaultValue={DEMO_DATES[0]}
                size="l"
              />
            </Box>
            <Box flex="y" spacing="s" alignX="start" alignY="center">
              <span style={{ color: "#888", fontSize: "12px" }}>
                padding x+xs / l+m
              </span>

              <Picker
                name="date_padding_xs"
                type="date"
                defaultValue={DEMO_DATES[0]}
                paddingX="s"
                paddingY="xs"
              />
              <Picker
                name="date_padding_m"
                type="date"
                defaultValue={DEMO_DATES[0]}
                paddingX="l"
                paddingY="m"
              />
            </Box>
            <Box flex="y" spacing="s" alignX="start" alignY="center">
              <span style={{ color: "#888", fontSize: "12px" }}>
                padding + border-radius 0 / m
              </span>

              <Picker
                name="date_radius_0"
                type="date"
                defaultValue={DEMO_DATES[0]}
                borderRadius="0"
                padding="m"
              />
              <Picker
                name="date_radius_full"
                type="date"
                defaultValue={DEMO_DATES[0]}
                borderRadius="m"
                padding="m"
              />
            </Box>
            <Box flex="y" spacing="s" alignX="start" alignY="center">
              <span style={{ color: "#888", fontSize: "12px" }}>
                textAlign left / center / right
              </span>

              <Picker
                name="date_align_left"
                type="date"
                defaultValue={DEMO_DATES[0]}
                width="200px"
                textAlign="left"
              />
              <Picker
                name="date_align_center"
                type="date"
                defaultValue={DEMO_DATES[0]}
                width="200px"
                textAlign="center"
              />
              <Picker
                name="date_align_right"
                type="date"
                defaultValue={DEMO_DATES[0]}
                width="200px"
                textAlign="right"
              />
            </Box>
            <div>
              <p class="desc" style={{ margin: "0 0 8px" }}>
                La bordure fait partie de la surface cliquable ; les coins
                arrondis, non — le hit-area reste rectangulaire.
              </p>
              <Picker
                name="date_border_demo"
                type="date"
                defaultValue={DEMO_DATES[0]}
                borderWidth="20"
                borderRadius="m"
              />
            </div>
          </Box>

          <hr class="demo-hr" />
          <Heading level={3} id="ui-default" class="states-col-header">
            ui="default" — UI du navigateur
          </Heading>
          <div class="states-grid">
            <div>
              <p class="desc" style={{ margin: "0 0 8px" }}>
                Picker ui="default"
              </p>
              <Box flex="y" spacing="xs" alignX="start">
                {DEMO_DATES.map((d, i) => (
                  <Picker
                    key={i}
                    name={`date_browser_${i}`}
                    type="date"
                    defaultValue={d}
                    ui="default"
                  />
                ))}
              </Box>
            </div>
            <div>
              <p class="desc" style={{ margin: "0 0 8px" }}>
                input natif
              </p>
              <Box flex="y" spacing="xs" alignX="start">
                {DEMO_DATES.map((d, i) => (
                  <input key={i} type="date" defaultValue={d} />
                ))}
              </Box>
            </div>
          </div>
        </div>
      );

      // ── Clipboard ────────────────────────────────────────────────────────

      const ClipboardDemo = () => (
        <div class="demo-section">
          <Heading id="clipboard">Clipboard</Heading>
          <p class="desc">
            Copier / couper dans la source puis coller dans la cible : le texte
            affiché change de langue, la date sous-jacente est préservée.
          </p>
          <ClipboardInspect>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: "24px",
                alignItems: "start",
              }}
            >
              <Box flex="y" spacing="s" alignX="start">
                <p class="desc" style={{ margin: 0 }}>
                  Source — <strong>fr</strong>
                </p>
                <Picker
                  name="clipboard_source"
                  type="date"
                  defaultValue={DEFAULT_DATE}
                  ui={<Picker.UI.Date lang="fr" />}
                />
              </Box>
              <Box flex="y" spacing="s" alignX="start">
                <p class="desc" style={{ margin: 0 }}>
                  Cible — <strong>en</strong>
                </p>
                <Picker
                  name="clipboard_target"
                  type="date"
                  ui={<Picker.UI.Date lang="en" />}
                />
              </Box>
            </div>
          </ClipboardInspect>
        </div>
      );

      // ── Date + Time combo ────────────────────────────────────────────────

      const SLOT_STEP_MINUTES = 30;
      const SLOT_STEP = "00:30";
      const SLOT_FIRST = "07:00";
      const SLOT_LAST = "21:00";

      const toDayString = (date) =>
        `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const TODAY = toDayString(new Date());

      const comboDateSignal = stateSignal(TODAY, {
        id: "combo_date",
        type: "date",
        min: TODAY,
        autoFix: true,
      });
      const comboTimeSignal = stateSignal(undefined, {
        id: "combo_time",
        type: "time",
      });

      const DateTimeComboDemo = () => {
        const [entries, push, clear] = useCallLog();
        const day = comboDateSignal.value;
        // Today has no slot in the past: the first one is the next step
        // boundary from now, so a slot is never proposed for a moment gone by.
        const firstSlot = isToday(day)
          ? getNowHoursRoundedToStep(SLOT_STEP_MINUTES)
          : SLOT_FIRST;

        return (
          <div class="demo-section">
            <Heading id="date-time-combo">Date + Time combo</Heading>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
              flex="y"
              spacing="m"
              alignX="start"
            >
              <Box flex spacing="m" alignY="end">
                <Field flex="y">
                  <Label>Jour (aujourd'hui au plus tôt)</Label>
                  <Picker
                    name="combo_date"
                    type="date"
                    required
                    min={TODAY}
                    signal={comboDateSignal}
                  />
                </Field>
                <Field flex="y">
                  <Label>
                    Créneau ({firstSlot} – {SLOT_LAST})
                  </Label>
                  <Picker
                    name="combo_time"
                    type="navi_time"
                    required
                    min={firstSlot}
                    max={SLOT_LAST}
                    step={SLOT_STEP}
                    signal={comboTimeSignal}
                  />
                </Field>
              </Box>
              <Button type="submit">Soumettre</Button>
            </Form>

            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── The page itself ──────────────────────────────────────────────────

      setupRoutes([
        route("", {
          searchParams: {
            no_initial_date: noInitialDateSignal,
            with_initial_date: withInitialDateSignal,
            combo_date: comboDateSignal,
            combo_time: comboTimeSignal,
          },
        }),
      ]);

      render(
        <NaviDebug debugAll>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
