<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day stepper demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 32px;
        font-size: 1.4rem;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      p.desc {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Day stepper</h1>
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import {
        Box,
        Button,
        DayStepper,
        Field,
        Form,
        Label,
        Link,
        Text,
        NaviDebug,
        route,
        setupRoutes,
        stateSignal,
      } from "@jsenv/navi";
      import { CallLog, useCallLog } from "./utils/call_log.jsx";
      import { DocumentToc } from "../../internal/document_toc.jsx";

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const today = new Date();
      const day = (offset) => {
        const date = new Date(today);
        date.setDate(date.getDate() + offset);
        const month = String(date.getMonth() + 1).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${String(date.getDate()).padStart(2, "0")}`;
      };
      const TODAY = day(0);
      const YESTERDAY = day(-1);

      // The days this page keeps in the url, and what "Tout réinitialiser"
      // puts back.
      const daySignal = stateSignal(TODAY, { id: "day", type: "date" });
      const boundedDaySignal = stateSignal(TODAY, {
        id: "bounded_day",
        type: "date",
      });
      const DEMO_SIGNALS = [daySignal, boundedDaySignal];

      const App = () => (
        <Box flex="y" spacing="l">
          <TableOfContents />
          <BasicsDemo />
          <DimensionsDemo />
          <LooksDemo />
          <BoundsDemo />
          <WeekDemo />
          <VerticalDemo />
          <UIActionDemo />
          <InFormDemo />
        </Box>
      );

      const TableOfContents = () => (
        <div class="demo-section">
          <Box flex alignY="center" spacing="m">
            <h2 style="margin: 0; flex: 1">Sommaire</h2>
            <Button
              onClick={() => {
                // undefined, not their defaults: a signal back at its
                // default is a signal with nothing to say, which is what
                // empties the url.
                for (const signal of DEMO_SIGNALS) {
                  signal.value = undefined;
                }
              }}
            >
              Tout réinitialiser
            </Button>
          </Box>
          <DocumentToc />
        </div>
      );

      // ── Basics ────────────────────────────────────────────────────────────

      const BasicsDemo = () => (
        <div class="demo-section">
          <Heading id="basics">Le jour, celui d'avant, celui d'après</Heading>
          <p class="desc">
            Les flèches changent de jour, le centre ouvre le calendrier.
          </p>
          <DayStepper signal={daySignal} width="340px" />
        </div>
      );

      // ── Looks ─────────────────────────────────────────────────────────────

      const Variant = ({ caption, children }) => (
        <Box flex="y" spacing="xs" alignX="start">
          {children}
          <Text size="s" color="#666">
            {caption}
          </Text>
        </Box>
      );

      const LooksDemo = () => (
        <div class="demo-section">
          <Heading id="looks">Apparence</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption="par défaut">
              <DayStepper defaultValue={TODAY} width="340px" />
            </Variant>
            <Variant caption='borderWidth="0"'>
              <DayStepper defaultValue={TODAY} width="340px" borderWidth="0" />
            </Variant>
            <Variant caption='borderColor="#1a73e8" borderRadius="10px"'>
              <DayStepper
                defaultValue={TODAY}
                width="340px"
                borderColor="#1a73e8"
                borderRadius="10px"
              />
            </Variant>
            <Variant caption='paddingY="m"'>
              <DayStepper defaultValue={TODAY} width="340px" paddingY="m" />
            </Variant>
            <Variant caption='size="xxl"'>
              <DayStepper defaultValue={TODAY} size="xxl" width="520px" />
            </Variant>
            <Variant caption='size="xxs"'>
              <DayStepper defaultValue={TODAY} size="xxs" width="240px" />
            </Variant>
          </Box>
        </div>
      );

      // ── Dimensions ────────────────────────────────────────────────────────

      const DimensionsDemo = () => (
        <div class="demo-section">
          <Heading id="dimensions">Dimensions</Heading>
          <Box flex="y" spacing="l" alignX="start">
            <Variant caption='format="numeric"'>
              <DayStepper defaultValue={TODAY} format="numeric" />
            </Variant>
            <Variant caption='format="short"'>
              <DayStepper defaultValue={TODAY} format="short" />
            </Variant>
            <Variant caption="par défaut, sans width : la largeur suit le jour affiché">
              <DayStepper defaultValue={TODAY} />
            </Variant>
            <Variant caption='width="340px"'>
              <DayStepper defaultValue={TODAY} width="340px" />
            </Variant>
          </Box>
        </div>
      );

      // ── Bounds ────────────────────────────────────────────────────────────

      const BoundsDemo = () => (
        <div class="demo-section">
          <Heading id="bounds">min / max</Heading>
          <p class="desc">Hier au plus tôt, dans 3 jours au plus tard.</p>
          <DayStepper
            signal={boundedDaySignal}
            min={YESTERDAY}
            max={day(3)}
            width="340px"
          />
        </div>
      );

      // ── Step ──────────────────────────────────────────────────────────────

      const WeekDemo = () => (
        <div class="demo-section">
          <Heading id="step">step</Heading>
          <p class="desc">Une semaine par flèche.</p>
          <DayStepper
            defaultValue={TODAY}
            step={7}
            width="340px"
            previousLabel="Semaine précédente"
            nextLabel="Semaine suivante"
          />
        </div>
      );

      // ── Vertical ──────────────────────────────────────────────────────────

      const VerticalDemo = () => (
        <div class="demo-section">
          <Heading id="vertical">vertical</Heading>
          <p class="desc">Le même, debout : ↑ ↓.</p>
          <DayStepper
            defaultValue={TODAY}
            vertical
            format="short"
            width="220px"
          />
        </div>
      );

      // ── uiAction ──────────────────────────────────────────────────────────

      const UIActionDemo = () => {
        const [entries, push, clear] = useCallLog();

        return (
          <div class="demo-section">
            <Heading id="ui-action">uiAction</Heading>
            <p class="desc">
              L'événement dit d'où vient le jour : une flèche, ou le calendrier.
            </p>
            <DayStepper
              defaultValue={TODAY}
              width="340px"
              uiAction={(dayPicked, event) => {
                push("uiAction", dayPicked, event);
              }}
            />
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── In a form ─────────────────────────────────────────────────────────

      const InFormDemo = () => {
        const [entries, push, clear] = useCallLog();

        return (
          <div class="demo-section">
            <Heading id="in-form">Dans un formulaire</Heading>
            <p class="desc">Le jour part avec le formulaire, sous son name.</p>
            <Form
              action={(values) => {
                push("Form action", values);
              }}
            >
              <Box flex spacing="m" alignY="end">
                <Field flex="y">
                  <Label>Jour</Label>
                  <DayStepper name="day" defaultValue={TODAY} width="340px" />
                </Field>
                <Button type="submit">Soumettre</Button>
              </Box>
            </Form>
            <CallLog entries={entries} onClear={clear} />
          </div>
        );
      };

      // ── The page itself ──────────────────────────────────────────────────

      setupRoutes([
        route("", {
          searchParams: {
            day: daySignal,
            bounded_day: boundedDaySignal,
          },
        }),
      ]);

      render(
        <NaviDebug debugAll>
          <App />
        </NaviDebug>,
        document.getElementById("app"),
      );
    </script>
  </body>
</html>
