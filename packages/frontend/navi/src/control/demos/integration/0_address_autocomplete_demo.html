<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adresse avec autocomplete</title>
    <style>
      body {
        max-width: 660px;
        margin: 0 auto;
        padding: 20px;
        color: #1a1a2e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #eef1f5;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.25rem;
      }
      .intro {
        margin: 0 0 20px;
        color: #555;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Adresse avec autocomplete</h1>
    <p class="intro">
      On tape, l'API adresse.data.gouv.fr suggère. Les composants structurés en
      dessous — ce que le formulaire envoie — se remplissent sur un geste
      explicite: choisir une suggestion, ou le bouton qui découpe au mieux le
      texte tapé. Ils restent modifiables à la main.
    </p>
    <div id="app"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useSignal } from "@preact/signals";
      import { useRef, useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Form,
        Input,
        Label,
        List,
        Popover,
        Text,
      } from "@jsenv/navi";
      import { FakeBackend } from "@jsenv/navi/src/internal/fake_backend.jsx";

      const GEO_API_URL = "https://api-adresse.data.gouv.fr/search/";
      const SUGGESTION_MIN_CHARS = 3;

      const STREET_TYPES = [
        "rue",
        "avenue",
        "boulevard",
        "chemin",
        "place",
        "impasse",
        "allée",
        "route",
        "quai",
        "cours",
      ];
      const parseStreetLine = (line) => {
        let streetNumber = "";
        let streetType = "";
        // espaces normalisés d'abord: les regex ci-dessous peuvent alors
        // matcher un séparateur littéral, sans quantifieurs ambigus
        let rest = line.trim().replace(/\s+/g, " ");
        const numberMatch = rest.match(/^(\d+(?: ?(?:bis|ter))?) (.*)$/i);
        if (numberMatch) {
          streetNumber = numberMatch[1];
          rest = numberMatch[2];
        }
        const firstWord = rest.split(" ")[0]?.toLowerCase();
        if (STREET_TYPES.includes(firstWord)) {
          streetType = firstWord;
          rest = rest.slice(firstWord.length).trim();
        }
        return {
          street_number: streetNumber,
          street_type: streetType,
          street_name: rest,
        };
      };
      // Coupé autour du code postal (5 chiffres) plutôt qu'en une seule
      // regex: avant lui la voie, après lui la ville
      const parseAddress = (text) => {
        const postalMatch = text.match(/\b\d{5}\b/);
        if (!postalMatch) {
          return { ...parseStreetLine(text), postal_code: "", city: "" };
        }
        const streetPart = text.slice(0, postalMatch.index);
        const cityPart = text.slice(postalMatch.index + 5);
        return {
          ...parseStreetLine(streetPart.replace(/[\s,]+$/, "")),
          postal_code: postalMatch[0],
          city: cityPart.replace(/^[\s,]+/, "").trim(),
        };
      };
      const formatAddress = (components) => {
        const streetLine = [
          components.street_number,
          components.street_type,
          components.street_name,
        ]
          .filter(Boolean)
          .join(" ");
        const cityLine = [components.postal_code, components.city]
          .filter(Boolean)
          .join(" ");
        return [streetLine, cityLine].filter(Boolean).join(", ");
      };

      const addressComponentsFromGeoFeature = (feature) => {
        const { housenumber, street, name, postcode, city } =
          feature.properties;
        // street manque sur certains résultats (lieux-dits): name porte alors
        // toute la ligne, numéro compris
        const streetLine = street
          ? `${housenumber ? `${housenumber} ` : ""}${street}`
          : name;
        const parsed = parseStreetLine(streetLine);
        return {
          street_number: housenumber || parsed.street_number,
          street_type: parsed.street_type,
          street_name: parsed.street_name,
          postal_code: postcode || "",
          city: city || "",
        };
      };

      const AddressField = ({ id }) => {
        const textSignal = useSignal("");
        // null: rien à montrer, popover fermé; []: recherche faite, aucun
        // résultat — le popover reste ouvert pour le dire
        const [suggestions, setSuggestions] = useState(null);
        const [searching, setSearching] = useState(false);
        // la requête en vol, annulée dès qu'une frappe la rend obsolète
        const abortRef = useRef(null);
        // Un signal par composant: chacun est un champ nommé du formulaire,
        // c'est le formulaire qui les envoie — rien à collecter à la main
        const componentSignals = {
          street_number: useSignal(""),
          street_type: useSignal(""),
          street_name: useSignal(""),
          postal_code: useSignal(""),
          city: useSignal(""),
        };
        const writeComponents = (components) => {
          for (const key of Object.keys(componentSignals)) {
            componentSignals[key].value = components[key] || "";
          }
        };

        // Sync exprès: une action async passerait l'input en loading — donc
        // read-only — pendant la recherche, alors qu'on veut continuer à
        // taper. C'est la liste de suggestions qui porte l'état loading, et
        // l'abort de la requête en vol est géré ici (le signal d'abort d'une
        // action ne couvre que la durée de son run, fini immédiatement en
        // sync). actionDebounce fait toujours le debounce.
        // Taper ne fait que chercher: les champs en dessous ne bougent que
        // sur un geste explicite — choisir une suggestion, ou le bouton
        // "Remplir les champs"
        const searchAddress = (value) => {
          const typed = (value || "").trim();
          abortRef.current?.abort();
          if (typed.length < SUGGESTION_MIN_CHARS) {
            setSearching(false);
            setSuggestions(null);
            return;
          }
          const abortController = new AbortController();
          abortRef.current = abortController;
          // la liste s'affiche tout de suite, en loading, sans attendre la
          // réponse
          setSearching(true);
          const search = async () => {
            try {
              const url = `${GEO_API_URL}?q=${encodeURIComponent(typed)}&limit=5&autocomplete=1`;
              const response = await fetch(url, {
                signal: abortController.signal,
              });
              const geoJson = await response.json();
              setSuggestions(geoJson.features || []);
              setSearching(false);
            } catch {
              if (abortController.signal.aborted) {
                // une frappe plus récente a repris la main
                return;
              }
              // autocomplete en panne = pas de suggestions, le champ reste
              // un champ texte qui marche
              setSuggestions(null);
              setSearching(false);
            }
          };
          search();
        };

        const pickSuggestion = (featureId) => {
          const feature = (suggestions || []).find(
            (candidate) => candidate.properties.id === featureId,
          );
          if (!feature) {
            return;
          }
          const components = addressComponentsFromGeoFeature(feature);
          writeComponents(components);
          // écrire le signal ne repasse pas par l'action de recherche: elle
          // ne se déclenche que sur une frappe, la liste ne se rouvre pas
          textSignal.value = formatAddress(components);
          abortRef.current?.abort();
          setSearching(false);
          setSuggestions(null);
        };

        // Le geste explicite pour une adresse tapée sans passer par une
        // suggestion: elle est découpée au mieux dans les champs
        const fillFromText = () => {
          const typed = (textSignal.value || "").trim();
          writeComponents(typed ? parseAddress(typed) : {});
        };

        return (
          <Box flex="y" spacing="m" alignX="start">
            <Field flex="y" spacingWithControl="s">
              <Label>Adresse</Label>
              <Input
                id={id}
                type="search"
                navi-list={`${id}_suggestions`}
                placeholder="12 rue de la Paix, Antibes"
                signal={textSignal}
                action={searchAddress}
                actionDebounce={300}
                autoComplete="off"
                borderRadius="s"
                paddingX="s"
                paddingY="s"
                width="320px"
              />
              {/* anchor + minWidth="var(--anchor-width)": le popover est posé
                  sous l'input et fait au moins sa largeur.
                  autoFocus={false}: l'ouverture ne déplace pas le focus, on
                  est en train de taper dans l'input et on y reste */}
              <Popover
                anchor={id}
                open={searching || suggestions !== null}
                minWidth="var(--anchor-width)"
                autoFocus={false}
              >
                <List
                  selectable
                  id={`${id}_suggestions`}
                  uiAction={pickSuggestion}
                  loading={searching}
                  fallback="Aucune adresse trouvée"
                  separator
                  expandX
                >
                  {(suggestions || []).map((feature, index) => (
                    <List.Item
                      selectable
                      key={feature.properties.id || index}
                      id={`${id}_suggestion_${index}`}
                      index={index}
                      value={feature.properties.id}
                      padding="s"
                    >
                      <Box flex="y">
                        <Text size="m">{feature.properties.label}</Text>
                        {feature.properties.context && (
                          <Text size="xs" color="secondary">
                            {feature.properties.context}
                          </Text>
                        )}
                      </Box>
                    </List.Item>
                  ))}
                </List>
              </Popover>
            </Field>

            {/* type="button": dans un Form, un bouton nu enverrait le
                formulaire — celui-ci ne fait que reporter le texte */}
            <Button type="button" action={fillFromText} paddingY="s">
              ↓ Remplir les champs avec cette adresse
            </Button>

            <Box flex="y" spacing="xs" alignX="start">
              <Text size="xs" color="secondary">
                Remplis en choisissant une suggestion ou via le bouton,
                modifiables
              </Text>
              <Box flex="x" spacing="s" flexWrap>
                <ComponentField
                  label="N°"
                  name="street_number"
                  signal={componentSignals.street_number}
                  width="60px"
                />
                <ComponentField
                  label="Type de voie"
                  name="street_type"
                  signal={componentSignals.street_type}
                  width="110px"
                />
                <ComponentField
                  label="Nom de voie"
                  name="street_name"
                  signal={componentSignals.street_name}
                  width="180px"
                />
                <ComponentField
                  label="Code postal"
                  name="postal_code"
                  signal={componentSignals.postal_code}
                  autoComplete="postal-code"
                  width="90px"
                />
                <ComponentField
                  label="Ville"
                  name="city"
                  signal={componentSignals.city}
                  autoComplete="address-level2"
                  width="140px"
                />
              </Box>
            </Box>
          </Box>
        );
      };

      // autoComplete: dire au navigateur ce qu'est chaque champ, pour que son
      // autofill propose la bonne chose au lieu de deviner (un identifiant
      // dans "nom de voie"...). Tokens standard: postal-code, address-level2
      // (ville). La granularité s'arrête là — numéro/type/nom de voie n'ont
      // pas de token, "off" empêche au moins le navigateur d'y improviser.
      const ComponentField = ({
        label,
        name,
        signal,
        width,
        autoComplete = "off",
      }) => (
        <Field flex="y" spacingWithControl="xs">
          <Label>
            <Text size="xs" color="secondary">
              {label}
            </Text>
          </Label>
          <Input
            name={name}
            signal={signal}
            autoComplete={autoComplete}
            borderRadius="s"
            paddingX="s"
            paddingY="s"
            width={width}
          />
        </Field>
      );

      const App = () => (
        <FakeBackend>
          {({ action }) => (
            <Form action={action} flex="y" spacing="m" expandX alignX="start">
              <AddressField id="address" />
              <Button type="submit" paddingY="s" alignX="start">
                Envoyer
              </Button>
            </Form>
          )}
        </FakeBackend>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
