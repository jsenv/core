<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Créer une annonce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 820px;
        margin: 0 auto;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .caption {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .phone {
        display: flex;
        width: 380px;
        height: 660px;
        flex: none;
        flex-direction: column;
        background: white;
        border: 1px solid #ccc;
        border-radius: 12px;
        overflow: hidden;
      }
      .page {
        display: flex;
        box-sizing: border-box;
        min-height: 0;
        padding: 20px;
        flex: 1;
        flex-direction: column;
        gap: 16px;
        overflow: auto;
      }
      .page_title {
        margin: 0;
        font-size: 1.05rem;
      }
      /* .phone n'est pas une Box navi: la place que la colonne donne aux
         slides est dite ici plutôt que par expandY. */
      .phone > .wizard_slides {
        min-height: 0;
        flex: 1 1 auto;
      }
      .wizard_head {
        color: white;
        background: #26314a;
      }
      .wizard_head_row {
        position: relative;
      }
      .wizard_title {
        margin: 0;
        flex: 1;
        font-size: 1.05rem;
        text-align: center;
      }
      /* Le div est à moi, le Button vit dedans en flux normal (même raison
         que .stepper_step_slot). */
      .wizard_cancel_slot {
        position: absolute;
        top: 50%;
        right: 8px;
        translate: 0 -50%;
      }
      .wizard_cancel {
        --button-color: #b9c4dd;
        --button-background-color-hover: rgba(255, 255, 255, 0.1);
      }
      .step_title {
        margin: 0;
        font-size: 1rem;
      }

      /* ── Le stepper ──────────────────────────────────────────────────────
         Deux calques SVG identiques: le gris dessous, le rempli dessus,
         révélé par un clip-path dont le bord droit marque le CHEMIN — jusqu'où
         les étapes sont remplies sans trou. Il avance quand une étape est
         validée (la transition sur clip-path anime le trait et la pastille qui
         se remplissent), pas quand on se déplace: la position, elle, est le
         halo. */
      .stepper {
        position: relative;
        width: 348px;
        height: 76px;
        margin: 0 auto;
      }
      .stepper_rail {
        position: absolute;
        top: 10px;
        left: 0;
        pointer-events: none;
      }
      /* Le chemin restant, en pointillés — le calque rempli le repasse en
         trait plein. */
      .stepper_rail line {
        stroke: rgba(255, 255, 255, 0.35);
        stroke-width: 2;
        stroke-dasharray: 4 5;
      }
      .stepper_rail circle {
        fill: #26314a;
        stroke: #8b99b8;
        stroke-width: 1.5;
      }
      .stepper_rail text {
        font-weight: 600;
        font-size: 12px;
        fill: #8b99b8;
      }
      .stepper_rail_fill {
        transition: clip-path 300ms ease;
      }
      .stepper_rail_fill line {
        stroke: white;
        stroke-dasharray: none;
      }
      .stepper_rail_fill circle {
        fill: #4f8ef7;
        stroke: #4f8ef7;
      }
      .stepper_rail_fill text {
        fill: white;
      }
      /* La position: un halo autour de la pastille de la slide qu'on regarde
         — qui peut être en avance sur le chemin. */
      .stepper_marker {
        position: absolute;
        top: 12.5px;
        box-sizing: border-box;
        width: 29px;
        height: 29px;
        border: 1.5px solid rgba(122, 167, 248, 0.8);
        border-radius: 50%;
        transition: left 300ms ease;
        pointer-events: none;
      }
      /* Le div est à moi, le Button vit dedans en flux normal: sa structure
         interne (qui change avec readOnly) n'a alors rien à casser. */
      .stepper_step_slot {
        position: absolute;
        top: 0;
        display: flex;
        box-sizing: border-box;
        width: 84px;
        height: 100%;
        padding-bottom: 6px;
        align-items: flex-end;
        justify-content: center;
      }
      .stepper_step {
        font-size: 12px;
        --button-color: #8b99b8;
        --button-color-readonly: #8b99b8;
        --button-background-color-hover: transparent;
        --button-background-color-readonly: transparent;
      }
      .stepper_step[data-current] {
        font-weight: 600;
        --button-color: white;
        --button-color-readonly: white;
      }

      .group_legend {
        padding: 0;
        font-weight: 600;
        font-size: 0.85rem;
      }
      /* Un jour coché se voit: le fond passe à l'accent. La variante bouton
         de navi garde exprès ses couleurs de bouton quand elle est cochée —
         ici c'est le fond qui dit la sélection, donc on le reprend. */
      .phone .day_chip:has(:checked) {
        color: white;
        background: #4f8ef7;
        border-color: #4f8ef7;
      }
      .annonce_list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .annonce_card {
        display: flex;
        padding: 12px 14px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        background: #eceff1;
        border-radius: 8px;
      }
      .done_check {
        display: flex;
        width: 48px;
        height: 48px;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        background: #2e7d32;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useId, useState } from "preact/hooks";
      import { useSignal } from "@preact/signals";
      import {
        Box,
        Button,
        CheckboxGroup,
        CloseSvg,
        Form,
        Icon,
        Input,
        List,
        RadioGroup,
        Select,
        SelectableInput,
        Slide,
        SlideContainer,
        Text,
        TimeRangeWheel,
        useSearchText,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../../../internal/demo_header.jsx";
      import {
        FakeBackend,
        createFakeBackend,
      } from "../../../../internal/fake_backend.jsx";

      // ── Ce qu'une annonce dit ─────────────────────────────────────────────
      const DAYS = [
        { key: "lun", initial: "L", short: "Lu", label: "Lundi" },
        { key: "mar", initial: "M", short: "Ma", label: "Mardi" },
        { key: "mer", initial: "M", short: "Me", label: "Mercredi" },
        { key: "jeu", initial: "J", short: "Je", label: "Jeudi" },
        { key: "ven", initial: "V", short: "Ve", label: "Vendredi" },
        { key: "sam", initial: "S", short: "Sa", label: "Samedi" },
        { key: "dim", initial: "D", short: "Di", label: "Dimanche" },
      ];
      const WEEK_KEYS = ["lun", "mar", "mer", "jeu", "ven"];
      const WEEKEND_KEYS = ["sam", "dim"];
      const dayShort = (key) => DAYS.find((day) => day.key === key)?.short;

      // "18:00" → "18h00", pour l'affichage.
      const fmtHeure = (time) => (time ? time.replace(":", "h") : "");
      const fmtHoraire = (horaire) =>
        horaire ? `${fmtHeure(horaire.start)} – ${fmtHeure(horaire.end)}` : "";

      const CLUBS = [
        {
          id: "padel-club-toulouse",
          name: "Padel Club Toulouse",
          ville: "Toulouse",
        },
        {
          id: "toulouse-padel-club",
          name: "Toulouse Padel Club",
          ville: "Toulouse",
        },
        { id: "padel-tolosa", name: "Padel Tolosa", ville: "Toulouse" },
        { id: "urban-padel", name: "Urban Padel", ville: "Toulouse" },
        {
          id: "4padel-colomiers",
          name: "4Padel Colomiers",
          ville: "Colomiers",
        },
        { id: "padel-attitude", name: "Padel Attitude", ville: "Colomiers" },
        { id: "esprit-padel", name: "Esprit Padel", ville: "Balma" },
        {
          id: "squash-padel-balma",
          name: "Squash & Padel Balma",
          ville: "Balma",
        },
        { id: "padel-factory", name: "Padel Factory", ville: "Blagnac" },
        { id: "axess-padel", name: "Axess Padel", ville: "Blagnac" },
      ];
      const VILLES = [...new Set(CLUBS.map((club) => club.ville))];
      const clubName = (id) => CLUBS.find((club) => club.id === id)?.name;

      const NIVEAUX = [
        { key: "debutant", label: "Débutant" },
        { key: "perfectionnement", label: "Perfectionnement" },
        { key: "intermediaire", label: "Intermédiaire" },
        { key: "intermediaire_plus", label: "Intermédiaire +" },
        { key: "avance", label: "Avancé" },
        { key: "competition", label: "Compétition" },
      ];
      const NIVEAUX_MAX = 3;
      const niveauLabel = (key) =>
        NIVEAUX.find((niveau) => niveau.key === key)?.label;

      const COTES = [
        { key: "gauche", label: "À gauche" },
        { key: "droite", label: "À droite" },
        { key: "indifferent", label: "Peu importe" },
      ];
      const coteLabel = (key) => COTES.find((cote) => cote.key === key)?.label;

      // ── Le backend ────────────────────────────────────────────────────────
      // Rien n'y part avant la fin du parcours: les étapes écrivent un
      // brouillon à l'écran, seul le récapitulatif envoie (POST ou PUT).
      const backend = createFakeBackend({
        value: [],
        persist: "navi_demo_create_announcement",
      });
      const annonces = () => backend.valueSignal.value;
      const nextAnnonceId = () => {
        let biggest = 0;
        for (const annonce of annonces()) {
          const id = Number(annonce.id);
          if (id > biggest) {
            biggest = id;
          }
        }
        return String(biggest + 1);
      };
      const writeAnnonce = (annonce) => {
        const rest = annonces().filter(
          (candidate) => candidate.id !== annonce.id,
        );
        backend.setValue([...rest, annonce]);
        return annonce;
      };
      const api = {
        create: (values) =>
          backend.call("POST /annonces", () =>
            writeAnnonce({ id: nextAnnonceId(), ...values }),
          ),
        update: (id, values) =>
          backend.call(`PUT /annonces/${id}`, () =>
            writeAnnonce({ id, ...values }),
          ),
      };

      // ── Les étapes ────────────────────────────────────────────────────────
      const STEPS = [
        { area: "dispo", label: "Dispo" },
        { area: "club", label: "Club" },
        { area: "place", label: "Place" },
        { area: "recap", label: "Récap" },
      ];
      const stepAnswered = (draft, area) => {
        if (area === "dispo") {
          return Boolean(draft.jours?.length && draft.horaire);
        }
        if (area === "club") {
          return Boolean(draft.club);
        }
        if (area === "place") {
          return Boolean(draft.niveaux?.length && draft.cote);
        }
        return false;
      };
      // Le chemin: jusqu'où les étapes sont remplies sans trou. On peut se
      // tenir plus loin (la navigation est libre), le chemin ne suit pas —
      // il reste bloqué sur la première étape à qui il manque une info.
      // "recap" n'est jamais "répondu", donc tout rempli met le chemin sur lui.
      const pathFrontier = (draft) =>
        STEPS.findIndex((step) => !stepAnswered(draft, step.area));

      // ── Le stepper ────────────────────────────────────────────────────────
      const RAIL_W = 348;
      const RAIL_H = 34;
      const DOT_R = 11;
      const RING_R = 14.5;
      const DOT_X = [30, 126, 222, 318];

      const StepperRail = ({ filled, style }) => (
        <svg
          className={filled ? "stepper_rail stepper_rail_fill" : "stepper_rail"}
          style={style}
          width={RAIL_W}
          height={RAIL_H}
          viewBox={`0 0 ${RAIL_W} ${RAIL_H}`}
          aria-hidden="true"
        >
          <line
            x1={DOT_X[0]}
            y1={RAIL_H / 2}
            x2={DOT_X[DOT_X.length - 1]}
            y2={RAIL_H / 2}
          />
          {STEPS.map((step, index) => (
            <g key={step.area}>
              <circle cx={DOT_X[index]} cy={RAIL_H / 2} r={DOT_R} />
              <text
                x={DOT_X[index]}
                y={RAIL_H / 2}
                dy="0.36em"
                text-anchor="middle"
              >
                {index + 1}
              </text>
            </g>
          ))}
        </svg>
      );

      // Deux choses distinctes, dessinées séparément:
      // - le CHEMIN (calque rempli): jusqu'où les étapes sont remplies sans
      //   trou. Il avance quand une étape est validée — la transition CSS sur
      //   clip-path fait le mouvement — et pas quand on se déplace;
      // - la POSITION (halo + label blanc): la slide qu'on regarde, qui peut
      //   être en avance sur le chemin.
      const Stepper = ({ containerId, stepSignal, draft }) => {
        const currentArea = stepSignal.value;
        const currentIndex = STEPS.findIndex(
          (step) => step.area === currentArea,
        );
        const frontierIndex = pathFrontier(draft);
        const fillX = DOT_X[frontierIndex] + DOT_R + 3;
        return (
          <div className="stepper">
            <StepperRail />
            <StepperRail
              filled
              style={{ clipPath: `inset(0 ${RAIL_W - fillX}px 0 0)` }}
            />
            {currentIndex === -1 ? null : (
              <div
                className="stepper_marker"
                style={{ left: `${DOT_X[currentIndex] - RING_R}px` }}
              />
            )}
            {STEPS.map((step, index) => (
              <div
                key={step.area}
                className="stepper_step_slot"
                style={{ left: `${DOT_X[index] - 42}px` }}
              >
                <Button
                  variant="discrete"
                  className="stepper_step"
                  command={`--navi-go-to-slide:${step.area}`}
                  commandFor={containerId}
                  readOnly={currentArea === "done"}
                  data-current={step.area === currentArea ? "" : undefined}
                >
                  {step.label}
                </Button>
              </div>
            ))}
          </div>
        );
      };

      // ── Les slides ────────────────────────────────────────────────────────
      const StepFooter = ({ first, submitLabel = "Suivant" }) => (
        <Box flex="x" spacing="s">
          <Button
            command="--navi-left"
            expandX
            style={first ? { visibility: "hidden" } : undefined}
            inert={first || undefined}
          >
            Précédent
          </Button>
          <Button type="submit" cta expandX>
            {submitLabel}
          </Button>
        </Box>
      );

      // Une étape: un formulaire dans une slide. L'envoi qui aboutit dit
      // "--navi-done" à la slide, qui avance d'elle-même — "Suivant" est un
      // simple submit. canSendWhileUnchanged: c'est l'envoi qui pose les
      // valeurs de l'étape dans le brouillon, y compris quand on garde les
      // valeurs proposées telles quelles.
      // Aucun verrou: la navigation entre étapes est libre, seul le CHEMIN du
      // stepper dit ce qui est rempli.
      const StepSlide = ({ area, title, first, onValues, children }) => (
        <Slide id={area} overflow="auto">
          <Form action={onValues} canSendWhileUnchanged>
            <Box flex="y" spacing="l" padding="l">
              <h3 className="step_title">{title}</h3>
              {children}
              <StepFooter first={first} />
            </Box>
          </Form>
        </Slide>
      );

      const DispoSlide = ({ draft, patchDraft, joursSignal }) => (
        <StepSlide
          area="dispo"
          title="Quand êtes-vous disponible ?"
          first
          onValues={(values) => {
            patchDraft({
              jours: values.jours ? [].concat(values.jours) : [],
              horaire: values.horaire,
            });
          }}
        >
          <Box flex="y" spacing="s" alignX="start">
            <CheckboxGroup
              name="jours"
              required
              signal={joursSignal}
              flex="x"
              spacing="s"
              borderWidth="0"
              padding="0"
            >
              {DAYS.map((day) => (
                <Input
                  key={day.key}
                  type="checkbox"
                  variant="button"
                  className="day_chip"
                  value={day.key}
                  aria-label={day.label}
                  width="38"
                  height="38"
                  borderRadius="50%"
                  alignX="center"
                  alignY="center"
                  icon={<span>{day.initial}</span>}
                />
              ))}
            </CheckboxGroup>
            <Box flex="x" spacing="xs">
              <Button
                variant="discrete"
                onClick={() => {
                  joursSignal.value = WEEK_KEYS;
                }}
              >
                En semaine
              </Button>
              <Button
                variant="discrete"
                onClick={() => {
                  joursSignal.value = WEEKEND_KEYS;
                }}
              >
                Le weekend
              </Button>
            </Box>
          </Box>
          {/* Les deux bornes se poussent l'une l'autre en tournant — la
              roue qu'on tient reste où on la met, l'autre cède. */}
          <TimeRangeWheel
            name="horaire"
            size="l"
            defaultValue={draft.horaire ?? { start: "18:00", end: "20:00" }}
            minuteStep={30}
            hours={{ min: 6, max: 23 }}
            minDuration={60}
          />
        </StepSlide>
      );

      const ClubSlide = ({ draft, patchDraft }) => {
        const [searchText, setSearchText] = useState("");
        const [ville, setVille] = useState("");
        const [clubId, setClubId] = useState(draft.club);
        const clubsOfVille = ville
          ? CLUBS.filter((club) => club.ville === ville)
          : CLUBS;
        const [matchingNames, getMatchInfo] = useSearchText(
          searchText,
          clubsOfVille.map((club) => club.name),
        );
        const clubs = clubsOfVille.filter((club) =>
          matchingNames.includes(club.name),
        );
        const listId = useId();
        return (
          <Slide id="club" overflow="auto">
            <Box flex="y" spacing="m" padding="l">
              <h3 className="step_title">Où voulez-vous jouer ?</h3>
              {/* Hors du formulaire: filtrer n'est pas répondre, et Entrée
                  dans la recherche ne doit pas envoyer l'étape. */}
              <Box flex="x" spacing="s">
                <Select
                  value={ville}
                  action={(value) => {
                    setVille(value);
                  }}
                >
                  <option value="">Toutes les villes</option>
                  {VILLES.map((v) => (
                    <option key={v} value={v}>
                      {v}
                    </option>
                  ))}
                </Select>
                <Input
                  type="search"
                  placeholder="Rechercher un club"
                  navi-list={listId}
                  value={searchText}
                  action={(value) => {
                    setSearchText(value);
                  }}
                  expandX
                />
              </Box>
              <Form
                action={() => {
                  patchDraft({ club: clubId });
                }}
                canSendWhileUnchanged
                flex="y"
                spacing="m"
              >
                <List
                  selectable
                  id={listId}
                  name="club"
                  required
                  maxHeight="240"
                  separator
                  action={(value) => {
                    setClubId(value ?? undefined);
                  }}
                  searchFallback={
                    <Text color="#666" padding="m">
                      Aucun club ne correspond.
                    </Text>
                  }
                >
                  {clubs.map((club, index) => (
                    <List.Item
                      selectable
                      key={club.id}
                      id={`club_${club.id}`}
                      index={index}
                      value={club.id}
                      selected={clubId === club.id}
                      matchInfo={getMatchInfo(club.name)}
                      paddingX="m"
                      paddingY="s"
                      flex="x"
                      spacing="s"
                      alignY="center"
                    >
                      <SelectableInput />
                      <Box flex="y">
                        <Text>{club.name}</Text>
                        <Text size="s" color="#8a94a6">
                          {club.ville}
                        </Text>
                      </Box>
                    </List.Item>
                  ))}
                </List>
                <StepFooter />
              </Form>
            </Box>
          </Slide>
        );
      };

      const PlaceSlide = ({ draft, patchDraft, niveauxSignal }) => {
        const niveauxSelected = niveauxSignal.value || [];
        return (
          <StepSlide
            area="place"
            title="Quelle place cherchez-vous ?"
            onValues={(values) => {
              patchDraft({
                niveaux: values.niveaux ? [].concat(values.niveaux) : [],
                cote: values.cote,
              });
            }}
          >
            <CheckboxGroup
              name="niveaux"
              required
              signal={niveauxSignal}
              flex="x"
              wrap
              spacing="xs"
            >
              <legend className="group_legend">
                Niveau ({NIVEAUX_MAX} max)
              </legend>
              {NIVEAUX.map((niveau) => {
                const selected = niveauxSelected.includes(niveau.key);
                return (
                  <Input
                    key={niveau.key}
                    type="checkbox"
                    variant="button"
                    width="auto"
                    value={niveau.key}
                    readOnly={
                      niveauxSelected.length >= NIVEAUX_MAX && !selected
                    }
                    icon={<span>{niveau.label}</span>}
                  />
                );
              })}
            </CheckboxGroup>
            <RadioGroup
              name="cote"
              required
              defaultValue={draft.cote}
              flex="x"
              wrap
              spacing="xs"
            >
              <legend className="group_legend">Côté</legend>
              {COTES.map((cote) => (
                <Input
                  key={cote.key}
                  type="radio"
                  variant="button"
                  width="auto"
                  value={cote.key}
                  icon={<span>{cote.label}</span>}
                />
              ))}
            </RadioGroup>
          </StepSlide>
        );
      };

      const RecapLine = ({ label, area, children }) => (
        <Box flex="x" alignY="center" spacing="s">
          <Box flex="y" expandX>
            <Text size="s" color="#666">
              {label}
            </Text>
            <Text>{children}</Text>
          </Box>
          <Button variant="discrete" command={`--navi-go-to-slide:${area}`}>
            modifier
          </Button>
        </Box>
      );

      const Wizard = ({ annonce, onExit }) => {
        const editing = Boolean(annonce);
        // Le brouillon vit à l'écran: chaque étape y écrit à l'envoi de son
        // formulaire, et rien ne part au backend avant le récapitulatif.
        const [draft, setDraft] = useState(() =>
          editing
            ? {
                jours: annonce.jours,
                horaire: annonce.horaire,
                club: annonce.club,
                niveaux: annonce.niveaux,
                cote: annonce.cote,
              }
            : {},
        );
        const patchDraft = (patch) => {
          setDraft((previous) => ({ ...previous, ...patch }));
        };
        // Les signaux tiennent ce que les contrôles montrent: c'est ce qui
        // permet aux quick actions d'écrire dedans et au chip désactivé de
        // lire combien sont cochés.
        const joursSignal = useSignal(draft.jours ?? []);
        const niveauxSignal = useSignal(draft.niveaux ?? []);
        const stepSignal = useSignal("dispo");
        const containerId = useId();
        const save = async () => {
          const values = {
            jours: draft.jours,
            horaire: draft.horaire,
            club: draft.club,
            niveaux: draft.niveaux,
            cote: draft.cote,
          };
          if (editing) {
            await api.update(annonce.id, values);
          } else {
            await api.create(values);
          }
        };

        return (
          <>
            <Box className="wizard_head" flex="y">
              <Box
                className="wizard_head_row"
                flex="x"
                alignY="center"
                spacing="s"
                paddingX="l"
                paddingY="m"
              >
                <h2 className="wizard_title">
                  {editing ? "Modifier l'annonce" : "Créer une annonce"}
                </h2>
                <div className="wizard_cancel_slot">
                  <Button
                    variant="discrete"
                    className="wizard_cancel"
                    icon
                    aria-label="Annuler"
                    onClick={onExit}
                  >
                    <Icon>
                      <CloseSvg />
                    </Icon>
                  </Button>
                </div>
              </Box>
              <Stepper
                containerId={containerId}
                stepSignal={stepSignal}
                draft={draft}
              />
            </Box>
            {/* Navigation libre: les flèches, le drag et le stepper vont où on
                veut — le chemin du stepper, lui, ne bouge que sur validation. */}
            <SlideContainer
              id={containerId}
              signal={stepSignal}
              className="wizard_slides"
            >
              <DispoSlide
                draft={draft}
                patchDraft={patchDraft}
                joursSignal={joursSignal}
              />
              <ClubSlide draft={draft} patchDraft={patchDraft} />
              <PlaceSlide
                draft={draft}
                patchDraft={patchDraft}
                niveauxSignal={niveauxSignal}
              />
              {/* preventNavNext: l'écran de confirmation ne s'atteint qu'en
                  publiant — le --navi-done d'un envoi réussi lève le verrou
                  lui-même, une flèche ou un drag non. */}
              <Slide id="recap" overflow="auto" preventNavNext>
                {/* Sans champ, ce formulaire n'est jamais "changé":
                    canSendWhileUnchanged pour que l'envoi parte quand même. */}
                <Form action={save} canSendWhileUnchanged>
                  <Box flex="y" spacing="l" padding="l">
                    <h3 className="step_title">Récapitulatif</h3>
                    <Box flex="y" spacing="m">
                      <RecapLine label="Jours" area="dispo">
                        {(draft.jours || []).map(dayShort).join(", ")}
                      </RecapLine>
                      <RecapLine label="Horaires" area="dispo">
                        {fmtHoraire(draft.horaire)}
                      </RecapLine>
                      <RecapLine label="Club" area="club">
                        {clubName(draft.club)}
                      </RecapLine>
                      <RecapLine label="Place" area="place">
                        {(draft.niveaux || []).map(niveauLabel).join(", ")}
                        {draft.cote
                          ? ` — ${coteLabel(draft.cote)?.toLowerCase()}`
                          : ""}
                      </RecapLine>
                    </Box>
                    <Box flex="x" spacing="s">
                      <Button command="--navi-left" expandX>
                        Précédent
                      </Button>
                      {/* Tant que le chemin n'a pas atteint le récap, il
                          manque une réponse quelque part: rien à publier. */}
                      <Button
                        type="submit"
                        cta
                        expandX
                        readOnly={pathFrontier(draft) !== STEPS.length - 1}
                      >
                        {editing ? "Enregistrer" : "Publier l'annonce"}
                      </Button>
                    </Box>
                  </Box>
                </Form>
              </Slide>
              <Slide id="done" preventNavPrevious>
                <Box
                  flex="y"
                  spacing="m"
                  alignX="center"
                  alignY="center"
                  padding="l"
                  expandY
                >
                  <span className="done_check">✓</span>
                  <Text bold>
                    {editing ? "Annonce modifiée" : "Annonce publiée"}
                  </Text>
                  <Button cta onClick={onExit}>
                    Voir mes annonces
                  </Button>
                </Box>
              </Slide>
            </SlideContainer>
          </>
        );
      };

      const summarize = (annonce) =>
        [
          (annonce.jours || []).map(dayShort).join(", "),
          fmtHoraire(annonce.horaire),
          (annonce.niveaux || []).map(niveauLabel).join(", "),
        ].join(" · ");

      const HomePage = ({ onCreate, onEdit }) => {
        const list = annonces();
        return (
          <div className="page">
            <h2 className="page_title">Mes annonces</h2>
            {list.length === 0 ? (
              <Text color="#666">Aucune annonce pour le moment.</Text>
            ) : (
              <div className="annonce_list">
                {list.map((annonce) => (
                  <div className="annonce_card" key={annonce.id}>
                    <Text bold>{clubName(annonce.club)}</Text>
                    <Text size="s" color="#555">
                      {summarize(annonce)}
                    </Text>
                    <Button variant="discrete" onClick={() => onEdit(annonce)}>
                      Modifier
                    </Button>
                  </div>
                ))}
              </div>
            )}
            <Button cta onClick={onCreate}>
              Créer une annonce
            </Button>
          </div>
        );
      };

      const App = () => {
        const [screen, setScreen] = useState({ name: "home" });
        const goHome = () => setScreen({ name: "home" });
        return (
          <Box flex="y" spacing="l">
            <DemoHeader title="Créer une annonce" />
            <div className="demo-section">
              <p className="caption">
                Créer une annonce en plusieurs étapes, la publier, puis la
                modifier.
              </p>
              <FakeBackend backend={backend}>
                {() => (
                  <div className="phone">
                    {screen.name === "home" ? (
                      <HomePage
                        onCreate={() => setScreen({ name: "create" })}
                        onEdit={(annonce) =>
                          setScreen({ name: "edit", annonce })
                        }
                      />
                    ) : (
                      <Wizard
                        key={screen.annonce?.id ?? "new"}
                        annonce={screen.annonce}
                        onExit={goHome}
                      />
                    )}
                  </div>
                )}
              </FakeBackend>
            </div>
          </Box>
        );
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
