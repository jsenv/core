<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fil de parties (scroll infini vers le haut)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 900px;
        margin: 0 auto;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        scroll-margin-top: 12px;
      }
      h3 {
        margin: 16px 0 4px;
        font-size: 0.95rem;
        scroll-margin-top: 12px;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        scroll-margin-top: 16px;
      }
      .stats {
        display: flex;
        padding: 8px 12px;
        flex-wrap: wrap;
        gap: 18px;
        color: #d4d4d4;
        font-size: 0.8rem;
        font-family: monospace;
        background: #1e1e1e;
        border-radius: 6px;
      }
      .stat-label {
        color: #888;
      }
      .stat-value {
        color: #4ec9b0;
      }
      .stat-value[data-busy] {
        color: #ce9178;
      }
      /* Une ligne fixe posée devant la liste: ce qui est dessous ne doit pas
         bouger quand des lignes arrivent au-dessus. */
      .anchored-list {
        position: relative;
      }
      .ruler {
        position: absolute;
        top: 160px;
        right: 0;
        left: 0;
        z-index: 2;
        height: 2px;
        background: repeating-linear-gradient(
          to right,
          #d33 0 8px,
          transparent 8px 16px
        );
        pointer-events: none;
      }
      /* Le cadre de la section 6: une barre en haut, une en bas, et entre les
         deux un seul ascenseur — celui de la page qu'elles encadrent. */
      .page-frame {
        display: flex;
        height: 360px;
        flex-direction: column;
        background: #fff;
        border: 1px solid #ccd;
        border-radius: 8px;
      }
      .page-frame-bar {
        padding: 10px 14px;
        flex: none;
        color: #fff;
        font-size: 0.85rem;
        background: #34406b;
      }
      .page-frame-scroll {
        padding: 0 14px;
        flex: 1;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { signal } from "@preact/signals";
      import { Box, Button, Link, List, ListItem, Text } from "@jsenv/navi";
      import { DemoHeader } from "../../../internal/demo_header.jsx";
      import { DocumentToc } from "../../../internal/document_toc.jsx";

      const PAST_COUNT = 4000;
      const FUTURE_COUNT = 1000;
      const TOTAL_COUNT = PAST_COUNT + FUTURE_COUNT;
      const PAGE_SIZE = 50;
      // On ouvre le fil sur la frontière: la première partie à venir.
      const FRONTIER_INDEX = PAST_COUNT;

      const ADVERSAIRES = [
        "Les Coyotes",
        "AS Bellevue",
        "FC Rivière",
        "Étoile du Nord",
        "Les Marmottes",
        "US Chantilly",
        "Racing Ponts",
        "SC Trois-Chênes",
      ];
      const JOUEURS = [
        "Camille",
        "Sacha",
        "Noor",
        "Éliott",
        "Ambre",
        "Jules",
        "Lou",
        "Naïm",
        "Iris",
        "Timéo",
      ];
      const MOIS = [
        "janvier",
        "février",
        "mars",
        "avril",
        "mai",
        "juin",
        "juillet",
        "août",
        "septembre",
        "octobre",
        "novembre",
        "décembre",
      ];

      const createGame = (index) => {
        const date = new Date(2019, 0, 6);
        date.setDate(date.getDate() + index * 2);
        const playerCount = 1 + ((index * 7) % 6);
        const players = [];
        let i = 0;
        while (i < playerCount) {
          players.push(JOUEURS[(index + i * 3) % JOUEURS.length]);
          i++;
        }
        return {
          index,
          date,
          opponent: ADVERSAIRES[index % ADVERSAIRES.length],
          score:
            index < PAST_COUNT ? `${index % 5} - ${(index * 3) % 4}` : null,
          players,
        };
      };

      const FRONTIER_GAMES = Array.from({ length: 50 }, (_, i) =>
        createGame(FRONTIER_INDEX - 25 + i),
      );
      const TWO_THOUSAND_GAMES = Array.from({ length: 2000 }, (_, i) =>
        createGame(i),
      );

      const requestCountSignal = signal(0);
      const inFlightSignal = signal(0);
      const fetchGames = (from, count, latency) => {
        requestCountSignal.value++;
        inFlightSignal.value++;
        return new Promise((resolve) => {
          setTimeout(() => {
            inFlightSignal.value--;
            const games = [];
            let i = 0;
            while (i < count) {
              games.push(createGame(from + i));
              i++;
            }
            resolve(games);
          }, latency);
        });
      };

      const formatDay = (date) =>
        `${date.getDate()} ${MOIS[date.getMonth()]} ${date.getFullYear()}`;

      const Heading = ({ level = 2, id, children, ...rest }) => {
        const Tag = `h${level}`;
        return (
          <Tag {...rest}>
            <Link anchor revealOnInteraction href={`#${id}`}>
              #
            </Link>
            {children}
          </Tag>
        );
      };

      const Section = ({ id, title, children }) => (
        <div className="demo-section">
          <Heading level={2} id={id}>
            {title}
          </Heading>
          {children}
        </div>
      );

      const Caption = ({ children }) => (
        <Text size="s" color="#555">
          {children}
        </Text>
      );

      const Stat = ({ label, value, busy }) => (
        <span>
          <span className="stat-label">{label} </span>
          <span className="stat-value" data-busy={busy ? "" : undefined}>
            {value}
          </span>
        </span>
      );

      // Une partie: la date, l'adversaire, le score s'il a eu lieu, et la liste
      // des joueurs — dont la longueur varie d'une partie à l'autre.
      const GameItem = ({ listId, game, index, uniformHeight }) => {
        const isMonthStart = game.date.getDate() <= 2;
        const players = uniformHeight ? game.players.slice(0, 1) : game.players;
        return (
          <ListItem
            id={`${listId}_${game.index}`}
            index={index}
            value={game.index}
            paddingX="m"
            paddingY="s"
          >
            <Box flex="y" spacing="xs">
              {isMonthStart && !uniformHeight && (
                <Text size="s" weight="bold" color="#8a6d3b">
                  {MOIS[game.date.getMonth()]} {game.date.getFullYear()}
                </Text>
              )}
              <Box flex alignY="baseline" spacing="s">
                <Text weight="bold">#{game.index}</Text>
                <Text>{game.opponent}</Text>
                <Text size="s" color="#777">
                  {formatDay(game.date)}
                </Text>
                <Text size="s" color={game.score ? "#2a7" : "#a72"}>
                  {game.score || "à venir"}
                </Text>
              </Box>
              <Text size="s" color="#666">
                {players.join(" · ")}
              </Text>
            </Box>
          </ListItem>
        );
      };

      // Le fil complet: ce qui est chargé, et de quel index il commence. Les
      // deux changent ensemble — préfixer 50 parties déplace le début d'autant.
      const useGameFeed = ({ initialFrom, initialCount, latency }) => {
        const [range, setRange] = useState(() => ({
          from: initialFrom,
          games: Array.from({ length: initialCount }, (_, i) =>
            createGame(initialFrom + i),
          ),
        }));
        const loadBefore = async () => {
          const { from } = range;
          if (from === 0) {
            return;
          }
          const count = from < PAGE_SIZE ? from : PAGE_SIZE;
          const page = await fetchGames(from - count, count, latency);
          setRange((current) => ({
            from: current.from - count,
            games: [...page, ...current.games],
          }));
        };
        const loadAfter = async () => {
          const end = range.from + range.games.length;
          if (end >= TOTAL_COUNT) {
            return;
          }
          const remaining = TOTAL_COUNT - end;
          const count = remaining < PAGE_SIZE ? remaining : PAGE_SIZE;
          const page = await fetchGames(end, count, latency);
          setRange((current) => ({
            from: current.from,
            games: [...current.games, ...page],
          }));
        };
        return {
          from: range.from,
          games: range.games,
          placeholderCountStart: range.from,
          placeholderCountEnd: TOTAL_COUNT - (range.from + range.games.length),
          loadBefore,
          loadAfter,
        };
      };

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Fil de parties (scroll infini vers le haut)"
            previous={{
              href: "./0_address_autocomplete_demo.html",
              label: "Adresse avec autocomplete",
            }}
          />
          <div className="demo-section">
            <h2 style="margin: 0 0 4px">Sommaire</h2>
            <DocumentToc />
          </div>
          <NominalDemo />
          <PlaceholderDemo />
          <PrependDemo />
          <ThrottleDemo />
          <VariableHeightDemo />
          <ParentScrollerDemo />
        </Box>
      );

      const NominalDemo = () => {
        const [latency, setLatency] = useState(400);
        const feed = useGameFeed({
          initialFrom: FRONTIER_INDEX - 25,
          initialCount: 50,
          latency,
        });

        return (
          <Section id="nominal" title="Cas nominal">
            <Caption>
              4000 parties passées, 1000 à venir, 50 chargées. On ouvre sur la
              frontière et on remonte.
            </Caption>
            <Box flex="y" spacing="s" style="margin-top: 12px">
              <Box flex alignY="center" spacing="m">
                <label>
                  latence{" "}
                  <select
                    value={latency}
                    onChange={(e) => setLatency(Number(e.target.value))}
                  >
                    <option value="0">0 ms</option>
                    <option value="400">400 ms</option>
                    <option value="1500">1500 ms</option>
                  </select>
                </label>
                <Stat label="chargées" value={feed.games.length} />
                <Stat label="avant" value={feed.placeholderCountStart} />
                <Stat label="après" value={feed.placeholderCountEnd} />
                <Stat
                  label="en vol"
                  value={inFlightSignal.value}
                  busy={inFlightSignal.value > 0}
                />
                <Stat label="requêtes" value={requestCountSignal.value} />
              </Box>
              <List
                maxHeight="420px"
                borderWidth="1"
                separator
                initialScrollToItem={`nominal_${FRONTIER_INDEX}`}
                placeholderCountStart={feed.placeholderCountStart}
                placeholderCountEnd={feed.placeholderCountEnd}
                reachThreshold={8}
                onReachStart={feed.loadBefore}
                onReachEnd={feed.loadAfter}
              >
                {feed.games.map((game, index) => (
                  <GameItem
                    key={game.index}
                    listId="nominal"
                    game={game}
                    index={index}
                  />
                ))}
              </List>
            </Box>
          </Section>
        );
      };

      const PlaceholderDemo = () => {
        const games = FRONTIER_GAMES;

        return (
          <Section id="placeholders" title="Réserver la place">
            <Box flex="y" spacing="m" style="margin-top: 12px">
              <Box flex="y" spacing="xs">
                <Caption>50 parties chargées, rien de réservé</Caption>
                <List maxHeight="220px" borderWidth="1" separator>
                  {games.map((game, index) => (
                    <GameItem
                      key={game.index}
                      listId="reserve_none"
                      game={game}
                      index={index}
                      uniformHeight
                    />
                  ))}
                </List>
              </Box>
              <Box flex="y" spacing="xs">
                <Caption>
                  les mêmes 50, placeholderCountStart=3975 et
                  placeholderCountEnd=975
                </Caption>
                <List
                  maxHeight="220px"
                  borderWidth="1"
                  separator
                  placeholderCountStart={FRONTIER_INDEX - 25}
                  placeholderCountEnd={TOTAL_COUNT - (FRONTIER_INDEX + 25)}
                >
                  {games.map((game, index) => (
                    <GameItem
                      key={game.index}
                      listId="reserve_both"
                      game={game}
                      index={index}
                      uniformHeight
                    />
                  ))}
                </List>
              </Box>
            </Box>
          </Section>
        );
      };

      const PrependDemo = () => {
        const [range, setRange] = useState(() => ({
          from: 500,
          count: 120,
        }));
        const games = Array.from({ length: range.count }, (_, i) =>
          createGame(range.from + i),
        );

        return (
          <Section id="prepend" title="Insérer en tête">
            <Caption>
              La ligne rouge est fixe. Ce qui est dessous doit y rester.
            </Caption>
            <Box flex="y" spacing="s" style="margin-top: 12px">
              <Box flex spacing="s" alignY="center">
                <Button
                  onClick={() =>
                    setRange((current) => ({
                      from: current.from - 50,
                      count: current.count + 50,
                    }))
                  }
                >
                  50 parties au-dessus
                </Button>
                <Button
                  onClick={() =>
                    setRange((current) => ({
                      from: current.from,
                      count: current.count + 50,
                    }))
                  }
                >
                  50 parties en dessous
                </Button>
                <Stat label="chargées" value={games.length} />
                <Stat label="depuis" value={range.from} />
              </Box>
              <div className="anchored-list">
                <div className="ruler"></div>
                <List
                  maxHeight="320px"
                  borderWidth="1"
                  separator
                  renderBudget={40}
                  placeholderCountStart={range.from}
                >
                  {games.map((game, index) => (
                    <GameItem
                      key={game.index}
                      listId="prepend"
                      game={game}
                      index={index}
                    />
                  ))}
                </List>
              </div>
            </Box>
          </Section>
        );
      };

      const ThrottleDemo = () => {
        const [log, setLog] = useState([]);
        const feed = useGameFeed({
          initialFrom: TOTAL_COUNT - 60,
          initialCount: 60,
          latency: 1500,
        });
        const loadBefore = async () => {
          const at = feed.from;
          setLog((current) => [
            `demande ${at - PAGE_SIZE}…${at - 1}`,
            ...current,
          ]);
          await feed.loadBefore();
          setLog((current) => [`reçu ${at - PAGE_SIZE}…${at - 1}`, ...current]);
        };

        return (
          <Section id="throttle" title="Une requête à la fois">
            <Caption>Latence 1500 ms, seuil 12 lignes.</Caption>
            <Box flex="y" spacing="s" style="margin-top: 12px">
              <Box flex alignY="center" spacing="m">
                <Stat label="chargées" value={feed.games.length} />
                <Stat
                  label="en vol"
                  value={inFlightSignal.value}
                  busy={inFlightSignal.value > 0}
                />
              </Box>
              <Box flex spacing="m" alignY="start">
                <List
                  maxHeight="320px"
                  borderWidth="1"
                  separator
                  width="480px"
                  placeholderCountStart={feed.placeholderCountStart}
                  reachThreshold={12}
                  onReachStart={loadBefore}
                >
                  {feed.games.map((game, index) => (
                    <GameItem
                      key={game.index}
                      listId="throttle"
                      game={game}
                      index={index}
                      uniformHeight
                    />
                  ))}
                </List>
                <List maxHeight="320px" borderWidth="1" width="220px">
                  {log.map((line, index) => (
                    <ListItem
                      key={`${line}_${log.length - index}`}
                      id={`throttle_log_${log.length - index}`}
                      index={index}
                      paddingX="s"
                      paddingY="xs"
                    >
                      <Text size="s">{line}</Text>
                    </ListItem>
                  ))}
                </List>
              </Box>
            </Box>
          </Section>
        );
      };

      const VariableHeightDemo = () => {
        const games = TWO_THOUSAND_GAMES;
        const renderList = (listId, uniformHeight) => (
          <List maxHeight="300px" borderWidth="1" separator>
            {games.map((game, index) => (
              <GameItem
                key={game.index}
                listId={listId}
                game={game}
                index={index}
                uniformHeight={uniformHeight}
              />
            ))}
          </List>
        );

        return (
          <Section id="variable" title="Hauteurs variables">
            <Box flex="y" spacing="m" style="margin-top: 12px">
              <Box flex="y" spacing="xs">
                <Caption>2000 parties, toutes de la même hauteur</Caption>
                {renderList("uniform", true)}
              </Box>
              <Box flex="y" spacing="xs">
                <Caption>
                  2000 parties, de 1 à 6 joueurs et un en-tête de mois tous les
                  15 jours
                </Caption>
                {renderList("variable", false)}
              </Box>
            </Box>
          </Section>
        );
      };

      const ParentScrollerDemo = () => {
        const [latency] = useState(300);
        const feed = useGameFeed({
          initialFrom: FRONTIER_INDEX - 25,
          initialCount: 50,
          latency,
        });

        return (
          <Section id="scroller-parent" title='scroller="parent"'>
            <Caption>
              La liste ne scrolle pas: la page entre les deux barres scrolle, et
              la liste se virtualise dedans.
            </Caption>
            <Box flex="y" spacing="s" style="margin-top: 12px">
              <Box flex alignY="center" spacing="m">
                <Stat label="chargées" value={feed.games.length} />
                <Stat label="avant" value={feed.placeholderCountStart} />
                <Stat
                  label="en vol"
                  value={inFlightSignal.value}
                  busy={inFlightSignal.value > 0}
                />
              </Box>
              <div className="page-frame">
                <div className="page-frame-bar">mes parties</div>
                <div className="page-frame-scroll">
                  <p>
                    <Text size="s" color="#666">
                      Du contenu de page au-dessus de la liste.
                    </Text>
                  </p>
                  <List
                    scroller="parent"
                    separator
                    initialScrollToItem={`parent_${FRONTIER_INDEX}`}
                    placeholderCountStart={feed.placeholderCountStart}
                    placeholderCountEnd={feed.placeholderCountEnd}
                    reachThreshold="400px"
                    onReachStart={feed.loadBefore}
                    onReachEnd={feed.loadAfter}
                  >
                    {feed.games.map((game, index) => (
                      <GameItem
                        key={game.index}
                        listId="parent"
                        game={game}
                        index={index}
                      />
                    ))}
                  </List>
                  <p>
                    <Text size="s" color="#666">
                      Et du contenu de page en dessous.
                    </Text>
                  </p>
                </div>
                <div className="page-frame-bar">accueil · parties · profil</div>
              </div>
            </Box>
          </Section>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
