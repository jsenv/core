<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Messagerie (scroll infini vers le haut)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 720px;
        margin: 0 auto;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .stat-label {
        color: #888;
        font-size: 0.8rem;
        font-family: monospace;
      }
      .stat-value {
        color: #2b7a5b;
        font-size: 0.8rem;
        font-family: monospace;
      }
      .stat-value[data-busy] {
        color: #b5651d;
      }
      .bubble {
        max-width: 78%;
        padding: 8px 12px;
        border-radius: 14px;
      }
      .bubble[data-mine] {
        color: #fff;
        background: #3b6ef5;
      }
      .bubble:not([data-mine]) {
        color: #1a1a2e;
        background: #eceff4;
      }
      .bubble[data-loading] {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: #f2f4f7;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import {
        Box,
        Button,
        List,
        ListItem,
        SelectableInput,
        Text,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../../internal/demo_header.jsx";
      import { FakeBackend } from "../../../internal/fake_backend.jsx";

      // La conversation entière vit "sur le serveur"; le front n'en tient que
      // les pages qu'il a demandées.
      const MESSAGE_COUNT = 200;
      const PAGE_MAX = 50;
      const LAST_READ_INDEX = 96;

      const PHRASES = [
        "ok",
        "je te confirme demain matin",
        "on se retrouve devant la salle, comme la dernière fois",
        "j'ai relu le compte-rendu: il manque le point sur les licences, le reste me va. Tu veux que je le complète ou tu préfères le faire toi ?",
        "parfait",
        "attends je regarde",
        "c'est bon de mon côté, j'ai envoyé le mail hier soir et j'ai eu une réponse ce matin. Ils sont d'accord sur le principe, ils veulent juste décaler d'une semaine.",
        "merci !",
        "je te rappelle dans 10 min",
        "franchement bien joué pour hier, tout le monde en parle encore. On refait ça quand ?",
      ];

      const createMessage = (index) => ({
        index,
        mine: index % 3 === 0,
        text: PHRASES[index % PHRASES.length],
        time: `${9 + Math.floor(index / 8)}h${String((index * 7) % 60).padStart(2, "0")}`,
      });

      // Ce que le serveur répond à un intervalle: jamais plus de PAGE_MAX
      // lignes, en disant où ça tombe et combien il y en a en tout. Un début
      // négatif compte depuis la fin (Range: items=-30).
      const readPage = ({ start, end }) => {
        let from = start < 0 ? MESSAGE_COUNT + start : start;
        let to = end < 0 ? MESSAGE_COUNT + end : end;
        if (from < 0) {
          from = 0;
        }
        if (to > MESSAGE_COUNT - 1) {
          to = MESSAGE_COUNT - 1;
        }
        if (to - from + 1 > PAGE_MAX) {
          // On rend la fin de l'intervalle demandé: c'est de là qu'on remonte.
          from = to - PAGE_MAX + 1;
        }
        const items = [];
        let index = from;
        while (index <= to) {
          items.push(createMessage(index));
          index++;
        }
        return { items, start: from, count: MESSAGE_COUNT };
      };

      const MessageItem = ({ message }) => (
        <ListItem paddingX="m" paddingY="xs">
          <Box flex="y" alignX={message.mine ? "end" : "start"} expandX>
            <div className="bubble" data-mine={message.mine ? "" : undefined}>
              <Text>{message.text}</Text>
            </div>
            <Text size="xs" color="#999">
              #{message.index} · {message.time}
            </Text>
          </Box>
        </ListItem>
      );

      // Une bulle qui n'est pas encore arrivée: même place, même côté, même
      // gabarit — seul le texte manque. C'est cette hauteur-là que la liste
      // réserve pour les 200 messages avant d'en avoir vu un seul.
      const MessageSkeleton = ({ index }) => (
        <ListItem skeleton paddingX="m" paddingY="xs">
          <Box flex="y" alignX={index % 3 === 0 ? "end" : "start"} expandX>
            <div className="bubble" data-loading="">
              <Text loading width={`${90 + ((index * 37) % 180)}px`}>
                {"\u00a0"}
              </Text>
              {index % 4 === 0 && (
                <Text loading width={`${60 + ((index * 23) % 120)}px`}>
                  {"\u00a0"}
                </Text>
              )}
            </div>
            <Text size="xs" color="#999">
              {"\u00a0"}
            </Text>
          </Box>
        </ListItem>
      );

      // Le vrai réseau: un délai qu'on subit, sans personne pour répondre à la
      // place du serveur.
      const LATENCY = 500;
      const fetchPage = (range) =>
        new Promise((resolve) => {
          setTimeout(() => resolve(readPage(range)), LATENCY);
        });

      const Thread = ({ startAt, itemsAction }) => (
        <List
          maxHeight="220px"
          expandX
          renderBudget={30}
          startAt={startAt}
          renderSkeleton={(index) => <MessageSkeleton index={index} />}
        >
          <List.Items
            count={MESSAGE_COUNT}
            itemsAction={itemsAction}
            getItemId={(message) => `message_${message.index}`}
            renderItem={(message) => <MessageItem message={message} />}
          />
        </List>
      );

      const Section = ({ title, caption, children }) => {
        const [key, setKey] = useState(0);
        return (
          <div className="demo-section">
            <h2>{title}</h2>
            <Box flex="y" spacing="m" style="margin-top: 8px">
              <Box flex alignY="center" spacing="m">
                <Text size="s" color="#555">
                  {caption}
                </Text>
                <Button onClick={() => setKey(key + 1)}>recharger</Button>
              </Box>
              {children(key)}
            </Box>
          </div>
        );
      };

      // Les parties de padel: des lignes qu'on choisit, pas qu'on lit. La
      // sélection est décrite par itemProps, donc la liste la connaît aussi
      // pour les lignes qu'elle ne rend pas.
      const COURTS = ["Court 1", "Court 2", "Court couvert", "Court extérieur"];
      const NIVEAUX = ["P25", "P50", "P100", "P250"];
      const GAME_COUNT = 3000;
      const createGame = (index) => ({
        index,
        court: COURTS[index % COURTS.length],
        level: NIVEAUX[index % NIVEAUX.length],
        players: 1 + (index % 4),
        day: `${1 + (index % 28)}/0${1 + (index % 9)}`,
        hour: `${8 + (index % 12)}h${index % 2 ? "30" : "00"}`,
      });
      const readGamePage = ({ start, end }) => {
        let from = start < 0 ? GAME_COUNT + start : start;
        let to = end < 0 ? GAME_COUNT + end : end;
        if (from < 0) {
          from = 0;
        }
        if (to > GAME_COUNT - 1) {
          to = GAME_COUNT - 1;
        }
        const items = [];
        let index = from;
        while (index <= to) {
          items.push(createGame(index));
          index++;
        }
        return { items, start: from, count: GAME_COUNT };
      };

      const GameItem = ({ game }) => (
        <List.Item flex alignY="center" spacing="s" paddingX="m" paddingY="s">
          <SelectableInput />
          <Text weight="bold">{game.level}</Text>
          <Text>{game.court}</Text>
          <Text size="s" color="#777">
            {game.day} · {game.hour}
          </Text>
          <Text size="s" color={game.players === 4 ? "#a72" : "#2a7"}>
            {game.players}/4 joueurs
          </Text>
        </List.Item>
      );
      const GameSkeleton = () => (
        <List.Item
          skeleton
          flex
          alignY="center"
          spacing="s"
          paddingX="m"
          paddingY="s"
        >
          <Text loading width="60px">
            {"\u00a0"}
          </Text>
          <Text loading width="180px">
            {"\u00a0"}
          </Text>
        </List.Item>
      );

      const GameList = () => {
        const [selected, setSelected] = useState(null);
        return (
          <Box flex="y" spacing="s">
            <List
              selectable
              maxHeight="260px"
              expandX
              renderBudget={30}
              separator
              action={(value) => setSelected(value)}
              renderSkeleton={() => <GameSkeleton />}
            >
              <List.Items
                count={GAME_COUNT}
                itemsAction={(range) =>
                  new Promise((resolve) => {
                    setTimeout(() => resolve(readGamePage(range)), LATENCY);
                  })
                }
                getItemId={(game) => `game_${game.index}`}
                itemProps={(game) => ({
                  selectable: true,
                  value: game.index,
                  selected: selected === game.index,
                })}
                renderItem={(game) => <GameItem game={game} />}
              />
            </List>
            <Text size="s" color="#555">
              partie choisie: {selected === null ? "aucune" : `#${selected}`}
            </Text>
          </Box>
        );
      };

      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader
            title="Listes infinies"
            previous={{
              href: "./0_address_autocomplete_demo.html",
              label: "Adresse avec autocomplete",
            }}
          />
          <Section
            title="On arrive sur le dernier message"
            caption='startAt="end"'
          >
            {(key) => (
              <Thread key={key} startAt="end" itemsAction={fetchPage} />
            )}
          </Section>
          <Section
            title="On reprend là où on s'était arrêté"
            caption={`startAt={${LAST_READ_INDEX}}`}
          >
            {(key) => (
              <Thread
                key={key}
                startAt={LAST_READ_INDEX}
                itemsAction={fetchPage}
              />
            )}
          </Section>
          <Section
            title="Une partie à rejoindre"
            caption="3000 parties, une seule à choisir"
          >
            {(key) => <GameList key={key} />}
          </Section>
          <Section
            title="Chaque page, à la main"
            caption="répondre ou échouer, pour voir ce que la liste fait de la réponse"
          >
            {(key) => (
              <FakeBackend value={`${MESSAGE_COUNT} messages`}>
                {({ action }) => (
                  <Thread
                    key={key}
                    startAt="end"
                    itemsAction={async (range) => {
                      await action(range);
                      return readPage(range);
                    }}
                  />
                )}
              </FakeBackend>
            )}
          </Section>
        </Box>
      );

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
