<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Messagerie (scroll infini vers le haut)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 720px;
        margin: 0 auto;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .stat-label {
        color: #888;
        font-size: 0.8rem;
        font-family: monospace;
      }
      .stat-value {
        color: #2b7a5b;
        font-size: 0.8rem;
        font-family: monospace;
      }
      .stat-value[data-busy] {
        color: #b5651d;
      }
      .bubble {
        max-width: 78%;
        padding: 8px 12px;
        border-radius: 14px;
      }
      .bubble[data-mine] {
        color: #fff;
        background: #3b6ef5;
      }
      .bubble:not([data-mine]) {
        color: #1a1a2e;
        background: #eceff4;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { signal } from "@preact/signals";
      import { Box, Button, List, ListItem, Text } from "@jsenv/navi";
      import { DemoHeader } from "../../../internal/demo_header.jsx";

      // La conversation entière vit "sur le serveur"; le front n'en tient que
      // les pages qu'il a demandées.
      const MESSAGE_COUNT = 200;
      const PAGE_MAX = 25;

      const PHRASES = [
        "ok",
        "je te confirme demain matin",
        "on se retrouve devant la salle, comme la dernière fois",
        "j'ai relu le compte-rendu: il manque le point sur les licences, le reste me va. Tu veux que je le complète ou tu préfères le faire toi ?",
        "parfait",
        "attends je regarde",
        "c'est bon de mon côté, j'ai envoyé le mail hier soir et j'ai eu une réponse ce matin. Ils sont d'accord sur le principe, ils veulent juste décaler d'une semaine.",
        "merci !",
        "je te rappelle dans 10 min",
        "franchement bien joué pour hier, tout le monde en parle encore. On refait ça quand ?",
      ];

      const createMessage = (index) => ({
        index,
        mine: index % 3 === 0,
        text: PHRASES[index % PHRASES.length],
        time: `${9 + Math.floor(index / 8)}h${String((index * 7) % 60).padStart(2, "0")}`,
      });

      const inFlightSignal = signal(0);
      const requestLogSignal = signal([]);
      // Le backend: on lui demande un intervalle, il répond ce qu'il a — jamais
      // plus de PAGE_MAX lignes — en disant où ça tombe et combien il y en a en
      // tout. Un début négatif compte depuis la fin (Range: items=-25).
      const fetchMessages = ({ start, end }, latency) => {
        let from = start < 0 ? MESSAGE_COUNT + start : start;
        let to = end < 0 ? MESSAGE_COUNT + end : end;
        if (from < 0) {
          from = 0;
        }
        if (to > MESSAGE_COUNT - 1) {
          to = MESSAGE_COUNT - 1;
        }
        if (to - from + 1 > PAGE_MAX) {
          // On rend la fin de l'intervalle demandé: c'est de là qu'on remonte.
          from = to - PAGE_MAX + 1;
        }
        inFlightSignal.value++;
        requestLogSignal.value = [
          `${start}…${end} → ${from}…${to}`,
          ...requestLogSignal.value,
        ].slice(0, 6);
        return new Promise((resolve) => {
          setTimeout(() => {
            inFlightSignal.value--;
            const items = [];
            let index = from;
            while (index <= to) {
              items.push(createMessage(index));
              index++;
            }
            resolve({ items, start: from, count: MESSAGE_COUNT });
          }, latency);
        });
      };

      const Stat = ({ label, value, busy }) => (
        <span>
          <span className="stat-label">{label} </span>
          <span className="stat-value" data-busy={busy ? "" : undefined}>
            {value}
          </span>
        </span>
      );

      const MessageItem = ({ message }) => (
        <ListItem paddingX="m" paddingY="xs">
          <Box flex="y" alignX={message.mine ? "end" : "start"} expandX>
            <div className="bubble" data-mine={message.mine ? "" : undefined}>
              <Text>{message.text}</Text>
            </div>
            <Text size="xs" color="#999">
              #{message.index} · {message.time}
            </Text>
          </Box>
        </ListItem>
      );

      // Une bulle qui n'est pas encore arrivée: même place, même côté, même
      // allure — seul le texte manque.
      const MessageSkeleton = ({ index }) => (
        <ListItem skeleton paddingX="m" paddingY="xs">
          <Box flex="y" alignX={index % 3 === 0 ? "end" : "start"} expandX>
            <Text loading width={`${40 + ((index * 13) % 45)}%`}>
              {"\u00a0"}
            </Text>
          </Box>
        </ListItem>
      );

      const Thread = ({ latency }) => (
        <List maxHeight="220px" borderWidth="1" startAt="end" renderBudget={30}>
          <List.Items
            itemsAction={(range) => fetchMessages(range, latency)}
            getItemId={(message) => `message_${message.index}`}
            renderItem={(message) => <MessageItem message={message} />}
            renderSkeleton={(index) => <MessageSkeleton index={index} />}
          />
        </List>
      );

      const RequestLog = () => (
        <Box flex="y" spacing="xs">
          {requestLogSignal.value.map((line, index) => (
            <Text key={`${line}_${index}`} size="xs" color="#777">
              {line}
            </Text>
          ))}
        </Box>
      );

      const App = () => {
        const [latency, setLatency] = useState(600);
        const [threadKey, setThreadKey] = useState(0);

        return (
          <Box flex="y" spacing="l">
            <DemoHeader
              title="Messagerie (scroll infini vers le haut)"
              previous={{
                href: "./0_address_autocomplete_demo.html",
                label: "Adresse avec autocomplete",
              }}
            />
            <div className="demo-section">
              <h2>Cas nominal</h2>
              <Box flex="y" spacing="m" style="margin-top: 12px">
                <Box flex alignY="center" spacing="m">
                  <label>
                    <span className="stat-label">latence </span>
                    <select
                      value={latency}
                      onChange={(e) => setLatency(Number(e.target.value))}
                    >
                      <option value="0">0 ms</option>
                      <option value="600">600 ms</option>
                      <option value="2000">2000 ms</option>
                    </select>
                  </label>
                  <Stat label="total" value={MESSAGE_COUNT} />
                  <Stat
                    label="en vol"
                    value={inFlightSignal.value}
                    busy={inFlightSignal.value > 0}
                  />
                  <Button onClick={() => setThreadKey(threadKey + 1)}>
                    recharger
                  </Button>
                </Box>
                <Thread key={threadKey} latency={latency} />
                <RequestLog />
              </Box>
            </div>
          </Box>
        );
      };

      render(<App />, document.getElementById("app"));
    </script>
  </body>
</html>
