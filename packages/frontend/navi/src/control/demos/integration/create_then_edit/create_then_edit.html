<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Créer puis modifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 40px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #container {
        max-width: 820px;
        margin: 0 auto;
      }
      .demo-section {
        margin-bottom: 24px;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .caption {
        margin: 0 0 16px;
        color: #555;
        font-size: 13px;
      }
      .phone {
        display: flex;
        width: 380px;
        height: 520px;
        flex: none;
        flex-direction: column;
        background: white;
        border: 1px solid #ccc;
        border-radius: 12px;
        overflow: hidden;
      }
      .travel_box {
        min-height: 0;
        flex: 1;
      }
      .page {
        display: flex;
        box-sizing: border-box;
        height: 100%;
        padding: 20px;
        flex-direction: column;
        gap: 16px;
        background: white;
        overflow: auto;
      }
      .page_title {
        margin: 0;
        font-size: 1.05rem;
      }
      .game_list {
        display: flex;
        padding: 4px 0;
        flex-direction: column;
        gap: 2px;
        border-top: 1px solid #eceff1;
        border-bottom: 1px solid #eceff1;
      }
      .game_card {
        margin: 0;
        padding: 12px 14px;
        color: #37474f;
        font-size: 14px;
        line-height: 1.6;
        background: #eceff1;
        border-radius: 8px;
      }
      /* Le backend, à côté de l'écran: ce qu'il tient, et les appels en vol. */
    </style>
  </head>
  <body>
    <div id="container">
      <div id="app"></div>
    </div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useEffect, useState } from "preact/hooks";
      import {
        Box,
        Button,
        Field,
        Form,
        Input,
        Label,
        Link,
        Loading,
        Route,
        RouteTravel,
        Select,
        resource,
        route,
        routeAction,
        setupRoutes,
        stateSignal,
        useAsyncData,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../../../internal/demo_header.jsx";
      import {
        FakeBackend,
        createFakeBackend,
      } from "../../../../internal/fake_backend.jsx";

      // ── Le backend ────────────────────────────────────────────────────────
      // Créé ici, hors de l'arbre: les appels partent des callbacks REST de la
      // ressource, qui ne sont pas dans un composant. Chaque appel attend qu'on
      // lui réponde (ou que le mode réponde pour nous), pour que l'écran en
      // chargement et l'écran en erreur restent à l'écran aussi longtemps qu'on
      // veut.
      const backend = createFakeBackend({
        value: [
          { id: "1", name: "Padel du mardi", level: "confirme", players: 4 },
        ],
        persist: "navi_demo_create_then_edit",
      });
      const games = () => backend.valueSignal.value;
      const findGame = (id) => games().find((game) => game.id === id);
      // Lu dans les données plutôt que compté ici: elles reviennent d'une visite
      // précédente, où le compteur ne les a pas vues naître.
      const nextGameId = () => {
        let biggest = 0;
        for (const game of games()) {
          const id = Number(game.id);
          if (id > biggest) {
            biggest = id;
          }
        }
        return String(biggest + 1);
      };
      const writeGame = (game) => {
        const rest = games().filter((candidate) => candidate.id !== game.id);
        backend.setValue([...rest, game]);
        return game;
      };
      const api = {
        read: (id) =>
          backend.call(`GET /games/${id}`, () => {
            const game = findGame(id);
            if (!game) {
              throw new Error(`Aucune partie "${id}"`);
            }
            return game;
          }),
        readMany: () => backend.call("GET /games", () => games()),
        create: (values) =>
          backend.call("POST /games", () =>
            writeGame({ id: nextGameId(), ...values }),
          ),
        update: (id, values) =>
          backend.call(`PUT /games/${id}`, () =>
            writeGame({ ...findGame(id), ...values }),
          ),
      };

      // ── Un signal par champ, partagé par les deux modes ────────────────────
      const nameSignal = stateSignal("", { id: "name" });
      const levelSignal = stateSignal("debutant", {
        id: "level",
        oneOf: ["debutant", "confirme"],
      });
      const playersSignal = stateSignal(4, {
        id: "players",
        type: "number",
        min: 2,
        max: 8,
      });

      // ── Les routes ────────────────────────────────────────────────────────
      const HOME_ROUTE = route("/");
      // Les champs de la création sont dans l'url: un brouillon se recharge et
      // se partage. Ceux de la modification n'y sont pas — ils appartiennent à
      // la partie, pas à la position.
      const NEW_GAME_ROUTE = route("/games/new", {
        searchParams: {
          name: nameSignal,
          level: levelSignal,
          players: playersSignal,
        },
      });
      const GAME_ROUTE = route("/games/:gameId");
      const EDIT_GAME_ROUTE = route("/games/:gameId/edit");
      setupRoutes([HOME_ROUTE, NEW_GAME_ROUTE, GAME_ROUTE, EDIT_GAME_ROUTE]);

      // ── La ressource ──────────────────────────────────────────────────────
      // Chaque callback rend ce que le store doit garder. C'est ce qui fait
      // qu'un PUT met à jour la page de la partie sans que personne ne
      // recharge, et qu'un POST fait réapparaître la liste avec la nouvelle.
      const GAME = resource("game", {
        GET: ({ id }) => api.read(id),
        GET_MANY: () => api.readMany(),
        POST: (values) => api.create(values),
        PUT: ({ id, ...values }) => api.update(id, values),
      });

      // Une action ne part pas toute seule quand on la lit: c'est la route qui
      // la déclenche. La liste se charge en arrivant sur l'accueil — et se
      // recharge d'elle-même après un POST, sans que personne le demande.
      const GAMES_OF_HOME = routeAction(HOME_ROUTE, GAME.GET_MANY, () => true);

      // ── La partie que l'url désigne, chargée pour les deux pages ──────────
      const GAME_OF_ROUTE = routeAction(
        [GAME_ROUTE, EDIT_GAME_ROUTE],
        GAME.GET,
        () => {
          // "/games/new" est aussi une url de ":gameId": plusieurs routes
          // matchent à la fois, et c'est à la plus précise de le dire.
          if (NEW_GAME_ROUTE.matchingSignal.value) {
            return null;
          }
          const gameId =
            GAME_ROUTE.paramsSignal.value.gameId ||
            EDIT_GAME_ROUTE.paramsSignal.value.gameId;
          return gameId ? { id: gameId } : null;
        },
      );

      // ── Le formulaire, un seul pour les deux modes ────────────────────────
      const GameFormFields = () => (
        <Box flex="y" spacing="m">
          <Field vertical>
            <Label>Nom</Label>
            <Input name="name" signal={nameSignal} required />
          </Field>
          <Field vertical>
            <Label>Niveau</Label>
            <Select name="level" signal={levelSignal}>
              <option value="debutant">Débutant</option>
              <option value="confirme">Confirmé</option>
            </Select>
          </Field>
          <Field vertical>
            <Label>Joueurs</Label>
            <Input name="players" type="number" signal={playersSignal} />
          </Field>
        </Box>
      );

      const LoadFailed = ({ title, error, action }) => (
        <div className="page">
          <h2 className="page_title">{title}</h2>
          <p className="game_card">{error.message}</p>
          <Button action={() => action.rerun()}>Réessayer</Button>
        </div>
      );

      const NewGamePage = () => (
        <div className="page">
          <h2 className="page_title">Créer une partie</h2>
          <Form
            action={async (values) => {
              const game = await GAME.POST.bindParams(values).rerun();
              // La destination n'existait pas avant la réponse: c'est l'action
              // qui l'a apprise, c'est elle qui y va.
              GAME_ROUTE.navTo({ gameId: game.id });
            }}
          >
            <Box flex="y" spacing="m">
              <GameFormFields />
              <Button type="submit" cta>
                Créer
              </Button>
            </Box>
          </Form>
          <Link route={HOME_ROUTE}>Annuler</Link>
        </div>
      );

      const GamePage = () => {
        const [game, loading, error] = useAsyncData(GAME_OF_ROUTE, {
          loading: true,
          error: true,
        });

        if (error) {
          return (
            <LoadFailed title="Partie" error={error} action={GAME_OF_ROUTE} />
          );
        }
        if (loading && !game) {
          return (
            <div className="page">
              <h2 className="page_title">Partie</h2>
              <p className="game_card">Chargement…</p>
            </div>
          );
        }
        return (
          <div className="page">
            <h2 className="page_title">{game.name}</h2>
            <p className="game_card">
              Niveau: {game.level}
              <br />
              Joueurs: {game.players}
            </p>
            <Link route={EDIT_GAME_ROUTE} routeParams={{ gameId: game.id }}>
              Modifier
            </Link>
            <Link route={HOME_ROUTE}>Toutes les parties</Link>
          </div>
        );
      };

      const EditGamePage = () => {
        const [game, loading, error] = useAsyncData(GAME_OF_ROUTE, {
          loading: true,
          error: true,
        });
        // Les champs sont remplis par ce qui arrive, une requête après
        // l'ouverture de l'écran. `filled` dit quand: avant, il n'y a rien à
        // comparer; après, ce que les champs portent est la référence.
        const [filled, setFilled] = useState(false);
        useEffect(() => {
          if (!game) {
            return;
          }
          nameSignal.value = game.name;
          levelSignal.value = game.level;
          playersSignal.value = game.players;
          setFilled(true);
        }, [game]);

        if (error) {
          return (
            <LoadFailed title="Modifier" error={error} action={GAME_OF_ROUTE} />
          );
        }
        if (loading && !game) {
          return (
            <div className="page">
              <h2 className="page_title">Modifier</h2>
              <p className="game_card">Chargement…</p>
            </div>
          );
        }
        return (
          <div className="page">
            <h2 className="page_title">Modifier {game.name}</h2>
            <Form
              pristineKey={filled ? game.id : undefined}
              command={`--navi-nav-to:${GAME_ROUTE.buildUrl({ gameId: game.id })}`}
              action={(values) =>
                GAME.PUT.bindParams({ id: game.id, ...values }).rerun()
              }
            >
              <Box flex="y" spacing="m">
                <GameFormFields />
                <Button type="submit" cta>
                  Enregistrer
                </Button>
              </Box>
            </Form>
            <Link route={GAME_ROUTE} routeParams={{ gameId: game.id }}>
              Annuler
            </Link>
          </div>
        );
      };

      const HomePage = () => {
        const [games, loading, error] = useAsyncData(GAMES_OF_HOME, {
          loading: true,
          error: true,
        });
        if (error) {
          return (
            <LoadFailed title="Parties" error={error} action={GAMES_OF_HOME} />
          );
        }
        if (loading && !games) {
          return (
            <div className="page">
              <h2 className="page_title">Parties</h2>
              <p className="game_card">Chargement…</p>
            </div>
          );
        }
        return (
          <div className="page">
            <h2 className="page_title">Parties</h2>
            <div className="game_list">
              {games.map((game) => (
                <Link
                  key={game.id}
                  route={GAME_ROUTE}
                  routeParams={{ gameId: game.id }}
                >
                  {game.name}
                </Link>
              ))}
            </div>
            <Button cta command={`--navi-nav-to:${NEW_GAME_ROUTE.buildUrl()}`}>
              Créer une partie
            </Button>
          </div>
        );
      };

      // La partie et sa modification voyagent entre elles, sur leur propre axe:
      // la modification est au-dessus, donc elle descend sur la partie et
      // s'enregistrer la fait remonter. C'est la même partie vue de deux façons,
      // donc rien d'autre à l'écran ne se déplace.
      const GameArea = () => (
        <RouteTravel axis="y" routes={[EDIT_GAME_ROUTE, GAME_ROUTE]}>
          <Route>
            <Route route={EDIT_GAME_ROUTE} element={EditGamePage} />
            <Route route={GAME_ROUTE} element={GamePage} />
          </Route>
        </RouteTravel>
      );

      // Deux ordres, et ils ne disent pas la même chose:
      // - les enfants sont écrits du plus précis au plus large, parce que la
      //   première branche qui matche l'emporte (et "/" matche partout);
      // - `routes` donne l'ordre du voyage: la création est à gauche de la
      //   partie, donc arriver sur ce qu'on vient de créer va vers la droite.
      //   L'accueil n'y est pas: ouvrir la création depuis la liste n'est pas un
      //   déplacement le long d'une rangée, et ne s'anime donc pas.
      const App = () => (
        <Box flex="y" spacing="l">
          <DemoHeader title="Créer puis modifier" />
          <div className="demo-section">
            <p className="caption">
              Créer une partie, arriver sur la partie créée, la modifier.
            </p>
            <FakeBackend backend={backend}>
              {() => (
                <Loading>
                  <div className="phone">
                    <RouteTravel
                      className="travel_box"
                      routes={[NEW_GAME_ROUTE, GAME_ROUTE]}
                    >
                      <Route>
                        <Route route={NEW_GAME_ROUTE} element={NewGamePage} />
                        {/* La même zone pour les deux: une partie et sa
                            modification sont un seul endroit de cette rangée,
                            et ce qui les sépare se joue dans la zone. */}
                        <Route route={EDIT_GAME_ROUTE} element={GameArea} />
                        <Route route={GAME_ROUTE} element={GameArea} />
                        <Route route={HOME_ROUTE} element={HomePage} />
                      </Route>
                    </RouteTravel>
                  </div>
                </Loading>
              )}
            </FakeBackend>
          </div>
        </Box>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
