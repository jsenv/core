<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>RouteTravel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .phone {
        display: flex;
        width: 100%;
        max-width: 540px;
        height: 100dvh;
        flex-direction: column;
      }
      .top_bar {
        flex: none;
        background: white;
        border-bottom: 1px solid #ddd;
      }
      .travel_box {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
      }
      .page {
        min-height: 0;
        padding: 12px;
        flex: 1;
        overflow-y: auto;
      }
      .page_row {
        margin-bottom: 8px;
        padding: 14px 12px;
        border-radius: 8px;
      }
      .photo {
        display: flex;
        height: 180px;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useLayoutEffect } from "preact/hooks";
      import {
        Link,
        Nav,
        Route,
        RouteTravel,
        Slide,
        SlideContainer,
        createAction,
        route,
        routeAction,
        setupRoutes,
        useAsyncData,
      } from "@jsenv/navi";

      const A_ROUTE = route("/a");
      const B_ROUTE = route("/b");
      const C_ROUTE = route("/c");
      const TABS = [
        { route: A_ROUTE, label: "A", color: "#e8f0fe" },
        { route: B_ROUTE, label: "B", color: "#fdf0e8" },
        { route: C_ROUTE, label: "C", color: "#eaf7ec" },
      ];
      setupRoutes(TABS.map(({ route }) => route));

      // Each tab reads something bound to its route, the way a real page does.
      const readRows = (label) =>
        createAction(async () => {
          await new Promise((resolve) => setTimeout(resolve, 400));
          return Array.from({ length: 40 }, (_, i) => `${label} ${i}`);
        });
      const ACTIONS = {
        A: routeAction(A_ROUTE, readRows("A"), () => true),
        B: routeAction(B_ROUTE, readRows("B"), () => true),
        C: routeAction(C_ROUTE, readRows("C"), () => true),
      };

      const Page = ({ label, color, photos }) => {
        const [rows, loading] = useAsyncData(ACTIONS[label], { loading: true });
        return (
          <div className="page" data-page={label}>
            {photos && (
              <SlideContainer>
                {["#7c3aed", "#0891b2", "#db2777"].map((background, index) => (
                  <Slide key={background} id={`photo_${index}`}>
                    <div className="photo" style={{ background }}>
                      {index}
                    </div>
                  </Slide>
                ))}
              </SlideContainer>
            )}
            {loading || !rows ? (
              <div className="page_row" style={{ background: color }}>
                {label}…
              </div>
            ) : (
              rows.map((row) => (
                <div
                  key={row}
                  className="page_row"
                  style={{ background: color }}
                >
                  {row}
                </div>
              ))
            )}
          </div>
        );
      };

      const OpenFirst = () => {
        useLayoutEffect(() => {
          A_ROUTE.redirectTo();
        }, []);
        return null;
      };

      render(
        <div className="phone">
          <div className="top_bar">
            <Nav expand currentIndicator>
              {TABS.map(({ route, label }) => (
                <Link
                  key={label}
                  variant="tab"
                  route={route}
                  replace
                  padding="m"
                  textAlign="center"
                >
                  {label}
                </Link>
              ))}
            </Nav>
          </div>
          <RouteTravel className="travel_box">
            <Route>
              {TABS.map(({ route, label, color }) => (
                <Route
                  key={label}
                  route={route}
                  element={Page}
                  elementProps={{ label, color, photos: label === "B" }}
                />
              ))}
              <Route fallback element={OpenFirst} />
            </Route>
          </RouteTravel>
        </div>,
        document.querySelector("#app"),
      );
    </script>
  </body>
</html>
