<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>defineRouteTransition Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100dvh;
        flex-direction: column;
      }
      .furniture {
        padding-bottom: 8px;
        flex: none;
        background: white;
        border-bottom: 1px solid #ddd;
      }
      .furniture_row {
        display: flex;
        padding: 0 16px;
        align-items: center;
        gap: 24px;
      }
      .steps_declaration {
        margin: 0;
        color: #555;
        font-size: 12px;
      }
      .tab_bar {
        flex: none;
        background: white;
        border-top: 1px solid #ddd;
      }
      .tab_row {
        width: 100%;
      }
      .app {
        position: relative;
        min-height: 0;
        flex: 1;
      }
      .page {
        position: absolute;
        inset: 0;
        padding: 16px;
        overflow-y: auto;
      }
      .page_title {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .card {
        display: block;
        margin-bottom: 8px;
        padding: 14px 12px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      .page_top_bar {
        display: flex;
        margin: -16px -16px 12px;
        padding: 10px 12px;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.7);
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .page_top_bar button {
        padding: 4px 10px;
        font-size: 1rem;
        cursor: pointer;
      }
      .page_top_bar strong {
        font-size: 1.1rem;
      }
      .page_row {
        margin-bottom: 8px;
        padding: 14px 12px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 8px;
      }

      /* Le type "spin" est à la page, pas à navi : les deux attributs sont sur
         la racine pendant la transition, et ce CSS définit le mouvement — sur
         les images de la zone, puisque cette page en marque une. Un type nommé
         reçoit de navi de quoi ressembler à un mouvement (images à leur taille,
         pages opaques, animation tenue) : ce qui reste à écrire, ce sont les
         deux animation-name. */
      :root[data-navi-route-transition-type="spin"] {
        &::view-transition-old(navi-route-transition),
        &::view-transition-new(navi-route-transition) {
          /* Un seul des deux côtés tourne, l'autre garde le fondu du
             navigateur — et un fondu, ce sont deux images à demi transparentes
             qui doivent S'AJOUTER plutôt que se recouvrir, sinon le fond se
             voit au milieu du mouvement. Un mouvement où les deux pages
             bougent garde l'opacité que navi pose. */
          mix-blend-mode: plus-lighter;
        }
      }
      :root[data-navi-route-transition-type="spin"][data-navi-route-transition="forward"] {
        &::view-transition-new(navi-route-transition) {
          animation-name: demo-spin-in;
        }
      }
      :root[data-navi-route-transition-type="spin"][data-navi-route-transition="back"] {
        &::view-transition-old(navi-route-transition) {
          animation-name: demo-spin-out;
        }
      }
      @keyframes demo-spin-in {
        from {
          opacity: 0;
          scale: 0.9;
          rotate: 6deg;
        }
      }
      @keyframes demo-spin-out {
        to {
          opacity: 0;
          scale: 0.9;
          rotate: 6deg;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useLayoutEffect, useState } from "preact/hooks";
      import {
        Link,
        Nav,
        Route,
        RouteTransitionArea,
        defineRouteTransition,
        route,
        setupRoutes,
      } from "@jsenv/navi";
      import { DemoHeader } from "../../../internal/demo_header.jsx";

      const PARTIES_ROUTE = route("/parties");
      const RADARS_ROUTE = route("/radars");
      const GAME_ROUTE = route("/games/:gameId");
      const PROFIL_ROUTE = route("/profil");
      const BADGES_ROUTE = route("/badges");
      const STATS_ROUTE = route("/stats");
      const REGLAGES_ROUTE = route("/reglages");
      setupRoutes([
        PARTIES_ROUTE,
        RADARS_ROUTE,
        GAME_ROUTE,
        PROFIL_ROUTE,
        BADGES_ROUTE,
        STATS_ROUTE,
        REGLAGES_ROUTE,
      ]);

      // A game is a page one goes INTO, wherever one opens it from — and the
      // two tabs of the bottom bar are side by side: no relation says anything
      // about "parties" and "radars", so nothing plays between them.
      defineRouteTransition(PARTIES_ROUTE, GAME_ROUTE, "slide-x");
      defineRouteTransition(RADARS_ROUTE, GAME_ROUTE, "slide-x");
      defineRouteTransition(PARTIES_ROUTE, REGLAGES_ROUTE, "slide-y");
      defineRouteTransition(RADARS_ROUTE, REGLAGES_ROUTE, "slide-y");
      defineRouteTransition(PROFIL_ROUTE, REGLAGES_ROUTE, "cover-bottom");
      // Pas de type : le cross-fade du navigateur.
      defineRouteTransition(PARTIES_ROUTE, PROFIL_ROUTE);
      defineRouteTransition(RADARS_ROUTE, PROFIL_ROUTE);
      // "zoom" est fourni par navi.
      defineRouteTransition(PROFIL_ROUTE, BADGES_ROUTE, "zoom");
      // Un type à soi, défini dans le CSS de cette page.
      defineRouteTransition(PROFIL_ROUTE, STATS_ROUTE, "spin");

      const GoBackButton = () => (
        <button onClick={() => window.history.back()}>←</button>
      );

      const PartiesPage = () => (
        <div className="page" style={{ background: "#e8f0fe" }}>
          <h1 className="page_title">Mes parties</h1>
          {[1, 2, 3].map((gameId) => (
            <Link
              key={gameId}
              className="card"
              route={GAME_ROUTE}
              routeParams={{ gameId }}
            >
              Partie {gameId}
            </Link>
          ))}
          {Array.from({ length: 8 }, (_, index) => (
            <div key={index} className="page_row">
              Partie archivée — {index + 1}
            </div>
          ))}
        </div>
      );

      const RadarsPage = () => (
        <div className="page" style={{ background: "#eaf7ec" }}>
          <h1 className="page_title">Radars</h1>
          {[4, 5].map((gameId) => (
            <Link
              key={gameId}
              className="card"
              route={GAME_ROUTE}
              routeParams={{ gameId }}
            >
              Partie {gameId} (repérée au radar)
            </Link>
          ))}
        </div>
      );

      const GamePage = () => {
        const { gameId } = GAME_ROUTE.paramsSignal.value;
        return (
          <div className="page" style={{ background: "#fdf0e8" }}>
            <div className="page_top_bar">
              <GoBackButton />
              <strong>Partie {gameId}</strong>
            </div>
            {Array.from({ length: 8 }, (_, index) => (
              <div key={index} className="page_row">
                Partie {gameId} — coup {index + 1}
              </div>
            ))}
          </div>
        );
      };

      const ReglagesPage = () => (
        <div className="page" style={{ background: "#f3e8fe" }}>
          <div className="page_top_bar">
            <GoBackButton />
            <strong>Réglages</strong>
          </div>
          {["Son", "Notifications", "Thème", "Langue"].map((label) => (
            <div key={label} className="page_row">
              {label}
            </div>
          ))}
        </div>
      );

      const ProfilPage = () => (
        <div className="page" style={{ background: "#fef8e0" }}>
          <h1 className="page_title">Profil</h1>
          <div className="page_row">Joueur : dmail</div>
          <div className="page_row">Elo : 1234</div>
          <Link className="card" route={BADGES_ROUTE}>
            Mes badges →
          </Link>
          <Link className="card" route={STATS_ROUTE}>
            Statistiques →
          </Link>
          {Array.from({ length: 6 }, (_, index) => (
            <div key={index} className="page_row">
              Succès débloqué — {index + 1}
            </div>
          ))}
        </div>
      );

      const StatsPage = () => (
        <div className="page" style={{ background: "#fee8ee" }}>
          <div className="page_top_bar">
            <GoBackButton />
            <strong>Statistiques</strong>
          </div>
          {["Parties jouées : 42", "Victoires : 28", "Série en cours : 5"].map(
            (label) => (
              <div key={label} className="page_row">
                {label}
              </div>
            ),
          )}
        </div>
      );

      const BadgesPage = () => (
        <div className="page" style={{ background: "#e0f4fe" }}>
          <div className="page_top_bar">
            <GoBackButton />
            <strong>Badges</strong>
          </div>
          {["Première partie", "10 victoires", "Radar affûté"].map((label) => (
            <div key={label} className="page_row">
              🏅 {label}
            </div>
          ))}
        </div>
      );

      // The page has no route of its own: it opens on the first tab.
      const AppIndex = () => {
        useLayoutEffect(() => {
          PARTIES_ROUTE.redirectTo();
        }, []);
        return null;
      };

      const TabBar = () => (
        <div className="tab_bar">
          <Nav className="tab_row" expand currentIndicator>
            <Link variant="tab" route={PARTIES_ROUTE} padding="m">
              Mes parties
            </Link>
            <Link variant="tab" route={RADARS_ROUTE} padding="m">
              Radars
            </Link>
            <Link variant="tab" route={PROFIL_ROUTE} padding="m">
              Profil
            </Link>
            <Link variant="tab" route={REGLAGES_ROUTE} padding="m">
              Réglages
            </Link>
          </Nav>
        </div>
      );

      const SPEEDS = [
        { label: "normale (300ms)", value: "300ms" },
        { label: "lente (1s)", value: "1000ms" },
        { label: "très lente (2,5s)", value: "2500ms" },
      ];
      const SPEED_STORAGE_KEY = "route_transition_demo_speed";
      const SpeedPicker = () => {
        const [speed, setSpeed] = useState(
          () => localStorage.getItem(SPEED_STORAGE_KEY) || SPEEDS[0].value,
        );
        useLayoutEffect(() => {
          document.documentElement.style.setProperty(
            "--navi-route-transition-duration",
            speed,
          );
          localStorage.setItem(SPEED_STORAGE_KEY, speed);
        }, [speed]);
        return (
          <label>
            Durée{" "}
            <select value={speed} onChange={(e) => setSpeed(e.target.value)}>
              {SPEEDS.map(({ label, value }) => (
                <option key={value} value={value}>
                  {label}
                </option>
              ))}
            </select>
          </label>
        );
      };

      const App = () => (
        <>
          <div className="furniture">
            <DemoHeader title="defineRouteTransition" />
            <div className="furniture_row">
              <pre className="steps_declaration">
                {[
                  `defineRouteTransition(PARTIES, GAME, "slide-x"); // idem RADARS`,
                  `defineRouteTransition(PARTIES, RÉGLAGES, "slide-y"); // idem RADARS`,
                  `defineRouteTransition(PROFIL, RÉGLAGES, "cover-bottom");`,
                  `defineRouteTransition(PARTIES, PROFIL); // cross-fade — idem RADARS`,
                  `defineRouteTransition(PROFIL, BADGES, "zoom");`,
                  `defineRouteTransition(PROFIL, STATS, "spin"); // CSS de la page`,
                ].join("\n")}
              </pre>
              <SpeedPicker />
            </div>
          </div>
          {/* Les pages vivent entre deux barres : les mouvements jouent
              dedans plutôt que sur le document. */}
          <RouteTransitionArea className="app">
            <Route>
              <Route route={PARTIES_ROUTE} element={PartiesPage} />
              <Route route={RADARS_ROUTE} element={RadarsPage} />
              <Route route={GAME_ROUTE} element={GamePage} />
              <Route route={PROFIL_ROUTE} element={ProfilPage} />
              <Route route={BADGES_ROUTE} element={BadgesPage} />
              <Route route={STATS_ROUTE} element={StatsPage} />
              <Route route={REGLAGES_ROUTE} element={ReglagesPage} />
              <Route fallback element={AppIndex} />
            </Route>
          </RouteTransitionArea>
          <TabBar />
        </>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
