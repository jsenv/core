<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pages défilées sous une barre du bas</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .page {
        padding: 16px;
      }
      .page_title {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .page_row {
        margin-bottom: 8px;
        padding: 14px 12px;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 8px;
      }
      .bar_content {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-weight: 600;
      }
      .bar_content .navi_link {
        flex: 1;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="app" data-navi-safe-area></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useLayoutEffect } from "preact/hooks";
      import {
        FixedBar,
        Link,
        Nav,
        Route,
        RouteTransitionArea,
        defineRouteTransition,
        route,
        setupRoutes,
      } from "@jsenv/navi";

      const A_ROUTE = route("/a");
      const B_ROUTE = route("/b");
      setupRoutes([A_ROUTE, B_ROUTE]);

      defineRouteTransition(A_ROUTE, B_ROUTE, "slide-x");

      const LongPage = ({ title, color, rows }) => (
        <div className="page" style={{ background: color }}>
          <h1 className="page_title">{title}</h1>
          {Array.from({ length: rows }, (_, index) => (
            <div className="page_row" key={index}>
              {title} — ligne {index + 1}
            </div>
          ))}
        </div>
      );

      const APage = () => <LongPage title="Page A" color="#5b8dd9" rows={40} />;
      const BPage = () => <LongPage title="Page B" color="#63b672" rows={40} />;

      const AppIndex = () => {
        useLayoutEffect(() => {
          A_ROUTE.redirectTo();
        }, []);
        return null;
      };

      const App = () => (
        <>
          <RouteTransitionArea>
            <Route>
              <Route route={A_ROUTE} element={APage} />
              <Route route={B_ROUTE} element={BPage} />
              <Route fallback element={AppIndex} />
            </Route>
          </RouteTransitionArea>
          <FixedBar
            area="bottom"
            height="64"
            borderWidth="10"
            borderColor="#111"
          >
            <Nav className="bar_content" expand currentIndicator>
              <Link variant="tab" route={A_ROUTE} padding="m">
                A
              </Link>
              <Link variant="tab" route={B_ROUTE} padding="m">
                B
              </Link>
            </Nav>
          </FixedBar>
        </>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
