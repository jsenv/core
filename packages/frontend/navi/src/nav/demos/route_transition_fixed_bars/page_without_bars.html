<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Route transition — une page sans barres</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      :root {
        --navi-route-transition-duration: 800ms;
      }
      /* Les pages vivent ENTRE les barres, chacune défilant pour elle-même. */
      .area {
        height: calc(
          100dvh - var(--navi-fixed-bar-space-top) -
            var(--navi-fixed-bar-space-bottom)
        );
        margin-top: var(--navi-fixed-bar-space-top);
        overflow: hidden;
      }
      .pages {
        height: 100%;
        padding: 16px;
        overflow: auto;
      }
      .page_title {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .card {
        display: block;
        margin-bottom: 8px;
        padding: 14px 12px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      .page_row {
        margin-bottom: 8px;
        padding: 14px 12px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 8px;
      }
      .bar_content {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-weight: 600;
      }

      .wizard {
        display: flex;
        height: 100%;
        flex-direction: column;
        background: #f3f1ff;
      }
      .wizard_head {
        display: flex;
        height: 96px;
        padding: 0 16px;
        flex: none;
        align-items: center;
        justify-content: space-between;
        color: white;
        background: #2b2545;
      }
      .wizard_head a {
        color: #c9c2ff;
      }
      .wizard_step {
        font-size: 0.85rem;
        opacity: 0.7;
      }
      .wizard_body {
        padding: 16px;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useLayoutEffect } from "preact/hooks";
      import {
        FixedBar,
        Link,
        Nav,
        Route,
        RouteTransitionArea,
        defineRouteTransition,
        route,
        setupRoutes,
        useRouteStatus,
      } from "@jsenv/navi";

      const ALERTS_ROUTE = route("/alertes");
      const ALERT_CREATE_ROUTE = route("/alertes/creer");
      const SETTINGS_ROUTE = route("/reglages");
      setupRoutes([ALERT_CREATE_ROUTE, ALERTS_ROUTE, SETTINGS_ROUTE]);

      defineRouteTransition(ALERTS_ROUTE, ALERT_CREATE_ROUTE, "cover-bottom");
      defineRouteTransition(ALERTS_ROUTE, SETTINGS_ROUTE, "slide-x");

      const LongPage = ({ title, color, rows, links }) => (
        <div className="pages" style={{ background: color }}>
          <h1 className="page_title">{title}</h1>
          {Array.from({ length: rows }, (_, index) => (
            <div key={index}>
              {index % 5 === 0 &&
                links.map((link) => (
                  <Link
                    key={link.testId}
                    className="card"
                    route={link.route}
                    data-testid={link.testId}
                  >
                    {link.label} (ligne {index + 1})
                  </Link>
                ))}
              <div className="page_row">
                {title} — ligne {index + 1}
              </div>
            </div>
          ))}
        </div>
      );

      const AlertsPage = () => (
        <LongPage
          title="Mes alertes"
          color="#e8f0fe"
          rows={30}
          links={[
            {
              route: ALERT_CREATE_ROUTE,
              testId: "create_link",
              label: "C'est parti ! →",
            },
          ]}
        />
      );

      const SettingsPage = () => (
        <LongPage
          title="Réglages"
          color="#eaf7ec"
          rows={25}
          links={[
            {
              route: ALERTS_ROUTE,
              testId: "alerts_link",
              label: "← Mes alertes",
            },
          ]}
        />
      );

      const AlertCreatePage = () => (
        <div className="wizard" data-testid="wizard">
          <header className="wizard_head" data-testid="wizard_head">
            <Link route={ALERTS_ROUTE} data-testid="cancel_link">
              Annuler
            </Link>
            <strong>Créer une alerte</strong>
            <span className="wizard_step">1 / 3</span>
          </header>
          <div className="wizard_body">
            <p>Quel trajet veux-tu surveiller ?</p>
          </div>
        </div>
      );

      const AppIndex = () => {
        useLayoutEffect(() => {
          ALERTS_ROUTE.redirectTo();
        }, []);
        return null;
      };

      const TopBarTitle = () => {
        const { matching: onSettings } = useRouteStatus(SETTINGS_ROUTE);
        return <span>{onSettings ? "Réglages" : "Alertes"}</span>;
      };

      const App = () => {
        const { matching: creating } = useRouteStatus(ALERT_CREATE_ROUTE);
        return (
          <>
            {!creating && (
              <FixedBar area="top" height="56" data-testid="top_bar">
                <div className="bar_content">
                  <TopBarTitle />
                </div>
              </FixedBar>
            )}
            <RouteTransitionArea className="area">
              <Route>
                <Route route={ALERT_CREATE_ROUTE} element={AlertCreatePage} />
                <Route route={ALERTS_ROUTE} element={AlertsPage} />
                <Route route={SETTINGS_ROUTE} element={SettingsPage} />
                <Route fallback element={AppIndex} />
              </Route>
            </RouteTransitionArea>
            {!creating && (
              <FixedBar area="bottom" height="64" data-testid="bottom_bar">
                <Nav className="bar_content" expand currentIndicator>
                  <Link variant="tab" route={ALERTS_ROUTE} padding="m">
                    Alertes
                  </Link>
                  <Link variant="tab" route={SETTINGS_ROUTE} padding="m">
                    Réglages
                  </Link>
                </Nav>
              </FixedBar>
            )}
          </>
        );
      };

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
