<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Route transition sous des barres fixes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      /* Les pages coulent dans le document, sous les barres : c'est la place
         que les barres rendent (la safe area) qui les décale, pas un
         conteneur qui défile pour elles. */
      .pages {
        padding: 16px;
      }
      .page_title {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .card {
        display: block;
        margin-bottom: 8px;
        padding: 14px 12px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      .page_row {
        margin-bottom: 8px;
        padding: 14px 12px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 8px;
      }
      .bar_content {
        display: flex;
        width: 100%;
        padding: 0 16px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-weight: 600;
      }
      /* Même hauteur et même marge que la barre du haut: la croix tombe là où
         était la roue. */
      .overlay_head {
        display: flex;
        height: 56px;
        padding: 0 16px;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        background: #f3ecfb;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .overlay_tabs {
        background: #f3ecfb;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .overlay_body {
        padding: 16px;
        background: #f3ecfb;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useLayoutEffect } from "preact/hooks";
      import {
        Button,
        FixedBar,
        Link,
        Nav,
        Route,
        RouteTransitionArea,
        SidePanel,
        Slide,
        SlideContainer,
        defineRouteTransition,
        route,
        setupRoutes,
        stateSignal,
        useRouteStatus,
      } from "@jsenv/navi";

      const ME_ROUTE = route("/me");
      const ME_EDIT_ROUTE = route("/me/edit");
      const PLACES_ROUTE = route("/places");
      const NOTIFICATIONS_ROUTE = route("/notifications");
      // Les réglages ne sont pas une page: ils sont une chose de plus vraie de
      // l'adresse qu'on est déjà en train de lire. Déclaré sur la racine, le
      // param vaut partout — /me?reglages, /places?reglages — donc l'adresse
      // du calque contient celle de ce qu'il recouvre, rechargement et lien
      // partagé compris. "push": le bouton retour du navigateur les referme.
      const reglagesSignal = stateSignal(false, {
        id: "reglages",
        type: "boolean",
        weak: true,
        history: "push",
      });
      // Le calque a des places à lui. Elles amendent l'entrée d'histoire au
      // lieu d'en empiler une: le retour ferme les réglages, il ne recule pas
      // d'un onglet. Et le param disparaît de l'adresse tant que l'onglet est
      // celui d'origine — /me?reglages, puis /me?reglages&reglages_onglet=alertes.
      const reglagesOngletSignal = stateSignal("compte", {
        id: "reglages_onglet",
        oneOf: ["compte", "alertes", "avance"],
        weak: true,
      });
      const ROOT_ROUTE = route("/", {
        searchParams: {
          reglages: reglagesSignal,
          reglages_onglet: reglagesOngletSignal,
        },
      });
      setupRoutes([
        ME_EDIT_ROUTE,
        ME_ROUTE,
        PLACES_ROUTE,
        NOTIFICATIONS_ROUTE,
        ROOT_ROUTE,
      ]);

      defineRouteTransition(ME_ROUTE, ME_EDIT_ROUTE, "slide-x");
      defineRouteTransition(ME_ROUTE, PLACES_ROUTE, "cover-bottom");
      // La porte des notifications est dans la barre du haut: on les ouvre
      // depuis n'importe quelle page et on les referme sur celle qu'on lisait.
      // Aucune paire à écrire — le `from` est laissé de côté, et la moitié
      // "retour" joue pour le bouton fermer comme pour celui du navigateur.
      // 900 ms pour avoir le temps d'appuyer pendant le mouvement.
      defineRouteTransition(null, NOTIFICATIONS_ROUTE, {
        type: "cover-top",
        duration: 900,
      });
      // Rien n'est écrit pour les réglages: ils ne remplacent aucune page, ils
      // se posent dessus, et un calque a son mouvement à lui.

      // Les liens sont répétés tous les cinq rangs: on part — et on revient —
      // depuis n'importe quelle position de défilement, ce qui est la seule
      // façon de voir ce que la page quittée fait de la sienne.
      const LongPage = ({ title, color, rows, links, close }) => (
        <div className="pages" style={{ background: color }}>
          <h1 className="page_title">{title}</h1>
          {close}
          {Array.from({ length: rows }, (_, index) => (
            <div key={index}>
              {index % 5 === 0 &&
                links.map((link) => (
                  <Link
                    key={link.testId}
                    className="card"
                    route={link.route}
                    data-testid={link.testId}
                    // Ce que CE lien demande, par-dessus ce que la paire dit
                    // (et même quand la paire ne dit rien). Absent, les
                    // relations répondent comme d'habitude.
                    routeTransition={link.routeTransition}
                  >
                    {link.label} (ligne {index + 1})
                  </Link>
                ))}
              <div className="page_row">
                {title} — ligne {index + 1}
              </div>
            </div>
          ))}
        </div>
      );

      const MePage = () => (
        <LongPage
          title="Mon profil"
          color="#e8f0fe"
          rows={30}
          links={[
            {
              route: ME_EDIT_ROUTE,
              testId: "edit_link",
              label: "Modifier mon profil →",
            },
            {
              route: PLACES_ROUTE,
              // Le sens rare de la paire: on RESSORT vers les lieux. Le
              // mouvement de la paire est gardé, seul le sens est retourné —
              // ce qu'aucune règle sur les routes ne saurait dire.
              routeTransition: { direction: "back" },
              testId: "places_back_link",
              label: "↩ Ressortir vers mes lieux",
            },
          ]}
        />
      );

      const MeEditPage = () => (
        <LongPage
          title="Modifier"
          color="#fdf0e8"
          rows={40}
          links={[
            {
              route: ME_ROUTE,
              testId: "back_link",
              label: "← Retour au profil",
            },
          ]}
        />
      );

      const PlacesPage = () => (
        <LongPage
          title="Mes lieux"
          color="#eaf7ec"
          rows={25}
          links={[
            { route: ME_ROUTE, testId: "me_link", label: "← Mon profil" },
            {
              route: ME_EDIT_ROUTE,
              testId: "shortcut_link",
              // Aucune relation n'est écrite entre ces deux pages: sans ce
              // lien elles ne joueraient rien l'une envers l'autre. Le temps
              // de cette navigation-là, elles jouent un zoom.
              routeTransition: "zoom",
              label: "Raccourci vers Modifier (zoom)",
            },
          ]}
        />
      );

      const NotificationsPage = () => (
        <LongPage
          title="Notifications"
          color="#f3ecfb"
          rows={20}
          close={
            <Button className="card" command="--navi-nav-back:/me">
              ✕ Fermer les notifications
            </Button>
          }
          links={[]}
        />
      );

      // UNE PAGE QUI EN REMPLACE UNE AUTRE.
      // La cloche ouvre les notifications et les referme: un seul bouton, deux
      // moitiés. Pendant la descente de la feuille, la barre du haut est une
      // photo — ce que la cloche demande avec pressableDuringRouteTransition,
      // c'est de répondre quand même à un appui qui la vise.
      const NotificationsDoor = () => {
        const { matching } = useRouteStatus(NOTIFICATIONS_ROUTE);
        if (matching) {
          return (
            <Button
              command="--navi-nav-back:/me"
              pressableDuringRouteTransition
              data-testid="notifications_door"
            >
              ✕ Notifications
            </Button>
          );
        }
        return (
          <Link
            route={NOTIFICATIONS_ROUTE}
            pressableDuringRouteTransition
            data-testid="notifications_door"
          >
            🔔 Notifications
          </Link>
        );
      };

      // UN CALQUE QUI SE POSE SUR LA PAGE, QUELLE QU'ELLE SOIT.
      // La roue ne mène nulle part: elle ouvre le panneau, et le panneau écrit
      // son ouverture dans l'adresse. La page dessous ne change pas — on la
      // retrouve telle quelle en refermant, depuis n'importe quel écran — et
      // la barre du bas continue de dire vrai, puisqu'on est bien resté là.
      const REGLAGES_PANEL_ID = "reglages_panel";
      const ReglagesDoor = () => (
        <Button
          variant="discrete"
          command="--navi-toggle"
          commandFor={REGLAGES_PANEL_ID}
          aria-label="Ouvrir les réglages"
          data-testid="reglages_door"
        >
          ⚙
        </Button>
      );

      // La croix tombe là où était la roue: le panneau prend tout l'écran,
      // barres comprises, et refait la ligne du haut à son compte.
      const REGLAGES_SLIDES_ID = "reglages_slides";
      const ReglagesOverlay = () => (
        <SidePanel
          id={REGLAGES_PANEL_ID}
          signal={reglagesSignal}
          side="top"
          expandY
          style={{ background: "#f3ecfb" }}
          animation
          data-testid="reglages_panel"
        >
          <SidePanel.Head className="overlay_head">
            <strong>Réglages</strong>
            <Button
              command="--navi-close"
              variant="discrete"
              aria-label="Fermer les réglages"
              data-testid="reglages_close"
            >
              ✕
            </Button>
          </SidePanel.Head>
          {/* Des onglets, pas des routes: un calque est dans la couche du
              dessus, où deux pages ne peuvent pas tenir côte à côte. */}
          <Nav
            className="overlay_tabs"
            slideContainer={REGLAGES_SLIDES_ID}
            expandX
            currentIndicator
          >
            <Link slide="compte" variant="tab" padding="m">
              Compte
            </Link>
            <Link slide="alertes" variant="tab" padding="m">
              Alertes
            </Link>
            <Link slide="avance" variant="tab" padding="m">
              Avancé
            </Link>
          </Nav>
          <SlideContainer
            id={REGLAGES_SLIDES_ID}
            signal={reglagesOngletSignal}
            expandY
            data-testid="reglages_slides"
          >
            <Slide area="compte">
              <ReglagesSection title="Compte" rows={6} />
            </Slide>
            <Slide area="alertes">
              <ReglagesSection title="Alertes" rows={4} />
            </Slide>
            <Slide area="avance">
              <ReglagesSection title="Avancé" rows={8} />
            </Slide>
          </SlideContainer>
        </SidePanel>
      );

      const ReglagesSection = ({ title, rows }) => (
        <div className="overlay_body">
          {Array.from({ length: rows }, (_, index) => (
            <div key={index} className="page_row">
              {title} — réglage {index + 1}
            </div>
          ))}
        </div>
      );

      const AppIndex = () => {
        useLayoutEffect(() => {
          ME_ROUTE.redirectTo();
        }, []);
        return null;
      };

      const App = () => (
        <>
          <FixedBar area="top" height="56">
            <div className="bar_content">
              <NotificationsDoor />
              <span>Barre du haut</span>
              <ReglagesDoor />
            </div>
          </FixedBar>
          <RouteTransitionArea>
            <Route>
              <Route route={ME_EDIT_ROUTE} element={MeEditPage} />
              <Route route={ME_ROUTE} element={MePage} />
              <Route route={PLACES_ROUTE} element={PlacesPage} />
              <Route route={NOTIFICATIONS_ROUTE} element={NotificationsPage} />
              <Route fallback element={AppIndex} />
            </Route>
          </RouteTransitionArea>
          {/* Hors de l'aire: le panneau se pose par-dessus les pages ET les
              barres, et il reste monté fermé pour pouvoir sortir en glissant. */}
          <ReglagesOverlay />
          <FixedBar area="bottom" height="64">
            <Nav className="bar_content" expand currentIndicator>
              <Link variant="tab" route={ME_ROUTE} padding="m">
                Profil
              </Link>
              <Link variant="tab" route={PLACES_ROUTE} padding="m">
                Lieux
              </Link>
            </Nav>
          </FixedBar>
        </>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
