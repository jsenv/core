<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Route transition sous des barres fixes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      /* Les pages coulent dans le document, sous les barres : c'est la place
         que les barres rendent (la safe area) qui les décale, pas un
         conteneur qui défile pour elles. */
      .pages {
        padding: 16px;
      }
      .page_title {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .card {
        display: block;
        margin-bottom: 8px;
        padding: 14px 12px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      .page_row {
        margin-bottom: 8px;
        padding: 14px 12px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 8px;
      }
      .bar_content {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-weight: 600;
      }
      .bar_content .navi_link {
        flex: 1;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useLayoutEffect } from "preact/hooks";
      import {
        FixedBar,
        Link,
        Nav,
        Route,
        RouteTransitionArea,
        defineRouteTransition,
        route,
        setupRoutes,
      } from "@jsenv/navi";

      const ME_ROUTE = route("/me");
      const ME_EDIT_ROUTE = route("/me/edit");
      const PLACES_ROUTE = route("/places");
      setupRoutes([ME_EDIT_ROUTE, ME_ROUTE, PLACES_ROUTE]);

      defineRouteTransition(ME_ROUTE, ME_EDIT_ROUTE, "slide-x");
      defineRouteTransition(ME_ROUTE, PLACES_ROUTE, "cover-y");

      const LongPage = ({ title, color, rows, children }) => (
        <div className="pages" style={{ background: color }}>
          <h1 className="page_title">{title}</h1>
          {children}
          {Array.from({ length: rows }, (_, index) => (
            <div key={index} className="page_row">
              {title} — ligne {index + 1}
            </div>
          ))}
        </div>
      );

      const MePage = () => (
        <LongPage title="Mon profil" color="#e8f0fe" rows={30}>
          <Link className="card" route={ME_EDIT_ROUTE} data-testid="edit_link">
            Modifier mon profil →
          </Link>
        </LongPage>
      );

      const MeEditPage = () => (
        <LongPage title="Modifier" color="#fdf0e8" rows={40}>
          <Link className="card" route={ME_ROUTE} data-testid="back_link">
            ← Retour au profil
          </Link>
        </LongPage>
      );

      const PlacesPage = () => (
        <LongPage title="Mes lieux" color="#eaf7ec" rows={25}>
          <Link className="card" route={ME_ROUTE} data-testid="me_link">
            ← Mon profil
          </Link>
        </LongPage>
      );

      const AppIndex = () => {
        useLayoutEffect(() => {
          ME_ROUTE.redirectTo();
        }, []);
        return null;
      };

      const App = () => (
        <>
          <FixedBar area="top" height="56">
            <div className="bar_content">Barre du haut</div>
          </FixedBar>
          <RouteTransitionArea>
            <Route>
              <Route route={ME_EDIT_ROUTE} element={MeEditPage} />
              <Route route={ME_ROUTE} element={MePage} />
              <Route route={PLACES_ROUTE} element={PlacesPage} />
              <Route fallback element={AppIndex} />
            </Route>
          </RouteTransitionArea>
          <FixedBar area="bottom" height="64">
            <Nav className="bar_content" expand currentIndicator>
              <Link variant="tab" route={ME_ROUTE} padding="m">
                Profil
              </Link>
              <Link variant="tab" route={PLACES_ROUTE} padding="m">
                Lieux
              </Link>
            </Nav>
          </FixedBar>
        </>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
