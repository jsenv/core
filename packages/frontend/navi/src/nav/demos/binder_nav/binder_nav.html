<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav binder variant demo</title>
    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }

      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .demo-section h2 {
        margin: 0 0 20px 0;
        padding-bottom: 10px;
        color: #333;
        font-size: 1.4rem;
        border-bottom: 2px solid #ddd;
      }

      fieldset {
        margin: 15px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }

      legend {
        padding: 0 10px;
        color: #555;
        font-weight: 500;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { useState } from "preact/hooks";
      import { Box, Nav, Link } from "@jsenv/navi";
      import { DemoHeader } from "../../../internal/demo_header.jsx";
      import { DocumentToc } from "../../../internal/document_toc.jsx";

      const Heading = ({ id, children }) => (
        <h2 id={id}>
          <a href={`#${id}`} style="color: inherit; text-decoration: none;">
            {children}
          </a>
        </h2>
      );

      const TAB_CONTENTS = {
        approved: "These 3 items have been reviewed and approved.",
        pending: "These 2 items are awaiting review.",
        archived: "No archived items yet.",
      };

      const BinderExample = ({
        vertical,
        panelPosition = "after",
        navStyle,
        initialActive = "approved",
      }) => {
        const [active, setActive] = useState(initialActive);
        const nav = (
          <Nav
            variant="binder"
            vertical={vertical}
            panelPosition={panelPosition}
            style={navStyle}
          >
            {Object.keys(TAB_CONTENTS).map((key) => (
              <Link
                key={key}
                appearance="tab"
                current={active === key}
                onClick={() => setActive(key)}
                paddingX="m"
                paddingY="s"
              >
                {key[0].toUpperCase() + key.slice(1)}
              </Link>
            ))}
          </Nav>
        );
        const panel = (
          <div style={{ width: "340px", padding: "16px" }}>
            {TAB_CONTENTS[active]}
          </div>
        );
        return (
          <div
            style={{
              display: vertical ? "flex" : "block",
              width: "fit-content",
              alignItems: "flex-start",
            }}
          >
            {panelPosition === "before" ? panel : nav}
            {panelPosition === "before" ? nav : panel}
          </div>
        );
      };

      const App = () => {
        return (
          <div>
            <DemoHeader title="Nav binder variant" />
            <TableOfContents />
            <NominalDemo />
            <PanelPositionDemo />
            <VerticalDemo />
            <BorderWidthDemo />
            <BorderRadiusDemo />
            <ColorsDemo />
          </div>
        );
      };

      const TableOfContents = () => (
        <div className="demo-section">
          <h2>Table of contents</h2>
          <DocumentToc />
        </div>
      );

      const NominalDemo = () => (
        <div className="demo-section">
          <Heading id="nominal">Cas nominal</Heading>
          <BinderExample />
        </div>
      );

      const PanelPositionDemo = () => (
        <div className="demo-section">
          <Heading id="panel-position">panelPosition</Heading>
          <Box flex="y" spacing="l">
            <fieldset>
              <legend>panelPosition="after" (default)</legend>
              <BinderExample panelPosition="after" initialActive="pending" />
            </fieldset>
            <fieldset>
              <legend>panelPosition="before"</legend>
              <BinderExample panelPosition="before" initialActive="pending" />
            </fieldset>
          </Box>
        </div>
      );

      const VerticalDemo = () => (
        <div className="demo-section">
          <Heading id="vertical">vertical</Heading>
          <Box flex="y" spacing="l">
            <fieldset>
              <legend>vertical + panelPosition="after"</legend>
              <BinderExample vertical initialActive="pending" />
            </fieldset>
            <fieldset>
              <legend>vertical + panelPosition="before"</legend>
              <BinderExample
                vertical
                panelPosition="before"
                initialActive="pending"
              />
            </fieldset>
          </Box>
        </div>
      );

      const BorderWidthDemo = () => (
        <div className="demo-section">
          <Heading id="border-width">--nav-border-width</Heading>
          <Box flex="y" spacing="l">
            <fieldset>
              <legend>default (2px)</legend>
              <BinderExample />
            </fieldset>
            <fieldset>
              <legend>--nav-border-width: 8px</legend>
              <BinderExample navStyle={{ "--nav-border-width": "8px" }} />
            </fieldset>
          </Box>
        </div>
      );

      const BorderRadiusDemo = () => (
        <div className="demo-section">
          <Heading id="border-radius">--nav-border-radius</Heading>
          <Box flex="y" spacing="l">
            <fieldset>
              <legend>--nav-border-radius: 0px</legend>
              <BinderExample navStyle={{ "--nav-border-radius": "0px" }} />
            </fieldset>
            <fieldset>
              <legend>default (8px)</legend>
              <BinderExample />
            </fieldset>
            <fieldset>
              <legend>--nav-border-radius: 16px</legend>
              <BinderExample navStyle={{ "--nav-border-radius": "16px" }} />
            </fieldset>
          </Box>
        </div>
      );

      const ColorsDemo = () => (
        <div className="demo-section">
          <Heading id="colors">--nav-border-color / --nav-background</Heading>
          <Box flex="y" spacing="l">
            <fieldset>
              <legend>default</legend>
              <BinderExample />
            </fieldset>
            <fieldset>
              <legend>
                --nav-border-color: #1976d2; --nav-background: #e3f2fd
              </legend>
              <BinderExample
                navStyle={{
                  "--nav-border-color": "#1976d2",
                  "--nav-background": "#e3f2fd",
                }}
              />
            </fieldset>
          </Box>
        </div>
      );

      render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
