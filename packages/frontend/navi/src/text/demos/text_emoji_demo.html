<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Emoji</title>
    <style>
      body {
        max-width: 900px;
        padding: 20px;
        font-family: system-ui, sans-serif;
      }
      h2 {
        margin: 32px 0 4px;
        font-size: 1rem;
      }
      h3 {
        margin: 20px 0 6px;
        color: #444;
        font-weight: normal;
        font-size: 0.9rem;
      }
      .caption {
        margin: 0 0 8px;
        color: #666;
        font-size: 13px;
      }
      /* Deux exemples collés bord à bord : une différence de hauteur se voit
         sans rien mesurer. */
      .compare {
        display: flex;
        align-items: flex-start;
      }
      .compare > * {
        outline: 1px dotted #6a8fd8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" jsenv-type="module/jsx">
      import { render } from "preact";
      import { signal } from "@preact/signals";
      import {
        Badge,
        Box,
        Button,
        Editable,
        Icon,
        Input,
        MessageBox,
        Text,
        Textarea,
        useEditionController,
      } from "@jsenv/navi";

      const PersonSvg = () => (
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6z" />
        </svg>
      );

      const Compare = ({ children }) => <div class="compare">{children}</div>;

      const LINE = "Sortie au parc de la Tête d'Or";
      const LINE_EMOJI = "Sortie au parc 🌳 de la Tête d'Or 🎉";
      const MESSAGE =
        "Salut, on se retrouve au parc vers 19h ? Ramène des chips et ta bonne humeur, il paraît qu'il y aura de la musique jusqu'à tard.";
      const MESSAGE_EMOJI =
        "Salut 👋 on se retrouve au parc 🌳 vers 19h ? Ramène des chips 🍟 et ta bonne humeur 😄, il paraît qu'il y aura de la musique 🎶 jusqu'à tard.";
      const DENSE =
        "Ce soir c'est la fête au parc avec pizza et musique ! Ramène des chips, des boissons et surtout ta bonne humeur.";
      const DENSE_EMOJI =
        "Ce soir 🎉 c'est la fête 🥳 au parc 🌳 avec pizza 🍕 et musique 🎶 ! Ramène 🙏 des chips 🍟, des boissons 🥤 et surtout 😄 ta bonne humeur ✨.";

      // ── Modifier sur place ──────────────────────────────────────────────

      const editableLineSignal = signal(LINE);
      const editableLineEmojiSignal = signal(LINE_EMOJI);
      const EditableRow = ({ signal: valueSignal }) => {
        const { editing, startEditing, stopEditing } = useEditionController();
        const value = valueSignal.value;

        return (
          <Box flex="y" spacing="s" alignX="start" paddingRight="m">
            <Box
              flex
              alignY="center"
              spacing="s"
              width="22em"
              paddingX="s"
              paddingY="xxs"
              background="#dce7fb"
              color="#1f3f8a"
            >
              <Icon shrink={false}>
                <PersonSvg />
              </Icon>
              <Box
                relative
                expandX
                minWidth="0"
                onDblClick={startEditing}
                border="1px solid transparent"
              >
                <Editable
                  editing={editing}
                  value={value}
                  action={(newValue) => {
                    valueSignal.value = newValue;
                  }}
                  onEditEnd={stopEditing}
                  expandX
                  padding="0"
                >
                  <Text maxLines={1}>{value}</Text>
                </Editable>
              </Box>
              <Badge shrink={false}>7-8</Badge>
            </Box>
            <Button onClick={startEditing} disabled={Boolean(editing)}>
              modifier
            </Button>
          </Box>
        );
      };

      const editableMessageSignal = signal(MESSAGE);
      const editableMessageEmojiSignal = signal(MESSAGE_EMOJI);
      const EditableMessage = ({ signal: valueSignal }) => {
        const { editing, startEditing, stopEditing } = useEditionController();
        const value = valueSignal.value;

        return (
          <Box flex="y" spacing="s" alignX="start" paddingRight="m">
            <Box
              relative
              width="18em"
              onDblClick={startEditing}
              border="1px solid transparent"
              borderRadius="10px"
              paddingX="s"
              paddingY="xs"
              background="#dce7fb"
              color="#1f3f8a"
            >
              <Editable
                multiline
                minRows={1}
                editing={editing}
                value={value}
                width="100%"
                action={(newValue) => {
                  valueSignal.value = newValue;
                }}
                paddingX="s"
                paddingY="xs"
                onEditEnd={stopEditing}
              >
                <Text block preWrap>
                  {value}
                </Text>
              </Editable>
            </Box>
            <Button onClick={startEditing} disabled={Boolean(editing)}>
              modifier
            </Button>
          </Box>
        );
      };

      // ── Les composants ──────────────────────────────────────────────────

      const AppRow = ({ width = "22em", children }) => (
        <Box
          flex
          alignY="center"
          spacing="s"
          width={width}
          paddingX="s"
          paddingY="xxs"
          background="#dce7fb"
          color="#1f3f8a"
        >
          <Icon shrink={false}>
            <PersonSvg />
          </Icon>
          <Text maxLines={1} expandX>
            {children}
          </Text>
          <Badge shrink={false}>7-8</Badge>
        </Box>
      );
      const Paragraph = ({ children }) => (
        <Text block width="18em" paddingX="s">
          {children}
        </Text>
      );

      const App = () => (
        <div>
          <h1>Emoji</h1>

          <h2>Modifier sur place</h2>
          <p class="caption">
            Ce qui est tapé, puis affiché, dans la même boîte — sans emoji à
            gauche, avec à droite.
          </p>
          <h3>Une ligne</h3>
          <Compare>
            <EditableRow signal={editableLineSignal} />
            <EditableRow signal={editableLineEmojiSignal} />
          </Compare>
          <h3>Plusieurs lignes</h3>
          <Compare>
            <EditableMessage signal={editableMessageSignal} />
            <EditableMessage signal={editableMessageEmojiSignal} />
          </Compare>

          <h2>Les composants</h2>
          <p class="caption">
            Bord à bord : ce qui porte un emoji fait la même hauteur que ce qui
            n'en porte pas.
          </p>

          <h3>Une phrase</h3>
          <Compare>
            <Paragraph>{MESSAGE}</Paragraph>
            <Paragraph>{MESSAGE_EMOJI}</Paragraph>
          </Compare>

          <h3>Presque que des emojis</h3>
          <Compare>
            <Paragraph>{DENSE}</Paragraph>
            <Paragraph>{DENSE_EMOJI}</Paragraph>
          </Compare>

          <h3>Séquences, drapeaux, teintes de peau</h3>
          <Compare>
            <Paragraph>Bravo à toute l'équipe pour ce résultat !</Paragraph>
            <Paragraph>
              Bravo 🎉🎉🎉 à toute l'équipe 👨‍👩‍👧 de 🇫🇷 et 🇯🇵 ❤️🧡💛💚💙💜 pour ce
              résultat 👍🏽👍🏿👍🏻 !
            </Paragraph>
          </Compare>

          <h3>Une ligne d'app, entière puis tronquée</h3>
          <Compare>
            <AppRow>{LINE}</AppRow>
            <AppRow>{LINE_EMOJI}</AppRow>
            <AppRow width="12em">{LINE_EMOJI}</AppRow>
          </Compare>

          <h3>Button</h3>
          <Compare>
            <Button>Envoyer</Button>
            <Button>Envoyer 🚀</Button>
          </Compare>

          <h3>Badge</h3>
          <Compare>
            <Badge>Nouveau</Badge>
            <Badge>Nouveau 🎉</Badge>
          </Compare>

          <h3>Input</h3>
          <Compare>
            <Input defaultValue={LINE} width="18em" />
            <Input defaultValue={LINE_EMOJI} width="18em" />
          </Compare>

          <h3>Textarea</h3>
          <Compare>
            <Textarea defaultValue={MESSAGE} width="18em" />
            <Textarea defaultValue={MESSAGE_EMOJI} width="18em" />
          </Compare>

          <h3>MessageBox</h3>
          <Compare>
            <MessageBox status="warning" icon>
              Au moins 5 caractères, il n'y en a que 2
            </MessageBox>
            <MessageBox status="warning" icon>
              Au moins 5 caractères, il n'y en a que 2 🙈
            </MessageBox>
          </Compare>
        </div>
      );

      render(<App />, document.querySelector("#app"));
    </script>
  </body>
</html>
