<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${status} ${statusText}</title>
    <style>body {
  color: #333;
  background-color: #f8f9fa;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
}

.error_container {
  text-align: center;
  background: #fff;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 4px 6px #0000001a;
}

.error_status {
  color: #dc3545;
  margin: 0;
  font-size: 5rem;
}

.error_status_text {
  text-align: left;
  word-break: break-word;
  margin: 10px 0;
  font-size: 1.5rem;
}

.error_message {
  color: #555;
  text-align: left;
  word-break: break-word;
  font-size: 1rem;
}

.home_link {
  color: #fff;
  background-color: #007bff;
  border-radius: 5px;
  margin-top: 15px;
  padding: 10px 15px;
  text-decoration: none;
  display: inline-block;
}

.home_link:hover {
  background-color: #0056b3;
}
</style>
  </head>
  <body>
    <div class="error_container">
      <p class="error_status">${status}</p>
      <p class="error_status_text">${statusText}</p>
      <p class="error_message">${statusMessage}</p>
      <a href="/" class="home_link">Return to Home</a>
    </div>
    <script>
      const css = /* css */ `
        dialog {
          opacity: 0;
          transition: all 0.3s allow-discrete;
        }
        dialog::backdrop {
          background-image: linear-gradient(
            45deg,
            magenta,
            rebeccapurple,
            dodgerblue,
            green
          );
          opacity: 0;
          transition: all 0.3s allow-discrete;
        }
        dialog:open {
          opacity: 1;
        }
        dialog:open::backdrop {
          opacity: 0.75;
        }
      `;
      
      const html = /* html */ `<style>
          ${css}
        </style>
        <dialog>
          <p>Connection with server is lost, waiting for it to come back...</p>
          <button autofocus name="retry">Retry now</button>
        </dialog>`;
      
      // The peer is a dev server being restarted, not a flaky network: it can be down
      // for the length of an "npm install" and there is no attempt count past which
      // giving up would be correct. Attempts space out to RETRY_AFTER_MAX_MS and never
      // stop; the dialog is a status the page can leave and come back to, so closing
      // it keeps the loop running and the page still reloads once the server answers.
      const RETRY_AFTER_MS = 500;
      const RETRY_AFTER_MAX_MS = 5000;
      // Most restarts complete before this, so a quick one goes unnoticed.
      const DIALOG_AFTER_MS = 3000;
      
      class JsenvAutoreloadOnServerRestart extends HTMLElement {
        constructor({ url } = {}) {
          super();
          const root = this.attachShadow({ mode: "open" });
          root.innerHTML = html;
      
          const dialog = root.querySelector("dialog");
          const retryButton = dialog.querySelector('button[name="retry"]');
      
          const connect = () => {
            const websocket = new WebSocket(url);
            return new Promise((resolve) => {
              websocket.onerror = () => {
                resolve(null);
              };
              websocket.onopen = () => {
                resolve(websocket);
              };
            });
          };
      
          let retryAfter = RETRY_AFTER_MS;
          let retryTimeout = null;
          let dialogTimeout = null;
      
          const tryToReconnect = async () => {
            retryTimeout = null;
            retryButton.disabled = true;
            const websocket = await connect();
            if (websocket) {
              clearTimeout(dialogTimeout);
              console.info("reconnected to server, reloading the page...");
              window.location.reload(true);
              return;
            }
            retryButton.disabled = false;
            retryTimeout = setTimeout(tryToReconnect, retryAfter);
            const nextRetryAfter = retryAfter * 2;
            retryAfter =
              nextRetryAfter > RETRY_AFTER_MAX_MS
                ? RETRY_AFTER_MAX_MS
                : nextRetryAfter;
          };
      
          const retryNow = () => {
            if (retryTimeout === null) {
              return;
            }
            clearTimeout(retryTimeout);
            retryAfter = RETRY_AFTER_MS;
            tryToReconnect();
          };
      
          const waitForServerToComeBack = () => {
            console.info("connection to server lost, trying to reconnect");
            dialogTimeout = setTimeout(() => {
              dialogTimeout = null;
              dialog.showModal();
            }, DIALOG_AFTER_MS);
            tryToReconnect();
          };
      
          retryButton.onclick = () => {
            retryNow();
          };
          // A tab coming back to the foreground, or the network coming back, are the
          // moments the server is most likely to be up already; waiting out the
          // backoff then shows a detached page for no reason.
          window.addEventListener("online", retryNow);
          window.addEventListener("focus", retryNow);
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              retryNow();
            }
          });
      
          (async () => {
            const initialWebSocket = await connect();
            if (!initialWebSocket) {
              waitForServerToComeBack();
              return;
            }
            initialWebSocket.onclose = () => {
              waitForServerToComeBack();
            };
          })();
        }
      }
      if (!customElements.get("jsenv-autoreload-on-server-restart")) {
        customElements.define(
          "jsenv-autoreload-on-server-restart",
          JsenvAutoreloadOnServerRestart,
        );
      }
      
      const websocketEndpoint =
        document.currentScript.getAttribute("data-ws-endpoint") ||
        "/.internal/alive.websocket";
      
      const jsenvAutoreloadOnServerRestartElement =
        new JsenvAutoreloadOnServerRestart({
          url: (() => {
            const websocketScheme =
              self.location.protocol === "https:" ? "wss" : "ws";
            const websocketUrl = `${websocketScheme}://${self.location.host}${websocketEndpoint}`;
            return websocketUrl;
          })(),
        });
      
      // script is injected into document.body
      if (document.body) {
        document.currentScript.parentNode.replaceChild(
          jsenvAutoreloadOnServerRestartElement,
          document.currentScript,
        );
      }
      // script injected outisde document.body (likely in head)
      else {
        document.currentScript.parentNode.removeChild(document.currentScript);
        document.onreadystatechange = () => {
          if (document.readyState === "interactive") {
            document.body.appendChild(jsenvAutoreloadOnServerRestartElement);
          }
        };
      }
    </script>
  </body>
</html>
