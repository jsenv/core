  </g>
  <foreignObject id="body" y="0" width="100%" height="204.45" overflow="hidden">
    <svg width="1481.84" height="194.45" font-family="monospace" font-variant-east-asian="full-width" fill="#cccccc">
      <g>
        <text x="10" y="24.55" fill="#DAA520">⚠</text>
        <text x="18.4" y="24.55" style="white-space:pre"> import.meta.css shipped as written: not parsed, not transpiled, not minified</text>
        <text x="10" y="43.55">--- css template ---</text>
        <text x="10" y="62.55">base/client/main.js:26:30</text>
        <text x="10" y="81.55">--- reason ---</text>
        <text x="10" y="100.55">"${selector}" stands in a selector, or an at-rule prelude</text>
        <text x="10" y="119.55">--- suggestion ---</text>
        <text x="10" y="138.55">only a "${}" standing where a css value stands can be read; a custom property set from JS, a data attribute or a selector list covers nearly every other reason to interpolate</text>
        <text x="10" y="157.55">--- to silence ---</text>
        <text x="10" y="176.55">write "jsenv-css-opaque" in a css comment inside that template</text>
      </g>
    </svg>
