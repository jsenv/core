<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device tracker</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        color: #e5e7eb;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #0b1020;
      }
      header {
        display: flex;
        padding: 12px 16px;
        align-items: center;
        gap: 12px;
        background: #111827;
        border-bottom: 1px solid #1f2937;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
      }
      .status {
        color: #9ca3af;
        font-size: 0.8rem;
      }
      .status .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 5px;
        vertical-align: middle;
        background: #9ca3af;
        border-radius: 50%;
      }
      .status.on .dot {
        background: #22c55e;
      }
      .spacer {
        flex: 1;
      }
      button {
        padding: 6px 12px;
        color: #e5e7eb;
        font-size: 0.8rem;
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #4b5563;
      }
      #logs {
        margin: 0;
        padding: 8px 12px;
        flex: 1;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
      }
      .entry {
        padding: 2px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .entry .time {
        margin-right: 8px;
        color: #6b7280;
      }
      .entry .lvl {
        display: inline-block;
        min-width: 42px;
        margin-right: 8px;
        font-weight: 600;
      }
      .lvl-error {
        color: #f87171;
      }
      .lvl-warn {
        color: #fbbf24;
      }
      .lvl-info {
        color: #60a5fa;
      }
      .lvl-debug {
        color: #a78bfa;
      }
      .lvl-log {
        color: #9ca3af;
      }
      .empty {
        padding: 20px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Device <span id="devid"></span></h1>
      <span class="status" id="status"
        ><span class="dot"></span>connecting…</span
      >
      <span class="spacer"></span>
      <button id="copy">Copy all</button>
      <button id="clear">Clear</button>
    </header>
    <div id="logs"><div class="empty">Waiting for logs…</div></div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const deviceId = params.get("id") || "";
      document.getElementById("devid").textContent = deviceId.slice(0, 8);
      const logsEl = document.getElementById("logs");
      const statusEl = document.getElementById("status");
      const entries = [];
      let empty = true;

      const pad = (n) => String(n).padStart(2, "0");
      const fmtTime = (ts) => {
        const d = new Date(ts);
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      const escapeHtml = (str) =>
        String(str).replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );

      const addEntry = (entry) => {
        entries.push(entry);
        if (empty) {
          logsEl.innerHTML = "";
          empty = false;
        }
        const atBottom =
          logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 40;
        const row = document.createElement("div");
        row.className = "entry";
        row.innerHTML = `<span class="time">${fmtTime(entry.ts)}</span><span class="lvl lvl-${entry.level}">${entry.level}</span>${escapeHtml(entry.text)}`;
        logsEl.appendChild(row);
        if (atBottom) {
          logsEl.scrollTop = logsEl.scrollHeight;
        }
      };

      document.getElementById("clear").onclick = () => {
        entries.length = 0;
        logsEl.innerHTML = '<div class="empty">Cleared.</div>';
        empty = true;
      };
      document.getElementById("copy").onclick = async () => {
        const text = entries
          .map((e) => `${fmtTime(e.ts)} [${e.level}] ${e.text}`)
          .join("\n");
        try {
          await navigator.clipboard.writeText(text);
          const btn = document.getElementById("copy");
          const prev = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => {
            btn.textContent = prev;
          }, 1200);
        } catch {
          // clipboard blocked — select nothing, just ignore
        }
      };

      const setStatus = (on, label) => {
        statusEl.className = on ? "status on" : "status";
        statusEl.innerHTML = `<span class="dot"></span>${label}`;
      };

      // Backlog first (a tracker opened late still sees recent history)…
      fetch(`/.internal/device.json?id=${encodeURIComponent(deviceId)}`)
        .then((r) => r.json())
        .then((device) => {
          for (const entry of device.logs || []) {
            addEntry(entry);
          }
        })
        .catch(() => {});

      // …then live. This page is cooked through the dev server, so it gets the
      // jsenv server-events client injected (window.__server_events__) — the
      // same channel autoreload rides. Every device's logs are broadcast there,
      // so keep only the ones for the device we're tracking.
      const whenServerEvents = (callback) => {
        const ready = () =>
          window.__server_events__ &&
          typeof window.__server_events__.listenEvents === "function";
        if (ready()) {
          callback(window.__server_events__);
          return;
        }
        const id = setInterval(() => {
          if (ready()) {
            clearInterval(id);
            callback(window.__server_events__);
          }
        }, 100);
      };
      whenServerEvents((serverEvents) => {
        setStatus(true, "tracking");
        serverEvents.listenEvents({
          device_log: (event) => {
            if (event.data.deviceId === deviceId) {
              addEntry(event.data);
            }
          },
        });
      });
    </script>
  </body>
</html>
